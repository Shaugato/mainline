; ── Tests: typed enough to be readable, not strict enough to be noise ────────
[mypy-tests.*]
disallow_untyped_defs = False
disallow_untyped_decorators = False

[mypy-*.tests.*]
disallow_untyped_defs = False
disallow_untyped_decorators = False

; ── Third-party gaps ────────────────────────────────────────────────────────
; Only libraries that genuinely ship no type information. Every entry is a
; specific admission, never a wildcard: `ignore_missing_imports` set globally is
; how a typo in an import name becomes a runtime AttributeError in production.
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-jinja2.*]
ignore_missing_imports = False
