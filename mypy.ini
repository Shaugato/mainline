; ===========================================================================
; THIRD-PARTY GAPS
; Only libraries that ship no type information, or that this workspace treats as
; an optional extra and therefore does not install. Every entry is a specific
; admission, never a wildcard: `ignore_missing_imports` set globally is how a typo
; in an import name becomes a runtime AttributeError in production.
; ===========================================================================

; Optional `aws` extra. Not installed in the dev environment, so the import is
; unresolved rather than untyped -- which is exactly why the inline
; `# type: ignore[import-untyped]` in `mainline_boundary/iam.py` was reported as
; unused on 2026-08-10 and has been removed. This section is what silences the
; import; deleting it re-breaks that file.
[mypy-boto3.*]
ignore_missing_imports = True

; `botocore` had a section here until 2026-08-10 and mypy reported it unused: no
; module in the workspace imports it. The only occurrences are in prose and in
; `mainline_delta_oracle.__init__`'s list of what must NEVER appear in the gate's
; closure. An admission for an import nobody makes is a licence waiting to be
; used by accident, so it is gone. `boto3` above is the real one.

; The Anthropic SDK is a declared dependency of `mainline-recall-agent`, imported
; lazily inside `providers/judge.py` behind an `ImportError` guard. It is absent
; from this dev environment because the workspace is not installable until W1
; regenerates `uv.lock` (quality-repair.md 1.1). The admission is here so the
; ratchet number below is the same on a machine that has the SDK and one that does
; not -- a count that moves with the environment ratchets nothing.
[mypy-anthropic.*]
ignore_missing_imports = True

; Optional signing extra used by `trappoint_ledger.signer` under a lazy import.
[mypy-cryptography.*]
ignore_missing_imports = True

; `python-docx`. It is NOT in `uv.lock` and that is deliberate:
; `mainline_corpus.docx.verify.opens_with_python_docx` imports it inside a
; `try: ... except ImportError:` and returns a SKIPPED finding when it is absent (ADR
; 0034), because the value of that stage is a THIRD-PARTY parse of the documents we
; produced. A copy we installed ourselves would only prove our reader agrees with our
; writer. So the import is legitimately unresolved on every machine, this one included.
;
; THE LOCATION OF THIS SECTION IS THE FIX. An equivalent
; `[[tool.mypy.overrides]] module = ["docx", "docx.*"]` has lived in
; `verticals/mainline/packages/mainline-corpus/pyproject.toml` since that file was
; written, and it is correct -- for `mypy --strict -p mainline_corpus` run against that
; package's own config. The repository check is
; `mypy --config-file mypy.ini $(scripts/qa/mypy_targets.py)`, which reads THIS file and
; no other: an explicit `--config-file` stops mypy's config discovery, and even without
; it a `mypy.ini` on disk outranks the root `pyproject.toml`, which carries no
; `[tool.mypy]` table at all. The per-package override was therefore never in scope for
; CI, which measured `verify.py:448: error: Cannot find implementation or library stub
; for module named "docx" [import-not-found]` on 2026-08-10. Mirrored here rather than
; moved -- exactly as the corpus package's `boto3` block mirrors the section above -- so
; that both invocations answer the same way.
[mypy-docx.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True
