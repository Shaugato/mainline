;
; Type-checking policy. The gradient is deliberate and it is not uniform.
;
; `--strict` is a COMMAND-LINE flag; mypy has no per-module `strict = True`. So the
; substrate's strictness is written out here flag by flag, which is better anyway:
; a reader can see exactly which guarantee applies where, and a future relaxation
; is a visible line in a diff rather than a dropped `--strict` in a CI command.
;
; STRICT (every flag `--strict` implies): every `packages/trappoint-*` distribution.
;   These are the Apache substrate. They are the artefact a stranger forks, and the
;   only thing standing between a fork and a wrong refusal is that the code says
;   what it means.
; NORMAL: the FSL vertical under `verticals/`.
;
; -- HOW THIS FILE IS INVOKED, AND WHY THAT MATTERS --------------------------
;
;     mypy --config-file mypy.ini $(python scripts/qa/mypy_targets.py)
;
; ONE run over EVERY distribution. Before 2026-08-10 there were two runs -- one for
; `trappoint-migrate` + `trappoint-conformance`, one for seven other packages -- and
; each of them printed `unused section(s): ...` naming the modules the other one
; covered. Between them they checked most of the tree, but no single invocation
; checked the substrate, so "types are clean" was a claim stitched from two partial
; measurements. Twenty-two distributions had no section here at all.
;
; `scripts/qa/mypy_targets.py --check` is what stops that recurring. It walks the
; workspace for `pyproject.toml`, reads `[tool.hatch.build.targets.wheel] packages`,
; and exits non-zero when a distribution on disk has no section below, or no
; `mypy_path` entry, or (for `trappoint_*`) a tier that is not strict. A package
; cannot join this repository and escape the type checker in silence -- the same
; guarantee `import-linter-registry` gives for import contracts.
;
; TIERS ARE ALL-OR-NOTHING. Every distribution section sets the SAME SIX flags, the
; members of `--strict` that the global `[mypy]` block below does not already set.
; Strict is those six True; normal is those six False. Setting three of them is
; refused by `--check`, because a half-set tier is a policy nobody decided.
;
; The other seven `--strict` flags (`warn_redundant_casts`, `warn_unused_ignores`,
; `warn_return_any`, `no_implicit_reexport`, `strict_equality`, `extra_checks`,
; `check_untyped_defs`) are global: they cost nothing on unannotated code and they
; catch the errors that matter most in the vertical too.
;
; TESTS ARE NOT CHECKED HERE. The target list is derived from what each wheel
; publishes, so `tests/` is outside it. The former `[mypy-tests.*]` and
; `[mypy-*.tests.*]` sections matched nothing in any invocation, ever -- this repo
; keeps tests as siblings of `src/`, never inside the package -- so they were
; removed rather than left to print as unused for a third reader to investigate.

[mypy]
python_version = 3.13
; Every `src` directory in the workspace that contains Python, plus the two this
; wave adds. `explicit_package_bases` derives a module name from a file's path
; relative to one of these roots, so an omission here is not a smaller check -- it
; is no check at all for that distribution.
;
; `mainline-corpus/src` was on this list as a NON-target when the list was written --
; sixty modules with no `pyproject.toml`. That repair has landed: the distribution now
; has a `pyproject.toml`, `mypy_targets.py` emits it, and it is checked like any other,
; so it has a tier below. The path entry stays because it is also imported.
;
; `trappoint-testkit/src` (W2) and `mainline-gate-svc/src` (W6) were forward-declared
; here while they were still owed. BOTH HAVE NOW LANDED and are ordinary targets:
; `mypy_targets.py --json` emits them, `--check` tiers them, and `qa/mypy-ratchet.json`
; carries a measured count for each. The forward declaration did its job — neither
; package arrived unchecked — and the entries stay because they are now load-bearing
; rather than anticipatory.
;
; `verticals/mainline/apps/console/src` is deliberately absent: it is TypeScript.
mypy_path =
    packages/mainline-agentkit/src,
    packages/mainline-boundary/src,
    packages/mainline-mcp/src,
    packages/trappoint-conformance,
    packages/trappoint-conformance/src,
    packages/trappoint-core/src,
    packages/trappoint-diagnose/src,
    packages/trappoint-jcs/src,
    packages/trappoint-ledger/src,
    packages/trappoint-migrate/src,
    packages/trappoint-model/src,
    packages/trappoint-recall/src,
    packages/trappoint-sql/src,
    packages/trappoint-testkit/src,
    packages/trappoint-verify/src,
    verticals/mainline/apps/demo-api/src,
    verticals/mainline/packages/mainline-anchor/src,
    verticals/mainline/packages/mainline-archivist/src,
    verticals/mainline/packages/mainline-cartographer/src,
    verticals/mainline/packages/mainline-cherrypick/src,
    verticals/mainline/packages/mainline-corpus/src,
    verticals/mainline/packages/mainline-custody-patrol/src,
    verticals/mainline/packages/mainline-delta-oracle/src,
    verticals/mainline/packages/mainline-domain/src,
    verticals/mainline/packages/mainline-fixity/src,
    verticals/mainline/packages/mainline-gate-svc/src,
    verticals/mainline/packages/mainline-mutation/src,
    verticals/mainline/packages/mainline-quarantine/src,
    verticals/mainline/packages/mainline-recall-agent/src,
    verticals/mainline/packages/mainline-recall-fleet/src,
    verticals/mainline/packages/mainline-sequencer/src,
    verticals/mainline/packages/mainline-steward/src
namespace_packages = True
explicit_package_bases = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True
check_untyped_defs = True
pretty = True
show_error_codes = True
show_column_numbers = True

