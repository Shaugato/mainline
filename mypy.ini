; `cases` -- the conformance corpus. Its module name does not start with `trappoint_`,
; but its DISTRIBUTION does: `packages/trappoint-conformance` publishes both
; `src/trappoint_conformance` and `cases` in `[tool.hatch.build.targets.wheel]`, so
; `mypy_targets.py --check` holds it to the substrate tier, and it is right to. A
; conformance case is an executable claim about what the database refuses; a case that
; type-checks loosely is a claim nobody verified the shape of.
;
; MEASURED before this section was added: with no `[mypy-cases.*]` at all, `--check`
; REFUSED with `packages/trappoint-conformance: no [mypy-cases.*] section in mypy.ini`
; while `mypy` itself passed -- the corpus was being checked at whatever the global
; block happened to say, which is the "tier is an accident" case this file's own
; preamble names. Declaring the strict tier costs ZERO errors: the corpus was already
; written to that standard and only the declaration was missing. Re-measured
; 2026-08-10 over the whole workspace, mypy 2.3.0: `Success: no issues found in 660
; source files`, banked in `qa/mypy-ratchet.json` as `total_errors 0` /
; `source_files_checked 660` / 32 distributions.
[mypy-cases.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_any_generics = True
disallow_subclassing_any = True

