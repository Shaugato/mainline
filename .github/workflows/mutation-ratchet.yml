#
# THE STANDING MEASUREMENT LANE.
#
# `docs/leads/algorithms.md` §8 R-A1: delta false negatives — a real weakening that both
# paths classify as `restate` — are IRREDUCIBLE and are "not argued away; MEASURED by the
# mutation ratchet and published per mutation class with Wilson bounds. It is the residual
# risk and it is named in the honesty card."
#
# So this lane exists to publish a number, nightly, and it has one property that every
# other lane in this repository does not:
#
#   ══════════════════════════════════════════════════════════════════════════════════
#   IT NEVER FAILS BECAUSE THE NUMBER IS LOW. IT IS NOT A GATE AND MUST NEVER BECOME ONE.
#   ══════════════════════════════════════════════════════════════════════════════════
#
# `mainline-mutation run` exits 0 whatever the kill rate is. The only conditions that
# fail this job are conditions under which the MEASUREMENT DID NOT HAPPEN: a catalogue
# class with no operator, a fixture whose paraphrase cassette has drifted, a class that
# produced no trial, an injection point that stopped injecting. A threshold here would
# give the figure an incentive to be high, and the cheapest way to raise a mutation score
# is to delete the mutants the system fails on. This catalogue keeps them.
#
# TWO ARMS, AND THE SECOND ONE IS THE PL-2 ARTEFACT.
# The lane runs the harness twice: intact, and crippled with lattice rule R1_DEONTIC
# switched off. The crippled arm MUST report a lower kill rate with `deontic_downgrade`
# named as a surviving class. That comparison is the only assertion in this workflow that
# is about the numbers at all, and it asserts that the harness is measuring something —
# not that what it measures is good.
#
# NO CLOUD, NO CREDENTIAL. The cluster is a local single-node CockroachDB started with
# `docker run` from the image pinned in `compose.yaml` (PL-1: a judge reproduces this on a
# laptop). There is no AWS call anywhere in this lane: the adversarial-paraphrase mutants
# come from committed cassettes (PL-3, decision D12) and `test_no_model_reach.py` walks
# the package AST to keep it that way.

name: mutation-ratchet

on:
  schedule:
    # 17:20 UTC ≈ 03:20 Australia/Brisbane. Nightly, off the hour, so it does not
    # queue behind everybody else's midnight cron.
    - cron: "20 17 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "master seed (the run is a pure function of it)"
        required: false
        default: "0"
  pull_request:
    # On a PR only when something that could move the number changes. A measurement
    # that re-ran on every documentation edit would be noise, and noise is what gets
    # a lane muted.
    paths:
      - "verticals/mainline/packages/mainline-mutation/**"
      - "verticals/mainline/packages/mainline-domain/**"
      - "verticals/mainline/db/migrations/0049y_meas_mutation_run.sql"
      - "verticals/mainline/db/migrations/0049z_meas_mutation_result.sql"
      - "verticals/mainline/db/migrations/0149y_trg_mutation_run_append_only.sql"
      - "verticals/mainline/db/migrations/0149z_trg_mutation_result_append_only.sql"
      - "tests/e2e/mutation/**"
      - "tests/unit/domain/novelty/**"
      - ".github/workflows/mutation-ratchet.yml"
  push:
    # ADDED 2026-08-10, and it is an ADDITION rather than the `main`→`master` rename the
    # other lanes needed: this workflow carried NO push trigger at all, so its result had
    # never appeared on the default branch. MEASURED: `git branch --show-current` is
    # `master`; `gh run list --branch main` is empty.
    #
    # The trigger is the SAME paths list as the `pull_request` arm above. It is written
    # out rather than shared by a YAML anchor because GitHub Actions' workflow parser
    # does not support anchors and aliases; an anchor here would be a fresh breakage
    # dressed as a tidy-up.
    #
    # That list is the honest scope: this lane already accepts running on a PR that
    # touches these paths, so running on the master push of the same paths costs exactly
    # what it already agreed to cost. It stays off every other commit — this is a
    # nightly measurement, and the header's "NEVER A GATE" is untouched, because
    # `mainline-mutation run` exits 0 whatever the kill rate is.
    branches: [master]
    paths:
      - "verticals/mainline/packages/mainline-mutation/**"
      - "verticals/mainline/packages/mainline-domain/**"
      - "verticals/mainline/db/migrations/0049y_meas_mutation_run.sql"
      - "verticals/mainline/db/migrations/0049z_meas_mutation_result.sql"
      - "verticals/mainline/db/migrations/0149y_trg_mutation_run_append_only.sql"
      - "verticals/mainline/db/migrations/0149z_trg_mutation_result_append_only.sql"
      - "tests/e2e/mutation/**"
      - "tests/unit/domain/novelty/**"
      - ".github/workflows/mutation-ratchet.yml"

permissions:
  contents: read

concurrency:
  group: mutation-ratchet-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  LOCAL_DSN: "postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable"
  FORCE_COLOR: "1"

jobs:
  ratchet:
    name: KILL / SURVIVE catalogues, Wilson-bounded
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the harness and the domain it measures
        # `--frozen` asserts uv.lock is authoritative. A published residual-risk
        # figure computed under a dependency graph that differs from a stranger's
        # is a figure a stranger cannot reproduce, which is PL-1's whole point.
        #
        # THIS STEP DOES NOT DECIDE WHAT LATER STEPS RUN AGAINST, and that was worth
        # measuring rather than assuming. Every `uv run --package …` below re-syncs the
        # workspace environment to that package's resolution and PRUNES what is not in
        # it, so the "Apply the migration tree" step's
        # `uv sync --frozen --package trappoint-migrate` replaces this environment
        # wholesale. Run 31417446264 shows it happening: `Uninstalled 18 packages` at
        # 18:07:58, then `Installed 9 packages in 26ms` at 18:17:53 as the measurement
        # suite's own `uv run --package mainline-mutation` rebuilt it. A dependency
        # floor added HERE would therefore be gone by the time pytest starts; the floor
        # for the pytest step is declared on the pytest step, and the reason is written
        # there.
        run: |
          uv sync --frozen \
            --package mainline-mutation \
            --package mainline-domain

      - name: Resolve the seed
        id: seed
        run: |
          set -euo pipefail
          seed="${{ github.event.inputs.seed || '0' }}"
          case "$seed" in
            ''|*[!0-9]*) echo "::error::seed must be a non-negative integer"; exit 1 ;;
          esac
          echo "seed=${seed}" >> "$GITHUB_OUTPUT"

      - name: The catalogue, as declared
        run: uv run --frozen --package mainline-mutation mainline-mutation catalogue

      # ── ARM 1: intact. The production code path and nothing else. ──────────
      - name: INTACT arm
        id: intact
        run: |
          set -euo pipefail
          uv run --frozen --package mainline-mutation \
            mainline-mutation run --seed "${{ steps.seed.outputs.seed }}" \
            --out evidence/mutation | tee intact.txt

      # ── ARM 2: crippled. PL-2 — the harness must be able to go red. ────────
      - name: CRIPPLED arm (R1_DEONTIC disabled)
        id: crippled
        run: |
          set -euo pipefail
          uv run --frozen --package mainline-mutation \
            mainline-mutation run --seed "${{ steps.seed.outputs.seed }}" \
            --disable R1_DEONTIC \
            --out evidence/mutation | tee crippled.txt

      - name: PL-2 — assert the crippled arm is WORSE and names its survivor
        # The ONLY numeric assertion in this lane, and it is not about quality.
        # It asserts that switching off a rule changes the answer — i.e. that the
        # harness is measuring the lattice rather than measuring itself. A harness
        # that has only ever reported 100 % has not been observed to assert
        # anything, and a harness whose crippled arm reports the same number as
        # its intact arm is not measuring the thing it names.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          def bound(path):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              m = re.search(r"^KILL\s+wilson_lower=([0-9.]+)", text, re.MULTILINE)
              if not m:
                  sys.exit(f"{path}: no KILL line; the harness did not report")
              return float(m.group(1)), text

          whole, whole_text = bound("intact.txt")
          hurt, hurt_text = bound("crippled.txt")
          print(f"intact  KILL wilson_lower = {whole}")
          print(f"crippled KILL wilson_lower = {hurt}")

          if not hurt < whole:
              sys.exit(
                  "PL-2 FAILED: disabling R1_DEONTIC did not lower the kill rate. Either the "
                  "injection point does nothing, or the catalogue contains no mutation that "
                  "R1_DEONTIC is the only detector of. Both mean this harness asserts nothing."
              )
          if "deontic_downgrade" not in hurt_text:
              sys.exit(
                  "PL-2 FAILED: R1_DEONTIC was disabled and no deontic_downgrade mutant "
                  "survived. A kill rate below 1.0 with no named surviving class is unactionable."
              )
          print("PL-2 OK: the crippled arm is strictly worse and names deontic_downgrade.")
          PY

      # ── The record. A cluster is started ONLY to prove the DDL applies and
      #    that the run is recordable; the published number needs no database.
      - name: Read the CockroachDB image pin out of compose.yaml
        id: image
        run: |
          set -euo pipefail
          image="$(python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("compose.yaml").read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if "trappoint:crdb-image-pin" in line:
                  for candidate in lines[i + 1 : i + 4]:
                      m = re.match(r"^\s*image:\s*(\S+)\s*$", candidate)
                      if m:
                          print(m.group(1))
                          raise SystemExit(0)
          raise SystemExit("compose.yaml carries no marked image pin")
          PY
          )"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Start a single-node CockroachDB
        # MEASURED 2026-08-10 against the pinned image — `--listen-addr` is
        # DELIBERATELY ABSENT and must stay absent:
        #
        #   $ docker run … start-single-node --insecure --listen-addr=0.0.0.0:26257 …
        #   error: hostname of listen_addr must be "127.0.0.1" or "localhost"
        #
        # The node refuses to start. `--advertise-addr=localhost:26257` does not rescue
        # it; the check is on listen_addr itself. And `--listen-addr=localhost:26257`
        # starts, but binds inside the container's loopback where a published port cannot
        # reach it. The default binds where `-p` can forward, which is what this job needs
        # and what the pgwire probe below actually proves. `--http-addr` is unaffected.
        #
        # That paragraph is db-schema.yml:162-172's, kept word for word because it
        # records three measurements and a paraphrase would lose the two negative ones.
        # The ONE difference is deliberate: that copy names the image literal and this
        # one says "the pinned image" instead, because db.yml's repository census
        # ratchets the count of restated image literals and that count is AT its ceiling
        # of 21 today. Naming the version here would turn this fix into a different red.
        run: |
          set -euo pipefail
          docker run -d --name mutation-crdb \
            -p 127.0.0.1:26257:26257 \
            "${{ steps.image.outputs.image }}" \
            start-single-node --insecure \
              --store=type=mem,size=2GiB
          for attempt in $(seq 1 60); do
            if docker exec mutation-crdb ./cockroach sql --insecure --execute "SELECT 1" >/dev/null 2>&1; then
              echo "cluster answering SQL after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the cluster never answered SQL"
          docker logs mutation-crdb | tail -50
          exit 1

      - name: Apply the migration tree
        run: |
          uv sync --frozen --package trappoint-migrate
          uv run --frozen --package trappoint-migrate trappoint migrate bootstrap --dsn "$LOCAL_DSN"
          uv run --frozen --package trappoint-migrate trappoint migrate up \
            --dsn "$LOCAL_DSN" \
            --tree mainline \
            --migrations verticals/mainline/db/migrations

      - name: The measurement suite
        # These are the failures that mean the measurement did not happen. They
        # are NOT thresholds on the number.
        #
        # ── THE TWO ADDITIONS ON THIS LINE, AND WHY THEY ARE EXACTLY THESE TWO ──────
        #
        # `pytest-timeout` is the same addition boundary.yml made on 2026-08-10, and its
        # paragraph is kept word for word because it is a measurement and a paraphrase
        # would lose it: it widens nothing this lane measures. It is a pytest plugin,
        # not a workspace dependency: it is invisible to the AST scan, absent from every
        # SBOM this lane reads, and it imports no model SDK. It is here because the root
        # `pyproject.toml` sets `addopts = [… "--strict-config" …]` together with
        # `timeout = 120`, and `--strict-config` makes an ini key that no installed
        # plugin claims a HARD error — measured on this exact lane, run 31417446264:
        # `ERROR: Unknown config option: timeout`, nothing collected, exit 4. The
        # timeout is also the thing that stops a wedged lane from burning the whole job
        # budget in silence, so declaring it is what makes the 20-minute budget mean
        # something.
        #
        # THIS IS THE THIRD INSTANCE OF THAT ONE DEFECT, NOT THE FIRST. `release-proof`
        # (its own install line pins `pytest-timeout>=2.4`) and `boundary` (seven jobs,
        # `./packages/mainline-boundary pytest pytest-timeout`) were both repaired for
        # the same cause in the previous wave. The shape is invariant: any environment
        # that runs pytest from the repository root without pytest-timeout installed
        # refuses to start. IF A FOURTH LANE APPEARS, THIS IS THE PARAGRAPH THAT SHOULD
        # CATCH IT IN REVIEW — grep `--strict-config` before adding a pytest invocation
        # to a minimal environment.
        #
        # `PyYAML` is the second, independent cause with the same shape, measured in the
        # same run: `ModuleNotFoundError: No module named 'yaml'` collecting
        # `tests/unit/domain/novelty/test_novelty_manifest.py`, whose line 45 is
        # `import yaml`. That file is one of the two test roots this step selects, so the
        # module is a floor of the selection, not a widening of it. PyYAML is a parser
        # for files already committed to this repository; it reaches no network, no
        # cluster and no model SDK, and `tests/e2e/mutation/test_no_model_reach.py` still
        # walks the package AST unaffected — it scans `mainline_mutation`, and neither
        # addition is imported by it.
        #
        # `--with` rather than the sync step above, because `uv run --package` re-syncs
        # and prunes (see that step's comment). `--with` is repeatable where `--package`
        # is not, and it is the idiom this repository already runs green in
        # supply-chain.yml:708. Both are floored, not pinned: the lock stays
        # authoritative for everything it covers, and `--frozen` still holds.
        run: |
          uv run --frozen --package mainline-mutation \
            --with "pytest-timeout>=2.4" \
            --with "PyYAML>=6.0" \
            python -m pytest tests/e2e/mutation tests/unit/domain/novelty -q

      - name: Publish the dated artefacts
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ github.run_id }}
          path: evidence/mutation/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Record the numbers in the job summary
        if: always()
        run: |
          {
            echo "## mutation ratchet"
            echo ""
            echo '```'
            cat intact.txt 2>/dev/null || echo "(intact arm did not report)"
            echo ""
            cat crippled.txt 2>/dev/null || echo "(crippled arm did not report)"
            echo '```'
            echo ""
            echo "**This is a standing measurement and never a gate.** Nothing here blocks a"
            echo "merge or fails a build on a low figure. Every proportion is a WILSON LOWER"
            echo "BOUND; the point estimates beside them are not the claim."
            echo ""
            echo "Path B (the LLM oracle) is not consulted, so the figure is the model-free"
            echo "floor and a LOWER bound on the whole system's detection. The"
            echo "adversarial-paraphrase mutants come from HAND-AUTHORED committed cassettes"
            echo "(PL-3): no model was called."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cluster logs on failure
        if: failure()
        run: docker logs mutation-crdb | tail -100

      - name: Tear down
        if: always()
        run: docker rm -f mutation-crdb || true
