# SPDX-FileCopyrightText: 2026 MAINLINE contributors
# SPDX-License-Identifier: Apache-2.0
#
# The determinism boundary — four independent enforcements, four independent jobs.
#
# ARCHITECTURE.md §8.2 draws the deterministic/LLM boundary physically, with four
# testable enforcements. The value of four is that they do not share a failure
# mode, so they do not share a job either: one bad fixture path, one bad regex or
# one bad parser can take out at most one of these lanes, and the other three
# still speak.
#
# Nothing here needs an AWS account or a cluster. E1/E2/E4 read the committed
# OpenTofu plan JSON. The live `iam simulate-principal-policy` leg is behind
# MAINLINE_BOUNDARY_LIVE_AWS=1 and is deliberately NOT set here (PL-3: an
# unproven capability does not go on a dated path).
#
# ── WHAT EVERY LANE INSTALLS, AND WHY IT IS EXACTLY THAT ─────────────────────
#
# `./packages/mainline-boundary pytest pytest-timeout`. Not `uv sync --frozen`,
# not the workspace, not a requirements file. E3 asserts what a MINIMAL
# kernel-plane environment can reach, so the environment it runs in is part of
# what it measures: install the workspace here and E3's finding becomes a
# statement about uv.lock rather than about the kernel.
#
# `pytest-timeout` is the one addition, made 2026-08-10, and it widens nothing
# E3 cares about. It is a pytest plugin, not a workspace dependency: it is
# invisible to the AST scan, absent from every SBOM this lane reads, and it
# imports no model SDK. It is here because the root `pyproject.toml` sets
# `addopts = [… "--strict-config" …]` together with `timeout = 120`, and
# `--strict-config` makes an ini key that no installed plugin claims a HARD
# error — measured on this exact lane: `ERROR: Unknown config option: timeout`,
# 16 tests collected, none run, exit 4. The timeout is also the thing that stops
# a wedged lane from burning the whole job budget in silence, so declaring it is
# what makes the 12-minute budget mean something.
#
# Measured before the fix, run 31372088311 (and the scheduled master run
# 31332657063): all seven jobs died in pytest's plugin loader with
# `ModuleNotFoundError: No module named 'psycopg'`, zero assertions executed.
# The cause was ours — `trappoint_testkit` imported a PostgreSQL driver at
# module scope to register a command-line option — and it is fixed in the
# package, not worked around here.
#
# ── 2026-08-10 — THE A6 SAMPLING GREP WAS CRYING WOLF, AND WAS NARROWED ──────
#
# Run 31427116607 failed two of the three jobs below on one cause. Measured, in
# that run's log:
#
#   GREP: examined=3203 violations=2 skips=0 exemptions=20
#     packages/trappoint-recall/.../lexical/units.py:67
#     verticals/mainline/.../mainline_domain/quantity/units.py:262
#
# Both were read at source. Neither is a model request builder: the first is
# `DIMENSION_SYMBOL = {…, "temperature": "k", …}` and the second is
# `_LABEL_REPRESENTATIVES = {…, "temperature": "kelvin", …}` — physical-dimension
# tables in an industrial-safety domain that also carries pressure, lel and uel.
# `greps.py`'s own docstring had predicted this failure mode word for word.
#
# The INSTRUMENT was repaired, not the finding. `ast.walk` sees the node and not
# the context, and `{"temperature": "k"}` and `{"temperature": 0.0}` beside
# `"modelId"` are the same node and opposite findings. The rule now carries
# context down the tree and fires only in a REQUEST-BUILDER CONTEXT: a keyword
# on a model-transport call, a key standing beside one of 28 wire-protocol
# markers, or a write into a name bound to a request body. Measured after, on
# this tree with the pinned interpreter:
#
#   GREP: examined=3215 violations=0 skips=0 exemptions=20
#
# NEITHER units.py ACQUIRED AN EXEMPTION — the count of exempt prefixes is still
# one, and `tests/boundary/test_ci_greps.py` asserts that by path. The one
# exemption that exists (the corpus renderer) now also reports what it withholds:
# `Withheld here: temperature:157, topP:158` in bedrock.py, which is the narrowed
# rule demonstrating on the real tree that it still fires on a real builder.
#
# A narrowing nobody has watched refuse is indistinguishable from a deletion, so
# `ci-greps` carries a standing RED step below that plants a genuine
# `temperature=` on a genuine `converse` call, in the same module as a copy of the
# table that used to trip the rule, and fails if the scan comes back clean.
#
# ── THE ONE THING THIS LANE IS STILL RED ON, NAMED AND OWED ──────────────────
#
# Run 31436815826 (commit a4c24ee): seven of eight jobs green. `CI greps` passed
# 37 tests and its RED step; `mainline-boundary unit tests` passed 56 tests and
# published `GREP: examined=3203 violations=0 skips=0 exemptions=20`. That job
# then failed at its `ruff` step, which had NEVER RUN BEFORE — the pytest step
# above it had failed on every prior run, so this is a debt being surfaced for
# the first time rather than a regression. Measured, `ruff check
# packages/mainline-boundary tests/boundary` with ruff 0.16.2:
#
#   E402   tests/boundary/conftest.py:39           (sys.path insert before import)
#   I001   tests/boundary/test_e1_iam.py:18        (first-party block not separated)
#   I001   tests/boundary/test_e2_network.py:18
#   E501   tests/boundary/test_e2_network.py:76    (105 > 100)
#   I001   tests/boundary/test_e3_code.py:20
#   RUF002 tests/boundary/test_fleet_matrix.py:5   (EN DASH in a docstring)
#   I001   tests/boundary/test_fleet_matrix.py:28
#   Found 7 errors.  [4 fixable with --fix]
#
# `packages/mainline-boundary/**`, `tests/boundary/test_ci_greps.py` and every
# other file this worker owns are at zero, under both `ruff check` and
# `ruff format --check`. The seven above sit in five files this worker does not
# own, so they are recorded here rather than fixed in the same commit: the cure
# is `ruff check --fix tests/boundary`, one `# noqa: E402` with its reason on
# conftest.py:39, one hyphen, and one rewrap. The step is NOT narrowed to dodge
# them — `tests/boundary` is this job's suite and linting it is the point.

name: boundary

on:
  push:
    # `master` is this repository's default branch. It read `main` until
    # 2026-08-10, so every lane below had never once run on the branch the
    # Actions tab opens on.
    branches: [master]
    paths:
      - "packages/mainline-boundary/**"
      - "tests/boundary/**"
      - "packages/trappoint-*/**"
      - "verticals/mainline/packages/mainline-gate-svc/**"
      - "spec/agents/fleet.yaml"
      - "evidence/sbom/**"
      - "README.md"
      - "VERIFY.md"
      - "docs/deck/**"
      - ".github/workflows/boundary.yml"
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, because three of the four enforcements assert the ABSENCE of
    # something, and an absence can be undone by a change to a file none of the
    # path filters above mention.
    - cron: "17 19 * * *"

permissions:
  contents: read

concurrency:
  group: boundary-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  # Not set, on purpose. Written here so the absence is a decision a reader can
  # see rather than an omission they have to infer:
  #   MAINLINE_BOUNDARY_LIVE_AWS: "1"
  FORCE_COLOR: "1"

jobs:
  e1-iam:
    name: E1 — no model IAM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the boundary package
        run: |
          python -m pip install --disable-pip-version-check \
            ./packages/mainline-boundary pytest pytest-timeout
      - name: Assert the kernel task role cannot reach Bedrock
        run: python -m pytest tests/boundary/test_e1_iam.py -v --no-header -rs
      # `|| true` was removed here on 2026-08-10. A report step that cannot fail
      # is a report nobody reads: the CLI's exit codes ARE its contract (0 clean,
      # 1 violations, 3 VACUOUS — examined nothing and gave no reason, 4 skipped
      # with a reason), and swallowing them turned "E1 examined nothing" into a
      # green tick. Measured today, `e1 --json` exits 0 against this tree, so
      # this step is green on its own merits and not by suppression.
      - name: Report
        if: always()
        run: python -m mainline_boundary.cli e1 --json

  e2-network:
    name: E2 — no model network path
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the boundary package
        run: |
          python -m pip install --disable-pip-version-check \
            ./packages/mainline-boundary pytest pytest-timeout
      - name: Install conftest
        # E2 is the enforcement a security reviewer believes precisely because it
        # does not depend on our code being correct, so the Rego leg is not
        # optional here. tests/boundary/test_e2_network.py skips the Rego tests
        # when no engine is present; this step is what makes that skip impossible
        # in CI.
        env:
          CONFTEST_VERSION: "0.69.0"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
          sudo install -m 0755 /tmp/conftest /usr/local/bin/conftest
          conftest --version
      - name: Assert no bedrock endpoint is reachable from the kernel
        run: python -m pytest tests/boundary/test_e2_network.py -v --no-header -rs
      - name: Rego, directly — the second opinion, unmediated by our test harness
        run: |
          conftest test --policy tests/boundary/policy --all-namespaces \
            tests/boundary/fixtures/plan.json

  e3-code:
    name: E3 — no model code path
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the boundary package
        run: |
          python -m pip install --disable-pip-version-check \
            ./packages/mainline-boundary pytest pytest-timeout
      - name: Assert no kernel-plane package can reach a model SDK
        run: python -m pytest tests/boundary/test_e3_code.py -v --no-header -rs
      - name: Surface the skips
        # E3 skips-with-reason where a leg cannot stand on its own. That skip
        # must be VISIBLE in the log, because a silent skip and a pass look
        # identical to everyone who is not reading closely.
        #
        # `|| true` was removed here on 2026-08-10, and removing it is what makes
        # the sentence above true: with it, exit 3 (VACUOUS — the scan examined
        # NOTHING and gave no reason) was indistinguishable from exit 0, which is
        # precisely the confusion the CLI's exit codes were designed to prevent.
        # Measured today: `e3` exits 0 with examined=327, violations=0, skips=1
        # (no SBOM is committed for the current kernel image, so that leg does
        # not stand; the AST scan does). If the scan ever examines nothing, this
        # step now says so by failing.
        if: always()
        run: python -m mainline_boundary.cli e3

  e4-egress:
    name: E4 — no model prompt path
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the boundary package
        run: |
          python -m pip install --disable-pip-version-check \
            ./packages/mainline-boundary pytest pytest-timeout
      - name: Assert the kernel speaks exactly pgwire plus in-VPC HTTPS
        run: python -m pytest tests/boundary/test_e4_egress.py -v --no-header -rs
      - name: Restate the FIS blackhole status in the log
        run: |
          python - <<'PY'
          from mainline_boundary.egress import load_fis_record
          record = load_fis_record()
          print(f"FIS {record.experiment_id}: status={record.status} "
                f"verified={record.verified} blocked_by={record.blocked_by}")
          print(record.raw.get("honest_status_sentence", "").strip())
          assert record.verified is False, "flip this only with a committed attestation"
          PY

  fleet-matrix:
    name: Fleet capability matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the boundary package
        run: |
          python -m pip install --disable-pip-version-check \
            ./packages/mainline-boundary pytest pytest-timeout
      - name: Assert every agent's declared capabilities
        run: python -m pytest tests/boundary/test_fleet_matrix.py -v --no-header -rs

  ci-greps:
    name: CI greps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the boundary package
        run: |
          python -m pip install --disable-pip-version-check \
            ./packages/mainline-boundary pytest pytest-timeout
      - name: No retry helper, no sampling parameter, no per-signer label, no forbidden claim
        run: python -m pytest tests/boundary/test_ci_greps.py -v --no-header -rs
      - name: RED — the narrowed A6 rule still fires on a real request builder
        # PL-2 for the 2026-08-10 narrowing, as a STANDING job rather than a
        # one-off: a rule that was narrowed on the day it cried wolf must be
        # watched refusing on every run thereafter, or the narrowing and a
        # deletion look identical from the outside. The planted module holds both
        # shapes — the dimension table that used to be reported, and a genuine
        # `temperature=` on a genuine `converse` call — and this step fails
        # unless the scan separates them.
        run: |
          python - <<'PY'
          import pathlib
          import tempfile

          from mainline_boundary.greps import scan_sampling_params

          SOURCE = (
              'DIMENSION_SYMBOL = {"pressure": "pa", "temperature": "k", "lel": "lel"}\n'
              "\n"
              "def render(client, node, model_id):\n"
              "    return client.converse(\n"
              "        modelId=model_id,\n"
              '        messages=[{"role": "user", "content": [{"text": node.text}]}],\n'
              "        temperature=0.0,\n"
              "    )\n"
          )
          numbered = list(enumerate(SOURCE.splitlines(), start=1))
          builder = {n for n, line in numbered if "temperature=0.0" in line}
          table = {n for n, line in numbered if '"temperature": "k"' in line}

          root = pathlib.Path(tempfile.mkdtemp())
          package = root / "packages" / "trappoint-recall" / "src" / "trappoint_recall"
          package.mkdir(parents=True)
          (package / "units.py").write_text(SOURCE, encoding="utf-8")

          report = scan_sampling_params(root)
          print(report.summary())
          reported = {int(v.subject.rsplit(":", 1)[1]) for v in report.violations}
          assert reported == builder, f"expected the builder at {builder}, got {reported}"
          assert not (reported & table), "the dimension table was reported again"
          print(
              f"RED as required: line {sorted(builder)[0]} refused, "
              f"line {sorted(table)[0]} cleared, and neither units.py in the real tree "
              "carries an exemption."
          )
          PY
      - name: Repository-wide grep report
        if: always()
        run: python -m mainline_boundary.cli greps

  package-unit-tests:
    name: mainline-boundary unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the boundary package
        run: |
          python -m pip install --disable-pip-version-check \
            ./packages/mainline-boundary pytest pytest-timeout ruff mypy types-PyYAML
      - name: Unit tests
        run: python -m pytest packages/mainline-boundary/tests -q --no-header
      - name: Repository-wide grep report — this job's headline number
        # `test_greps_pass_over_the_repository` asserts `violations=0`, but under
        # `-q` the number it asserted is not in the log. This step puts it there:
        # the job that owns the assertion should also publish the measurement.
        if: always()
        run: python -m mainline_boundary.cli greps
      - name: ruff
        run: ruff check packages/mainline-boundary tests/boundary
      - name: mypy (strict)
        run: mypy --strict packages/mainline-boundary/src/mainline_boundary

  summary:
    name: Boundary summary
    runs-on: ubuntu-24.04
    needs: [e1-iam, e2-network, e3-code, e4-egress, fleet-matrix, ci-greps, package-unit-tests]
    if: always()
    steps:
      - name: Fail if any enforcement did not pass
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Determinism boundary (ARCHITECTURE.md §8.2)

          | # | enforcement | result |
          |---|---|---|
          | E1 | no model IAM | ${{ needs.e1-iam.result }} |
          | E2 | no model network path | ${{ needs.e2-network.result }} |
          | E3 | no model code path | ${{ needs.e3-code.result }} |
          | E4 | no model prompt path | ${{ needs.e4-egress.result }} |
          | — | fleet capability matrix | ${{ needs.fleet-matrix.result }} |
          | — | CI greps | ${{ needs.ci-greps.result }} |

          E1, E2 and E4 are asserted over a committed OpenTofu plan, not a live
          account: AWS credentials are not valid on the build machine as of
          2026-08. They become live checks in `cloud-verify.yml` the day
          credentials work (PL-3).

          The AWS FIS blackhole game-day named in §8.2 is **specified and unrun**
          (§19 GT-16). Do not promise it on camera.
          EOF
          for result in \
            "${{ needs.e1-iam.result }}" \
            "${{ needs.e2-network.result }}" \
            "${{ needs.e3-code.result }}" \
            "${{ needs.e4-egress.result }}" \
            "${{ needs.fleet-matrix.result }}" \
            "${{ needs.ci-greps.result }}" \
            "${{ needs.package-unit-tests.result }}" ; do
            if [ "$result" != "success" ]; then
              echo "an enforcement lane reported '$result'"
              exit 1
            fi
          done
