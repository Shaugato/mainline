# SPDX-FileCopyrightText: 2026 MAINLINE contributors
# SPDX-License-Identifier: Apache-2.0
#
# THE ONLY LANE THAT HAS EVER SPOKEN TO COCKROACHDB CLOUD.
#
# Before this file existed, nothing in this repository ran against CockroachDB Cloud —
# docs/leads/quality-repair.md §1.7, measured. Every green tick the project had was a
# tick from a single-node container started by `docker run`, and the product's platform
# claims are claims about a managed, multi-region, Serverless-tier database. Those are
# not the same system, and the differences are not cosmetic.
#
# THREE THINGS THIS LANE EXISTS TO CATCH, all of them measured platform facts:
#
#   * gc.ttlseconds. Local defaults to 14400. Cloud Basic is 4500. LOCAL IS MORE
#     PERMISSIVE. `db.yml` now pins 4500 on its throwaway node so the local lane stops
#     being the easier exam, but a pinned local node is a simulation of Cloud, not
#     Cloud. Only this lane reads the real number.
#   * The vector index. Prefix-constrained ANN uses the index ONLY when explicitly
#     hinted (`FROM t@idx`) with every prefix column equal to a single value. A plan
#     that silently degrades to a full scan is a latency regression, not an error, and
#     a local node with five thousand rows will never show it.
#   * Serializable retries. Cloud's contention profile is not a laptop's. `40001` is
#     the error the whole retry contract is written against, and this lane is where a
#     real one is likely to appear.
#
# THE HONESTY REQUIREMENT, AND IT IS THE POINT OF THE FILE.
#
# When the cluster secret is absent this workflow DOES NOT PASS. It reports `skipped`
# with a named reason, writes that reason into the job summary, and emits it as a
# `::warning`. A lane that quietly returns success when its credential is missing is
# worse than no lane at all: it manufactures a green tick for an assertion that was
# never evaluated, and the whole moat of this project is that its greens mean something.
# The `verify` job is therefore gated on a boolean computed from the secret, and the
# `skipped-loudly` job runs in the exact complement of that condition — so the workflow
# always says which of the two happened, and never says nothing.
#
# PL-1 IS NOT VIOLATED BY THIS FILE. PL-1 says every milestone's PROOF must run on a
# stranger's machine with no credential of ours. This lane is not a proof; it is a
# TRUTH CHECK on the platform assumptions the proofs are written against. That is why
# it is nightly and not on `pull_request`, why nothing in `ci.yml`, `db.yml` or
# `release-proof.yml` needs it, and why its absence degrades the repository to "the
# local proofs, unconfirmed against Cloud" rather than to "unproven".
#
# GEOGRAPHY, and it is recorded in the step summary on every run because it is the kind
# of fact that gets forgotten and then explains a latency number nobody can account for:
# the DATABASE is CockroachDB Cloud Basic in SINGAPORE, and INFERENCE runs in AWS
# ap-southeast-2, SYDNEY. Every embedding call in a recall path crosses that gap.
# Bedrock Rerank is not available in ap-southeast-2 at all.

name: cloud-verify

on:
  # NO `push:` TRIGGER, AND THAT IS DELIBERATE — READ THIS BEFORE "FIXING" IT.
  #
  # On 2026-08-10 every other workflow in this repository was found triggering on
  # `push: branches: [main]` against a repository whose default branch is `master`, so
  # fifteen lanes had never run on the branch the Actions tab opens on. This file was
  # NOT part of that defect and must not be swept up in its repair: it holds the one
  # credential this repository has (`secrets.CRDB_CLOUD_DSN`), and a lane that reaches a
  # live CockroachDB Cloud cluster on every commit is a lane that bills a shared
  # resource for every typo. PL-1 also says a proof needing a credential of ours is
  # evidence about us, not about the product — so this is nightly by design.
  #
  # It still reaches `master`: GitHub fires `schedule:` from the DEFAULT branch only,
  # which is `master`, so the scheduled runs below are already master runs and are
  # already visible on the default view of the Actions tab.
  schedule:
    # 17:00 UTC daily = 01:00 Singapore, 03:00 Sydney. Off-peak for the cluster region
    # and for the inference region, and comfortably clear of the working day in which
    # somebody might be running the same suite by hand against the same cluster.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "conformance profile to run against Cloud"
        required: false
        default: "trappoint-ref"
        type: string

permissions:
  contents: read

concurrency:
  # NOT `cancel-in-progress`. There is one Cloud cluster and a half-finished
  # conformance run leaves rows in it; letting a new run cancel an old one mid-history
  # is how the next run inherits state it did not create and reports a refusal that is
  # an artefact of the cancellation.
  group: cloud-verify
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  FORCE_COLOR: "1"
  # Recorded, not used to authenticate. See the geography note in the header.
  DATABASE_REGION: "CockroachDB Cloud Basic — Singapore (ap-southeast-1)"
  INFERENCE_REGION: "AWS Bedrock — Sydney (ap-southeast-2)"

jobs:
  # ---------------------------------------------------------------------------------
  # `secrets` cannot be read in a job-level `if:`, so the boolean has to be computed in
  # a step and published as an output. This job exists for that one reason. It never
  # prints the secret and never puts it in an output — only whether it is non-empty.
  # ---------------------------------------------------------------------------------
  preflight:
    name: is there a Cloud cluster to verify against? (and can it say no?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has-cluster: ${{ steps.probe.outputs.has-cluster }}
    steps:
      - name: Deny all egress
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------------
      # THE NEGATIVE CONTROL THIS LANE COULD NOT HAVE, AND NOW DOES.
      #
      # `skipped-loudly` is the complement of `verify`, so on a run where the secret
      # IS set — every run since it was set — the skip path executes zero times. The
      # honesty this whole file is built on was therefore asserted by nothing but the
      # text of an `if:` expression. A lane whose failure path never runs has a
      # failure path nobody has tested.
      #
      # So the probe is a FILE, and it is exercised four times before it is trusted
      # once: with no secret, with a loopback DSN, with a `.local` DSN, and finally
      # with the real one. The three red cases run on every scheduled run, whether or
      # not the credential is present, and none of them can see its value.
      # ---------------------------------------------------------------------------
      - name: The probe, written once so its red half cannot drift from its green half
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anti-vacuity"
          cat > "$RUNNER_TEMP/anti-vacuity/probe.py" <<'PY'
          """Decide whether there is a CockroachDB Cloud cluster to verify against.

          Reads $CLOUD_DSN. Prints `has-cluster=true` or `has-cluster=false` and a reason.
          Exits 1 — never `false` — when the DSN is present but points somewhere that is
          not Cloud, because "the secret is set to localhost" is a misconfiguration and
          reporting it as "no cluster" would hide it behind a legitimate-looking skip.

          The VALUE is never printed. On refusal the HOST is, because a DSN that has
          fallen back to a loopback address has no secret left in the part being named.
          """
          import os
          import sys
          from urllib.parse import urlsplit

          dsn = os.environ.get("CLOUD_DSN", "")
          if not dsn:
              print("has-cluster=false")
              print("REASON: the repository secret CRDB_CLOUD_DSN is not set, so no "
                    "CockroachDB Cloud cluster can be contacted")
              raise SystemExit(0)

          host = (urlsplit(dsn).hostname or "").lower()
          if host in {"localhost", "127.0.0.1", "::1", ""} or host.endswith(".local"):
              print(f"::error title=CRDB_CLOUD_DSN is not Cloud::the secret resolves to "
                    f"{host!r} — that is not CockroachDB Cloud, and every assertion in "
                    "this lane would pass against it while proving nothing about the "
                    "managed platform it claims to measure")
              raise SystemExit(1)

          print("has-cluster=true")
          # Presence only. Not the value, and not its length either: a length is a fact
          # about a credential, and facts about credentials belong in no log.
          print("REASON: CRDB_CLOUD_DSN is present and does not resolve to a loopback host")
          PY
          echo "wrote $RUNNER_TEMP/anti-vacuity/probe.py"

      - name: RED — with no secret the probe says false, and says why
        env:
          CLOUD_DSN: ""
        run: |
          set -euo pipefail
          out="$(python3 "$RUNNER_TEMP/anti-vacuity/probe.py")"
          echo "${out}"
          case "${out}" in
            *"has-cluster=false"*) ;;
            *) echo "::error title=cloud-verify can be vacuous::with no secret the probe did not report has-cluster=false. The verify job is gated on that string, so this lane would run its assertions against nothing, or skip in silence."; exit 1 ;;
          esac
          case "${out}" in
            *"CRDB_CLOUD_DSN is not set"*) echo "and it names the missing secret, as it must" ;;
            *) echo "::error title=cloud-verify can be vacuous::the probe reported false without naming CRDB_CLOUD_DSN. A skip that does not say what is missing is a skip nobody will act on."; exit 1 ;;
          esac

      - name: RED — a DSN that is not Cloud is a FAILURE, never a quiet false
        run: |
          set -euo pipefail
          for host in "127.0.0.1:26257" "localhost:26257" "crdb.local:26257"; do
            set +e
            out="$(CLOUD_DSN="postgresql://root@${host}/defaultdb?sslmode=disable" \
              python3 "$RUNNER_TEMP/anti-vacuity/probe.py" 2>&1)"
            code=$?
            set -e
            echo "${host} -> exit ${code}"
            if [ "${code}" -eq 0 ]; then
              echo "::error title=cloud-verify can be vacuous::the probe ACCEPTED ${host}. A DSN that has silently fallen back to a local node makes every assertion in this lane pass while proving nothing about CockroachDB Cloud — which is precisely what this workflow exists to refuse."
              exit 1
            fi
            case "${out}" in
              *"is not CockroachDB Cloud"*) echo "  refused, and the message names the family" ;;
              *) echo "::error title=cloud-verify can be vacuous::exit ${code} for ${host} but the message does not name the family: ${out}"; exit 1 ;;
            esac
          done

      - name: RED — the gate and its complement are both still declared
        # The three checks above prove the probe can say no. This one proves the answer
        # is still WIRED to anything: `verify` must be gated on the boolean, and
        # `skipped-loudly` must run in exactly the complement, or this workflow can
        # report a green tick for an assertion it never made.
        run: |
          set -euo pipefail
          file=".github/workflows/cloud-verify.yml"
          missing=0
          grep -qF "if: needs.preflight.outputs.has-cluster == 'true'" "${file}" || {
            echo "::error file=${file}::the verify job is no longer gated on has-cluster == 'true'. Without that gate this lane runs its Cloud assertions with no Cloud credential, or reports success for assertions it never made."
            missing=1
          }
          grep -qF "if: needs.preflight.outputs.has-cluster != 'true'" "${file}" || {
            echo "::error file=${file}::the skipped-loudly job no longer runs in the complement of the verify gate. The workflow can then say NOTHING about a run with no credential, which is the exact silence its header forbids."
            missing=1
          }
          [ "${missing}" -eq 0 ]
          echo "both halves of the gate are declared: verify on 'true', skipped-loudly on its complement"

      - name: GREEN — is CRDB_CLOUD_DSN set?
        id: probe
        env:
          # Quoted into a variable and tested by the same file the three red cases above
          # ran. The value is never echoed, never written to an output, and never
          # interpolated into a `run:` body.
          CLOUD_DSN: ${{ secrets.CRDB_CLOUD_DSN }}
        run: |
          set -euo pipefail
          out="$(python3 "$RUNNER_TEMP/anti-vacuity/probe.py")"
          echo "${out}"
          echo "${out}" | grep -E '^has-cluster=(true|false)$' >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------
  verify:
    name: conformance + fingerprint attestation, against Cloud
    runs-on: ubuntu-24.04
    needs: [preflight]
    if: needs.preflight.outputs.has-cluster == 'true'
    timeout-minutes: 30
    env:
      CONFORM_PROFILE: ${{ inputs.profile || 'trappoint-ref' }}
    steps:
      - name: Deny egress except to the indexes and the cluster
        uses: step-security/harden-runner@v2
        with:
          # `cockroachlabs.cloud` is the control plane; the pgwire host is a subdomain
          # of it and resolves per-cluster, so the wildcard-free list below is the
          # honest minimum. `block` still applies to everything else — this job holds a
          # database credential and must not be able to post it anywhere.
          #
          # `release-assets.githubusercontent.com` is where GitHub now serves release-asset
          # BODIES from — `github.com` issues only the redirect — so `astral-sh/setup-uv`
          # cannot install uv without it. It is named here and NOT on the other two jobs
          # in this file, because neither of those installs uv: an endpoint permitted by a
          # job that has no use for it is a hole, not a convenience. Measured in
          # `.github/actions/setup-workspace/action.yml`'s header.
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            cockroachlabs.cloud:443
            cockroachlabs.cloud:26257

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          packages: "trappoint-migrate trappoint-conformance"
          cache-suffix: "cloud"

      - name: The cluster answers, and it is NOT a local node
        # A DSN that has silently fallen back to localhost would make every step below
        # pass and would prove nothing about Cloud, which is precisely the failure this
        # workflow exists to refuse. So the first thing asserted is that the host is not
        # a loopback address.
        env:
          CRDB_CLOUD_DSN: ${{ secrets.CRDB_CLOUD_DSN }}
        run: |
          set -euo pipefail
          uv run --frozen --package trappoint-migrate python - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          dsn = os.environ["CRDB_CLOUD_DSN"]
          host = (urlsplit(dsn).hostname or "").lower()
          if host in {"localhost", "127.0.0.1", "::1", ""} or host.endswith(".local"):
              print(f"::error::CRDB_CLOUD_DSN points at {host!r} — that is not CockroachDB Cloud")
              sys.exit(1)
          print(f"cluster host: {host}")
          PY

      - name: Read Cloud's real gc.ttlseconds
        # Not asserted, RECORDED. The number is the platform fact `db.yml` pins its
        # throwaway node to, and the day Cloud changes it is the day a pile of local
        # time-travel assertions quietly stop corresponding to anything. Measured
        # expectation, 2026-08-10: 4500 on Basic, against 14400 on a fresh local node.
        env:
          CRDB_CLOUD_DSN: ${{ secrets.CRDB_CLOUD_DSN }}
        run: |
          set -euo pipefail
          uv run --frozen --package trappoint-migrate python - <<'PY'
          import os
          import pathlib
          import re

          import psycopg

          with psycopg.connect(os.environ["CRDB_CLOUD_DSN"], connect_timeout=20) as conn:
              version = conn.execute("SELECT version()").fetchone()[0]
              try:
                  rows = conn.execute("SHOW ZONE CONFIGURATION FOR RANGE default").fetchall()
              except psycopg.Error as exc:
                  # Basic/Serverless tiers may refuse zone introspection to a non-admin
                  # role. That is a fact worth recording, not a reason to fail a lane
                  # whose job is to REPORT this number. Saying "unavailable, and here is
                  # the SQLSTATE" is honest; guessing 4500 would not be.
                  rows = []
                  version += f"  [zone config unreadable: {exc.diag.sqlstate if exc.diag else '?'}]"

          raw = " ".join(str(cell) for row in rows for cell in row).replace("\n", " ")
          found = re.search(r"gc\.ttlseconds\s*=\s*(\d+)", raw)
          ttl = found.group(1) if found else "unavailable"

          print(f"version       : {version}")
          print(f"gc.ttlseconds : {ttl}")
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## the cluster this ran against\n\n")
              handle.write("| item | value |\n|---|---|\n")
              handle.write(f"| version | `{version}` |\n")
              handle.write(f"| gc.ttlseconds (RANGE default) | `{ttl}` |\n")
              handle.write("| local equivalent | `14400` on a fresh single-node container |\n\n")
          PY

      - name: Bootstrap and apply the reference vertical
        env:
          CRDB_CLOUD_DSN: ${{ secrets.CRDB_CLOUD_DSN }}
        run: |
          set -euo pipefail
          uv run --frozen --package trappoint-migrate trappoint migrate bootstrap --dsn "$CRDB_CLOUD_DSN"
          uv run --frozen --package trappoint-migrate trappoint migrate up \
            --dsn "$CRDB_CLOUD_DSN" \
            --tree trappoint-ref \
            --migrations packages/trappoint-sql/refvertical/sql

      - name: FINGERPRINT ATTESTATION — the same schema, in a different place
        # This is the assertion with the most value in the whole workflow. The schema
        # fingerprint is computed from the live catalogue. If Cloud and a local node
        # produce the SAME digest for the same migrations, the fingerprint is a property
        # of the schema. If they differ, the fingerprint is a property of the
        # ENVIRONMENT, and every claim built on "the digest did not move" has to be
        # withdrawn. There is no third possibility and no way to learn which without a
        # second environment — this one.
        env:
          CRDB_CLOUD_DSN: ${{ secrets.CRDB_CLOUD_DSN }}
        run: uv run --frozen --package trappoint-migrate trappoint migrate attest --dsn "$CRDB_CLOUD_DSN"

      - name: Status
        env:
          CRDB_CLOUD_DSN: ${{ secrets.CRDB_CLOUD_DSN }}
        run: |
          uv run --frozen --package trappoint-migrate trappoint migrate status \
            --dsn "$CRDB_CLOUD_DSN" \
            --tree trappoint-ref \
            --migrations packages/trappoint-sql/refvertical/sql

      - name: CONFORMANCE, against Cloud
        env:
          CRDB_CLOUD_DSN: ${{ secrets.CRDB_CLOUD_DSN }}
        run: |
          uv run --frozen --package trappoint-conformance trappoint-conform \
            --dsn "$CRDB_CLOUD_DSN" \
            --profile "$CONFORM_PROFILE" \
            --json

      - name: Record what ran, and where the two halves of it live
        if: always()
        run: |
          {
            echo "## cloud-verify"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| database | ${DATABASE_REGION} |"
            echo "| inference | ${INFERENCE_REGION} |"
            echo "| profile | \`${CONFORM_PROFILE}\` |"
            echo ""
            echo "**The two halves of this product are in different countries.** The database is"
            echo "CockroachDB Cloud Basic in **Singapore**; model inference runs on AWS Bedrock in"
            echo "**ap-southeast-2, Sydney**. Every embedding call on a recall path crosses that"
            echo "gap, and a latency number measured on a laptop where both are localhost is not"
            echo "a number about this system. Bedrock Rerank is **not available** in"
            echo "ap-southeast-2 at all, which is why no read path depends on it."
            echo ""
            echo "**What this lane proves.** That the reference vertical applies to a managed"
            echo "multi-node cluster, that the schema fingerprint is a property of the SCHEMA and"
            echo "not of the environment, and that the conformance suite's illegal histories are"
            echo "refused there too."
            echo ""
            echo "**What it does NOT prove.** Nothing about the MAINLINE merge gate"
            echo "(\`release-proof.yml\`), nothing about the console, and nothing about inference:"
            echo "no model is called anywhere in this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------
  # The complement. This job runs in exactly the case `verify` does not, and it is the
  # reason this workflow can never report a green tick for an assertion it did not make.
  # ---------------------------------------------------------------------------------
  skipped-loudly:
    name: SKIPPED — no Cloud cluster secret
    runs-on: ubuntu-24.04
    needs: [preflight]
    if: needs.preflight.outputs.has-cluster != 'true'
    timeout-minutes: 5
    steps:
      - name: Deny all egress
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Say what was not verified, and name the thing that is missing
        run: |
          set -euo pipefail
          reason="the repository secret CRDB_CLOUD_DSN is not set, so no CockroachDB Cloud cluster was contacted"
          echo "::warning title=cloud-verify skipped::${reason}"
          {
            echo "## cloud-verify — SKIPPED"
            echo ""
            echo "**Reason.** ${reason}"
            echo ""
            echo "This workflow did not fail and it did not pass. It ran and asserted **nothing**,"
            echo "and it says so here rather than reporting a green tick, because a lane that"
            echo "returns success when its credential is missing manufactures evidence for a"
            echo "check that was never evaluated."
            echo ""
            echo "**What is consequently unconfirmed until this secret is set:**"
            echo ""
            echo "| claim | where it is asserted today | why local is not enough |"
            echo "|---|---|---|"
            echo "| the schema fingerprint is a property of the schema | \`db.yml\`, one node | a digest reproduced in ONE environment cannot be distinguished from a digest OF that environment |"
            echo "| time-travel assertions hold at Cloud's GC horizon | \`db.yml\`, pinned to 4500 | a pinned local node simulates Cloud; it is not Cloud |"
            echo "| prefix-constrained ANN uses the vector index | local, ~5 000 rows | an unhinted plan degrades to a scan silently, and a small table hides it |"
            echo "| the retry contract survives real contention | local, single node | \`40001\` is rare on a laptop and ordinary on a shared cluster |"
            echo ""
            echo "**To enable it:** set the repository secret \`CRDB_CLOUD_DSN\` to the cluster's"
            echo "pgwire DSN. The lane runs nightly at 17:00 UTC and on \`workflow_dispatch\`."
            echo ""
            echo "**Geography, for when it is enabled.** Database: ${DATABASE_REGION}."
            echo "Inference: ${INFERENCE_REGION}. The two halves are in different countries."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${reason}"

  # ---------------------------------------------------------------------------------
  # THE RETRY CONTRACT, EXERCISED RATHER THAN ASSUMED.
  #
  # The header of this file lists `40001` as one of three things the lane exists to catch,
  # and the `skipped-loudly` table says "`40001` is rare on a laptop and ordinary on a
  # shared cluster". Both sentences were true and neither was a test: no run of this
  # repository had ever produced a serialization restart, so the retry loop that the whole
  # gate service is built on — `trappoint_core.retry.run_gate` — had never met the error
  # it exists for outside a unit test with a fake exception.
  #
  # "Rare on a laptop" is a statement about ACCIDENTAL contention. A CONSTRUCTED read-write
  # cycle produces `RETRY_SERIALIZABLE` on a single node, deterministically, and this job
  # does exactly that: transaction A reads key 1 and writes key 2, transaction B reads key
  # 2 and writes key 1, and neither can be ordered before the other. MEASURED 2026-08-10
  # against CockroachDB v26.2.5 on the pinned image:
  #
  #     observed sqlstate : 40001
  #     observed message  : restart transaction: TransactionRetryWithProtoRefreshError:
  #                         TransactionRetryError: retry txn (RETRY_SERIALIZABLE) …
  #     run_gate attempts : 2  retries recorded: [(0, '40001', 0.0166)]
  #     max_attempts=1    : RetryBudgetExhausted: 40001 after 1 attempt(s) in 1.013s:
  #                         the transaction is undecided, not refused
  #
  # THREE FAMILIES, and the first of them is the anti-vacuity one:
  #
  #   not-exercised            no 40001 was produced at all. The contract would then be
  #                            ASSUMED, and this job reports that as a failure rather than
  #                            printing "no contention observed" and going green.
  #   retry-never-taken        a 40001 arrived and `run_gate` did not record a retry, so
  #                            the ladder was never walked.
  #   budget-swallows-40001    with `max_attempts=1` the conflicting transaction reported
  #                            SUCCESS, or surfaced as a refusal. An undecided transaction
  #                            reported as decided is the worst outcome available here, and
  #                            it is the one `spec/errors.md` §4 is written against.
  #
  # NO CREDENTIAL. This runs on the pinned local image, so it holds whether or not
  # `CRDB_CLOUD_DSN` is set — which is the point: the lane's most load-bearing platform
  # claim stops depending on a secret only the maintainer has.
  # ---------------------------------------------------------------------------------
  retry-contract:
    name: a real 40001 RETRY_SERIALIZABLE, and the loop that must not swallow it
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RETRY_DSN: "postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable"
      RETRY_DATABASE: "ci_retry_contract"
      PGCONNECT_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Read the ONE version constant out of compose.yaml
        id: image
        # READ, not restate — see the header of `release-proof.yml`'s `prove` job for the
        # full reasoning. In short: until 2026-08-12 this step opened with an image
        # literal and checked compose.yaml AGAINST it, which is two copies of the version
        # constant asserting that they agree. `db.yml`'s `image-pin` job refuses exactly
        # that, HARD, over a list of harness files this one is on — so the restatement was
        # not a stylistic matter, it was the reason `db` was red. One copy cannot disagree
        # with itself.
        run: |
          set -euo pipefail
          image="$(python3 - <<'PY'
          import pathlib
          import re
          import sys

          MARKER = "trappoint:crdb-image-pin"
          IMAGE_LINE = re.compile(r"^\s*image:\s*(?P<image>\S+)\s*$")

          lines = pathlib.Path("compose.yaml").read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(lines):
              if MARKER not in line:
                  continue
              for candidate in lines[index + 1 : index + 4]:
                  found = IMAGE_LINE.match(candidate)
                  if found is not None:
                      print(found.group("image"))
                      sys.exit(0)
          sys.exit(
              f"compose.yaml carries no line marked {MARKER!r} followed by an 'image:' key "
              "within the next three lines; the CockroachDB version constant has moved or "
              "been deleted"
          )
          PY
          )"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "using ${image}"

      - name: Start the single-node cluster
        run: |
          set -euo pipefail
          docker run -d --name mainline-crdb-retry \
            -p 26257:26257 \
            --health-cmd="curl -fsS http://127.0.0.1:8080/health?ready=1 || exit 1" \
            --health-interval=3s --health-retries=40 --health-start-period=5s \
            "${{ steps.image.outputs.image }}" \
            start-single-node --insecure --store=type=mem,size=2GiB \
            --cache=.25 --max-sql-memory=.25
          for _ in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Health.Status}}' mainline-crdb-retry)"
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          # `SELECT 1`, not the `SELECT version()` that used to be here. The loop above can
          # fall out without ever seeing `healthy`, so this line is load-bearing as the
          # readiness gate — under `set -e` a node that is not up fails the step. What it
          # was NOT is a version check: it printed a version and compared it with nothing,
          # which has the shape of an assertion without being one. The comparison now lives
          # in the step below, where it can fail.
          docker exec mainline-crdb-retry ./cockroach sql --insecure -e "SELECT 1;"

      - name: The server that answered IS the pinned version
        # ANTI-VACUITY, 2026-08-13. The step above reads the pin out of compose.yaml, hands
        # it to `docker run` and waits for a healthy node. That catches a pin that failed
        # to ARRIVE — the container did not start, or did not answer — and nothing else. A
        # tag resolving to different bytes than compose.yaml names went green identically:
        # a moving tag, a layer already cached on the runner under that name, a container
        # of this fixed name left behind, a registry substitution.
        #
        # It matters more here than anywhere. This job's claim is that a REAL 40001
        # RETRY_SERIALIZABLE is produced and that `run_gate` does not swallow it, and
        # serialisation-conflict behaviour is exactly the kind of thing a patch release
        # changes. The header above records `observed sqlstate : 40001` as measured "on the
        # pinned image" — a sentence nothing in this job had ever checked.
        #
        # The expectation is DERIVED from the pin the `image` step resolved and is never
        # written out here: `db.yml`'s `image-pin` job refuses ANY image literal in this
        # file, by name, and that refusal is the reason the restatement was removed on
        # 2026-08-12. `image-pin-bites` in this lane is the negative control.
        env:
          PINNED_IMAGE: ${{ steps.image.outputs.image }}
          CRDB_CONTAINER: mainline-crdb-retry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          image = os.environ["PINNED_IMAGE"]
          container = os.environ["CRDB_CONTAINER"]
          tag = image.rsplit(":", 1)[-1]
          wanted = tag[len("latest-") :] if tag.startswith("latest-") else tag

          probe = subprocess.run(
              ["docker", "exec", container, "./cockroach", "sql", "--insecure",
               "--format=csv", "-e", "SELECT version()"],
              capture_output=True, text=True, check=False,
          )
          if probe.returncode != 0:
              detail = (probe.stderr or probe.stdout).strip().replace("\n", " · ")
              print("::error title=the node would not report its version::"
                    "`SELECT version()` failed against a node that had just answered "
                    f"`SELECT 1` — container {container}: {detail}")
              sys.exit(1)
          served = [row for row in probe.stdout.splitlines() if row.strip()][-1]
          served = served.strip().strip('"')

          if re.search(rf"(?<![0-9A-Za-z.]){re.escape(wanted)}(\.\d+)*(?![0-9A-Za-z.])", served):
              print(f"compose.yaml asked for {wanted}; the server said: {served}")
              sys.exit(0)
          print("::error title=the running server is not the pinned version::compose.yaml "
                f"asked for {wanted} (pin {image}); the node that answered reports "
                f"{served!r}. The retry contract below would then be a measurement of that "
                "other engine's conflict behaviour, published under this lane's name.")
          sys.exit(1)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the retry loop and a driver, and nothing else
        # `--no-deps -e packages/trappoint-core` for the same reason `release-proof.yml`
        # does it: this assertion must not become un-runnable because the workspace
        # lockfile is behind.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary,pool]>=3.3.4"
          python -m pip install --no-deps -e packages/trappoint-core
          python -c "from trappoint_core.retry import run_gate; print('run_gate imported')"

      - name: EXERCISE — construct a real 40001 and drive it through run_gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import threading
          import time

          import psycopg

          from trappoint_core.errors import RETRYABLE_SQLSTATE, RetryBudgetExhausted
          from trappoint_core.retry import RecordingObserver, RetryPolicy, run_gate

          DSN = os.environ["RETRY_DSN"]
          DATABASE = os.environ["RETRY_DATABASE"]
          failures: list[str] = []

          head, _, tail = DSN.rpartition("/")
          query = "?" + tail.split("?", 1)[1] if "?" in tail else ""
          with psycopg.connect(DSN, autocommit=True, connect_timeout=20) as admin:
              admin.execute(f"DROP DATABASE IF EXISTS {DATABASE} CASCADE")
              admin.execute(f"CREATE DATABASE {DATABASE}")
          WORK = f"{head}/{DATABASE}{query}"
          with psycopg.connect(WORK, autocommit=True, connect_timeout=20) as conn:
              conn.execute("CREATE TABLE contended (id INT8 PRIMARY KEY, v INT8 NOT NULL)")
              conn.execute("INSERT INTO contended (id, v) VALUES (1, 0), (2, 0)")

          # ── 1 · a real 40001, observed, with RETRY_SERIALIZABLE in its text ──────────
          a = psycopg.connect(WORK, connect_timeout=20)
          b = psycopg.connect(WORK, connect_timeout=20)
          seen: dict[str, tuple[str | None, str]] = {}
          try:
              ca, cb = a.cursor(), b.cursor()
              ca.execute("SELECT v FROM contended WHERE id = 1")
              cb.execute("SELECT v FROM contended WHERE id = 2")
              ca.execute("UPDATE contended SET v = v + 1 WHERE id = 2")

              def partner():
                  try:
                      cb.execute("UPDATE contended SET v = v + 1 WHERE id = 1")
                      b.commit()
                  except psycopg.Error as exc:
                      seen["b"] = (exc.diag.sqlstate if exc.diag else None,
                                   str(exc).splitlines()[0])

              thread = threading.Thread(target=partner, daemon=True)
              thread.start()
              time.sleep(1.0)
              try:
                  a.commit()
                  seen["a"] = (None, "committed with no retry error")
              except psycopg.Error as exc:
                  seen["a"] = (exc.diag.sqlstate if exc.diag else None,
                               str(exc).splitlines()[0])
              thread.join(timeout=30)
          finally:
              a.close()
              b.close()

          state, message = None, ""
          for who in ("a", "b"):
              got, text = seen.get(who, (None, "committed"))
              if got == RETRYABLE_SQLSTATE:
                  state, message = got, text
                  break
          print(f"observed sqlstate : {state}")
          print(f"observed message  : {message[:220]}")
          if state != RETRYABLE_SQLSTATE:
              failures.append(
                  "PLANTED FAMILY not-exercised: the constructed read-write cycle produced "
                  f"no 40001 (saw {sorted((k, v[0]) for k, v in seen.items())}). The retry "
                  "contract would be ASSUMED rather than exercised, and this lane may not "
                  "report success for it."
              )
          elif "RETRY_SERIALIZABLE" not in message:
              failures.append(
                  "PLANTED FAMILY wrong-retry-reason: a 40001 arrived but its text does not "
                  f"say RETRY_SERIALIZABLE: {message[:200]}"
              )

          # ── 2 · run_gate RETRIES it, and records the retry rather than inferring it ──
          attempts = {"n": 0}

          def operation() -> int:
              attempts["n"] += 1
              conn = psycopg.connect(WORK, connect_timeout=20)
              try:
                  cur = conn.cursor()
                  cur.execute("SELECT v FROM contended WHERE id = 1")
                  if attempts["n"] == 1:
                      rival = psycopg.connect(WORK, connect_timeout=20)
                      rc = rival.cursor()
                      rc.execute("SELECT v FROM contended WHERE id = 2")
                      cur.execute("UPDATE contended SET v = v + 1 WHERE id = 2")

                      def write_and_commit():
                          try:
                              rc.execute("UPDATE contended SET v = v + 1 WHERE id = 1")
                              rival.commit()
                          except psycopg.Error:
                              pass
                          finally:
                              rival.close()

                      rival_thread = threading.Thread(target=write_and_commit, daemon=True)
                      rival_thread.start()
                      time.sleep(1.0)
                  else:
                      cur.execute("UPDATE contended SET v = v + 1 WHERE id = 2")
                  conn.commit()
                  return attempts["n"]
              finally:
                  conn.close()

          observer = RecordingObserver()
          converged = True
          try:
              run_gate(operation, observer=observer, policy=RetryPolicy(max_attempts=5))
          except Exception as exc:  # noqa: BLE001 - reported, never swallowed
              converged = False
              print(f"run_gate raised {type(exc).__name__}: {exc}")
          print(f"run_gate attempts : {attempts['n']}  retries: {observer.retries}")
          if not [r for r in observer.retries if r[1] == RETRYABLE_SQLSTATE]:
              failures.append(
                  "PLANTED FAMILY retry-never-taken: run_gate recorded no 40001 retry, so "
                  "the backoff ladder was never walked and the contract is untested."
              )
          if not converged:
              failures.append(
                  "PLANTED FAMILY retry-does-not-converge: run_gate did not complete after "
                  "retrying a 40001. A retry loop that cannot converge is not a retry loop."
              )

          # ── 3 · with no budget the 40001 SURFACES; it is never reported as success ───
          attempts["n"] = 0
          surfaced = None
          try:
              run_gate(operation, observer=RecordingObserver(),
                       policy=RetryPolicy(max_attempts=1))
          except RetryBudgetExhausted as exc:
              surfaced = f"RetryBudgetExhausted: {exc}"
          except Exception as exc:  # noqa: BLE001
              surfaced = f"{type(exc).__name__}: {exc}"
          print(f"max_attempts=1    : {surfaced}")
          if surfaced is None:
              failures.append(
                  "PLANTED FAMILY budget-swallows-40001: with max_attempts=1 the conflicting "
                  "transaction reported SUCCESS. A retry loop that reports success for an "
                  "undecided transaction is the worst outcome available here."
              )
          elif "RetryBudgetExhausted" not in surfaced:
              failures.append(
                  "PLANTED FAMILY budget-misclassifies-40001: with max_attempts=1 the 40001 "
                  f"surfaced as {surfaced[:160]} rather than RetryBudgetExhausted. An "
                  "undecided transaction reported as a refusal is a false refusal, and "
                  "spec/errors.md §4 says a refusal is attempted exactly once, ever."
              )

          for failure in failures:
              print(f"::error title=the 40001 contract is assumed, not exercised::{failure}")
          if failures:
              raise SystemExit(1)
          print("")
          print("the 40001 retry contract was EXERCISED against a live cluster: a real "
                "RETRY_SERIALIZABLE was produced, run_gate retried it and converged, and "
                "with no budget it surfaced as RetryBudgetExhausted rather than success.")
          PY

      - name: What this job proved
        if: always()
        run: |
          {
            echo "## the 40001 retry contract"
            echo ""
            echo "| family | what a failure would mean |"
            echo "|---|---|"
            echo "| \`not-exercised\` | no serialization restart was produced at all, so the contract is assumed |"
            echo "| \`wrong-retry-reason\` | a 40001 arrived that is not a \`RETRY_SERIALIZABLE\` |"
            echo "| \`retry-never-taken\` | \`run_gate\` met the error and did not walk its ladder |"
            echo "| \`retry-does-not-converge\` | the loop retries and never finishes |"
            echo "| \`budget-swallows-40001\` | an UNDECIDED transaction reported as success |"
            echo "| \`budget-misclassifies-40001\` | an undecided transaction reported as a refusal |"
            echo ""
            echo "\`40001\` is rare on a single node **by accident** and ordinary under a"
            echo "constructed read-write cycle. This job constructs one, so the claim that the"
            echo "retry contract holds stops being a sentence in a header and starts being a"
            echo "run. It needs **no credential**, so it holds on every run of this lane"
            echo "whether or not \`CRDB_CLOUD_DSN\` is set."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the cluster
        if: always()
        run: docker rm -f mainline-crdb-retry || echo "(no container to remove)"

  # ---------------------------------------------------------------------------------
  # THE NEGATIVE CONTROL FOR THE VERSION ASSERTION IN `retry-contract`
  #
  # An assertion nobody has ever watched fail is the same vacuity in a newer coat, and
  # this workflow already knows it — `skipped-loudly` exists for exactly that reason.
  # `retry-contract` now compares `SELECT version()` against the version derived from
  # compose.yaml's pin; this job runs the SAME comparison — one compiled pattern, one
  # function, used twice inside one step — against two nodes:
  #
  #   the pinned tag       MUST match      (or the comparison is broken, not the tree)
  #   a NEIGHBOURING tag   MUST NOT match  (or the comparison cannot tell versions apart)
  #
  # The job is RED if the wrong node satisfies the comparison. A control that fails to
  # fail is a failure and is reported as one, with the half that broke named.
  #
  # NO CREDENTIAL, and no `needs: [preflight]`: this asserts over the local pinned image
  # and holds whether or not `CRDB_CLOUD_DSN` is set, like `retry-contract` itself.
  #
  # NO `harden-runner` HERE, and the omission is deliberate and stated rather than
  # silent — the same reasoning `db.yml`'s kernel job records. This job's first act is a
  # `docker pull` reaching registry-1.docker.io, auth.docker.io and a Cloudflare CDN host
  # whose name is not stable; an allowlist written from memory would either break the job
  # for a reason unrelated to its claim or be broad enough to assert nothing. This job
  # holds no secret, so there is nothing here for an egress control to protect.
  #
  # The control tag is DERIVED — the pin's patch component minus one — and never written
  # down. `db.yml`'s `image-pin` job refuses ANY image literal in THIS FILE by name, and
  # its repository census counts restated literals across `.github/workflows/` against a
  # ceiling being driven DOWN; a literal here would break the first and raise the second.
  # ---------------------------------------------------------------------------------
  image-pin-bites:
    name: the version comparison bites — a neighbouring tag must fail it
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read the ONE version constant out of compose.yaml
        id: image
        run: |
          set -euo pipefail
          image="$(python3 - <<'PY'
          import pathlib
          import re
          import sys

          MARKER = "trappoint:crdb-image-pin"
          IMAGE_LINE = re.compile(r"^\s*image:\s*(?P<image>\S+)\s*$")

          lines = pathlib.Path("compose.yaml").read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(lines):
              if MARKER not in line:
                  continue
              for candidate in lines[index + 1 : index + 4]:
                  found = IMAGE_LINE.match(candidate)
                  if found is not None:
                      print(found.group("image"))
                      sys.exit(0)
          sys.exit(
              f"compose.yaml carries no line marked {MARKER!r} followed by an 'image:' key "
              "within the next three lines; the CockroachDB version constant has moved or "
              "been deleted"
          )
          PY
          )"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Two nodes, one comparison, opposite verdicts
        env:
          PINNED_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import time

          IMAGE = os.environ["PINNED_IMAGE"]
          repository, _, tag = IMAGE.rpartition(":")
          WANTED = tag[len("latest-") :] if tag.startswith("latest-") else tag

          # THE comparison. Compiled once, applied to both nodes, so "the identical
          # comparison" is a property of the code rather than of a copy-paste.
          MATCH = re.compile(rf"(?<![0-9A-Za-z.]){re.escape(WANTED)}(\.\d+)*(?![0-9A-Za-z.])")

          def version_of(container: str) -> str:
              probe = subprocess.run(
                  ["docker", "exec", container, "./cockroach", "sql", "--insecure",
                   "--format=csv", "-e", "SELECT version()"],
                  capture_output=True, text=True, check=False,
              )
              if probe.returncode != 0:
                  detail = (probe.stderr or probe.stdout).strip().replace("\n", " · ")
                  raise SystemExit(f"SELECT version() failed on {container}: {detail}")
              row = [line for line in probe.stdout.splitlines() if line.strip()][-1]
              return row.strip().strip('"')

          def start(container: str, image: str) -> None:
              made = subprocess.run(
                  ["docker", "run", "-d", "--name", container, image,
                   "start-single-node", "--insecure", "--store=type=mem,size=1GiB"],
                  capture_output=True, text=True, check=False,
              )
              if made.returncode != 0:
                  detail = (made.stderr or made.stdout).strip().replace("\n", " · ")
                  raise SystemExit(
                      f"the negative control could not be exercised: {image} would not "
                      f"start — {detail}. This job asserts nothing until it can."
                  )
              for _ in range(60):
                  alive = subprocess.run(
                      ["docker", "exec", container, "./cockroach", "sql", "--insecure",
                       "-e", "SELECT 1"],
                      capture_output=True, text=True, check=False,
                  )
                  if alive.returncode == 0:
                      return
                  time.sleep(2)
              raise SystemExit(
                  f"the negative control could not be exercised: {image} never answered "
                  "pgwire within 120 seconds"
              )

          # The deliberately wrong tag, derived from the pin and never restated.
          parts = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", WANTED)
          if parts is None:
              print("::error title=the negative control cannot be derived::the pin's tag is "
                    f"not a vMAJOR.MINOR.PATCH triple — got {WANTED!r}. Deriving a "
                    "neighbouring tag is how this control avoids restating the version "
                    "constant, which this file is forbidden to do; rewrite the derivation "
                    "rather than hard-coding a tag.")
              sys.exit(1)
          major, minor, patch = (int(part) for part in parts.groups())
          if patch > 0:
              control_tag = f"v{major}.{minor}.{patch - 1}"
          elif minor > 0:
              control_tag = f"v{major}.{minor - 1}.0"
          else:
              print("::error title=the negative control cannot be derived::the pin is a "
                    f".0.0 release ({WANTED}) and no neighbouring tag can be derived from "
                    "it without inventing one.")
              sys.exit(1)

          NODES = (
              ("pin-truth", IMAGE, True),
              ("pin-control", f"{repository}:{control_tag}", False),
          )

          failures: list[str] = []
          try:
              for container, image, must_match in NODES:
                  start(container, image)
                  served = version_of(container)
                  matched = MATCH.search(served) is not None
                  print(f"{container}: tag {image.rsplit(':', 1)[-1]} -> server said "
                        f"{served!r} -> {'MATCHES' if matched else 'does not match'} the "
                        f"pin {WANTED}")
                  if matched == must_match:
                      continue
                  if must_match:
                      failures.append(
                          f"the comparison REJECTED the pinned node itself: a node started "
                          f"from {image} reports {served!r} and the pattern built from "
                          f"{WANTED} did not find it. The version assertion in "
                          "`retry-contract` is broken, not the tree it asserts over."
                      )
                  else:
                      failures.append(
                          f"the comparison ACCEPTED a node started from {image}, whose "
                          f"server reports {served!r}, while asserting {WANTED}. It cannot "
                          "tell two versions apart, so every green the version assertion in "
                          "`retry-contract` has produced is worth nothing and it must be "
                          "treated as unproven."
                      )
          finally:
              for container, _image, _expected in NODES:
                  subprocess.run(["docker", "rm", "-f", container],
                                 capture_output=True, text=True, check=False)

          if failures:
              for line in failures:
                  print(f"::error title=the version comparison does not bite::{line}")
              sys.exit(1)
          print(f"the comparison bites: {WANTED} accepted and {control_tag} rejected by the "
                "same pattern, in the same step, against two nodes that both answered SQL")
          PY
