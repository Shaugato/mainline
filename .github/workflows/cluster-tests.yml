#
# THE FIRST LANE IN THIS REPOSITORY THAT POINTS A REAL DATABASE AT THE DEMO API.
#
# WHAT WAS TRUE BEFORE THIS FILE EXISTED, measured 2026-08-13 at HEAD 073dfea:
#
#     $ grep -rn "demo-api" .github/workflows/
#     (no matches, in any file)
#
#     $ pytest verticals/mainline/apps/demo-api/tests --crdb=none  -q
#     258 passed, 186 skipped
#     $ pytest verticals/mainline/apps/demo-api/tests --crdb=reuse -q
#     3 failed, 377 passed, 1 skipped, 63 errors
#
# 444 tests both ways. Nine of eighteen workflows stand up a CockroachDB container and
# not one of them names that directory; `ci.yml` is the only lane that runs the whole
# `testpaths` collection and it runs it `--crdb=none`, so those 186 tests — 41.9% of the
# suite covering the product's headline path — had never executed in CI even once. They
# were not failing. They were not passing. They were SKIPPING, which on a dashboard is
# the same green tick as a pass, and that is the defect this lane exists to end.
#
# THIS LANE IS RED ON THE DAY IT LANDS, AND THAT IS THE POINT.
#
# The 3 failures and 63 errors above are real defects owned by other leads. A lane that
# went green by deselecting `test_reads.py`, by marking the 63 `xfail`, or by adding a
# `-k` expression would convert a visible defect back into an invisible one — the exact
# motion this whole wave exists to reverse. So the failures are CLASSIFIED and not
# suppressed: `qa/cluster-known-red.json` names every one of them with the cause and the
# lead who owns it, `scripts/ci/cluster_lane_report.py` prints each as `known`,
# `unstable` or **NEW**, and the job's exit status is pytest's exit status, unmodified.
#
# The inventory cannot become a suppression list, and the refusal is structural rather
# than a matter of reviewer attention: the report is handed pytest's real exit code and
# EXITS WITH IT when it is non-zero, whatever the inventory says about the node ids
# involved. It also refuses a run whose JUnit XML records failures while its caller
# claims pytest exited 0 — which is the one rewiring that would let a fully-inventoried
# red run present as green. Both properties are exercised by controls — and the controls
# are in `tests/ci/test_cluster_lane_report.py`, not in the report itself. The pointer is
# part of the claim: this sentence read "see that file" until 2026-08-14, when a search
# established that `cluster_lane_report.py` was named by two workflows and three documents
# and by NO test at all. Each control there demonstrates its property by MUTATION — the
# real program and a copy with that one property removed are run through the same
# scenario, and the control asserts the real one is safe AND the mutant is not — so a
# control that has quietly stopped discriminating goes red rather than passing.
#
# NO `harden-runner` ON THIS JOB, and the omission is deliberate and stated rather than
# silent, exactly as `db.yml:362-368` states it. This job's first act is `docker pull`,
# which reaches registry-1.docker.io, auth.docker.io and a Cloudflare CDN host whose name
# is not stable. An `allowed-endpoints` list written from memory would either be wrong —
# breaking the lane for a reason that has nothing to do with the database — or so broad
# that it permits everything and asserts nothing. `ci.yml` is where the egress claim is
# enforced, on every job, with policy `block`. This lane's claim is about the database.

name: cluster-tests

on:
  push:
    # `master`, not `main`. The branch `main` does not exist in this repository; a `main`
    # trigger has never fired once here. See `ci.yml:93-99` for the measurement.
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-api:
    name: the demo-api suite against a real CockroachDB
    runs-on: ubuntu-24.04
    # The fixture applies 271 migrations and both deployed seed files before the first
    # test runs — 46.7 s locally, and it is built once per session. The suite itself was
    # 154.21 s in run 31735341117. Since 2026-08-14 this job ALSO builds the deployed
    # package (`./.github/actions/build-demo-package`), which is a `pnpm install`, a
    # `vite build` measured at 3.7 s, a `pip download` of two manylinux wheels and a
    # 250-entry pack — about two further minutes on a cold runner. 30 minutes is room for
    # all of it; a lane that hangs must fail rather than hold a runner. This is a
    # RELIABILITY bound and not a spend bound, and it rose because the job's work grew,
    # which is the only reason it may rise.
    timeout-minutes: 30

    env:
      # Unique per run. `db-schema.yml` uses a fixed container name and its own step 4
      # comment names the hazard that creates: "a container of this fixed name left
      # behind by an earlier run" is one of the ways a pinned tag comes to be measured
      # against bytes nobody chose.
      CRDB_CONTAINER: mainline-cluster-tests-${{ github.run_id }}-${{ github.run_attempt }}
      SUITE: verticals/mainline/apps/demo-api/tests
      # A FLOOR, not an equality, and the distinction is argued rather than assumed.
      #
      # What this assertion is FOR is the claim that the suite IMPORTS on this runner:
      # `mainline-demo-api` is deliberately not a workspace member, its dependencies
      # resolve through other members, and its `tests/conftest.py` puts `../src` on
      # `sys.path` itself. A partial import collects FEWER tests; deleting assertions
      # collects fewer tests. A floor catches both, which are the two defects.
      #
      # Collecting MORE is the suite growing, which is not a defect, and an equality here
      # would go red for it. That is not hypothetical: measured 444 at 20:43 on
      # 2026-08-13 and 445 at 21:02 the same evening, because another worker rewrote
      # `test_refusal_row_factory.py` from 13 tests to 14 in between. An assertion that
      # goes red when somebody adds a test trains its readers to edit the number without
      # reading it, and `release-proof.yml`'s own anti-vacuity gate uses a floor
      # (`if tests < 15`) for exactly this reason.
      #
      # The floor is 445, measured — it may RISE with the suite and may not fall.
      COLLECTED_FLOOR: "445"

    steps:
      - uses: actions/checkout@v4

      # ── CONTRACT B, copied from `db-schema.yml:310-450`. Five steps, and the fourth
      #    is the one that matters. ────────────────────────────────────────────────────
      - name: Read the ONE version constant out of compose.yaml
        id: image
        # The version constant lives in compose.yaml and nowhere else, and it is NOT
        # restated here: `db.yml`'s repository census counts image literals across
        # `.github/workflows/` and every `.py` file against a ceiling being driven down,
        # and a second copy of the version is the defect that census exists to refuse.
        run: |
          set -euo pipefail
          image="$(python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("compose.yaml").read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if "trappoint:crdb-image-pin" in line:
                  for candidate in lines[i + 1 : i + 4]:
                      m = re.match(r"^\s*image:\s*(\S+)\s*$", candidate)
                      if m:
                          print(m.group(1))
                          raise SystemExit(0)
          raise SystemExit("compose.yaml carries no marked image pin")
          PY
          )"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "CockroachDB image: ${image}"

      - name: Pull the image and record its digest
        id: digest
        # Digest pinning without a fabricated hash, as `db.yml` and `db-schema.yml` do
        # it. The digest is resolved and printed every run; when the repository variable
        # CRDB_IMAGE_DIGEST is set it is ASSERTED. An invented digest committed today
        # would be a lie in the repository; an assertion that activates the moment
        # somebody records the real one is the honest version of the same control.
        env:
          PINNED_IMAGE: ${{ steps.image.outputs.image }}
          EXPECTED: ${{ vars.CRDB_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          docker pull "${PINNED_IMAGE}"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${PINNED_IMAGE}")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "resolved: ${digest}"
          if [ -n "${EXPECTED}" ] && [ "${EXPECTED}" != "${digest}" ]; then
            echo "::error::image digest ${digest} does not match the pinned ${EXPECTED}"
            exit 1
          fi
          if [ -z "${EXPECTED}" ]; then
            echo "::notice::CRDB_IMAGE_DIGEST is unset; the digest is recorded but not asserted"
          fi

      - name: Start a single-node CockroachDB
        # `--listen-addr` is DELIBERATELY ABSENT and must stay absent. Measured
        # 2026-08-10 and recorded in `db-schema.yml`: `--listen-addr=0.0.0.0:26257` makes
        # the node REFUSE TO START ("hostname of listen_addr must be 127.0.0.1 or
        # localhost"), and `--listen-addr=localhost:26257` starts but binds inside the
        # container's loopback where a published port cannot reach it. The default binds
        # where `-p` can forward, which is what the pgwire probe below actually proves.
        env:
          PINNED_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker run -d --name "${CRDB_CONTAINER}" \
            -p 127.0.0.1:26257:26257 -p 127.0.0.1:8080:8080 \
            "${PINNED_IMAGE}" \
            start-single-node --insecure \
              --http-addr=0.0.0.0:8080 \
              --store=type=mem,size=2GiB
          for attempt in $(seq 1 60); do
            if docker exec "${CRDB_CONTAINER}" ./cockroach sql --insecure \
                 --execute "SELECT 1" >/dev/null 2>&1; then
              echo "cluster answering SQL after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the cluster never answered SQL"
          docker logs "${CRDB_CONTAINER}" | tail -50
          exit 1

      - name: The server that answered IS the pinned version
        # ANTI-VACUITY. Every step above reads the pin, hands it to `docker run`,
        # resolves a digest and polls `SELECT 1`. Not one of them asks the RUNNING SERVER
        # which version it is, so the sequence catches a pin that failed to ARRIVE and
        # nothing else. A tag resolving to different bytes than compose.yaml names goes
        # green identically: a moving tag, a cached layer, a registry substitution.
        #
        # This lane's whole claim is "443 demo-api tests ran against the pinned engine".
        # Without this step it is "443 demo-api tests ran against an unknown engine,
        # under this lane's name", which is a different and much weaker sentence.
        #
        # The expectation is DERIVED from what step 1 resolved and is never written out.
        env:
          PINNED_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          image = os.environ["PINNED_IMAGE"]
          container = os.environ["CRDB_CONTAINER"]
          tag = image.rsplit(":", 1)[-1]
          wanted = tag[len("latest-") :] if tag.startswith("latest-") else tag

          probe = subprocess.run(
              ["docker", "exec", container, "./cockroach", "sql", "--insecure",
               "--format=csv", "--execute", "SELECT version()"],
              capture_output=True, text=True, check=False,
          )
          if probe.returncode != 0:
              detail = (probe.stderr or probe.stdout).strip().replace("\n", " - ")
              print("::error title=the node would not report its version::"
                    "`SELECT version()` failed against a node that had just answered "
                    f"`SELECT 1` - container {container}: {detail}")
              sys.exit(1)
          served = [row for row in probe.stdout.splitlines() if row.strip()][-1]
          served = served.strip().strip('"')

          if re.search(rf"(?<![0-9A-Za-z.]){re.escape(wanted)}(\.\d+)*(?![0-9A-Za-z.])", served):
              print(f"compose.yaml asked for {wanted}; the server said: {served}")
              sys.exit(0)
          print("::error title=the running server is not the pinned version::compose.yaml "
                f"asked for {wanted} (pin {image}); the node that answered reports "
                f"{served!r}. The demo-api suite below would be measured against that "
                "other engine, under this lane's name.")
          sys.exit(1)
          PY

      - uses: ./.github/actions/setup-workspace
        with:
          python-version: "3.13"

      # ── THE LANE BUILDS WHAT IT TESTS ────────────────────────────────────────────────
      #
      # Run 31735341117 reported `10 test(s) skipped, ceiling 1` and errored on it, which
      # was correct. Nine of those ten skipped for ONE reason:
      # `out/lambda/mainline-demo-api-arm64.zip` is a `.gitignore`'d build output and no
      # lane in `.github/workflows/` built it. The tenth — `test_gate_run.py:945`,
      # *"jsonschema is not a workspace dependency"* — is the one the ceiling of 1 exists
      # for, has nothing to do with the database, and is NOT this step's business.
      #
      # The nine live in THREE modules, not the two a reader would guess:
      # `test_response_contract.py` (5), `test_static_site.py` (3) and — easy to miss —
      # `test_envelope.py` (1). A lane that armed only the first two would land at 2
      # against a ceiling of 1 and would invite exactly the edit this repository forbids.
      # **The ceiling stays at 1** — it lives in `qa/cluster-known-red.json` under
      # `floor.max_skipped` and nothing here touches it.
      #
      # WHY BEFORE THE SUITE AND NOT AFTER. The console build and the pack cost about two
      # minutes; the suite costs 154 s of database work on top of a 46.7 s migration
      # fixture. A missing `console/dist` discovered after all of that is three minutes of
      # runner spent to learn something the packer's own preflight can say immediately.
      #
      # WHY BEFORE THE DSN STEP. Nothing here reads a database, and putting it above the
      # DSN keeps the four published spellings adjacent to the collection and the suite
      # that consume them, so the DSN block still reads as one thought.
      #
      # THIS STEP DOES NOT WEAKEN THE SKIP CEILING; IT REMOVES THE REASON FOR THE SKIPS.
      # If the nine now FAIL, that is nine assertions about what this origin costs
      # executing in CI for the first time, and the answer is to fix what they found — not
      # to delete this step and go back to a lane whose skips looked like passes.
      # `docs/ci/cluster-lane-package.md` records what they were measured to do, and why.
      - name: Build the deployed package the ratchets read
        uses: ./.github/actions/build-demo-package
        with:
          arch: arm64

      - name: Publish the DSN under all four spellings the tree checks
        # `packages/trappoint-testkit/cluster.py:103-106` reads these four names, and the
        # demo-api conftest reads the same four before falling back to 127.0.0.1:26257.
        # Publishing all four is how this lane hands the node it just started to the
        # suite; publishing three of them is how a lane silently falls back.
        run: |
          set -euo pipefail
          dsn="postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable"
          for name in MAINLINE_TEST_DSN COCKROACH_URL CRDB_URL TRAPPOINT_DSN; do
            echo "${name}=${dsn}" >> "$GITHUB_ENV"
            echo "published ${name}"
          done

      - name: Collection must cost a second, not a container
        # trappoint:pytest-lane=hermetic
        #
        # `--crdb=none`, and the marker is `hermetic`, because that is what this
        # invocation IS: the testkit plugin returns before obtaining any cluster when
        # `collectonly` is set, so this step reaches no database even though the job it
        # sits in has one running. Marking it `cluster` would be a declaration that
        # cannot be checked against its own behaviour.
        #
        # WHY IT IS HERE AT ALL. `mainline-demo-api` is deliberately NOT a workspace
        # member: `verticals/*/apps/*` is absent from `[tool.uv.workspace] members`
        # because the console beside it is a pnpm workspace. Its dependencies resolve
        # through other members and its `tests/conftest.py` puts `../src` on `sys.path`
        # itself. That is a claim about this runner, and a collection error inside a test
        # run is a wall of noise; here it is one legible failure with a number.
        run: |
          set -euo pipefail
          # `set +e` brackets ONLY the pytest call, and only so that a non-zero status can
          # be EXPLAINED before it is obeyed. This is the identical idiom the next step in
          # this file already uses for `--pytest-rc`, and it is DIAGNOSIS, NOT TOLERANCE:
          # the step still exits with pytest's own status, `set -e` is restored before
          # anything is decided, and nothing is suppressed. It must not be turned into
          # tolerance — no `continue-on-error`, no `|| true`, no defaulted `rc`.
          #
          # WHY IT IS HERE, measured rather than imagined. Run 31720235677 at HEAD e944407
          # died on this step with `Process completed with exit code 2` AND NO OTHER TEXT
          # WHATSOEVER. Under `set -e` the shell aborts ON the pytest line, so the `tail`
          # further down — the only thing in the step that would have said why — was
          # unreachable. Meanwhile pytest had written the whole collection error to stdout,
          # which the redirect had faithfully captured into `collected.txt`, and the abort
          # then threw the file away unread. The lane was RIGHT to fail and left nobody
          # able to say what it had found, which is a second defect sitting on top of the
          # first one: an assertion whose red cannot be acted on is only half a control.
          set +e
          uv run --frozen --all-packages pytest "${SUITE}" \
            --crdb=none --collect-only -q > collected.txt
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ]; then
            echo "pytest --collect-only exited ${rc}; its own account of why follows."
            tail -n 40 collected.txt
            echo "::error title=the demo-api suite did not collect::pytest exited ${rc} while collecting ${SUITE}; the text above is pytest's own diagnosis, not this lane's guess. A collection error here is a real defect in the checked-out tree — most often a module the committed tests import that was itself left uncommitted — and it is answered by landing what is missing. It is never answered by lowering COLLECTED_FLOOR, by -k, by --deselect, or by stubbing the import."
            exit "${rc}"
          fi
          # `grep -c` exits 1 on no matches, and shell-level error suppression is banned
          # in this directory. `ci.yml` solves the same problem the same way — with the
          # guard rather than the suppression — so a broken collection, which also
          # produces no matches, cannot quietly read as "zero tests collected".
          count=0
          if grep -q '::' collected.txt; then
            count="$(grep -c '::' collected.txt)"
          fi
          echo "collected ${count} test(s) from ${SUITE} (floor ${COLLECTED_FLOOR})"
          if [ "${count}" -lt "${COLLECTED_FLOOR}" ]; then
            tail -n 20 collected.txt
            echo "::error title=the demo-api suite did not collect::${count} test(s) collected, floor ${COLLECTED_FLOOR}. Either the suite failed to import on this runner — it is not a uv workspace member and puts its own src on sys.path — or assertions were deleted. Both are defects; neither may be answered by lowering the floor."
            exit 1
          fi
          if [ "${count}" -gt "${COLLECTED_FLOOR}" ]; then
            echo "::notice::the suite grew to ${count}; raise COLLECTED_FLOOR to match in the same commit"
          fi

      # ── THE SUITE, AND WHY THIS STEP IS SHAPED THE WAY IT IS ────────────────────────
      #
      # The rationale lives HERE, above the step, and not inside the `run:` body. GitHub
      # echoes a `run:` body into the log and does not echo the comment: over run
      # 31735341117 that echo was 186 of 1,023 log lines, mostly this file's own (good,
      # long) step comments printed a second time on top of the output a reader came for.
      # The prose is kept in full; it just stops being printed twice per run. The lane
      # marker below stays INSIDE the step, adjacent to the invocation it governs —
      # `scripts/qa/check_pytest_lanes.py` binds a marker to the first pytest call within
      # 40 lines under it, and MARKER_REACH is a measured constant, not a dial.
      #
      # THE PYTEST INVOCATION AND THE VERDICT ARE ONE STEP, ON PURPOSE. Splitting them
      # would leave a step whose deletion turns this lane green while the suite still
      # fails, because pytest's status would have been captured and then dropped. Here
      # the last command of the step exits with pytest's own status when pytest failed
      # (`--pytest-rc`), so there is nothing to delete that does not delete the run.
      #
      # No step-level error tolerance, no shell-level error suppression, and the verdict
      # is not deferred into a step that runs unconditionally. `set +e` brackets ONLY the
      # pytest call, and only so its status can be handed to the report rather than thrown
      # away by the shell; `set -e` is restored before anything is decided.
      #
      # The two steps that FOLLOW do run unconditionally, and neither is a verdict: one
      # prints a digest of the XML this step wrote and the other uploads it. They are
      # diagnosis in the same sense `db.yml`'s container log is, they emit no `::error`,
      # and nothing they do can change what `--pytest-rc` was handed above. The verdict is
      # the LAST command of THIS step and stays there.
      #
      # THE STDOUT IS CAPTURED WITH `tee`, AND `rc=$?` IS STILL PYTEST'S OWN ANSWER.
      # `> file` would hand the reader a run whose live log is empty for three minutes,
      # and this suite is I/O-bound and silent under a redirect — healthy runs have been
      # killed for looking hung. `tee` keeps the log live AND writes the file the digest
      # step and the artifact upload below both read.
      #
      # `set +e` disables errexit and NOTHING ELSE — `set -o pipefail`, from the
      # `set -euo pipefail` at the top of the body, stays in force — so `$?` after the
      # pipeline is its rightmost non-zero status. `tee` exits 0 whenever it could write,
      # which makes `rc` pytest's own status in every normal run; and in the one case
      # where it is not — `tee` itself failed — `rc` is non-zero and the lane goes RED.
      # That is the right direction to fail: a run that could not write its own log must
      # not be able to report success. Measured, bash 5.2: pytest exiting 7 through `tee`
      # yields `rc=7`.
      #
      # `${PIPESTATUS[0]}` names pytest's element explicitly and was tried first. It is
      # NOT used, for two measured reasons. `tests/ci/test_cluster_lane_report.py:1002`
      # reads the literal `rc=$?` out of THIS FILE as the wiring every one of its
      # `--pytest-rc` controls rests on; with the substring gone from this step that
      # control would still pass — satisfied by the collection step's copy above — which
      # is a control that has quietly stopped discriminating, and this repository treats
      # that as worse than the defect it hides. And a bare `rc=$?` assignment resets
      # `PIPESTATUS` to `(0)`, so the two cannot both be captured and compared afterwards.
      - name: The suite against the cluster, and the verdict
        # trappoint:pytest-lane=cluster
        #
        # `--crdb=reuse`, NEVER `auto`. `auto` means "reuse a cluster that answers, start
        # one if none does", so a lane whose `docker run` had failed would quietly start
        # a container of its own and report success — a lane that cannot report that its
        # cluster is missing. `reuse` skips instead, and the floor refuses the skip.
        run: |
          set -euo pipefail
          report="junit-cluster.xml"
          captured="pytest-cluster.txt"
          set +e
          uv run --frozen --all-packages pytest "${SUITE}" \
            --crdb=reuse -q -p no:cacheprovider --junit-xml="${report}" 2>&1 | tee "${captured}"
          rc=$?
          set -e
          echo "pytest exited ${rc}"
          # PUBLISHED, NOT RE-DERIVED. The VERDICT step at the end of this job needs
          # pytest's real status and runs in a different shell; deriving it from the XML
          # there would be a second opinion about a fact this line already holds. This is
          # additive and changes nothing about the verdict: `--pytest-rc` below is still
          # handed `${rc}` directly, the report is still the LAST command of this step,
          # and `rc=$?` — the literal `tests/ci/test_cluster_lane_report.py` reads out of
          # this file as the wiring its controls rest on — is untouched above.
          echo "PYTEST_RC=${rc}" >> "$GITHUB_ENV"
          uv run --frozen --all-packages python scripts/ci/cluster_lane_report.py \
            --junit "${report}" \
            --known qa/cluster-known-red.json \
            --suite-root "${SUITE}" \
            --pytest-rc "${rc}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: What failed, in the few lines a reader needs first
        # Diagnosis, and it is its OWN step ON PURPOSE — the one deviation in this file
        # from `docs/leads/lane-honest-plan.md`'s wording, argued here rather than made
        # quietly.
        #
        # The plan says to call the digest "after the report". Folding it into the step
        # above would have meant one of two things, and both are worse than this:
        #
        #   * digest LAST, which needs a trailing `exit "${verdict_rc}"` — and that
        #     replaces the property the step above is built on ("the last command exits
        #     with pytest's own status, so there is nothing to delete that does not delete
        #     the run") with a single deletable line standing between the verdict and the
        #     job's status;
        #   * digest BEFORE the verdict, which puts a program that can fail in front of
        #     the one that decides, so a broken diagnosis tool would hide the diagnosis.
        #
        # As its own step AFTER the verdict it is literally "after the report", it cannot
        # come between pytest's exit status and `--pytest-rc`, and deleting it cannot turn
        # a red run green. `scripts/ci/lane_log_digest.py` exits 0 on every input by
        # construction and emits no `::error`, so the verdict stays in exactly one place.
        #
        # `always()` and not `failure()`: the skip census is the half a reader needs on a
        # GREEN run — ten skips against a ceiling of one is the defect this whole wave was
        # about, and a digest that only appeared on red would never have published it.
        if: always()
        run: |
          set -euo pipefail
          uv run --frozen --all-packages python scripts/ci/lane_log_digest.py \
            --junit junit-cluster.xml \
            --stdout pytest-cluster.txt \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: The run's own files, as files
        # `gh run download` yields these two instead of 1,023 lines of interleaved log.
        # Measured over run 31735341117: the FAILURES block and the verdict are lines
        # 760-919 of that log, and the one failing assertion is a single line at 830.
        #
        # `if-no-files-found: warn` is chosen rather than defaulted. A collection error in
        # the step above aborts this job before pytest ever writes a JUnit file, and that
        # is a real defect with its own `::error` already attached; making this upload a
        # SECOND red for the same cause would teach a reader that the lane fails twice for
        # one problem. `ignore` would be wrong the other way — a missing artefact after a
        # run that DID reach pytest is worth a line in the log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-lane-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            junit-cluster.xml
            pytest-cluster.txt
          if-no-files-found: warn
          retention-days: 30

      - name: The container's own account of the run
        # Diagnosis only, and it is the one step in this job allowed to run after a
        # failure — it decides nothing, and it runs only when the job has ALREADY failed,
        # so it can neither mask a verdict nor create one. When the suite fails for a
        # reason that is about the database rather than about the code, this is where
        # that shows up. It suppresses nothing: this directory permits exactly one
        # suppressed command, `db.yml`'s container cleanup, and a second would make that
        # ban unenforceable.
        #
        # FOLDED, NOT QUIETED, AND NOT SHORTENED. Measured over run 31735341117: these 60
        # lines are 943-1003 of a 1,023-line log, so a reader who opens a failed run lands
        # on CockroachDB's session log and the failing assertion is ~180 lines above it.
        # `::group::` collapses them in the UI and keeps every byte one click away. The
        # obvious alternatives were both refused: `tail -20` throws away the part of an
        # event log that is furthest from the failure and usually the part that explains
        # it, and a `--log` filter on the container would silence exactly the case this
        # step exists for.
        #
        # 2026-08-14, RULING R8 — THE ENGINE LOG NOW GOES TO ITS OWN FILE AS WELL AS TO
        # THE GROUP, AND NOTHING IS SHORTENED TO ACHIEVE IT. The `tail -60` in the log is
        # unchanged; what is new is that the WHOLE log is written to `crdb-engine.log`
        # first and uploaded by the step below, so the two readers get what each needs:
        # a reader scrolling the run gets 60 collapsed lines, and a reader debugging a
        # database problem gets every line as a file, without either one being the wall
        # the other has to scroll past. The tail is now taken FROM the file rather than
        # from a second `docker logs`, so the group and the artefact cannot disagree
        # about what the engine said.
        if: failure()
        run: |
          set -euo pipefail
          docker logs "${CRDB_CONTAINER}" > crdb-engine.log 2>&1
          total="$(wc -l < crdb-engine.log | tr -d ' ')"
          echo "::group::docker logs ${CRDB_CONTAINER} | tail -60 (of ${total} line(s); all of them are in the crdb-engine.log artefact)"
          tail -60 crdb-engine.log
          echo "::endgroup::"

      - name: The engine's own account, as a file
        # The other half of the separation above. `if-no-files-found: warn` and not
        # `error`: the step that writes this file runs only on failure and only after
        # `docker run` succeeded, so a job that died on the image pin legitimately has no
        # engine log, and a second red for one cause teaches a reader that the lane fails
        # twice for one problem. It is a separate artefact from `cluster-lane-…` on
        # purpose — that one is what pytest said, this one is what CockroachDB said, and
        # the whole point of R8 is that those two are not the same document.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: crdb-engine.log
          if-no-files-found: warn
          retention-days: 30

      # ── THE LAST THING A FAILING RUN SAYS ───────────────────────────────────────────
      #
      # RULING R8 of `docs/leads/ci-green-final.md`: *a lane whose diagnosis needs `grep`
      # will not be read.* Measured on this lane rather than assumed:
      #
      #   * run 31735341117 was 1,023 log lines; the one failing assertion was line 830
      #     and CockroachDB's event log was 943-1003, so the bottom of the run — where a
      #     reader's eye lands — was the engine, not the defect;
      #   * run 31770005759 had EIGHT failing node ids and the `::error` annotation the
      #     report emits lists FIVE of them and then `; …`, so the count and the list
      #     disagree and three ids appear nowhere a reader can see them.
      #
      # This step answers both, and it is STRICTLY ADDITIVE — it removes no assertion,
      # shortens no output, and touches neither `COLLECTED_FLOOR` (445, a floor that may
      # rise and may not fall) nor the skip ceiling of 1 (which lives in
      # `qa/cluster-known-red.json` under `floor.max_skipped` and is not this lane's to
      # move). It runs LAST so that the block is the final text in the log, and AFTER the
      # engine steps so that nothing engine-shaped comes between the reader and it.
      #
      # IT DECIDES NOTHING, AND THAT IS DELIBERATE. `scripts/ci/lane_verdict.py` exits 0
      # on every input by construction and emits no `::error`, `::warning` or `::notice`
      # — the same contract `lane_log_digest.py` states, for the same reason: a lane that
      # can go red in two places has two places a verdict can hide. The verdict is
      # pytest's own exit status, handed to `cluster_lane_report.py` through
      # `--pytest-rc` several steps above, and deleting this step cannot turn a red run
      # green. `if: failure()` and not `always()`: on a green run there is no failing
      # node id to list and the digest above already publishes the skip census.
      #
      # `python3`, NOT `uv run`, AND THAT IS THE POINT. Every other Python step in this
      # job goes through `uv run --frozen`, which needs `setup-workspace` to have
      # succeeded. The runs where this block matters most are precisely the ones where
      # something upstream did not succeed, so a diagnosis that inherits the workspace's
      # preconditions is a diagnosis that is absent exactly when it is needed.
      # `scripts/ci/lane_verdict.py` imports nothing outside the standard library for
      # this reason, and `ubuntu-24.04` ships `python3`.
      #
      # `PYTEST_RC` is exported by the suite step above and defaults to 1 here. The
      # default is not a guess about pytest: this step runs only under `if: failure()`,
      # so if the variable is absent the job failed BEFORE pytest was reached, and the
      # block says so from the missing JUnit rather than from this number.
      - name: VERDICT — the failing ids, the counts, the owner, and what turns it green
        if: failure()
        run: |
          set -euo pipefail
          python3 scripts/ci/lane_verdict.py \
            --junit junit-cluster.xml \
            --known qa/cluster-known-red.json \
            --suite-root "${SUITE}" \
            --pytest-rc "${PYTEST_RC:-1}" \
            --lane "cluster-tests / the demo-api suite against a real CockroachDB" \
            --lane-owner "the CI-BOARD lead, docs/leads/ci-green-final.md"
