# SPDX-FileCopyrightText: 2026 MAINLINE contributors
# SPDX-License-Identifier: Apache-2.0
#
# THE SCHEMA-MUTATING SUITES. Everything here DROPS CONSTRAINTS and DISABLES TRIGGERS, so
# it runs serially, on a container it creates and destroys, and never on a cluster any
# other job shares.
#
# `testing-invariants.md` §1: two suites are exempt from the parallel-against-one-cluster
# architecture — migrations and unwelding — and both get a serialised job on a disposable
# container. This file is where that is written down.
#
# Three properties this workflow has, each because its absence has a failure mode:
#
#   `concurrency` with no cancel-in-progress. Two unwelding runs against two containers
#   would be fine; two runs racing to write REFUSAL_DEPTH.md would not, and a cancelled
#   run that had already dropped a constraint is a container nobody reaps.
#
#   `-p no:xdist` and `-p no:randomly`. Parallelism is the thing this suite must not have:
#   one probe's DROP CONSTRAINT is another probe's silent unwelding. Order shuffling is
#   equally fatal — the matrix restores what it removed, and a shuffle can interleave a
#   removal with a restoration.
#
#   The image pin is READ OUT of compose.yaml rather than repeated here. A second copy of a
#   version string is a second thing to forget, and a dev/CI skew that changes DDL
#   behaviour is precisely the drift the schema fingerprint exists to catch — so the
#   harness must not introduce one.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# THIS LANE IS RED ON PURPOSE, AND SINCE 2026-08-10 IT SAYS WHY IN ONE SENTENCE
# ─────────────────────────────────────────────────────────────────────────────────────────
# The reference vertical references TWO tables that no file in it creates:
#
#     trappoint_ref.clause   consumed by 0066_disposition       (FOREIGN KEY target)
#     trappoint_ref.event    consumed by 0058_blocking_check    (FOREIGN KEY target)
#
# Both are named in full, by every job in this file that speaks. Until 2026-08-10 the only
# thing this lane printed about that was
#
#     trappoint migrate: REFUSED: 0058_blocking_check: [42P01] relation "trappoint_ref.event"
#     does not exist
#
# — a true sentence that names neither the missing artefact as an artefact, nor the domain
# that owes it, nor the second missing producer sitting behind the first.
#
# AND THE DATABASE CANNOT NAME `clause` AT ALL IN THIS STATE. Measured 2026-08-13 against a
# local CockroachDB v26.2.5, by applying all 109 files of the reference vertical in order
# into an empty `trappoint_ref` schema and DELIBERATELY NOT STOPPING at refusals — which is
# strictly more than `trappoint migrate up` will ever tell you. 42P01 is raised for six
# relations:
#
#     trappoint_ref.event            first refused by 0058_blocking_check
#     trappoint_ref.blocking_check   first refused by 0058a_bc_open_index
#     trappoint_ref.exposure_line    first refused by 0066_disposition
#     trappoint_ref.disposition      first refused by 0066a_one_live_disposition
#     trappoint_ref.site             first refused by 0127_trg_closure_guard
#     trappoint_ref.override_ledger  first refused by 0128f_trg_refuse_mutation_override_ledger
#
# `trappoint_ref.clause` is NOT among them. Five of those six are cascade — tables the tree
# does create, whose CREATE never ran because an earlier file refused — and 0066_disposition
# refuses on `exposure_line` before it reaches its `REFERENCES trappoint_ref.clause`. So the
# second genuinely missing producer surfaces from the database only after `event` and its
# entire cascade are restored. The static scan in the `producers` job is the only thing in
# this repository that can name it today, which is why that job exists and runs first.
#
# The `producers` job below states the whole finding, hermetically, in about ten seconds,
# and it is the first thing a reader sees. The two container jobs still run and still
# refuse against a real CockroachDB — the database is the authority and a static check is
# only a reading of it — but they now classify their own refusal instead of leaving a raw
# SQLSTATE, they name BOTH missing producers rather than the first one the runner reached,
# and they say in their own first sentence that they are COLLATERAL.
#
# COLLATERAL, measured on run 31596641256 (2026-08-12, commit 1d41442): `unwelding matrix`
# and `the self-attesting gate` both died at their `Apply the reference vertical` step, so
# neither the unwelding matrix nor the gate-source snapshot comparison executed at all. A
# reader of that run had to diff the tree to discover that two of the three red jobs were
# consequences of the third's finding and had measured nothing of their own subject. Those
# two jobs now say so: their subject is UNPROVEN by such a run, not failing.
#
# NOTHING HERE IS ALLOWED TO GO GREEN BY BEING QUIETER. No `continue-on-error`, no
# `|| true`, no job that is skipped so its absence reads as a pass. The lane stays red
# until somebody in the KERNEL domain writes the two producers.

name: schema

on:
  pull_request:
    paths:
      - "packages/trappoint-sql/**"
      - "packages/trappoint-conformance/**"
      - "packages/trappoint-migrate/**"
      - "verticals/mainline/db/**"
      - "spec/conformance/**"
      - ".github/workflows/schema.yml"
      - "compose.yaml"
  push:
    # `master`, not `main` — the default branch of this repository, measured
    # 2026-08-10 with `gh repo view --json defaultBranchRef`. `main` does not exist,
    # so this trigger had never fired once. See claims.yml for the full note. The
    # `schedule:` below was already reaching `master`, because GitHub fires cron
    # triggers from the DEFAULT branch only — which is why this lane had scheduled
    # runs and no push runs.
    branches: [master]
  schedule:
    # Nightly, because the full matrix is the long form: CI runs it on every PR that
    # touches the schema, and this catches the case where nothing touched the schema and
    # the platform moved underneath it.
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-${{ github.ref }}
  cancel-in-progress: false

env:
  # The corpus reads these exactly as `trappoint-conform` does, so a developer who can run
  # the CLI can run the suite with nothing else to configure.
  TRAPPOINT_PROFILE: trappoint-ref
  PYTHONIOENCODING: utf-8

jobs:
  producers:
    name: every object the reference vertical references has a producer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Every REFERENCES target in the reference vertical must be created by it
        # Hermetic: no container, no uv, no network. Reads the same .sql files the runner
        # applies and answers the question the runner can only answer one refusal at a
        # time, because `trappoint migrate up` stops at its first REFUSED.
        #
        # Deliberately narrow. It matches `REFERENCES trappoint_ref.<table>` and nothing
        # else — not FROM, not JOIN, not a function body — because a foreign key is the one
        # construct whose target must exist at APPLY time and whose absence is therefore
        # exactly the 42P01 the lane already gets. A wider scan would be a different check
        # with different false positives, and this one has to be trustworthy enough that
        # its message can be read as a work item.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, sys

          SQL = pathlib.Path("packages/trappoint-sql/refvertical/sql")
          MAINLINE_TWIN = {
              "event": "verticals/mainline/db/migrations/0033_event.sql",
              "clause": "verticals/mainline/db/migrations/0028_clause.sql",
          }

          create = re.compile(
              r"CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?trappoint_ref\.([a-z_][a-z0-9_]*)",
              re.IGNORECASE,
          )
          reference = re.compile(
              r"REFERENCES\s+trappoint_ref\.([a-z_][a-z0-9_]*)", re.IGNORECASE
          )

          produced: dict[str, str] = {}
          consumed: dict[str, list[str]] = {}
          for path in sorted(SQL.glob("*.sql")):
              text = path.read_text(encoding="utf-8", errors="ignore")
              body = "\n".join(
                  line for line in text.splitlines() if not line.lstrip().startswith("--")
              )
              for table in create.findall(body):
                  produced.setdefault(table.lower(), path.stem)
              for table in reference.findall(body):
                  consumed.setdefault(table.lower(), []).append(path.stem)

          missing = {t: c for t, c in sorted(consumed.items()) if t not in produced}
          print(f"reference vertical: {len(produced)} tables created, "
                f"{len(consumed)} referenced, {len(missing)} with no producer")

          if not missing:
              print("every REFERENCES target has a producer")
              sys.exit(0)

          # THE TITLE IS THE WHOLE MESSAGE FOR MOST READERS. A judge scanning the Actions
          # tab sees this annotation and nothing else, and a red that means "by design"
          # costs exactly the attention of a red that means "broken" unless it says so in
          # the first clause. It says so in the first clause. The second sentence is the
          # one that stops the cheap fix before somebody tries it: this cannot be closed by
          # narrowing the matrix, skipping the job or dropping the foreign key.
          print("::error title=RED BY DESIGN - MISSING PRODUCER in the reference vertical::"
                f"RED BY DESIGN, NOT A CI DEFECT: {len(missing)} object(s) referenced by "
                "packages/trappoint-sql/refvertical/sql and created by no file in it: "
                + ", ".join(f"trappoint_ref.{t}" for t in missing)
                + ". This lane refuses to be closed by narrowing the matrix, skipping a job "
                  "or dropping the foreign key -- only a CREATE TABLE migration for each "
                  "object named above turns it green, because two bindings that both render "
                  "is the substrate claim and one binding is a template engine with an "
                  "audience of one.")

          for table, consumers in missing.items():
              twin = MAINLINE_TWIN.get(table, "(no MAINLINE twin identified)")
              print("::error::"
                    f"MISSING PRODUCER: trappoint_ref.{table} -- "
                    f"consumed by {', '.join(consumers)} (FOREIGN KEY target) -- "
                    "expected: a CREATE TABLE migration in "
                    "packages/trappoint-sql/refvertical/sql/ -- "
                    f"MAINLINE twin that already exists: {twin} -- "
                    "owner: KERNEL domain, docs/leads/kernel.md 1.1 "
                    "(the reference vertical ships inside packages/trappoint-sql/refvertical/)")

          print()
          print("=" * 88)
          print("THE SCHEMA LANE IS RED BECAUSE THE PRODUCT IS INCOMPLETE, NOT BECAUSE CI IS BROKEN")
          print("=" * 88)
          for table, consumers in missing.items():
              cited = ", ".join(consumers)
              twin = MAINLINE_TWIN.get(table, "(none identified)")
              for line in (
                  "",
                  f"  MISSING PRODUCER : trappoint_ref.{table}",
                  f"  consumed by      : {cited}  (REFERENCES trappoint_ref.{table})",
                  f"  expected at      : packages/trappoint-sql/refvertical/sql/<nnnn>_{table}.sql",
                  f"  MAINLINE twin    : {twin}",
                  "  template         : none. packages/trappoint-sql/templates/ carries",
                  "                     0059_subject_event.sql.j2 (the per-subject event tables)",
                  "                     and 0052_subject_clause.sql.j2 (the per-subject clause",
                  "                     link tables). Neither renders the base table, so a",
                  "                     producer needs a new template or a hand-authored file.",
                  "  owner            : KERNEL domain - docs/leads/kernel.md 1.1, which decides",
                  "                     that the kernel ships a reference vertical alongside the",
                  "                     MAINLINE binding from day one, inside",
                  "                     packages/trappoint-sql/refvertical/.",
                  "  what it is NOT   : a CI defect. It must not be closed by narrowing the",
                  "                     matrix, skipping the job or dropping the foreign key.",
                  "                     Two bindings that both render is the entire substrate",
                  "                     claim; one binding is a template engine with an",
                  "                     audience of one.",
              ):
                  print(line)
          print()
          print("The container jobs below reach only the FIRST of these against a real "
                "database, because `trappoint migrate up` stops at its first REFUSED. That "
                "is why this job exists — and it is why those two jobs now repeat this scan "
                "and name the whole list themselves, so that no single log names one missing "
                "producer at a time. They are COLLATERAL of this finding: neither the "
                "unwelding matrix nor the gate-source snapshot comparison runs at all while "
                "these producers are absent, so their subjects are UNPROVEN, not failing.")
          print()
          print("Measured 2026-08-13 on CockroachDB v26.2.5, applying all of "
                "packages/trappoint-sql/refvertical/sql in order WITHOUT stopping at "
                "refusals — strictly more than the runner will ever report: 42P01 names "
                "trappoint_ref.event and five cascade victims, and NEVER names "
                "trappoint_ref.clause, because 0066_disposition refuses on "
                "trappoint_ref.exposure_line before it reaches its REFERENCES "
                "trappoint_ref.clause. No amount of reading the database surfaces the second "
                "missing producer until the first and its cascade are closed. This static "
                "scan is the only reader in the repository that can name it today.")

          # The Actions SUMMARY page, not only the log. A reader who opens the run rather
          # than a job sees the whole finding, both objects, and the owning domain without
          # expanding a single step. Written LAST so that a crash in the scan above cannot
          # leave a confident half-table on the summary page.
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as handle:
                  handle.write(
                      f"## schema: {len(missing)} object(s) referenced by the reference "
                      "vertical and created by nothing\n\n"
                  )
                  handle.write(
                      "| missing object | consumed by | producer expected at | MAINLINE twin "
                      "| owner |\n|---|---|---|---|---|\n"
                  )
                  for table, consumers in missing.items():
                      twin = MAINLINE_TWIN.get(table, "(none identified)")
                      handle.write(
                          f"| `trappoint_ref.{table}` | {', '.join(consumers)} | "
                          f"`packages/trappoint-sql/refvertical/sql/<nnnn>_{table}.sql` | "
                          f"`{twin}` | KERNEL domain, `docs/leads/kernel.md` 1.1 |\n"
                      )
                  handle.write(
                      "\nRED ON PURPOSE. This table is computed from the .sql files in this "
                      "checkout at run time, so it cannot go stale. The lane goes green when "
                      "the migrations above exist — not when a job is skipped, a foreign key "
                      "is dropped or a matrix is narrowed. `unwelding matrix` and `the "
                      "self-attesting gate` fail as COLLATERAL of this finding and measure "
                      "nothing of their own subjects until it is closed.\n"
                  )
          sys.exit(1)
          PY

  unweld:
    name: unwelding matrix (serial, disposable cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned CockroachDB image out of compose.yaml
        id: image
        # One constant, one place. The line is tagged `trappoint:crdb-image-pin` in
        # compose.yaml and this is the only reader in this workflow.
        run: |
          set -euo pipefail
          image="$(grep -A1 'trappoint:crdb-image-pin' compose.yaml | tail -n1 | sed 's/.*image: *//')"
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "pinned image: $image"

      - name: Start a cluster this job is allowed to break
        run: |
          set -euo pipefail
          docker run -d --name trappoint-unweld-ci \
            -p 127.0.0.1:26399:26257 \
            "${{ steps.image.outputs.image }}" \
            start-single-node --insecure --store=type=mem,size=2GiB
          for _ in $(seq 1 60); do
            if docker exec trappoint-unweld-ci ./cockroach sql --insecure \
                 --host=127.0.0.1:26257 --execute='SELECT 1' >/dev/null 2>&1; then
              echo "cluster up"; exit 0
            fi
            sleep 2
          done
          echo "the disposable cluster never answered SQL"; docker logs trappoint-unweld-ci; exit 1

      - name: Make local behaviour Cloud-truthful
        # F2: gc.ttlseconds is 4500 on Cloud Basic and 14400 locally. Local is MORE
        # PERMISSIVE than production, so a time-travel assertion that passes here can fail
        # there. Standing rule: where local and Cloud differ, configure local to the
        # stricter value. CF-46 reads this back and asserts against it.
        run: |
          docker exec trappoint-unweld-ci ./cockroach sql --insecure --host=127.0.0.1:26257 \
            --execute="ALTER RANGE default CONFIGURE ZONE USING gc.ttlseconds = 4500"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --all-packages

      - name: Apply the reference vertical
        env:
          TRAPPOINT_UNWELD_DSN: postgresql://root@127.0.0.1:26399/defaultdb?sslmode=disable
        # The database is the authority: this is the step that observes CockroachDB
        # refusing, and the `producers` job above is only a reading of the same files. What
        # changed on 2026-08-10 is that a refusal is now CLASSIFIED here rather than left as
        # a raw SQLSTATE for a reader to interpret. The step still exits non-zero, always.
        #
        # What changed on 2026-08-13, after reading run 31596641256: this step named ONE
        # missing producer (`trappoint_ref.event`, the first refusal) and never said that
        # the unwelding matrix — the thing this job is named after and exists to run — had
        # not executed at all. A reader of that log could not tell a collateral casualty
        # from an independent failure without diffing the tree. Both are fixed below: the
        # static scan is repeated here so the log carries the WHOLE list, and the first
        # sentence out of this step is that the job is COLLATERAL.
        run: |
          set -euo pipefail
          uv run --package trappoint-migrate trappoint migrate bootstrap \
            --dsn "$TRAPPOINT_UNWELD_DSN"

          # The same scan the `producers` job runs, repeated rather than shared: GitHub
          # Actions has no YAML anchors, and a script under scripts/ would be a second
          # place to look for the sentence THIS log has to carry. It is only a reading of
          # the files. The refusal below is the database's own answer and stays the
          # authority; this is what makes the answer legible when migrate stops early.
          detail="$RUNNER_TEMP/missing-producers.txt"
          oneline="$RUNNER_TEMP/missing-producers-oneline.txt"
          python3 - "$detail" "$oneline" <<'PY'
          import pathlib, re, sys

          detail_path, oneline_path = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          SQL = pathlib.Path("packages/trappoint-sql/refvertical/sql")
          TWIN = {
              "event": "verticals/mainline/db/migrations/0033_event.sql",
              "clause": "verticals/mainline/db/migrations/0028_clause.sql",
          }
          created = re.compile(
              r"CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?trappoint_ref\.([a-z_][a-z0-9_]*)",
              re.IGNORECASE,
          )
          referenced = re.compile(
              r"REFERENCES\s+trappoint_ref\.([a-z_][a-z0-9_]*)", re.IGNORECASE
          )

          produced: set[str] = set()
          consumed: dict[str, list[str]] = {}
          for path in sorted(SQL.glob("*.sql")):
              body = "\n".join(
                  line
                  for line in path.read_text(encoding="utf-8", errors="ignore").splitlines()
                  if not line.lstrip().startswith("--")
              )
              produced.update(table.lower() for table in created.findall(body))
              for table in referenced.findall(body):
                  consumed.setdefault(table.lower(), []).append(path.stem)

          missing = sorted(table for table in consumed if table not in produced)
          detail_path.write_text(
              "".join(
                  f"    trappoint_ref.{table}  --  consumed by {', '.join(consumed[table])}"
                  f"  --  expected at packages/trappoint-sql/refvertical/sql/<nnnn>_{table}.sql"
                  f"  --  MAINLINE twin {TWIN.get(table, 'none identified')}\n"
                  for table in missing
              ),
              encoding="utf-8",
          )
          oneline_path.write_text(
              ", ".join(f"trappoint_ref.{table}" for table in missing) or "(none)",
              encoding="utf-8",
          )
          PY
          objects="$(cat "$oneline")"
          missing_count="$(awk 'NF' "$detail" | wc -l | tr -d ' ')"

          log="$RUNNER_TEMP/refvertical-migrate.log"
          if uv run --package trappoint-migrate trappoint migrate up \
               --dsn "$TRAPPOINT_UNWELD_DSN" --tree trappoint-ref \
               --migrations packages/trappoint-sql/refvertical/sql 2>&1 | tee "$log"; then
            echo "the reference vertical applied clean"
            exit 0
          fi

          object="$(sed -n 's/.*relation "\(trappoint_ref\.[a-z_][a-z0-9_]*\)" does not exist.*/\1/p' "$log" | head -n1)"
          consumer="$(sed -n 's/.*REFUSED: \([0-9a-zA-Z_]*\):.*/\1/p' "$log" | head -n1)"

          if [ -n "$object" ]; then
            echo "::error title=RED BY DESIGN (COLLATERAL) - the unwelding matrix never ran::RED BY DESIGN, NOT A CI DEFECT. ${missing_count} object(s) are referenced by packages/trappoint-sql/refvertical/sql and created by no file in it: ${objects}. CockroachDB refused at ${consumer} on ${object}, the first of them. Owner: KERNEL domain, docs/leads/kernel.md 1.1. This job did NOT fail on its own subject -- the unwelding matrix did not execute, so it is UNPROVEN by this run rather than failing. WHAT TURNS IT GREEN: a CREATE TABLE migration for each object named above. WHAT DOES NOT: narrowing the matrix, skipping this job, or dropping the foreign key -- each of those closes the lane by deleting the question."
            cat <<EOF

          ========================================================================================
          COLLATERAL -- this job measured nothing of its own subject
          ========================================================================================
            this job     : unwelding matrix (serial, disposable cluster)
            its subject  : packages/trappoint-conformance/unweld -- drop each constraint, prove
                           the database refuses, restore it, and regenerate REFUSAL_DEPTH.md.
                           NONE of that ran. This job is a casualty of the finding below, not
                           an independent failure, and its subject is UNPROVEN by this run.
            cause        : the reference vertical cannot be applied, so there is no schema to
                           unweld. Identical cause, identical objects, in 'the self-attesting
                           gate' -- the two are one finding seen twice, not two findings.
          ----------------------------------------------------------------------------------------
          MISSING PRODUCERS -- the reference vertical, not MAINLINE
          ----------------------------------------------------------------------------------------
            refused at   : ${consumer}  on  ${object}   (FOREIGN KEY target; it must exist at
                           APPLY time, and migrate stops at its FIRST refusal)
            full list    : ${missing_count} object(s) -- ${objects}
                           (read out of the .sql files in this checkout, in this step, so the
                           log is not one instalment of the finding)
          EOF
            cat "$detail"
            cat <<'EOF'
            tree         : packages/trappoint-sql/refvertical/sql   (--tree trappoint-ref)
            expected     : a CREATE TABLE migration per object, in that directory. The MAINLINE
                           binding's twins already exist and there is no template in
                           packages/trappoint-sql/templates/ that renders either base table.
            owner        : KERNEL domain -- docs/leads/kernel.md 1.1, which ships the reference
                           vertical "alongside the MAINLINE binding, from day one, inside
                           packages/trappoint-sql/refvertical/".
            status       : RED ON PURPOSE. This is product incompleteness. It is not closed by
                           continue-on-error, by dropping the foreign key, or by removing the
                           reference vertical from this lane. The 'producers' job in this
                           workflow states the same finding hermetically, in ten seconds.
          ========================================================================================
          EOF
            if [ "$missing_count" -eq 0 ]; then
              echo "::error title=the scan and the database disagree::The static scan found NO missing producer, yet CockroachDB refused on ${object}. The scan matches REFERENCES trappoint_ref.<table> and nothing else, so it is narrower than the database; that gap is itself a finding and belongs in the 'producers' job, not in a silence here."
            fi
          else
            echo "::error title=the reference vertical refused, unclassified::trappoint migrate up failed for a reason this step does not recognise, so it is NOT attributed to the ${missing_count} known missing producer(s) (${objects}). The runner's whole output is below; classify it here rather than leaving the next reader with a bare exit code. Owner of the reference vertical: KERNEL domain, docs/leads/kernel.md 1.1."
            echo "---- trappoint migrate up ----"
            cat "$log"
            echo "------------------------------"
          fi
          exit 1

      - name: Unwelding matrix
        env:
          TRAPPOINT_UNWELD_DSN: postgresql://root@127.0.0.1:26399/defaultdb?sslmode=disable
          TRAPPOINT_UNWELD_PROFILE: trappoint-ref
        # -p no:xdist  — one probe's DROP CONSTRAINT is another probe's silent unwelding.
        # -p no:randomly — the matrix restores what it removed; a shuffle can interleave a
        #                  removal with its own restoration.
        # -m schema    — this job runs the mutating suites and nothing else.
        run: |
          uv run --package trappoint-conformance pytest \
            packages/trappoint-conformance/unweld \
            -m schema -p no:xdist -p no:randomly -q

      - name: The refusal-depth matrix must be committed and current
        # The generated artefact is part of the assurance pack, so a run that changed it
        # and did not commit it is a run whose published matrix describes a schema that no
        # longer exists.
        run: |
          set -euo pipefail
          if ! git diff --quiet -- packages/trappoint-conformance/REFUSAL_DEPTH.md; then
            echo "::error::REFUSAL_DEPTH.md changed. The unwelding matrix measured something"
            echo "::error::different from what is committed. Commit the regenerated file."
            git --no-pager diff -- packages/trappoint-conformance/REFUSAL_DEPTH.md
            exit 1
          fi

      - name: Publish the matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: refusal-depth-matrix
          path: packages/trappoint-conformance/REFUSAL_DEPTH.md
          if-no-files-found: warn

      - name: Destroy the cluster
        if: always()
        # `|| true` is banned repository-wide and a teardown is not the exception: it is
        # where the token is least visible and most costly, because a container that will
        # not die is a runner that leaks and a `|| true` is how nobody finds out. Ask
        # whether it exists; let a removal that genuinely fails, fail.
        run: |
          set -euo pipefail
          if docker ps -a --format '{{.Names}}' | grep -qx trappoint-unweld-ci; then
            docker rm -f trappoint-unweld-ci
          else
            echo "no container named trappoint-unweld-ci; nothing to destroy"
          fi

  gate-source:
    name: the self-attesting gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned CockroachDB image out of compose.yaml
        id: image
        run: |
          set -euo pipefail
          image="$(grep -A1 'trappoint:crdb-image-pin' compose.yaml | tail -n1 | sed 's/.*image: *//')"
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Start a cluster
        run: |
          set -euo pipefail
          docker run -d --name trappoint-gatesrc-ci \
            -p 127.0.0.1:26401:26257 \
            "${{ steps.image.outputs.image }}" \
            start-single-node --insecure --store=type=mem,size=2GiB
          for _ in $(seq 1 60); do
            if docker exec trappoint-gatesrc-ci ./cockroach sql --insecure \
                 --host=127.0.0.1:26257 --execute='SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "the cluster never answered SQL"; exit 1

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --all-packages

      - name: Apply the reference vertical
        env:
          LOCAL_DSN: postgresql://root@127.0.0.1:26401/defaultdb?sslmode=disable
        # Same classification as the `unweld` job, including the repeated scan and the
        # COLLATERAL framing. Duplicated rather than factored out because GitHub Actions has
        # no YAML anchors and a shared script under scripts/ would be a second place to look
        # for the sentence a reader needs in this log.
        run: |
          set -euo pipefail
          uv run --package trappoint-migrate trappoint migrate bootstrap --dsn "$LOCAL_DSN"

          detail="$RUNNER_TEMP/missing-producers.txt"
          oneline="$RUNNER_TEMP/missing-producers-oneline.txt"
          python3 - "$detail" "$oneline" <<'PY'
          import pathlib, re, sys

          detail_path, oneline_path = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          SQL = pathlib.Path("packages/trappoint-sql/refvertical/sql")
          TWIN = {
              "event": "verticals/mainline/db/migrations/0033_event.sql",
              "clause": "verticals/mainline/db/migrations/0028_clause.sql",
          }
          created = re.compile(
              r"CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?trappoint_ref\.([a-z_][a-z0-9_]*)",
              re.IGNORECASE,
          )
          referenced = re.compile(
              r"REFERENCES\s+trappoint_ref\.([a-z_][a-z0-9_]*)", re.IGNORECASE
          )

          produced: set[str] = set()
          consumed: dict[str, list[str]] = {}
          for path in sorted(SQL.glob("*.sql")):
              body = "\n".join(
                  line
                  for line in path.read_text(encoding="utf-8", errors="ignore").splitlines()
                  if not line.lstrip().startswith("--")
              )
              produced.update(table.lower() for table in created.findall(body))
              for table in referenced.findall(body):
                  consumed.setdefault(table.lower(), []).append(path.stem)

          missing = sorted(table for table in consumed if table not in produced)
          detail_path.write_text(
              "".join(
                  f"    trappoint_ref.{table}  --  consumed by {', '.join(consumed[table])}"
                  f"  --  expected at packages/trappoint-sql/refvertical/sql/<nnnn>_{table}.sql"
                  f"  --  MAINLINE twin {TWIN.get(table, 'none identified')}\n"
                  for table in missing
              ),
              encoding="utf-8",
          )
          oneline_path.write_text(
              ", ".join(f"trappoint_ref.{table}" for table in missing) or "(none)",
              encoding="utf-8",
          )
          PY
          objects="$(cat "$oneline")"
          missing_count="$(awk 'NF' "$detail" | wc -l | tr -d ' ')"

          log="$RUNNER_TEMP/refvertical-migrate.log"
          if uv run --package trappoint-migrate trappoint migrate up \
               --dsn "$LOCAL_DSN" --tree trappoint-ref \
               --migrations packages/trappoint-sql/refvertical/sql 2>&1 | tee "$log"; then
            echo "the reference vertical applied clean"
            exit 0
          fi

          object="$(sed -n 's/.*relation "\(trappoint_ref\.[a-z_][a-z0-9_]*\)" does not exist.*/\1/p' "$log" | head -n1)"
          consumer="$(sed -n 's/.*REFUSED: \([0-9a-zA-Z_]*\):.*/\1/p' "$log" | head -n1)"

          if [ -n "$object" ]; then
            echo "::error title=RED BY DESIGN (COLLATERAL) - the self-attesting gate never ran::RED BY DESIGN, NOT A CI DEFECT. ${missing_count} object(s) are referenced by packages/trappoint-sql/refvertical/sql and created by no file in it: ${objects}. CockroachDB refused at ${consumer} on ${object}, the first of them. Owner: KERNEL domain, docs/leads/kernel.md 1.1. This job did NOT fail on its own subject -- test_gate_source_snapshot.py did not execute, so the gate's source is UNPROVEN by this run rather than drifted. WHAT TURNS IT GREEN: a CREATE TABLE migration for each object named above. WHAT DOES NOT: narrowing the matrix, skipping this job, or dropping the foreign key -- each of those closes the lane by deleting the question."
            cat <<EOF

          ========================================================================================
          COLLATERAL -- this job measured nothing of its own subject
          ========================================================================================
            this job     : the self-attesting gate
            its subject  : packages/trappoint-conformance/tests/test_gate_source_snapshot.py --
                           read the gate function the DATABASE will execute and compare it to
                           the committed snapshot. That comparison did NOT run. The gate is
                           UNPROVEN by this run; nothing here says it has drifted.
            cause        : the reference vertical cannot be applied, so there is no gate in the
                           database to read. Identical cause, identical objects, in 'unwelding
                           matrix' -- the two are one finding seen twice, not two findings.
          ----------------------------------------------------------------------------------------
          MISSING PRODUCERS -- the reference vertical, not MAINLINE
          ----------------------------------------------------------------------------------------
            refused at   : ${consumer}  on  ${object}   (FOREIGN KEY target; it must exist at
                           APPLY time, and migrate stops at its FIRST refusal)
            full list    : ${missing_count} object(s) -- ${objects}
                           (read out of the .sql files in this checkout, in this step, so the
                           log is not one instalment of the finding)
          EOF
            cat "$detail"
            cat <<'EOF'
            tree         : packages/trappoint-sql/refvertical/sql   (--tree trappoint-ref)
            expected     : a CREATE TABLE migration per object, in that directory. The MAINLINE
                           binding's twins already exist and there is no template in
                           packages/trappoint-sql/templates/ that renders either base table.
            owner        : KERNEL domain -- docs/leads/kernel.md 1.1, which ships the reference
                           vertical "alongside the MAINLINE binding, from day one, inside
                           packages/trappoint-sql/refvertical/".
            status       : RED ON PURPOSE. The self-attesting gate cannot compare a snapshot of
                           a gate that was never created. The 'producers' job in this workflow
                           states the same finding hermetically, in ten seconds.
          ========================================================================================
          EOF
            if [ "$missing_count" -eq 0 ]; then
              echo "::error title=the scan and the database disagree::The static scan found NO missing producer, yet CockroachDB refused on ${object}. The scan matches REFERENCES trappoint_ref.<table> and nothing else, so it is narrower than the database; that gap is itself a finding and belongs in the 'producers' job, not in a silence here."
            fi
          else
            echo "::error title=the reference vertical refused, unclassified::trappoint migrate up failed for a reason this step does not recognise, so it is NOT attributed to the ${missing_count} known missing producer(s) (${objects}). The runner's whole output is below; classify it here rather than leaving the next reader with a bare exit code. Owner of the reference vertical: KERNEL domain, docs/leads/kernel.md 1.1."
            echo "---- trappoint migrate up ----"
            cat "$log"
            echo "------------------------------"
          fi
          exit 1

      - name: The gate's own source must match the committed snapshot
        env:
          LOCAL_DSN: postgresql://root@127.0.0.1:26401/defaultdb?sslmode=disable
        # This is the step whose failure message is meant to be read rather than silenced:
        # the text the database will execute the next time somebody merges a permit is not
        # the text the last reviewer read.
        run: |
          uv run --package trappoint-conformance pytest \
            packages/trappoint-conformance/tests/test_gate_source_snapshot.py -q

      - name: Destroy the cluster
        if: always()
        # See the note on the same step in `unweld`: no `|| true` in a teardown either.
        run: |
          set -euo pipefail
          if docker ps -a --format '{{.Names}}' | grep -qx trappoint-gatesrc-ci; then
            docker rm -f trappoint-gatesrc-ci
          else
            echo "no container named trappoint-gatesrc-ci; nothing to destroy"
          fi

  coverage-artefacts:
    name: anomaly coverage and manifest totality (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --all-packages

      - name: Totality, taxonomy, raise-site grounding and A1-A14 coverage
        # No cluster. These are the guards against a suite that shrinks silently, and they
        # belong in the fastest job because the fastest job is the one nobody skips.
        run: |
          uv run --package trappoint-conformance pytest \
            packages/trappoint-conformance/tests/test_manifest_totality.py \
            packages/trappoint-conformance/tests/test_taxonomy_totality.py \
            packages/trappoint-conformance/tests/test_raise_sites.py \
            packages/trappoint-conformance/tests/test_anomaly_coverage.py \
            packages/trappoint-conformance/unweld/test_unweld.py::test_restoration_matches_the_migration \
            -q -m "not db and not schema"

      - name: ANOMALY_COVERAGE.md must be committed and current
        run: |
          set -euo pipefail
          if ! git diff --quiet -- packages/trappoint-conformance/ANOMALY_COVERAGE.md; then
            echo "::error::ANOMALY_COVERAGE.md is stale. Regenerate and commit it."
            git --no-pager diff -- packages/trappoint-conformance/ANOMALY_COVERAGE.md
            exit 1
          fi
