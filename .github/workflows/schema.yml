# SPDX-License-Identifier: Apache-2.0
#
# THE SCHEMA-MUTATING SUITES. Everything here DROPS CONSTRAINTS and DISABLES TRIGGERS, so
# it runs serially, on a container it creates and destroys, and never on a cluster any
# other job shares.
#
# `testing-invariants.md` §1: two suites are exempt from the parallel-against-one-cluster
# architecture — migrations and unwelding — and both get a serialised job on a disposable
# container. This file is where that is written down.
#
# Three properties this workflow has, each because its absence has a failure mode:
#
#   `concurrency` with no cancel-in-progress. Two unwelding runs against two containers
#   would be fine; two runs racing to write REFUSAL_DEPTH.md would not, and a cancelled
#   run that had already dropped a constraint is a container nobody reaps.
#
#   `-p no:xdist` and `-p no:randomly`. Parallelism is the thing this suite must not have:
#   one probe's DROP CONSTRAINT is another probe's silent unwelding. Order shuffling is
#   equally fatal — the matrix restores what it removed, and a shuffle can interleave a
#   removal with a restoration.
#
#   The image pin is READ OUT of compose.yaml rather than repeated here. A second copy of a
#   version string is a second thing to forget, and a dev/CI skew that changes DDL
#   behaviour is precisely the drift the schema fingerprint exists to catch — so the
#   harness must not introduce one.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# THIS LANE IS RED ON PURPOSE, AND SINCE 2026-08-10 IT SAYS WHY IN ONE SENTENCE
# ─────────────────────────────────────────────────────────────────────────────────────────
# The reference vertical references two tables that no file in it creates. Until
# 2026-08-10 the only thing this lane printed about that was
#
#     trappoint migrate: REFUSED: 0058_blocking_check: [42P01] relation "trappoint_ref.event"
#     does not exist
#
# — a true sentence that names neither the missing artefact as an artefact, nor the domain
# that owes it, nor the second missing producer sitting behind the first. A migration run
# stops at its first refusal, so a reader fixing `event` would have discovered `clause` on
# the next run and nowhere else.
#
# The `producers` job below states the whole finding, hermetically, in about ten seconds,
# and it is the first thing a reader sees. The two container jobs still run and still
# refuse against a real CockroachDB — the database is the authority and a static check is
# only a reading of it — but they now classify their own refusal instead of leaving a raw
# SQLSTATE.
#
# NOTHING HERE IS ALLOWED TO GO GREEN BY BEING QUIETER. No `continue-on-error`, no
# `|| true`, no job that is skipped so its absence reads as a pass. The lane stays red
# until somebody in the KERNEL domain writes the two producers.

name: schema

on:
  pull_request:
    paths:
      - "packages/trappoint-sql/**"
      - "packages/trappoint-conformance/**"
      - "packages/trappoint-migrate/**"
      - "verticals/mainline/db/**"
      - "spec/conformance/**"
      - ".github/workflows/schema.yml"
      - "compose.yaml"
  push:
    # `master`, not `main` — the default branch of this repository, measured
    # 2026-08-10 with `gh repo view --json defaultBranchRef`. `main` does not exist,
    # so this trigger had never fired once. See claims.yml for the full note. The
    # `schedule:` below was already reaching `master`, because GitHub fires cron
    # triggers from the DEFAULT branch only — which is why this lane had scheduled
    # runs and no push runs.
    branches: [master]
  schedule:
    # Nightly, because the full matrix is the long form: CI runs it on every PR that
    # touches the schema, and this catches the case where nothing touched the schema and
    # the platform moved underneath it.
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-${{ github.ref }}
  cancel-in-progress: false

env:
  # The corpus reads these exactly as `trappoint-conform` does, so a developer who can run
  # the CLI can run the suite with nothing else to configure.
  TRAPPOINT_PROFILE: trappoint-ref
  PYTHONIOENCODING: utf-8

jobs:
  producers:
    name: every object the reference vertical references has a producer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Every REFERENCES target in the reference vertical must be created by it
        # Hermetic: no container, no uv, no network. Reads the same .sql files the runner
        # applies and answers the question the runner can only answer one refusal at a
        # time, because `trappoint migrate up` stops at its first REFUSED.
        #
        # Deliberately narrow. It matches `REFERENCES trappoint_ref.<table>` and nothing
        # else — not FROM, not JOIN, not a function body — because a foreign key is the one
        # construct whose target must exist at APPLY time and whose absence is therefore
        # exactly the 42P01 the lane already gets. A wider scan would be a different check
        # with different false positives, and this one has to be trustworthy enough that
        # its message can be read as a work item.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          SQL = pathlib.Path("packages/trappoint-sql/refvertical/sql")
          MAINLINE_TWIN = {
              "event": "verticals/mainline/db/migrations/0033_event.sql",
              "clause": "verticals/mainline/db/migrations/0028_clause.sql",
          }

          create = re.compile(
              r"CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?trappoint_ref\.([a-z_][a-z0-9_]*)",
              re.IGNORECASE,
          )
          reference = re.compile(
              r"REFERENCES\s+trappoint_ref\.([a-z_][a-z0-9_]*)", re.IGNORECASE
          )

          produced: dict[str, str] = {}
          consumed: dict[str, list[str]] = {}
          for path in sorted(SQL.glob("*.sql")):
              text = path.read_text(encoding="utf-8", errors="ignore")
              body = "\n".join(
                  line for line in text.splitlines() if not line.lstrip().startswith("--")
              )
              for table in create.findall(body):
                  produced.setdefault(table.lower(), path.stem)
              for table in reference.findall(body):
                  consumed.setdefault(table.lower(), []).append(path.stem)

          missing = {t: c for t, c in sorted(consumed.items()) if t not in produced}
          print(f"reference vertical: {len(produced)} tables created, "
                f"{len(consumed)} referenced, {len(missing)} with no producer")

          if not missing:
              print("every REFERENCES target has a producer")
              sys.exit(0)

          print("::error title=MISSING PRODUCER in the reference vertical::"
                f"{len(missing)} object(s) referenced by "
                "packages/trappoint-sql/refvertical/sql and created by nothing: "
                + ", ".join(f"trappoint_ref.{t}" for t in missing))

          for table, consumers in missing.items():
              twin = MAINLINE_TWIN.get(table, "(no MAINLINE twin identified)")
              print("::error::"
                    f"MISSING PRODUCER: trappoint_ref.{table} -- "
                    f"consumed by {', '.join(consumers)} (FOREIGN KEY target) -- "
                    "expected: a CREATE TABLE migration in "
                    "packages/trappoint-sql/refvertical/sql/ -- "
                    f"MAINLINE twin that already exists: {twin} -- "
                    "owner: KERNEL domain, docs/leads/kernel.md 1.1 "
                    "(the reference vertical ships inside packages/trappoint-sql/refvertical/)")

          print()
          print("=" * 88)
          print("THE SCHEMA LANE IS RED BECAUSE THE PRODUCT IS INCOMPLETE, NOT BECAUSE CI IS BROKEN")
          print("=" * 88)
          for table, consumers in missing.items():
              cited = ", ".join(consumers)
              twin = MAINLINE_TWIN.get(table, "(none identified)")
              for line in (
                  "",
                  f"  MISSING PRODUCER : trappoint_ref.{table}",
                  f"  consumed by      : {cited}  (REFERENCES trappoint_ref.{table})",
                  f"  expected at      : packages/trappoint-sql/refvertical/sql/<nnnn>_{table}.sql",
                  f"  MAINLINE twin    : {twin}",
                  "  template         : none. packages/trappoint-sql/templates/ carries",
                  "                     0059_subject_event.sql.j2 (the per-subject event tables)",
                  "                     and 0052_subject_clause.sql.j2 (the per-subject clause",
                  "                     link tables). Neither renders the base table, so a",
                  "                     producer needs a new template or a hand-authored file.",
                  "  owner            : KERNEL domain - docs/leads/kernel.md 1.1, which decides",
                  "                     that the kernel ships a reference vertical alongside the",
                  "                     MAINLINE binding from day one, inside",
                  "                     packages/trappoint-sql/refvertical/.",
                  "  what it is NOT   : a CI defect. It must not be closed by narrowing the",
                  "                     matrix, skipping the job or dropping the foreign key.",
                  "                     Two bindings that both render is the entire substrate",
                  "                     claim; one binding is a template engine with an",
                  "                     audience of one.",
              ):
                  print(line)
          print()
          print("The container jobs below reach only the FIRST of these, because "
                "`trappoint migrate up` stops at its first REFUSED. That is why this job "
                "exists: the run log otherwise names one missing producer at a time.")
          sys.exit(1)
          PY

  unweld:
    name: unwelding matrix (serial, disposable cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned CockroachDB image out of compose.yaml
        id: image
        # One constant, one place. The line is tagged `trappoint:crdb-image-pin` in
        # compose.yaml and this is the only reader in this workflow.
        run: |
          set -euo pipefail
          image="$(grep -A1 'trappoint:crdb-image-pin' compose.yaml | tail -n1 | sed 's/.*image: *//')"
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "pinned image: $image"

      - name: Start a cluster this job is allowed to break
        run: |
          set -euo pipefail
          docker run -d --name trappoint-unweld-ci \
            -p 127.0.0.1:26399:26257 \
            "${{ steps.image.outputs.image }}" \
            start-single-node --insecure --store=type=mem,size=2GiB
          for _ in $(seq 1 60); do
            if docker exec trappoint-unweld-ci ./cockroach sql --insecure \
                 --host=127.0.0.1:26257 --execute='SELECT 1' >/dev/null 2>&1; then
              echo "cluster up"; exit 0
            fi
            sleep 2
          done
          echo "the disposable cluster never answered SQL"; docker logs trappoint-unweld-ci; exit 1

      - name: Make local behaviour Cloud-truthful
        # F2: gc.ttlseconds is 4500 on Cloud Basic and 14400 locally. Local is MORE
        # PERMISSIVE than production, so a time-travel assertion that passes here can fail
        # there. Standing rule: where local and Cloud differ, configure local to the
        # stricter value. CF-46 reads this back and asserts against it.
        run: |
          docker exec trappoint-unweld-ci ./cockroach sql --insecure --host=127.0.0.1:26257 \
            --execute="ALTER RANGE default CONFIGURE ZONE USING gc.ttlseconds = 4500"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --all-packages

      - name: Apply the reference vertical
        env:
          TRAPPOINT_UNWELD_DSN: postgresql://root@127.0.0.1:26399/defaultdb?sslmode=disable
        # The database is the authority: this is the step that observes CockroachDB
        # refusing, and the `producers` job above is only a reading of the same files. What
        # changed on 2026-08-10 is that a refusal is now CLASSIFIED here rather than left as
        # a raw SQLSTATE for a reader to interpret. The step still exits non-zero, always.
        run: |
          set -euo pipefail
          uv run --package trappoint-migrate trappoint migrate bootstrap \
            --dsn "$TRAPPOINT_UNWELD_DSN"

          log="$RUNNER_TEMP/refvertical-migrate.log"
          if uv run --package trappoint-migrate trappoint migrate up \
               --dsn "$TRAPPOINT_UNWELD_DSN" --tree trappoint-ref \
               --migrations packages/trappoint-sql/refvertical/sql 2>&1 | tee "$log"; then
            echo "the reference vertical applied clean"
            exit 0
          fi

          object="$(sed -n 's/.*relation "\(trappoint_ref\.[a-z_][a-z0-9_]*\)" does not exist.*/\1/p' "$log" | head -n1)"
          consumer="$(sed -n 's/.*REFUSED: \([0-9a-zA-Z_]*\):.*/\1/p' "$log" | head -n1)"

          if [ -n "$object" ]; then
            echo "::error title=MISSING PRODUCER in the reference vertical::${object} is referenced by ${consumer} and created by no file in packages/trappoint-sql/refvertical/sql. Owner: KERNEL domain, docs/leads/kernel.md 1.1"
            cat <<EOF

          ========================================================================================
          MISSING PRODUCER -- the reference vertical, not MAINLINE
          ========================================================================================
            object     : ${object}
            consumer   : ${consumer}  (FOREIGN KEY target, so it must exist at APPLY time)
            tree       : packages/trappoint-sql/refvertical/sql   (--tree trappoint-ref)
            expected   : a CREATE TABLE migration in that directory. The MAINLINE binding's
                         twins already exist -- verticals/mainline/db/migrations/0033_event.sql
                         and 0028_clause.sql -- and there is no template in
                         packages/trappoint-sql/templates/ that renders either base table.
            owner      : KERNEL domain -- docs/leads/kernel.md 1.1, which ships the reference
                         vertical "alongside the MAINLINE binding, from day one, inside
                         packages/trappoint-sql/refvertical/".
            status     : RED ON PURPOSE. This is product incompleteness. It is not closed by
                         continue-on-error, by dropping the foreign key, or by removing the
                         reference vertical from this lane. See the 'producers' job in this
                         workflow for the FULL list -- migrate stops at its first refusal and
                         there is more than one.
          ========================================================================================
          EOF
          else
            echo "::error title=the reference vertical refused, unclassified::trappoint migrate up failed for a reason this step does not recognise. The log is below; classify it here rather than leaving the next reader with a bare exit code."
            echo "---- trappoint migrate up ----"
            cat "$log"
            echo "------------------------------"
          fi
          exit 1

      - name: Unwelding matrix
        env:
          TRAPPOINT_UNWELD_DSN: postgresql://root@127.0.0.1:26399/defaultdb?sslmode=disable
          TRAPPOINT_UNWELD_PROFILE: trappoint-ref
        # -p no:xdist  — one probe's DROP CONSTRAINT is another probe's silent unwelding.
        # -p no:randomly — the matrix restores what it removed; a shuffle can interleave a
        #                  removal with its own restoration.
        # -m schema    — this job runs the mutating suites and nothing else.
        run: |
          uv run --package trappoint-conformance pytest \
            packages/trappoint-conformance/unweld \
            -m schema -p no:xdist -p no:randomly -q

      - name: The refusal-depth matrix must be committed and current
        # The generated artefact is part of the assurance pack, so a run that changed it
        # and did not commit it is a run whose published matrix describes a schema that no
        # longer exists.
        run: |
          set -euo pipefail
          if ! git diff --quiet -- packages/trappoint-conformance/REFUSAL_DEPTH.md; then
            echo "::error::REFUSAL_DEPTH.md changed. The unwelding matrix measured something"
            echo "::error::different from what is committed. Commit the regenerated file."
            git --no-pager diff -- packages/trappoint-conformance/REFUSAL_DEPTH.md
            exit 1
          fi

      - name: Publish the matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refusal-depth-matrix
          path: packages/trappoint-conformance/REFUSAL_DEPTH.md
          if-no-files-found: warn

      - name: Destroy the cluster
        if: always()
        # `|| true` is banned repository-wide and a teardown is not the exception: it is
        # where the token is least visible and most costly, because a container that will
        # not die is a runner that leaks and a `|| true` is how nobody finds out. Ask
        # whether it exists; let a removal that genuinely fails, fail.
        run: |
          set -euo pipefail
          if docker ps -a --format '{{.Names}}' | grep -qx trappoint-unweld-ci; then
            docker rm -f trappoint-unweld-ci
          else
            echo "no container named trappoint-unweld-ci; nothing to destroy"
          fi

  gate-source:
    name: the self-attesting gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned CockroachDB image out of compose.yaml
        id: image
        run: |
          set -euo pipefail
          image="$(grep -A1 'trappoint:crdb-image-pin' compose.yaml | tail -n1 | sed 's/.*image: *//')"
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Start a cluster
        run: |
          set -euo pipefail
          docker run -d --name trappoint-gatesrc-ci \
            -p 127.0.0.1:26401:26257 \
            "${{ steps.image.outputs.image }}" \
            start-single-node --insecure --store=type=mem,size=2GiB
          for _ in $(seq 1 60); do
            if docker exec trappoint-gatesrc-ci ./cockroach sql --insecure \
                 --host=127.0.0.1:26257 --execute='SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "the cluster never answered SQL"; exit 1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --all-packages

      - name: Apply the reference vertical
        env:
          LOCAL_DSN: postgresql://root@127.0.0.1:26401/defaultdb?sslmode=disable
        # Same classification as the `unweld` job. Duplicated rather than factored out
        # because GitHub Actions has no YAML anchors and a shared script under scripts/
        # would be a second place to look for the sentence a reader needs in the log.
        run: |
          set -euo pipefail
          uv run --package trappoint-migrate trappoint migrate bootstrap --dsn "$LOCAL_DSN"

          log="$RUNNER_TEMP/refvertical-migrate.log"
          if uv run --package trappoint-migrate trappoint migrate up \
               --dsn "$LOCAL_DSN" --tree trappoint-ref \
               --migrations packages/trappoint-sql/refvertical/sql 2>&1 | tee "$log"; then
            echo "the reference vertical applied clean"
            exit 0
          fi

          object="$(sed -n 's/.*relation "\(trappoint_ref\.[a-z_][a-z0-9_]*\)" does not exist.*/\1/p' "$log" | head -n1)"
          consumer="$(sed -n 's/.*REFUSED: \([0-9a-zA-Z_]*\):.*/\1/p' "$log" | head -n1)"

          if [ -n "$object" ]; then
            echo "::error title=MISSING PRODUCER in the reference vertical::${object} is referenced by ${consumer} and created by no file in packages/trappoint-sql/refvertical/sql. Owner: KERNEL domain, docs/leads/kernel.md 1.1"
            cat <<EOF

          ========================================================================================
          MISSING PRODUCER -- the reference vertical, not MAINLINE
          ========================================================================================
            object     : ${object}
            consumer   : ${consumer}  (FOREIGN KEY target, so it must exist at APPLY time)
            tree       : packages/trappoint-sql/refvertical/sql   (--tree trappoint-ref)
            expected   : a CREATE TABLE migration in that directory. The MAINLINE binding's
                         twins already exist -- verticals/mainline/db/migrations/0033_event.sql
                         and 0028_clause.sql -- and there is no template in
                         packages/trappoint-sql/templates/ that renders either base table.
            owner      : KERNEL domain -- docs/leads/kernel.md 1.1, which ships the reference
                         vertical "alongside the MAINLINE binding, from day one, inside
                         packages/trappoint-sql/refvertical/".
            status     : RED ON PURPOSE. The self-attesting gate cannot compare a snapshot of a
                         gate that was never created. See the 'producers' job for the full list.
          ========================================================================================
          EOF
          else
            echo "::error title=the reference vertical refused, unclassified::trappoint migrate up failed for a reason this step does not recognise. The log is below; classify it here rather than leaving the next reader with a bare exit code."
            echo "---- trappoint migrate up ----"
            cat "$log"
            echo "------------------------------"
          fi
          exit 1

      - name: The gate's own source must match the committed snapshot
        env:
          LOCAL_DSN: postgresql://root@127.0.0.1:26401/defaultdb?sslmode=disable
        # This is the step whose failure message is meant to be read rather than silenced:
        # the text the database will execute the next time somebody merges a permit is not
        # the text the last reviewer read.
        run: |
          uv run --package trappoint-conformance pytest \
            packages/trappoint-conformance/tests/test_gate_source_snapshot.py -q

      - name: Destroy the cluster
        if: always()
        # See the note on the same step in `unweld`: no `|| true` in a teardown either.
        run: |
          set -euo pipefail
          if docker ps -a --format '{{.Names}}' | grep -qx trappoint-gatesrc-ci; then
            docker rm -f trappoint-gatesrc-ci
          else
            echo "no container named trappoint-gatesrc-ci; nothing to destroy"
          fi

  coverage-artefacts:
    name: anomaly coverage and manifest totality (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --all-packages

      - name: Totality, taxonomy, raise-site grounding and A1-A14 coverage
        # No cluster. These are the guards against a suite that shrinks silently, and they
        # belong in the fastest job because the fastest job is the one nobody skips.
        run: |
          uv run --package trappoint-conformance pytest \
            packages/trappoint-conformance/tests/test_manifest_totality.py \
            packages/trappoint-conformance/tests/test_taxonomy_totality.py \
            packages/trappoint-conformance/tests/test_raise_sites.py \
            packages/trappoint-conformance/tests/test_anomaly_coverage.py \
            packages/trappoint-conformance/unweld/test_unweld.py::test_restoration_matches_the_migration \
            -q -m "not db and not schema"

      - name: ANOMALY_COVERAGE.md must be committed and current
        run: |
          set -euo pipefail
          if ! git diff --quiet -- packages/trappoint-conformance/ANOMALY_COVERAGE.md; then
            echo "::error::ANOMALY_COVERAGE.md is stale. Regenerate and commit it."
            git --no-pager diff -- packages/trappoint-conformance/ANOMALY_COVERAGE.md
            exit 1
          fi
