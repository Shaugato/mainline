# SPDX-License-Identifier: Apache-2.0
#
# THE CUSTODY CHAIN LANE — K2, in the order the proofs depend on each other.
#
# `docs/leads/custody.md` §1.4 fixes the proof order and this file is that order made
# executable: canonical bytes before hashes (a hash of bytes nobody can reproduce is not
# evidence) -> tree before signature (signing a root you cannot prove inclusion into is
# theatre) -> signature before anchor (anchoring an unsigned root anchors nothing) ->
# verifier before ledger content (the verifier is the specification's executable form) ->
# attack matrix last (an attack harness is only meaningful against a complete defence).
#
# Two steps in this file are the ones that would be embarrassing to lose:
#
#   * `tier-1-clean-venv` installs NOTHING but `cryptography` and verifies the committed
#     reference bundle. That is the sentence the whole domain exists to make true, tested
#     as a fact rather than asserted as a promise. It does not use `uv sync`, does not put
#     the workspace on `sys.path`, and fails if either would have been needed.
#   * `nemesis` runs fifteen attacks against a disposable CockroachDB and regenerates
#     `evidence/CUSTODY_ATTACK_MATRIX.md` from the RUN. CI fails if any executed attack was
#     detected by zero checks; it FLAGS, and does not fail, an attack detected by exactly
#     one.
#
# NOT NAMED `custody.yml`: the kernel lead owns the eight base workflows and a ninth with a
# colliding name is a merge conflict waiting for the worst possible moment.
#
# No AWS account and no CockroachDB Cloud organisation is used anywhere in this file. Every
# cluster it touches is a container it started and will delete. That is PL-1, and it is why
# a stranger can reproduce this lane on a laptop.
#
# READING THIS LANE'S LOGS — a trap that cost a real misdiagnosis on 2026-08-10.
# GitHub echoes each `run:` block's ENTIRE SOURCE into the log under its `##[group]Run`
# header, before executing a single line of it. So every `::error …` string written inside
# a conditional branch below appears in the log of a run in which that branch never
# executed. Run 31372088425 was read that way and reported as
# "check_chain_fn_matches_spec.py absent"; the script is tracked, it ran, and it found a
# genuine spec drift. Every such message in this file now begins "PRINTED ONLY WHEN …" so
# that source and output cannot be confused again. `##[group]Run` = source. Everything
# after the group header = output.

name: custody-chain

on:
  push:
    branches: [master]
    paths:
      - "packages/trappoint-jcs/**"
      - "packages/trappoint-ledger/**"
      - "packages/trappoint-verify/**"
      - "spec/custody/**"
      - "spec/wire/checkpoint.md"
      - "spec/wire/evidence-bundle.md"
      - "spec/wire/receipt.md"
      - "evidence/reference-ledger/**"
      - "scripts/custody/**"
      - "tests/integration/custody/**"
      - "infra/policy/custody/**"
      # CU-9's A1 diffs 0105/0106 and A2 diffs 0125/0126 against spec/custody, and
      # `policy-and-spec` now applies the whole chain to a disposable node so that A3/A4
      # can read a live catalogue. A migration edit that this lane did not see is exactly
      # the drift the lane exists to catch, so the whole tree is a trigger, and so is the
      # runner that applies it and the file the image pin is read out of.
      - "verticals/mainline/db/migrations/**"
      - "packages/trappoint-migrate/**"
      - "compose.yaml"
      - "uv.lock"
      - ".github/workflows/custody-chain.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custody-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  FORCE_COLOR: "1"

jobs:
  # =====================================================================================
  # 1 · CANONICAL BYTES, THEN HASHES, THEN THE OFFLINE VERIFIER
  # =====================================================================================
  algebra-and-verifier:
    name: canon vectors · merkle properties · verifier floor · vendoring equality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the workspace from the one lockfile
        run: uv sync --frozen

      # RFC 8785 first. Every hash below is a hash OF these bytes, so a canonicaliser that
      # is wrong makes every green result underneath it meaningless.
      - name: JCS test vectors (canon_v1, ES6 numbers, the float ban)
        run: uv run pytest packages/trappoint-jcs -q

      - name: RFC 6962 merkle — vectors and properties
        run: uv run pytest packages/trappoint-ledger -q

      # CU-8 / §1.4a. The one-dependency claim dies the moment the vendored canonicaliser
      # drifts from the one the sequencer used, so the equality is a byte comparison rather
      # than a promise, and the registry pins every canonicaliser ever shipped.
      - name: Vendored canonicaliser is byte-identical to the shipped one
        run: uv run python scripts/custody/check_vendored_canon.py

      # CU-7. "Requires no cooperation from us" must be a 200 ms test.
      - name: Verifier dependency floor and no-network guarantee
        run: |
          set -euo pipefail
          if [ -d packages/trappoint-verify ]; then
            uv run pytest packages/trappoint-verify -q
          else
            echo "::error title=trappoint-verify absent::PRINTED ONLY WHEN \
            packages/trappoint-verify is missing from the checkout — if you are reading \
            this inside a ##[group]Run header it is source, not output. The package has \
            not landed, so checks 1-16 are unimplemented and the reference bundle has no \
            verifier. RED on purpose: a lane that passed here would be green by absence."
            exit 1
          fi

  # =====================================================================================
  # 2 · THE REFERENCE BUNDLE — ZERO-DIFF REGENERATION, THEN TIER 1
  # =====================================================================================
  reference-bundle:
    name: reference bundle regenerates to zero diff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen

      # CU-6, mirroring `trappoint render --check`. A fixture a stranger cannot regenerate
      # is a screenshot; a fixture that regenerates differently every time has no
      # "ordinarily" to appeal to under Evidence Act 1995 (Cth) ss.146-147.
      - name: Regeneration is a no-op
        run: uv run python scripts/custody/regen_reference_ledger.py --check

      - name: The bundle carries what the K2 criteria name
        run: |
          uv run python - <<'PY'
          import json, pathlib
          bundle = json.loads(pathlib.Path("evidence/reference-ledger/bundle.json").read_text())
          required = {
              "leaves": 64, "checkpoints": 2, "consistency_proofs": 1,
              "inclusion_proofs": 1, "receipts": 1, "schema_attestations": 1,
              "closure_generations": 1, "webauthn_assertions": 1,
          }
          for section, minimum in required.items():
              count = len(bundle[section])
              assert count >= minimum, f"{section}: {count} < {minimum}"
              print(f"{section}: {count}")
          sizes = [c["tree_size"] for c in bundle["checkpoints"]]
          pairs = {(p["from_size"], p["to_size"]) for p in bundle["consistency_proofs"]}
          missing = [p for p in zip(sizes, sizes[1:]) if p not in pairs]
          assert not missing, f"consecutive checkpoint pairs with no consistency proof: {missing}"
          assert all(t["token_b64"] for c in bundle["checkpoints"] for t in c["tsa_tokens"])
          print("every consecutive checkpoint pair carries a consistency proof")
          PY

  # =====================================================================================
  # 3 · TIER 1 — A CLEAN VENV HOLDING ONLY `cryptography`
  # =====================================================================================
  tier-1-clean-venv:
    name: a stranger verifies the bundle with cryptography and nothing else
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [reference-bundle]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Deliberately NOT `uv sync`. This job models a person who received one JSON file and
      # was told they need Python and `cryptography`. If anything in the workspace is
      # required for the bundle to verify, this job is where that becomes visible.
      - name: A venv with exactly one dependency
        run: |
          set -euo pipefail
          python -m venv /tmp/stranger
          /tmp/stranger/bin/pip install --quiet --upgrade pip
          /tmp/stranger/bin/pip install --quiet cryptography
          echo "--- installed distributions ---"
          /tmp/stranger/bin/pip list --format=freeze

      - name: Install trappoint-verify from source, with no workspace on the path
        run: |
          set -euo pipefail
          if [ ! -d packages/trappoint-verify ]; then
            echo "::error title=Tier 1 cannot be tested::PRINTED ONLY WHEN \
            packages/trappoint-verify is missing from the checkout — if you are reading \
            this inside a ##[group]Run header it is source, not output. Without it, 'a \
            stranger verifies the bundle offline with no credential' is UNPROVEN by this \
            run. Reported as a failure rather than a skip, because this is the deliverable \
            sentence of the custody domain."
            exit 1
          fi
          /tmp/stranger/bin/pip install --quiet --no-deps ./packages/trappoint-verify

      - name: Verify the committed bundle, offline
        # `grep -q "0 findings"` used to be the assertion here and it was DEAD TEXT. Measured
        # 2026-08-10, run 31372088425: the verifier's summary line is
        # `16 checks | 9 passed | 0 failed | 7 not checked`, followed by
        # `exit 2: everything that ran held, and 7 check(s) did not run.` It has never
        # printed the string "0 findings". Today that is invisible, because `pipefail`
        # makes the verifier's exit 2 kill the step before the grep runs — but the moment
        # checks 4-8/11/12 land and the verifier exits 0, this step would have gone red on
        # a string that does not exist, and the red would have been read as custody's.
        #
        # The replacement asserts what the verifier actually prints, and asserts MORE than
        # the old line did: `0 failed` was implied by the exit code, `0 not checked` was
        # asserted nowhere. That second one is the anti-vacuity half — a bundle over which
        # seven of sixteen checks did not run is not a verified bundle, and this step is
        # the sentence "a stranger verifies it offline" made executable.
        #
        # RULING R3 — an intentional red must name its missing artefact and its owner.
        # This lane is RED ON PURPOSE and stays red until the seven cryptographic check
        # modules exist. A red whose entire content is that a number was short teaches a
        # judge nothing, so the failure now NAMES every check that did not run, the module
        # file and the test file each one needs, the registry's own status and target, and
        # `owner=verify-crypto`. That list is NOT written out here. It is read out of the
        # same registry, in the same interpreter, that the run above just used — so it
        # cannot describe a different run than the one it is explaining, and it refuses to
        # print at all if the count it derives disagrees with the count the verifier
        # printed. A hand-written list of seven ids would be seven more literals to go
        # stale the moment a module lands.
        #
        # The verifier's exit status is CAPTURED, not swallowed. `set -e` plus `pipefail`
        # killed this step on the verifier's own exit 2 before a single line below it ran,
        # which is precisely why this lane has never explained itself: the two `::error`
        # blocks it already carried were unreachable. An `if` CONDITION is exempt from
        # `set -e` by definition — the same idiom, and the same reasoning, as the
        # dependency-floor step below — so the status is read and acted on. Every path out
        # of this step that is not a clean verification still exits non-zero. There is no
        # `continue-on-error`, no `|| true`, and no check is marked implemented that is not.
        run: |
          set -euo pipefail
          cd /tmp    # nothing of ours is importable from here except what pip installed
          bundle="${GITHUB_WORKSPACE}/evidence/reference-ledger/bundle.json"
          if /tmp/stranger/bin/trappoint-verify verify --bundle "${bundle}" | tee out.txt; then
            status=0
          else
            status=$?
          fi
          echo "the verifier exited ${status}"

          if ! summary="$(grep -E '^[0-9]+ checks \|' out.txt)"; then
            echo "::error title=the verifier printed no summary line::PRINTED ONLY WHEN \
            the run produced no '<n> checks | …' line at all — if you are reading this \
            inside a ##[group]Run header it is source, not output. The verifier exited \
            ${status}. Without that line this step cannot tell a clean verification from \
            a silent one, so it refuses rather than guessing."
            exit 1
          fi
          echo "summary line: ${summary}"

          if ! printf '%s' "${summary}" | grep -q '| 0 failed |'; then
            echo "::error title=the reference bundle does not verify::PRINTED ONLY WHEN a \
            check FAILED — if you are reading this inside a ##[group]Run header it is \
            source, not output. Summary: ${summary}"
            exit 1
          fi

          if printf '%s' "${summary}" | grep -q '| 0 not checked'; then
            if [ "${status}" -ne 0 ]; then
              echo "::error title=a clean summary with a non-zero exit::PRINTED ONLY WHEN \
              the summary line reports nothing failed and nothing unchecked and the \
              verifier still exited non-zero — if you are reading this inside a \
              ##[group]Run header it is source, not output. Exit ${status}, summary: \
              ${summary}. One of the two is wrong and this step will not pick the \
              flattering one."
              exit 1
            fi
            echo "the bundle verifies offline: nothing failed and nothing went unchecked"
            exit 0
          fi

          # Not clean. Name every check that did not run, and what each one is waiting for.
          /tmp/stranger/bin/python - "${summary}" <<'PY'
          import os
          import re
          import sys

          from trappoint_verify.checks import CHECK_IDS, load_all, registered, spec_for

          SOURCE_ROOT = "packages/trappoint-verify/src/"

          summary = sys.argv[1]
          load_report = load_all()
          why = {entry.module: entry.reason for entry in load_report.missing()}
          unchecked = [check_id for check_id in CHECK_IDS if check_id not in registered()]

          # Anti-vacuity for the explanation itself: this block runs in the same process
          # state the verifier ran in, so the count it derives and the count the verifier
          # printed must agree. If they do not, the explanation would be about some other
          # run, and a confident wrong list is worse than no list.
          printed = re.search(r"\|\s*(\d+) not checked", summary)
          if printed is None or int(printed.group(1)) != len(unchecked):
              print(
                  f"::error title=the explanation does not match the run::the summary line "
                  f"reads {summary!r} but this registry reports {len(unchecked)} check(s) "
                  f"with no runner bound. The per-check explanation is withheld rather than "
                  f"printed about a different run."
              )
              raise SystemExit(1)

          def source_file(dotted: str) -> str:
              """`trappoint_verify.checks.tsa` -> the path the module has to appear at."""
              return SOURCE_ROOT + dotted.replace(".", "/") + ".py"

          owners = sorted({spec_for(check_id).owner for check_id in unchecked})
          ids = ", ".join(str(check_id) for check_id in unchecked)
          print(
              f"::error title=custody: {len(unchecked)} of {len(CHECK_IDS)} checks have no "
              f"implementation::PRINTED ONLY WHEN a check has no runner bound — if you are "
              f"reading this inside a ##[group]Run header it is source, not output. Checks "
              f"{ids} did not run. Owner: {'; '.join(owners)}. This lane is RED ON PURPOSE "
              f"and stays red until the modules named in the annotations below exist. "
              f"Nothing is skipped, excused or ratcheted to conceal it."
          )

          detail = []
          for check_id in unchecked:
              spec = spec_for(check_id)
              module_file = source_file(spec.module)
              # ImportError stringifies as "cannot import name 'tsa' from
              # 'trappoint_verify.checks' (<abspath of the PARENT package's __init__>)".
              # That path is the runner's temporary venv and it is the wrong file anyway,
              # so it is dropped; `module_file` above is the artefact actually wanted.
              reason = why.get(spec.module, "the module imported but registered no runner")
              reason = reason.split(" (", 1)[0]
              detail.append((check_id, spec, module_file, reason))
              print(
                  f"::error title=check {check_id} {spec.name} is unimplemented::NEEDS "
                  f"{module_file} (import said: {reason}) and {spec.test}. Registry says "
                  f"status={spec.status}, target={spec.target_status}, owner={spec.owner}. "
                  f"It would have proved: {spec.proves}"
              )

          print("")
          print(f"{len(unchecked)} of {len(CHECK_IDS)} custody checks did not run:")
          print("")
          for check_id, spec, module_file, reason in detail:
              print(f"  check {check_id:>2}  {spec.name}")
              print(f"            needs      {module_file}")
              print(f"            and        {spec.test}")
              print(
                  f"            registry   status={spec.status}, "
                  f"target={spec.target_status}, owner={spec.owner}"
              )
              print(f"            import     {reason}")
              print(f"            proves     {spec.proves}")
              print("")
          print(f"Owner of every check above: {'; '.join(owners)}.")
          print("")
          print("The checks that DID run all held, and the exit code says exactly that:")
          print("`exit 2` means everything that ran held and the rest did not run. Nine of")
          print("sixteen is the honest state of the custody domain today, and it is the")
          print("reason this lane is red. It goes green when the modules above exist — not")
          print("when a threshold is lowered.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(
                  f"## custody: {len(unchecked)} of {len(CHECK_IDS)} checks did not run\n\n"
              )
              handle.write("| check | name | module it needs | test it needs | registry | owner |\n")
              handle.write("|---|---|---|---|---|---|\n")
              for check_id, spec, module_file, _reason in detail:
                  handle.write(
                      f"| {check_id} | `{spec.name}` | `{module_file}` | `{spec.test}` | "
                      f"{spec.status} → {spec.target_status} | `{spec.owner}` |\n"
                  )
              handle.write(
                  "\nRed on purpose. This table is read from the verifier's own registry at "
                  "run time, so it cannot go stale, and the lane goes green when these "
                  "modules exist.\n"
              )
          PY
          exit 1

      - name: Confirm the floor is exactly one dependency
        # SC2015, reported by actionlint on 2026-08-10 against line 198 of this file as it
        # stood before this commit. The old spelling was
        #
        #     pip list … | grep -viE '…' && { echo "::error::…"; exit 1; } || true
        #
        # `grep -v` exits 1 when it matches NOTHING, which here is the SUCCESS case, so
        # under `set -euo pipefail` the pipeline had to be made non-fatal. `|| true` did
        # that by making the WHOLE construct non-fatal, and shellcheck's note is the least
        # of it. MEASURED 2026-08-10 by running the old line against three stub `pip`s:
        #
        #   * pip exits 2 without listing anything -> pipefail yields grep's 1, `&&` short
        #     circuits, `|| true` yields 0, and the step prints "dependency floor holds"
        #     and passes. NOTHING WAS CHECKED and the log said the floor held;
        #   * `pipdeptree` installed -> the pattern was a bare prefix, `^(pip|…` matched
        #     `pipdeptree`, and a real extra distribution was admitted, green.
        #
        # Both now refuse. So this was never only a lint finding: it was a control that
        # reported a property it had not measured, which is the one thing this repository
        # says it will not ship.
        #
        # An `if` CONDITION is exempt from `set -e` by definition, so the explicit form
        # below needs no swallowing at all. The only `|| true` left in this file is the one
        # quoted in this comment block, which is YAML that no shell ever sees. The pip
        # invocation is hoisted out of the condition so that a pip failure is fatal rather
        # than being read as "grep found nothing": with `pipefail`, a pip that exits 2 and a
        # grep that exits 1 yield a pipeline status of 1, which the `if` would have read as
        # a clean floor.
        run: |
          set -euo pipefail
          # `pip list --format=freeze` prints `name==version`, or `name @ file:///…` for a
          # distribution installed from a path. The boundary group after the alternation is
          # what stops `pip` from also matching a hypothetical `pipdeptree`: the old
          # pattern was a bare prefix match and would have let one through.
          floor='^(pip|setuptools|wheel|cffi|pycparser|cryptography|trappoint-verify)([=@ ]|$)'
          installed="$(/tmp/stranger/bin/pip list --format=freeze)"
          echo "--- installed distributions ---"
          printf '%s\n' "${installed}"
          if extra="$(printf '%s\n' "${installed}" | grep -viE "${floor}")"; then
            echo "::error title=dependency floor broken::PRINTED ONLY WHEN a distribution \
            outside the allowed set is installed — if you are reading this inside a \
            ##[group]Run header it is source, not output. CU-7 promises a stranger needs \
            Python and cryptography; each name below is one more thing they would have to \
            install, and the promise is false until it is gone."
            printf '%s\n' "${extra}"
            exit 1
          fi
          echo "dependency floor holds: nothing outside the allowed set is installed"

  # =====================================================================================
  # 4 · THE SEQUENCER'S CONCURRENCY PROOF, AGAINST A REAL CLUSTER
  # =====================================================================================
  sequencer-concurrency:
    name: dense, fork-free append under N parallel sequencers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Read the ONE image pin out of compose.yaml
        id: image
        run: |
          set -euo pipefail
          image="$(python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("compose.yaml").read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if "trappoint:crdb-image-pin" in line:
                  for candidate in lines[i + 1 : i + 4]:
                      m = re.match(r"^\s*image:\s*(\S+)\s*$", candidate)
                      if m:
                          print(m.group(1)); raise SystemExit(0)
          raise SystemExit("compose.yaml carries no marked image pin")
          PY
          )"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Start a disposable single-node cluster
        run: |
          set -euo pipefail
          docker run -d --name crdb -p 26257:26257 "${{ steps.image.outputs.image }}" \
            start-single-node --insecure --store=type=mem,size=2GiB
          # The `… && break` this replaces fell out of the loop on the 60th failure exactly
          # as it did on the first success, and the step went green either way. pytest then
          # failed on a connection refusal, which reads like a test defect and is not one.
          for attempt in $(seq 1 60); do
            if docker exec crdb ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              echo "cluster answering SQL after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=the cluster never answered SQL::PRINTED ONLY WHEN the node \
          did not answer pgwire within 120 seconds — if you are reading this inside a \
          ##[group]Run header it is source, not output. The append-density proof needs a \
          real cluster and there is nothing to run it against."
          docker logs crdb | tail -50
          exit 1

      - name: The append is dense and fork-free under contention
        env:
          MAINLINE_TEST_DSN: postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable
        run: uv run pytest tests/integration/custody/test_ledger_append.py -q

  # =====================================================================================
  # 5 · ATTACK-DEPTH — LAST, BECAUSE AN ATTACK HARNESS NEEDS A COMPLETE DEFENCE
  # =====================================================================================
  nemesis:
    name: fifteen attacks · the matrix is generated from the run
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [reference-bundle]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Read the ONE image pin out of compose.yaml
        id: image
        run: |
          set -euo pipefail
          image="$(python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("compose.yaml").read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if "trappoint:crdb-image-pin" in line:
                  for candidate in lines[i + 1 : i + 4]:
                      m = re.match(r"^\s*image:\s*(\S+)\s*$", candidate)
                      if m:
                          print(m.group(1)); raise SystemExit(0)
          raise SystemExit("compose.yaml carries no marked image pin")
          PY
          )"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Start the DISPOSABLE cluster the attacks destroy
        run: |
          set -euo pipefail
          docker run -d --name nemesis-crdb -p 26257:26257 "${{ steps.image.outputs.image }}" \
            start-single-node --insecure --store=type=mem,size=2GiB
          # See the same loop in `sequencer-concurrency`: falling out of the retries used to
          # look exactly like succeeding on the first one. An attack suite that cannot reach
          # a database detects nothing, and ATTACK-DEPTH would then fail for the wrong
          # reason — "zero detectors" when the truth is "zero attacks were executed".
          for attempt in $(seq 1 60); do
            if docker exec nemesis-crdb ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              echo "cluster answering SQL after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=the cluster never answered SQL::PRINTED ONLY WHEN the node \
          did not answer pgwire within 120 seconds — if you are reading this inside a \
          ##[group]Run header it is source, not output. The fifteen attacks have nothing \
          to attack."
          docker logs nemesis-crdb | tail -50
          exit 1

      # The conftest refuses any DSN whose host is not localhost/127.0.0.1 before opening a
      # socket. This step proves the guard is armed rather than assuming it: a nemesis suite
      # that can reach production IS a T1 attack surface.
      - name: The lane refuses a non-local DSN
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import sys, pathlib
          sys.path.insert(0, str(pathlib.Path("tests/integration/custody/nemesis").resolve()))
          from conftest import RemoteDsnRefused, refuse_remote
          for dsn in (
              "postgresql://root@ledger.prod.internal:26257/mainline",
              "postgresql://root@10.0.4.7:26257/mainline",
              "postgresql://u@free-tier.aws-ap-southeast-1.cockroachlabs.cloud:26257/defaultdb",
          ):
              try:
                  refuse_remote(dsn)
              except RemoteDsnRefused:
                  print(f"refused: {dsn}")
              else:
                  raise SystemExit(f"NOT REFUSED: {dsn}")
          refuse_remote("postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable")
          print("localhost accepted")
          PY

      - name: Execute the fifteen attacks
        env:
          MAINLINE_TEST_DSN: postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable
        run: uv run pytest tests/integration/custody/nemesis -q

      # ATTACK-DEPTH. Zero detectors fails; exactly one is flagged and printed.
      - name: Regenerate the matrix from the run and enforce ATTACK-DEPTH
        run: |
          uv run python tests/integration/custody/nemesis/matrix.py \
            --run evidence/custody-nemesis-run.json \
            --out evidence/CUSTODY_ATTACK_MATRIX.md \
            --enforce

      - name: A15 appears as a SKIP and is never silently absent
        run: |
          set -euo pipefail
          grep -q "A15" evidence/CUSTODY_ATTACK_MATRIX.md
          grep -qE "A15.*SKIP\(" evidence/CUSTODY_ATTACK_MATRIX.md
          echo "A15 is present and reported as skipped"

      - name: The K2 exit criteria, unedited
        run: uv run pytest tests/integration/custody/test_k2_exit.py -q

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: custody-attack-matrix
          path: |
            evidence/CUSTODY_ATTACK_MATRIX.md
            evidence/custody-nemesis-run.json

  # =====================================================================================
  # 6 · THE CONTROLS THAT CANNOT BE RETROFITTED, AND THE SPEC THAT MUST NOT DRIFT
  # =====================================================================================
  policy-and-spec:
    name: Object Lock policy-as-code · the chain function matches its spec
    runs-on: ubuntu-24.04
    # 10 -> 25: this job now applies the mainline migration chain, because CU-9's A3 and A4
    # read the LIVE catalogue and a job with no schema can only ever SKIP them.
    timeout-minutes: 25
    env:
      # `LOCAL_DSN` is one of the five names check_chain_fn_matches_spec.py reads, and the
      # one `trappoint migrate` reads, so the two tools below need no second spelling.
      LOCAL_DSN: postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen

      # CU-10 / GT-18. Object Lock and versioning cannot be retrofitted and backup retention
      # is set once at provisioning, so the assertion is over the OpenTofu PLAN rather than
      # over `moto`, whose Object Lock enforcement is incomplete — a green test against a
      # mock that does not enforce the thing is worse than no test.
      - name: Evidence-stack plan carries the indelible controls
        run: |
          set -euo pipefail
          if [ -f scripts/custody/check_evidence_plan.py ]; then
            uv run python scripts/custody/check_evidence_plan.py
          else
            echo "::error title=check_evidence_plan.py absent::PRINTED ONLY WHEN the file \
            is missing from the checkout — if you are reading this inside a ##[group]Run \
            header it is source, not output. CU-10's plan-JSON assertion has not landed \
            (owner: custody worker 8, anchor-and-evidence-infra). GT-18 is a one-shot and \
            this is the only thing standing between us and getting it wrong once, \
            permanently."
            exit 1
          fi

      # ── The live half of CU-9 ──────────────────────────────────────────────────────
      # Until 2026-08-10 this job ran the chain-function check with no cluster, so of its
      # eight assertions only four could execute and the run ended
      # `4 passed, 0 failed, 1 skipped · NOT CHECKED`. The skipped line was A3/A4 — the two
      # that read what the DATABASE is running, which is the half of CU-9 that a text diff
      # against a migration file cannot substitute for: a migration is what somebody wrote,
      # `pg_get_functiondef` is what the engine will execute. The three steps below exist so
      # that the skip has no cause left, and `--strict` below makes any future skip a
      # failure rather than a quieter green.
      - name: Read the ONE image pin out of compose.yaml
        id: image
        run: |
          set -euo pipefail
          image="$(python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("compose.yaml").read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if "trappoint:crdb-image-pin" in line:
                  for candidate in lines[i + 1 : i + 4]:
                      m = re.match(r"^\s*image:\s*(\S+)\s*$", candidate)
                      if m:
                          print(m.group(1)); raise SystemExit(0)
          raise SystemExit("compose.yaml carries no marked image pin")
          PY
          )"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Start the disposable node A3/A4 read
        # `--listen-addr` is DELIBERATELY ABSENT and must stay absent. Measured 2026-08-10
        # on CockroachDB v26.2.5 — the pin `compose.yaml` names and the `image` step above
        # resolves, not a coordinate restated here: `--listen-addr=0.0.0.0:26257` makes the node
        # refuse to start with `hostname of listen_addr must be "127.0.0.1" or "localhost"`,
        # and `--listen-addr=localhost:26257` binds inside the container's loopback where a
        # published port cannot reach it. The default binds where `-p` can forward.
        run: |
          set -euo pipefail
          docker run -d --name custody-spec-crdb \
            -p 127.0.0.1:26257:26257 \
            "${{ steps.image.outputs.image }}" \
            start-single-node --insecure --store=type=mem,size=2GiB
          for attempt in $(seq 1 60); do
            if docker exec custody-spec-crdb ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              echo "cluster answering SQL after ${attempt} attempt(s)"
              docker exec custody-spec-crdb ./cockroach sql --insecure -e "SELECT version()"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=the cluster never answered SQL::PRINTED ONLY WHEN the node \
          did not answer pgwire within 120 seconds — if you are reading this inside a \
          ##[group]Run header it is source, not output. A3/A4 of CU-9 read the live \
          catalogue and have nothing to read without it."
          docker logs custody-spec-crdb | tail -50
          exit 1

      - name: Apply the mainline chain, so A3/A4 have a schema to read
        # Ruling D6: `bootstrap` creates the `trappoint` bookkeeping schema outside the
        # numbered sequence, and applying the numbered files without it fails on the first
        # migration that reaches for `trappoint`. `--package trappoint-migrate` is the same
        # environment db.yml uses; the runner's only dependency is psycopg.
        #
        # `--attest final` IS LOAD-BEARING AND IS NOT THE DEFAULT. `--attest each`
        # recomputes `stable_fingerprint()` after every one of the 271 files — it takes the
        # fingerprint twice and refuses if the two disagree. Measured 2026-08-10 on
        # CockroachDB v26.2.5 — the same pin the `image` step resolves — over this exact
        # chain, with `--attest each`:
        #
        #   trappoint migrate: REFUSED: the schema fingerprint is not stable across two
        #   consecutive computations (37e2c7fdf45c2d72… then 76e2775328bede0c…).
        #
        # It halted at `0120_trg_check_project`, the first trigger migration, leaving that
        # version DIRTY. `scripts/chain/apply_chain.py` records the counterpart measurement
        # in its own budget note — `--attest final` applied all 271 files — and this lane
        # wants the SCHEMA, not a per-file attestation ledger. The record run with
        # `--attest each` belongs to that script and to the kernel domain, not here.
        # The instability itself is a finding against
        # packages/trappoint-migrate/src/trappoint_migrate/attest.py, owner: kernel.
        run: |
          set -euo pipefail
          uv run --frozen --package trappoint-migrate trappoint migrate bootstrap \
            --dsn "$LOCAL_DSN"
          # Captured rather than streamed so that a refusal can be CLASSIFIED before the
          # step dies. The step still dies — the exit code is the runner's and nothing is
          # swallowed — but a reader is told whether custody broke the chain or inherited
          # a break, which is the difference between a fix and a bug report.
          if ! uv run --frozen --package trappoint-migrate trappoint migrate up \
                 --dsn "$LOCAL_DSN" \
                 --tree mainline \
                 --migrations verticals/mainline/db/migrations \
                 --attest final > up.log 2>&1; then
            cat up.log
            if grep -q 'fingerprint is not stable' up.log; then
              echo "::error title=migrate refused on fingerprint instability::PRINTED ONLY \
              WHEN the runner refuses with the stable-fingerprint message — if you are \
              reading this inside a ##[group]Run header it is source, not output. This is \
              NOT a custody defect and not a spec drift: stable_fingerprint() in \
              packages/trappoint-migrate/src/trappoint_migrate/attest.py computes the \
              schema fingerprint twice and refuses when the two disagree, and it was \
              measured disagreeing on this tree on 2026-08-10. Owner: kernel. CU-9's A3 \
              and A4 are UNCHECKED for this run."
            else
              echo "::error title=the mainline chain did not apply::PRINTED ONLY WHEN the \
              migration runner exits non-zero — if you are reading this inside a \
              ##[group]Run header it is source, not output. The runner's own output is \
              printed above and names the file it halted on. CU-9's A3 and A4 are \
              UNCHECKED for this run."
            fi
            exit 1
          fi
          tail -20 up.log

      # CU-9. Migrations have exactly one owner, so custody SPECIFIES fn_permit_event_chain
      # and FALSIFIES it; the datamodel lead implements it. This is the falsification.
      #
      # The `if [ -f … ]` guard that used to wrap this line is GONE, and its removal is the
      # point rather than a tidy-up: the script is tracked in git, so the branch was dead,
      # and its `::error title=… absent` text — echoed into every log by the ##[group]Run
      # header — was read on 2026-08-10 as if the script were missing. It was not. It ran,
      # and it found `0105`/`0106` had drifted from spec/custody/chain-verification.md §2.
      # A missing file now fails with the interpreter's own unambiguous message.
      #
      # `--strict` promotes SKIP to failure. The three skips this check can emit are
      # enumerated in spec/custody/chain-verification.md §3.2, and the two steps above are
      # what remove their causes; the third (a role that cannot CREATE SCHEMA) cannot arise
      # for `root` on a node this job started itself. Expect `8 passed, 0 failed, 0 skipped`.
      - name: The live chain function still matches its normative spec
        run: |
          set -euo pipefail
          uv run python scripts/custody/check_chain_fn_matches_spec.py \
            --dsn "$LOCAL_DSN" --strict

      # CU-12. Evidence Act 1995 (Cth) s.69(3) and s.147(3) exclude representations prepared
      # in contemplation of a proceeding. A ledger built to be evidence is not a business
      # record, so this is an admissibility requirement rather than a style guide.
      - name: The exhibit vocabulary leads with the gate
        run: |
          set -euo pipefail
          uv run pytest tests/integration/custody/test_k2_exit.py::test_no_litigation_vocabulary -q
          if grep -rniE "split[- ]view resistan" README.md docs/ --include="*.md" \
               | grep -viE "not claim|never claim|is not|MUST NOT|until a genuinely adverse"; then
            echo "::error title=split-view resistance is claimed::PRINTED ONLY WHEN the \
            phrase appears unqualified in README.md or docs/ — if you are reading this \
            inside a ##[group]Run header it is source, not output. Quorum is q=1 over our \
            own infrastructure, which is not adverse in the legal sense."
            exit 1
          fi
          echo "vocabulary holds"

      # The file header claims every cluster this lane touches is a container it started and
      # will delete. The runner is ephemeral, so that was true by accident; here it is true
      # on purpose. Guarded rather than `docker rm -f` unguarded, because `rm -f` on a
      # container that was never created still prints `Error response from daemon: No such
      # container` to the log, and an error-shaped line in a green job is the exact defect
      # the note at the head of this file exists to stop.
      - name: Delete the disposable node
        if: always()
        run: |
          set -euo pipefail
          if [ -n "$(docker ps -aq --filter 'name=^custody-spec-crdb$')" ]; then
            docker rm -f custody-spec-crdb
            echo "custody-spec-crdb deleted"
          else
            echo "no custody-spec-crdb container exists; nothing to delete"
          fi
