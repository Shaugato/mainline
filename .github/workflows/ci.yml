# SPDX-FileCopyrightText: 2026 MAINLINE contributors
# SPDX-License-Identifier: Apache-2.0
#
# THE STATIC LANE. Everything decidable without a cluster, a credential or a network
# round trip: the lockfile, the workspace membership, format, the lint ratchet, types,
# the import contracts, licence headers, workflow syntax, and the hermetic tests.
#
# WHAT CHANGED ON 2026-08-10, AND WHY.
#
# This file used to run `uv lock --check` in one job and `uv sync --frozen
# --all-packages` in another. docs/leads/quality-repair.md §1.1 measured the lockfile:
# `[manifest] members` listed SEVEN distributions against TWENTY-SEVEN `pyproject.toml`
# files on disk. Those two jobs cannot both pass against that lockfile — so every green
# tick this workflow has ever shown for them was a tick against a workspace that had
# stopped describing this repository twenty distributions ago. The lockfile is repaired
# by a sibling worker in this wave; the job of THIS file is to make the repair stay
# repaired, which is a different and more durable thing than fixing it once.
#
# The second change is that this lane now invokes CHECKERS rather than restating their
# logic. Five of them were written in this wave — workspace membership, the ruff
# ratchet, the mypy target inventory, the import registry, REUSE compliance — and each
# one is a program a developer can run on a laptop and get the same answer CI gets. A
# guard that exists only inside a YAML `run:` block is a guard nobody can reproduce
# locally, which means it is a guard people learn to merge past.
#
# Four properties are deliberate.
#
# 1. TWELVE-MINUTE WALL-CLOCK BUDGET, per job. A guard lane that takes half an hour is
#    a guard lane people learn to merge past.
#
# 2. NETWORK EGRESS DENY-LIST, per job, policy `block`, never `audit`. This
#    repository's central claim is that no model can reach the merge gate; a CI lane
#    that may call anything is a lane that could quietly acquire one.
#
# 3. NOTHING HERE NEEDS AWS OR COCKROACHDB CLOUD. PL-1: a proof that needs a credential
#    of ours is evidence about us, not about the product. The Cloud lane is
#    `cloud-verify.yml`, it is nightly, and it skips loudly rather than passing when its
#    secret is absent.
#
# 4. THE HERMETIC TEST JOB PASSES `--crdb=none`. Measured on 2026-08-10: a full-suite
#    run started THIRTEEN private single-node CockroachDB containers concurrently, all
#    thirteen exited 7 or 8, they took the real node down with them, and the run did not
#    fail — it WEDGED, because fixtures connect with no `connect_timeout` and
#    pytest-timeout cannot interrupt a hang inside session-scoped fixture setup.
#    `--crdb=none` makes every cluster-backed test skip with the reason its own fixture
#    writes. Measured here: `pytest packages/trappoint-testkit/tests --crdb=none` ->
#    26 passed, 2 skipped, 3.62 s, with the skip reason printed.
#
# 5. THE HERMETIC TEST LANE IS TWO JOBS, NOT ONE — added 2026-08-10.
#
#    Run 31372088432 measured `47 failed, 8182 passed, 833 skipped` in a single job.
#    Roughly a third of those 47 are RED ON PURPOSE and say so in their own assertion
#    text: five `[FAIL] <gate>` lines from `tests/eval/recall/test_g4alpha_gates.py`
#    (whose `g4alpha` marker is registered in `pyproject.toml` as "observed RED by
#    design until K4"), `test_mi_ratchet.py::test_red_every_invariant_is_enforced`
#    ("21 of 30 MAINLINE invariants are still pending … This is PL-2's red case"), and
#    the `PL-2 RED, as intended.` cases across the `test_mi_*` suites.
#
#    One job that mixes those with genuine regressions has two failure modes and no way
#    to tell them apart: a reader cannot see a new break inside a wall of intended
#    breaks, and — worse — the day a declared red goes GREEN, which is the event the
#    whole PL-2 discipline exists to notice, the count simply falls and nobody is told.
#
#    So `hermetic-tests` DESELECTS the declared-red markers and `red-by-design` runs
#    exactly those and INVERTS the verdict: it fails if any of them PASSES. This is the
#    shape `db-schema.yml`'s `mi-red` job already uses. Nothing is skipped, nothing is
#    `xfail`-swallowed, no `continue-on-error` and no `|| true`: both jobs are `needs:`
#    of `summary`, both keep their exit codes, and the reds simply stop being
#    indistinguishable from regressions.
#
#    THE SPLIT WAS HALF-CONNECTED UNTIL 2026-08-10 AND IS NOW WHOLE. `RED_SELECTOR`
#    named `pl2_red`; no test carried it and `pyproject.toml` did not register it, so
#    run 31388699452 read `41 failed, 8224 passed, 833 skipped, 5 deselected` — five,
#    the g4alpha five — while eight cases that print `PL-2 RED, as intended.` failed
#    inside `hermetic-tests`, where nothing distinguishes them from a regression. The
#    marker is now registered (`pyproject.toml`, next to `g4alpha`) and applied to those
#    eight and to nothing else, and `RED_FLOOR` has risen 5 -> 13 to match.
#
#    THE ADMISSION TEST FOR THE MARKER IS THE FAILURE MESSAGE, NOT THE FILE. Every one
#    of the eight prints `PL-2 RED, as intended.` or the ratchet's "N of 30 … PL-2's red
#    case" today, measured on the pinned interpreter before the marker was applied. Two
#    further cases the tree NAMES `test_pl2_red_*` — `test_mi_spine.py::test_pl2_red_
#    mi15_bloodline_guard_does_not_exist_yet` and `test_mi_foundation.py::test_pl2_red_
#    site_projection_is_not_yet_enforced` — were measured GREEN on 2026-08-10 and are
#    deliberately NOT marked: marking a passing test would file it under "red by design"
#    and hide the transition this job exists to announce. They are reported upward
#    instead, to the suites that own them.

name: ci

on:
  push:
    # `master`, not `main`. MEASURED 2026-08-10: `gh repo view --json defaultBranchRef`
    # -> `master`; `gh run list --branch main` -> empty. The branch `main` does not
    # exist in this repository, so this trigger had NEVER FIRED ONCE — every push run
    # of this workflow in its whole history is a `pull_request` run on somebody's
    # branch. The Actions tab opens on the default branch, which means this lane's
    # green was invisible on the only page a first-time reader looks at.
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  FORCE_COLOR: "1"
  # THE BY-DESIGN-RED SET, DECLARED ONCE.
  #
  # `hermetic-tests` runs `not (RED_SELECTOR)` and `red-by-design` runs `RED_SELECTOR`,
  # so the two jobs are the exact complement of each other over the same collection and
  # there is no third place a test can hide. Writing the two expressions by hand in two
  # jobs is how a gap gets in, so they are derived from this one string instead.
  #
  # MEASURED 2026-08-13 at HEAD 073dfea on the pinned interpreter
  # (`.venv/Scripts/python.exe -m pytest --crdb=none --collect-only -q`), with BOTH
  # markers registered and applied:
  #
  #   -m "g4alpha or pl2_red"        ->    15 collected, 9824 deselected
  #   -m "not (g4alpha or pl2_red)"  ->  9824 collected,   15 deselected
  #                                      ----   9839, the whole collection
  #
  # and the selected 15 run `15 failed, 0 passed, 0 skipped` in 14.69 s — which is why
  # `RED_FLOOR` below is 15.
  #
  # RE-MEASURED at the END of the same sitting, three hours later, because five other
  # workers were writing to this tree throughout it:
  #
  #   -m "g4alpha or pl2_red"        ->    15 collected, 9884 deselected
  #   -m "not (g4alpha or pl2_red)"  ->  9884 collected,   15 deselected
  #                                      ----   9899, the whole collection
  #
  # BOTH READINGS ARE PRINTED, and the difference between them is the point. The
  # collection moved 9839 -> 9899 in three hours; the RED SET DID NOT MOVE, and all
  # fifteen still failed. That is what makes 15 a floor rather than a snapshot: it is a
  # count of DECLARED reds, and declared reds change only when somebody applies or
  # removes a marker, which is a reviewable act. A tally of the whole collection is not,
  # which is why the one recorded here carries the time it was taken and why anyone
  # quoting it should re-run the command above rather than trust the number.
  #
  # THE TWO SUPERSEDED READINGS ARE KEPT, because the difference between them is the
  # defect each pair of jobs was built to end, and a number replaced in place teaches
  # nobody anything:
  #
  #   1093 /    5 / 1098   taken while `pl2_red` was registered nowhere and applied to
  #                        nothing; the selector reached only the g4alpha five.
  #     13 / 9240 / 9253   taken 2026-08-10 in the commit that registered and applied
  #                        `pl2_red`. Correct on that tree.
  #
  # The 9253 -> 9839 move is 586 tests, and it is NOT drift: `pyproject.toml`'s
  # `testpaths` gained `verticals/*/packages/*/tests` and then
  # `verticals/*/apps/demo-api/tests` (2026-08-13), which is where 444 of them came from.
  # The 13 -> 15 move is `tests/integration/custody/test_k2_exit.py`'s K2.4 and K2.6,
  # marked `pl2_red` on 2026-08-13 with the argument written into that file's own module
  # docstring. Both were measured here before this line was edited, not inferred from it.
  #
  # A THIRD DATED READING, APPENDED 2026-08-14 at HEAD eefae1c. Nothing above is edited.
  # The whole argument for keeping the first two is that a number replaced in place
  # teaches nobody anything, and a third reading that overwrote the second would be that
  # same edit wearing a later date:
  #
  #   -m "g4alpha or pl2_red"        ->    15 collected, 10135 deselected
  #   -m "not (g4alpha or pl2_red)"  -> 10135 collected,    15 deselected
  #                                      ----  10150, the whole collection
  #
  # THIS ONE WAS NOT TAKEN ON A WORKSTATION, which is why it is the reading to quote. It
  # is CI's own measurement of the COMMITTED tree, read out of run 31735341191 (push,
  # `eefae1c`, 2026-08-13T19:20:30Z): `hermetic-tests` printed `collected 10150 items`
  # and `10150 tests collected in 18.91s`, and `red-by-design` printed
  # `15 failed, 10135 deselected in 20.43s`. The two jobs are the exact complement of
  # each other over one collection and their halves add to it — which is the property
  # this env block exists to keep true, now checked against a runner rather than against
  # a developer's tree.
  #
  # THE COLLECTION MOVED 9839 -> 10150, which is +311. A figure of +430 was in
  # circulation when this reading was ordered; it came from comparing the live number
  # against a dirty working tree, and it is wrong. RED_FLOOR DID NOT MOVE: 15 at 073dfea,
  # 15 in the 9899 re-reading three hours later, 15 here. Three readings, three different
  # collections, one floor — which is exactly what the paragraph above predicted a count
  # of DECLARED reds would do and a tally of the whole collection would not.
  #
  # RE-RUN ON THIS WORKSTATION on 2026-08-14, on the pinned interpreter, at the same HEAD
  # but on a working tree five other workers were writing to at the time:
  #
  #   -m "g4alpha or pl2_red"        ->    15/10211 collected (10196 deselected) in 20.47s
  #   -m "not (g4alpha or pl2_red)"  -> 10196/10211 collected (   15 deselected) in 14.18s
  #
  # 10211 - 10150 = 61, and the 61 is accounted for BY NAME rather than called drift.
  # Four test files exist on disk and in no commit —
  # `packages/trappoint-testkit/tests/test_txn.py` (17),
  # `tests/concurrency/test_seed_permit_needs_retry.py` (2),
  # `verticals/mainline/apps/demo-api/tests/test_defeaters.py` (29) and
  # `verticals/mainline/apps/demo-api/tests/test_judge_can_sign.py` (13) — and collecting
  # exactly those four gives 61 tests. The five TRACKED test files modified in the same
  # tree contribute a net zero. `RED_FLOOR` is 15 in this reading too, on a collection 61
  # tests larger than the one CI measured: a fourth agreement, on a fourth tree.
  #
  # `g4alpha` is registered in `pyproject.toml` ("observed RED by design until K4").
  # `pl2_red` is the marker for the `PL-2 RED, as intended.` cases — registered in
  # `pyproject.toml` beside it, with `scripts/mi_ratchet.py`'s own wording, and applied
  # to the eight cases named in the `red-by-design` REGISTRY below. `--strict-markers`
  # governs markers APPLIED to tests, not names used in a `-m` expression, which is why
  # this selector was syntactically valid throughout the period it was selecting five
  # tests instead of thirteen: a `-m` name that no test carries fails silently and green.
  # `RED_FLOOR` is the guard against that state ever returning unnoticed.
  RED_SELECTOR: "g4alpha or pl2_red"

jobs:
  # ---------------------------------------------------------------------------------
  # Gate zero. Every other job in this file calls a program by path. When one of those
  # programs is missing, six jobs fail with six copies of the same opaque "No such file
  # or directory" and the reader has to diff the tree to learn which single file is
  # absent. This job says it once, by name, with the plan section that promised it.
  # ---------------------------------------------------------------------------------
  checkers:
    name: every checker this lane invokes exists
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Deny all egress
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - uses: actions/checkout@v7

      - name: The checker registry
        run: |
          set -euo pipefail
          missing=0
          # path <TAB> what it asserts
          while IFS='|' read -r path claim; do
            [ -n "${path}" ] || continue
            if [ -f "${path}" ]; then
              printf '  ok      %-42s %s\n' "${path}" "${claim}"
            else
              printf '  MISSING %-42s %s\n' "${path}" "${claim}"
              echo "::error file=${path}::${path} is invoked by a named job in ci.yml and is not on disk (${claim})"
              missing=$((missing + 1))
            fi
          done <<'REGISTRY'
          scripts/qa/check_workspace_members.py|every pyproject.toml on disk is a uv.lock member
          scripts/qa/ruff_ratchet.py|no ruff rule count may rise
          scripts/qa/mypy_targets.py|every distribution has a mypy.ini section
          scripts/qa/check_import_registry.py|no distribution is linted by zero contracts
          scripts/qa/check_reuse.py|every file carries an SPDX identifier or a sidecar
          scripts/qa/skip_ratchet.py|every cluster-shaped skip is executed by a named lane or enumerated
          scripts/qa/check_pytest_lanes.py|every pytest step in this directory declares which side of the cluster line it is on
          REGISTRY
          if [ "${missing}" -ne 0 ]; then
            echo ""
            echo "${missing} checker(s) absent. ci.yml asserts what these programs assert and"
            echo "nothing else, so a missing one is a claim this lane silently stopped making."
            exit 1
          fi
          echo ""
          echo "all seven checkers present"

      - name: A skipped test may not read as green
        # WHY THIS RUNS IN GATE ZERO AND NOT IN A TEST JOB. It reads three committed files
        # — qa/ci-skip-census.json, qa/skip-ratchet.json and .github/workflows/*.yml as
        # RAW TEXT — and runs no pytest, opens no socket and starts no container. Putting
        # it behind `setup-workspace` would buy nothing and cost a minute.
        #
        # WHAT IT REFUSES. Measured 2026-08-13: 974 of this repository's 988 hermetic
        # skips name a cluster, a node, a database or a DSN; 244 of those 974 are executed
        # by a lane that stands a node up and 730 are not. This checker fails the build
        # when a cluster-shaped skip is attributed to NEITHER — so a cluster-backed test
        # added with no lane is a red X naming the node id, instead of a green tick over
        # an assertion nobody has ever run. `pytest` exits 0 when every test skips, and on
        # the Actions tab that is indistinguishable from a pass.
        run: python3 scripts/qa/skip_ratchet.py

      - name: Every pytest step says which side of the cluster line it is on
        # Contract A. The marker is a COMMENT, so this checker reads workflow files as raw
        # text; PyYAML discards comments and these files are 60% comment by volume.
        # Measured 2026-08-13 before this step existed: 30 of the 32 pytest invocations in
        # this directory declared no `--crdb` mode at all and therefore ran at the default
        # `auto` — "reuse a cluster that answers, start one if none does" — so the file
        # could not say whether a step reused the shared node or started its own. A lane
        # whose cluster posture is implicit cannot be audited and cannot be ratcheted.
        run: python3 scripts/qa/check_pytest_lanes.py

  # ---------------------------------------------------------------------------------
  lockfile:
    name: the lockfile is authoritative · workspace membership
    runs-on: ubuntu-24.04
    needs: [checkers]
    timeout-minutes: 12
    steps:
      - name: Deny egress except to the package indexes
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443

      - uses: actions/checkout@v7

      - name: Set up the workspace (uv only — do NOT sync)
        # `sync: false` matters. `uv sync` can rewrite `uv.lock`; checking the lockfile
        # after syncing would be checking it against an environment it had just been
        # allowed to produce.
        uses: ./.github/actions/setup-workspace
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          sync: "false"

      - name: uv lock --check
        # Fails when uv.lock does not match what the pyproject files imply. A stranger
        # who resolves a different graph than CI did has not reproduced PL-1's proof;
        # they have run a different program.
        run: uv lock --check

      - name: Every distribution on disk is a member of the locked workspace
        # `uv lock --check` answers "is this lockfile consistent with the pyprojects the
        # WORKSPACE GLOBS matched". It does not answer "did a distribution land in a
        # directory no glob covers", and it does not answer "is there a src/ tree with
        # no pyproject.toml at all" — which is exactly what was found:
        # `verticals/mainline/packages/mainline-corpus/` held 60+ modules, was imported
        # by four test trees, and had no `pyproject.toml`, so it was in no lockfile, no
        # workspace and no contract. That is the hole this checker closes.
        # Plain `python3`, not `uv run`: this job deliberately has no synced
        # environment (see the step above), and the checker is stdlib-only precisely so
        # it can answer "is the workspace coherent" without first requiring a coherent
        # workspace to run in.
        run: python3 scripts/qa/check_workspace_members.py

      - name: uv sync --frozen --all-packages actually resolves
        # The other half of the 2026-08-10 finding. `uv lock --check` and this command
        # were in two different jobs and could not both pass; running them adjacently,
        # in this order, is what makes the pair meaningful.
        run: uv sync --frozen --all-packages

  # ---------------------------------------------------------------------------------
  format:
    name: ruff format · the counted lint ratchet
    runs-on: ubuntu-24.04
    needs: [checkers]
    timeout-minutes: 12
    steps:
      - name: Deny egress except to the package indexes
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          sync: "false"
          cache-suffix: "lint"

      - name: ruff format --check
        run: uv run --frozen --only-group dev ruff format --check .

      - name: The ratchet — a count may fall, it may not rise
        # Ruling D4. `ruff check .` reported 896 findings on 2026-08-10 and `ruff format`
        # would rewrite 237 files owned by nine other workers. Reformatting the tree
        # mid-wave is a merge catastrophe that buys a zero nobody can audit; a counted
        # ratchet publishes today's honest number per rule per tree and refuses an
        # increase. A truthful 896 that cannot grow beats a fabricated 0. Raising a
        # count is allowed — `--rebaseline`. Raising it silently is not.
        run: uv run --frozen --only-group dev python scripts/qa/ruff_ratchet.py

  # ---------------------------------------------------------------------------------
  types:
    name: mypy · and the target list is complete
    runs-on: ubuntu-24.04
    needs: [checkers]
    timeout-minutes: 12
    steps:
      - name: Deny egress except to the package indexes
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        # `--all-packages`: mypy follows real imports across distributions. A partial
        # sync makes it report "module has no attribute" for things that are simply not
        # installed, and a reader learns to ignore the output.
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: The target list, emitted rather than restated
        # `mypy.ini` used to be invoked with two hand-written package paths, which is why
        # "129 files, 1 error" was news: no single invocation type-checked the substrate,
        # and mypy itself was printing `unused section(s):` in both directions. The
        # target list is now DERIVED from the distributions on disk. A hand-maintained
        # list in a `run:` block is a list that goes stale the first time somebody adds
        # a package and does not think about CI.
        id: targets
        run: |
          set -euo pipefail
          uv run --frozen --all-packages python scripts/qa/mypy_targets.py > mypy-targets.txt
          read -ra targets < mypy-targets.txt
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::mypy_targets.py emitted no targets; mypy would have checked nothing and passed"
            exit 1
          fi
          echo "count=${#targets[@]}" >> "$GITHUB_OUTPUT"
          echo "${#targets[@]} target(s)"

      - name: mypy
        run: |
          set -euo pipefail
          read -ra targets < mypy-targets.txt
          uv run --frozen --all-packages mypy --config-file mypy.ini "${targets[@]}"

      - name: Every distribution has a section — no package is silently unchecked
        # The complement of the step above, and the one that catches the real failure
        # mode: a distribution with no `[mypy-<name>.*]` section and no `mypy_path`
        # entry is not type-checked at all, and mypy reports that as SUCCESS.
        run: uv run --frozen --all-packages python scripts/qa/mypy_targets.py --check

  # ---------------------------------------------------------------------------------
  imports:
    name: import-linter contracts · and no package outside them
    runs-on: ubuntu-24.04
    needs: [checkers]
    timeout-minutes: 12
    steps:
      - name: Deny egress except to the package indexes
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        # import-linter builds a REAL import graph, so every root package must be
        # importable. `--all-packages` is what makes the contracts assert anything.
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: The contracts
        run: uv run --frozen --all-packages lint-imports --config .importlinter

      - name: Registry guard — a new distribution cannot be silently unlinted
        # `root_packages` can only name packages that exist at lint time, so a package
        # created after the config was written sits outside every contract and nobody is
        # told. Measured on 2026-08-10: FIVE root packages against TWENTY-SEVEN
        # distributions — twenty-two packages linted by nothing, including
        # `trappoint-core`, which holds the retry-loop contract. A distribution must
        # appear either in `root_packages` (its imports are checked) or in some
        # contract's `forbidden_modules` (importing it is checked). Neither is a
        # failure; being in neither is.
        run: uv run --frozen --all-packages python scripts/qa/check_import_registry.py

  # ---------------------------------------------------------------------------------
  reuse:
    name: REUSE — every file names its licence
    runs-on: ubuntu-24.04
    needs: [checkers]
    timeout-minutes: 12
    steps:
      - name: Deny egress except to the package indexes
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          sync: "false"

      - name: The licence map is complete and the identifier is one identifier
        # Two measured defects, both of which this checker owns. (1) `LICENSES/` was
        # EMPTY, so REUSE could not resolve a single identifier the tree declares.
        # (2) The same licence is spelled two ways — `FSL-1.1-ALv2` in 1 027 files and
        # `LicenseRef-FSL-1.1-ALv2` in 324 — and only the second is legal, because
        # FSL-1.1-ALv2 is not an SPDX-registered identifier. A repository that cannot
        # state its own licence unambiguously has not published anything a stranger can
        # safely fork, and "the substrate is Apache-2.0 and forkable" is the claim
        # `.importlinter` contract 1 exists to protect.
        run: python3 scripts/qa/check_reuse.py

  # ---------------------------------------------------------------------------------
  hermetic-tests:
    name: pytest --crdb=none (no cluster, no credential, no network)
    runs-on: ubuntu-24.04
    needs: [checkers]
    timeout-minutes: 12
    steps:
      - name: Deny egress except to the package indexes
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # trappoint:pytest-lane=hermetic — passes --crdb=none. No cluster is obtained and
      #                                   none may be started; cluster tests skip with the
      #                                   reason their own fixture writes.
      - name: Collection must cost a second, not a container
        # `--collect-only` starts no cluster by construction (the testkit plugin returns
        # early when `collectonly` is set). Running it first turns a collection ERROR —
        # the module-basename collisions that were the residual 3 of the original 14 —
        # into its own legible failure instead of a wall of noise inside a test run.
        run: uv run --frozen --all-packages pytest --crdb=none --collect-only -q

      # trappoint:pytest-lane=hermetic — passes --crdb=none, and `--collect-only` besides.
      - name: Name every test this job hands to `red-by-design`
        # A DESELECTION MUST NOT BE A DISAPPEARANCE. This file has always argued —
        # correctly, in the step below — that a marker filter is dangerous because the
        # deselected test vanishes from the report and cannot be told from a deleted
        # one. The step below therefore still refuses `-m "not requires_cluster"`.
        #
        # The one deselection this lane does make is answered two ways: the deselected
        # tests are printed BY NAME here, and they are RUN, in full, with their verdict
        # inverted, by the `red-by-design` job in this same workflow. Both jobs are
        # `needs:` of `summary`. So the census below is a hand-off, and it names its
        # counterpart.
        run: |
          set -euo pipefail
          code=0
          uv run --frozen --all-packages pytest --crdb=none \
            -m "${RED_SELECTOR}" --collect-only -q > handed-off.txt || code=$?
          # 0 = tests collected, 5 = nothing matched. Anything else is a broken
          # collection and must not be reported as an empty hand-off.
          if [ "${code}" -ne 0 ] && [ "${code}" -ne 5 ]; then
            echo "::error::collection for the hand-off census exited ${code}; the count below cannot be trusted"
            cat handed-off.txt
            exit 1
          fi
          count=0
          if grep -q '::' handed-off.txt; then
            count=$(grep -c '::' handed-off.txt)
          fi
          echo "::notice::${count} test(s) deselected here and run by the 'red-by-design' job"
          echo "handed to red-by-design (-m '${RED_SELECTOR}'):"
          if [ "${count}" -eq 0 ]; then
            echo "  (none)"
          else
            grep '::' handed-off.txt | sed 's/^/  /'
          fi

      # trappoint:pytest-lane=hermetic — passes --crdb=none. THIS is the invocation the
      #                                   skip census in qa/ci-skip-census.json measures,
      #                                   and the 973-of-987 cluster skips it records are
      #                                   this lane's honest half. It is deliberately NOT
      #                                   a cluster lane: `cluster-tests.yml` is.
      - name: The suite, with every cluster test SKIPPED FOR A NAMED REASON
        # NOT `-m "not requires_cluster"`. A marker filter DESELECTS, which means the
        # test disappears from the report and nobody can tell a test that was skipped
        # from a test that was deleted. `--crdb=none` makes the fixture skip and PRINT
        # the reason it skipped, so `-ra` renders a census of exactly what this lane did
        # not prove. That census is the honest half of a green tick.
        #
        # The single exception is `not (RED_SELECTOR)`, and it is an exception on the
        # exact ground the paragraph above states: those tests do not disappear, because
        # the step above names each one and the `red-by-design` job runs every one of
        # them. What this job asserts after the split is the thing it could never assert
        # before — that a failure HERE is a REGRESSION, with no by-design red in the
        # count to hide it.
        run: |
          uv run --frozen --all-packages pytest --crdb=none \
            -m "not (${RED_SELECTOR})" -q --durations=10

      - name: The conformance suite lists without a database
        # `--list` is a documentation act and must not need a driver connection. It is
        # also the cheapest possible check that spec/conformance/manifest.toml still
        # parses and that every case carries a non-empty exhibit.
        run: uv run --frozen --all-packages trappoint-conform --profile trappoint-ref --list

      - name: The manifest's declared counts are the counts
        run: |
          uv run --frozen --all-packages python - <<'PY'
          from trappoint_conformance.manifest import load_manifest

          m = load_manifest()
          assert len(m.cases) == m.declared_case_count, (
              f"[manifest].case_count says {m.declared_case_count}, "
              f"but there are {len(m.cases)} [[case]] entries"
          )
          ref = m.for_profile("trappoint-ref")
          assert len(ref) == m.declared_ref_profile_case_count, (
              f"[manifest].ref_profile_case_count says "
              f"{m.declared_ref_profile_case_count}, but {len(ref)} cases carry the "
              "trappoint-ref profile — and that number is the K1 exit string"
          )
          print(f"{len(m.cases)} cases · {len(ref)} on trappoint-ref · spec {m.spec_version}")
          PY

  # ---------------------------------------------------------------------------------
  # RED BY DESIGN, AND IT MUST STAY RED.
  #
  # The complement of `hermetic-tests`. It runs exactly the tests that job deselects,
  # and it INVERTS the verdict: a test in this set that FAILS is the expected state and
  # this job stays green; a test in this set that PASSES fails this job by name.
  #
  # Why inversion rather than `xfail`, `continue-on-error` or deletion. All three of
  # those make a by-design red SILENT, and silence loses the one event that matters:
  # PL-2 says a mechanism is not delivered until an assertion that was observed red is
  # observed green, so the transition is the deliverable. An `xfail` reports XPASS and
  # exits 0 by default; `continue-on-error` paints a green tick over any outcome
  # whatever; deletion loses the claim entirely. Only an inverted assertion turns "a
  # declared red went green" into a red X with the node id in it.
  #
  # THREE GUARDS AGAINST A VACUOUS PASS, because "the assertion held over the empty set"
  # is the exact way an instrument stops measuring without anybody noticing:
  #
  #   * a FLOOR — the selected set must contain at least RED_FLOOR failures, so the
  #     selector silently collapsing to nothing fails instead of passing;
  #   * a REGISTRY — every test the marker reaches must live in a file declared below
  #     with the reason it is allowed to be red, so the marker cannot become a place to
  #     put an inconvenient regression;
  #   * a SKIP CENSUS — `--crdb=none` cannot measure a cluster-backed test, and a test
  #     that was not measured is not evidence of anything, so skips are counted, named
  #     and never allowed to satisfy the floor.
  # ---------------------------------------------------------------------------------
  red-by-design:
    name: "RED BY DESIGN, and it must stay red"
    runs-on: ubuntu-24.04
    needs: [checkers]
    timeout-minutes: 12
    env:
      # A floor on FAILURES, never on collected tests — a set that collects fifteen and
      # fails none is exactly what this job exists to catch.
      #
      # 5 -> 13 on 2026-08-10, in the commit that registered and applied `pl2_red`:
      #
      #   .venv/Scripts/python.exe -m pytest --crdb=none -m "g4alpha or pl2_red" -q
      #   ->  13 failed, 9240 deselected in 14.83s   (0 passed, 0 skipped)
      #
      # 13 -> 15 on 2026-08-13 at HEAD 073dfea. RE-MEASURED on the pinned interpreter
      # immediately before this line was edited, and the composition printed with `-rA`
      # so every one of the fifteen is named rather than counted:
      #
      #   .venv/Scripts/python.exe -m pytest --crdb=none -m "g4alpha or pl2_red" -q
      #   ->  15 failed, 9824 deselected in 14.69s   (0 passed, 0 skipped)
      #
      #   5 · tests/eval/recall/test_g4alpha_gates.py       — the G4-alpha gates
      #   2 · tests/integration/custody/test_k2_exit.py     — NEW: K2.4 and K2.6
      #   2 · tests/integration/schema/test_mi_blame.py
      #   4 · tests/integration/schema/test_mi_boundary_override.py
      #   1 · tests/integration/schema/test_mi_event_severity.py
      #   1 · tests/integration/schema/test_mi_ratchet.py
      #
      # ALL FIFTEEN WERE OBSERVED FAILING before the floor was raised. That order matters:
      # a floor above the observed count makes this job red for the wrong reason, which is
      # a worse outcome than a floor that is one too low, because it is red about itself
      # rather than about the suite. Raising a floor is strengthening and is allowed;
      # lowering one may be done only by a commit that promotes a red to green and says
      # which. The two new members were marked by the custody suite on 2026-08-13 and
      # their argument is in that file's own module docstring; the REGISTRY below gains
      # the file in this same edit, because a marked file absent from the registry fails
      # this job as "UNDECLARED by-design red" — correctly, and it did.
      #
      # RE-MEASURED 2026-08-14 at HEAD eefae1c, AND THE FLOOR DID NOT MOVE. This is a
      # THIRD dated reading appended beside the two above, not a replacement for either —
      # the `5 -> 13` block stays exactly where it is, for the reason the env block at the
      # top of this file gives at length:
      #
      #   CI run 31735341191, this job, on the committed tree
      #   ->  15 failed, 10135 deselected in 20.43s   (0 passed, 0 skipped)
      #
      # The collection around it moved 9824 -> 10135 deselected, +311 tests, while the
      # declared red set stayed at fifteen and every one of the fifteen still failed. A
      # floor that survives a 311-test move without being touched is the floor doing its
      # job; the day it has to be edited to keep a lane green, the edit IS the finding.
      #
      # AND IT IS NOT RAISED HERE. Raising a floor is strengthening and is allowed — but
      # only by a run that OBSERVED more than fifteen declared reds failing, and this run
      # observed exactly fifteen. A floor raised to a number nobody watched fail makes
      # this job red about itself instead of red about the suite, which the paragraph
      # above already rules is the worse outcome.
      RED_FLOOR: "15"
    steps:
      - name: Deny egress except to the package indexes
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # trappoint:pytest-lane=hermetic — passes --crdb=none. A declared red that needs a
      #                                   cluster CANNOT be measured here and is reported
      #                                   as "not measured" below, never counted toward
      #                                   the floor.
      - name: Run the declared set — the exit code is NOT the verdict
        # Deliberately not the verdict. pytest exits 1 for "some test failed", which is
        # the state this job WANTS, and 0 for "everything passed", which is the state it
        # must refuse. Reading the code directly would therefore invert the meaning of
        # every other exit code too, so the run is recorded to a JUnit report and the
        # verdict is computed per test in the step below. Only the codes that mean the
        # run did not happen — 2 interrupted, 3 internal error, 4 usage error, 5 nothing
        # collected — are fatal here, and each is named.
        run: |
          set -euo pipefail
          code=0
          uv run --frozen --all-packages pytest --crdb=none \
            -m "${RED_SELECTOR}" -rA --durations=10 \
            -o junit_family=xunit1 --junitxml=red-by-design.xml || code=$?
          echo "pytest exited ${code}"
          case "${code}" in
            0|1)
              ;;
            5)
              echo "::error::'-m ${RED_SELECTOR}' collected NO tests, so this job would have"
              echo "reported 'every declared red is still red' over the empty set. Either the"
              echo "markers were removed from the suites, or the selector in ci.yml's env block"
              echo "no longer names them. A vacuous pass here is worse than a red."
              exit 1
              ;;
            2)
              echo "::error::pytest was INTERRUPTED (exit 2). Nothing was measured."
              exit 1
              ;;
            3)
              echo "::error::pytest hit an INTERNAL ERROR (exit 3). Nothing was measured."
              exit 1
              ;;
            4)
              echo "::error::pytest refused its own command line (exit 4) — a usage or config"
              echo "error, not a test result. Nothing was measured."
              exit 1
              ;;
            *)
              echo "::error::pytest exited ${code}, which this job does not know how to read."
              exit 1
              ;;
          esac

      - name: The verdict — every declared red is still red, and nothing else hid here
        # No `if: always()`. The step above already fails, by name, for every exit code
        # that means the run did not happen; re-reporting "no JUnit report" underneath
        # one of those would bury the real message. This step runs exactly when there is
        # a report to read.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          # path -> the truth this file's by-design-RED cases report. A file is allowed
          # to carry the marker only if it is named here WITH its reason, so the set is
          # reviewable in one place instead of being wherever somebody put a decorator.
          #
          # RE-MEASURED 2026-08-10, when `pl2_red` was registered in pyproject.toml and
          # applied for the first time. Every reason below is the assertion text the case
          # actually printed on the pinned interpreter that day, not a remembered one:
          #
          #   .venv/Scripts/python.exe -m pytest --crdb=none -m "g4alpha or pl2_red" -q
          #
          # The MI-ratchet line said "28 of 30" and the run says 21 — nine invariants had
          # been promoted since it was written. An intentional red seven invariants out of
          # date is an intentional red losing its precision, so the count and the names are
          # both here and both come from the failure message.
          #
          # `tests/integration/schema/test_mi_spine.py` was in this registry and is not any
          # more, because no case in it carries the marker: its `test_pl2_red_mi15_bloodline
          # _guard_does_not_exist_yet` was measured PASSING on 2026-08-10 (a function
          # reading sev_max/blood_size and RAISEing now exists in the band), and its
          # cluster-tier counterpart `test_mi15_a_version_may_not_shrink_its_ancestry` is
          # `requires_cluster` and cannot be measured in this lane at all. A registry entry
          # with no marked case behind it prints a row of zeroes under a claim in the job
          # summary, which is a claim with no evidence. Reported to the spine suite's owner
          # instead. The same holds for `test_mi_foundation.py::test_pl2_red_site_
          # projection_is_not_yet_enforced`, also measured passing.
          REGISTRY = {
              "tests/eval/recall/test_g4alpha_gates.py":
                  "the five G4-alpha recall gates are not met; RED until K4 by declaration",
              "tests/integration/schema/test_mi_ratchet.py":
                  "PL-2's red case — 21 of 30 MAINLINE invariants are still pending "
                  "(MI03, MI04, MI05, MI06, MI07, MI08, MI09, MI10, MI12, MI15, MI17, "
                  "MI20, MI21, MI22, MI23, MI24, MI25, MI26, MI27, MI29, MI30); promote "
                  "in verticals/mainline/db/invariants/mi_catalogue.yaml",
              "tests/integration/schema/test_mi_blame.py":
                  "clause_version.sev_max is never projected from the closure, and "
                  "fn_closure_guard's monotone branch accepts an unrelated severity "
                  "revision; owner dm-functions-triggers / kernel projection-triggers",
              "tests/integration/schema/test_mi_boundary_override.py":
                  "fn_boundary_project, the carried-use projection, an append-only trigger "
                  "on predicate_revocation and carried_disposition_use, and any requirement "
                  "that a cited predicate still hold, none of them exist yet; owner "
                  "dm-functions-triggers, band 0140-0149z",
              "tests/integration/schema/test_mi_event_severity.py":
                  "severity-revision provenance is not yet projected; owner "
                  "dm-functions-triggers, band 0130-0199",
              # ADDED 2026-08-13. Both reasons are the assertion text the two cases
              # actually printed on the pinned interpreter that day, quoted rather than
              # summarised, because a registry entry that paraphrases its case stops
              # being checkable against it.
              "tests/integration/custody/test_k2_exit.py":
                  "K2.4 — nothing in the repository writes evidence/k2-checkpoint-"
                  "cadence.json, so the ~60 s window of undetectable mutation has never "
                  "been observed; and K2.6 — the writer exists "
                  "(mainline_custody_patrol.collect.write_k2_migration_attestation) and "
                  "no lane runs it against a migrated cluster, so evidence/k2-migration-"
                  "attestation.json has never been produced. Owner: CUSTODY domain — "
                  "docs/leads/custody.md, workers `sequencer` and `witness-and-custodian`",
          }

          floor = int(os.environ["RED_FLOOR"])
          report = pathlib.Path("red-by-design.xml")
          if not report.exists():
              print("::error::no JUnit report was written, so this job measured nothing")
              sys.exit(1)

          def where_of(case: ET.Element) -> str:
              """The file a testcase came from, repository-relative, POSIX separators.

              MEASURED 2026-08-10 on pytest 9.1.1: the `file` attribute is emitted ONLY
              by the `xunit1` JUnit family. The default `xunit2` writes `classname`,
              `name` and `time` and nothing else — so a reader of the default report
              cannot tell which file a test came from, and the registry check below
              would call every test undeclared. The run step therefore asks for
              `xunit1` explicitly.

              `xunit1` is deprecated, so this does not depend on it: when `file` is
              absent the path is recovered from `classname`, walking components off the
              end until one names a real file — `a.b.test_c` and `a.b.test_c.TestD`
              both resolve to `a/b/test_c.py`. If neither route works the raw classname
              is returned, which no REGISTRY key can equal, so an unresolvable test
              fails CLOSED as undeclared rather than passing as declared.
              """
              raw = case.get("file")
              if raw:
                  return raw.replace("\\", "/")
              parts = [p for p in (case.get("classname") or "").split(".") if p]
              while parts:
                  candidate = pathlib.Path(*parts).with_suffix(".py")
                  if candidate.is_file():
                      return candidate.as_posix()
                  parts.pop()
              return case.get("classname") or "<unresolvable>"

          red: list[str] = []
          green: list[str] = []
          skipped: list[str] = []
          stray: list[str] = []

          for case in ET.parse(report).getroot().iter("testcase"):
              where = where_of(case)
              node = f"{where}::{case.get('name')}"
              if where not in REGISTRY:
                  stray.append(node)
              if case.find("failure") is not None or case.find("error") is not None:
                  red.append(node)
              elif case.find("skipped") is not None:
                  skipped.append(node)
              else:
                  green.append(node)

          print(f"selected {len(red) + len(green) + len(skipped)} test(s) "
                f"-> {len(red)} red · {len(green)} green · {len(skipped)} not measured")

          failures = 0

          for node in green:
              print(f"::error::A BY-DESIGN RED WENT GREEN: {node}")
              print(f"  {node} passed. That is the PL-2 transition and it is good news,")
              print("  but it must be recorded, not absorbed: drop its by-design-RED marker")
              print("  in the same commit, and promote the invariant it stands for in")
              print("  verticals/mainline/db/invariants/mi_catalogue.yaml if it names one.")
              print("  Until that lands, this job is the only thing saying the claim moved.")
              failures += 1

          for node in sorted(set(stray)):
              print(f"::error::UNDECLARED by-design red: {node}")
              print(f"  {node.split('::')[0]} carries a by-design-RED marker and is not in")
              print("  this job's REGISTRY. Either add it there with the truth it reports, or")
              print("  take the marker off — the marker must never become somewhere to put a")
              print("  regression where neither pytest job will report it.")
              failures += 1

          if len(red) < floor:
              print(f"::error::only {len(red)} declared red(s) actually failed; the floor is {floor}")
              print("  This job asserts that a declared set is STILL RED. Below the floor it")
              print("  would be asserting that over almost nothing, which is the vacuous pass")
              print("  the floor exists to refuse. If the floor is genuinely too high because")
              print("  reds were promoted, lower RED_FLOOR in ci.yml in the promoting commit.")
              failures += 1

          for node in sorted(skipped):
              print(f"::warning::not measured (no cluster in this lane): {node}")

          if skipped and not red:
              print("::error::every selected test SKIPPED, so nothing was measured at all")
              failures += 1

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## RED BY DESIGN\n\n")
              handle.write("These assertions fail on purpose. This job fails if one of them "
                           "PASSES.\n\n")
              handle.write("| file | still red | not measured | went GREEN | what its red reports |\n")
              handle.write("|---|---|---|---|---|\n")
              for path, why in sorted(REGISTRY.items()):
                  prefix = f"{path}::"
                  handle.write(
                      f"| `{path}` "
                      f"| {sum(1 for n in red if n.startswith(prefix))} "
                      f"| {sum(1 for n in skipped if n.startswith(prefix))} "
                      f"| {sum(1 for n in green if n.startswith(prefix))} "
                      f"| {why} |\n"
                  )
              handle.write(f"\nFloor: at least {floor} of these must be failing. "
                           f"Measured: {len(red)}.\n")

          sys.exit(1 if failures else 0)
          PY

  # ---------------------------------------------------------------------------------
  sql-lint:
    name: the sequence ban, repository-wide
    runs-on: ubuntu-24.04
    needs: [checkers]
    timeout-minutes: 12
    steps:
      - name: Deny egress except to the package indexes
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          packages: "trappoint-migrate"
          cache-suffix: "kernel"

      - name: No sequence anywhere, and every migration cites an invariant
        # Ruling D10 and ARCHITECTURE.md §18, over EVERY migration tree and every
        # template in the repository. A whole-repository guard, and it lives here rather
        # than in db.yml on purpose: the db lane's failure must mean "the conformance
        # case is red" and nothing else.
        #
        # The claim it protects: the event ledger is gap-free by compare-and-swap, so a
        # gap MEANS tampering. One reintroduced sequence anywhere and that sentence has
        # to be withdrawn.
        run: uv run --frozen --package trappoint-migrate trappoint migrate lint

  # ---------------------------------------------------------------------------------
  workflows:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Deny egress except to the release host
        # `github.com:443` IS NOT THE RELEASE HOST, and this job spent 2026-08-12 proving
        # it. `/releases/download/…` is a 302 with no body; GitHub serves the BYTES from a
        # separate origin, and as of 2026 that origin is `release-assets.githubusercontent.com`
        # rather than the `objects.githubusercontent.com` this list has always named.
        # Measured, run 31596249352, `Install actionlint`:
        #
        #     curl: (7) Failed to connect to release-assets.githubusercontent.com port 443
        #     after 1 ms: Couldn't connect to server
        #     ##[error]Process completed with exit code 7.
        #
        # Exit 7 is curl's "could not connect", not curl's 404 — harden-runner refused a
        # destination the allowlist could not name, which is the control working. The same
        # host moving is what took the other eight jobs of this workflow down through
        # `setup-workspace`, whose `astral-sh/setup-uv` fetches uv from a GitHub release
        # too; see `.github/actions/setup-workspace/action.yml` for that half.
        #
        # Not fixed by pinning, and not fixed by `egress-policy: audit`. The URL above
        # already carries an exact version, so the version was never the variable; and
        # auditing would retire the assertion this list exists to make instead of
        # correcting it.
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@v7

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version
          # actionlint runs shellcheck over every `run:` block, but only if shellcheck is
          # on PATH — and it says nothing when it is not. A lane whose most valuable half
          # can vanish silently is a lane that reports on less than it claims to, so the
          # version is printed and its absence is fatal here rather than invisible later.
          shellcheck --version

      - name: Lint every workflow
        # shellcheck runs over `run:` blocks as part of actionlint, which is most of the
        # value: the db lane's cluster-wait loop is shell, and a quoting bug there would
        # make the red lane fail for the wrong reason.
        run: actionlint -color

      - name: The composite action, which actionlint does not cover
        # actionlint reads `.github/workflows/*.yml` and nothing else, so the file every
        # job in this workflow depends on is the one file it does not check. These are
        # the three properties whose absence produces an unhelpful runtime error rather
        # than a parse error: `runs.using` must be `composite`, every `run:` step in a
        # composite action must declare a `shell:`, and every declared output must have
        # a `value:`.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          failures = []
          for path in sorted(pathlib.Path(".github/actions").glob("*/action.yml")):
              doc = yaml.safe_load(path.read_text(encoding="utf-8"))
              runs = doc.get("runs", {})
              if runs.get("using") != "composite":
                  failures.append(f"{path}: runs.using is {runs.get('using')!r}, expected 'composite'")
              for index, step in enumerate(runs.get("steps", [])):
                  if "run" in step and not step.get("shell"):
                      name = step.get("name", f"step {index}")
                      failures.append(f"{path}: step {name!r} has `run:` and no `shell:`")
                  if "run" in step and "uses" in step:
                      failures.append(f"{path}: step {index} has both `run:` and `uses:`")
              for name, spec in (doc.get("outputs") or {}).items():
                  if "value" not in spec:
                      failures.append(f"{path}: output {name!r} declares no `value:`")
              print(f"checked {path}")

          for line in failures:
              print(f"::error::{line}")
          sys.exit(1 if failures else 0)
          PY

  # ---------------------------------------------------------------------------------
  adr-red-recorded:
    name: PL-2 — the red run is recorded
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Deny all egress
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@v7

      - name: The ADR must name the run that was observed red
        # PL-2 is satisfied by a job that WAS OBSERVED RED, not by an intention to write
        # tests first. The evidence is a run URL. Until the repository has pushed CI
        # history there is no URL to record, so this warns on pull_request and
        # workflow_dispatch and FAILS on a push to the default branch — which means the
        # first push to it after the db lane runs is the commit that has to record it.
        #
        # `refs/heads/master`, not `refs/heads/main`, and the correction matters more
        # here than anywhere else in this file. This repository's default branch is
        # `master` and `main` does not exist (measured 2026-08-10), so the condition
        # below could never be true: an honesty ratchet that cannot fire is a ratchet
        # that has been removed without anybody deciding to remove it. Restoring the
        # branch name arms it.
        #
        # THIS JOB IS RED ON `master` TODAY, AND THE MESSAGE NOW NAMES WHY (R3 of
        # docs/leads/ci-finish-final.md: an intentional red must name the artefact that
        # does not exist and the domain that owes it). Measured 2026-08-10:
        #
        #   gh api …/actions/runs/31440847412/jobs
        #     success  one version constant, and it lives in compose.yaml
        #     failure  migrate + conform, on a node pinned to Cloud's gc.ttlseconds
        #       failure  Apply the reference vertical
        #       skipped  CONFORMANCE
        #
        # The image-pin census that used to skip the kernel job is fixed, so the kernel
        # job runs — and stops one step BEFORE the conform step, on
        # `0058_blocking_check: [42P01] relation "trappoint_ref.event" does not exist`.
        # No `db` run in this repository's history has executed `CONFORMANCE`, so there
        # is no red conform run to link. Recording run 31440847412 anyway — it IS a red
        # `db` run — would put a URL in a field that asks for a different observation,
        # which is the precise failure the field was created to prevent. It stays
        # UNRECORDED and this job stays red until the producer lands.
        #
        # The `else` branch is not a rubber stamp: a `run_url` that is not an Actions run
        # URL of this repository is refused. That is a SHAPE check and is described as
        # one — this job has no token and blocks egress, so it cannot ask GitHub whether
        # the run exists or what colour it was. It closes the cheap failure (a note, a
        # bare word, a link to something else) and does not pretend to close the others.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          adr="docs/adr/0005-red-before-green.md"
          test -f "$adr"
          if grep -q 'run_url: *UNRECORDED' "$adr"; then
            if [ "${EVENT_NAME}" = "push" ] && [ "${REF}" = "refs/heads/master" ]; then
              echo "::error file=${adr},title=RED BY DESIGN - PL-2: the db lane's red conform run URL is still UNRECORDED::RED BY DESIGN, NOT A CI DEFECT. This job asks for the URL of a db run in which the CONFORMANCE step itself went red. No such run exists, because CONFORMANCE has never executed: db.yml stops one step earlier, at 0058_blocking_check on the missing trappoint_ref.event. Recording any other red db run would put a URL in a field that asks for a different observation, which is the precise laundering the field was created to prevent, so it stays UNRECORDED and this job stays red. WHAT TURNS IT GREEN: the producer for trappoint_ref.event lands, the next db push-run on master reaches CONFORMANCE, that step is red, and THAT run's URL replaces the word UNRECORDED in ${adr}. WHAT DOES NOT: any other red db run, deleting the line, or relaxing this check."
              echo "PL-2: the db lane's red conform run URL is still UNRECORDED."
              echo "THIS RED IS BY DESIGN. It is not a broken lane and not a flake: it is this"
              echo "  repository refusing to record a red-before-green observation it has not made."
              echo "MISSING ARTEFACT: a producer for 'trappoint_ref.event' in"
              echo "  packages/trappoint-sql/refvertical/sql/ — 0058_blocking_check.sql:75 declares"
              echo "  'precursor_event_id UUID NULL REFERENCES trappoint_ref.event (event_id)' and no"
              echo "  file in that tree creates the table."
              echo "OWNER: the KERNEL domain — docs/leads/kernel.md 1.1. Recorded in"
              echo "  docs/CI-STATE.md under 'the reds that are red on purpose' (the schema lane)."
              echo "  The owner is cited by DOMAIN DOCUMENT rather than by a section number:"
              echo "  CI-STATE.md is rewritten from a fresh measurement every time the board moves,"
              echo "  and a section number in a workflow is a cross-reference that rots silently."
              echo "CONSEQUENCE: db.yml's 'Apply the reference vertical' step fails, so its"
              echo "  'CONFORMANCE' step is SKIPPED and has never run — measured across every db run"
              echo "  on master: 31386723687, 31435379718, 31440847412, and again at HEAD."
              echo "WHAT FILLS THIS FIELD: the producer lands, the next db run on master reaches"
              echo "  CONFORMANCE, that step is red, and THAT run's URL goes into the ADR."
              echo "WHAT DOES NOT: any other red db run. The field names one observation, not a colour."
              exit 1
            fi
            echo "::warning file=${adr}::the red run URL is UNRECORDED; a push to master will fail until it is filled"
          else
            recorded=""
            if line="$(grep -m1 'run_url:' "$adr")"; then
              recorded="$(printf '%s' "${line}" | sed 's/.*run_url: *//; s/[[:space:]]*$//')"
            fi
            if [ -z "${recorded}" ]; then
              echo "::error file=${adr}::the ADR carries no 'run_url:' line at all. The field was"
              echo "not filled in — it was deleted, which removes the claim instead of recording it."
              echo "Restore the line, with either an Actions run URL or the word UNRECORDED."
              exit 1
            fi
            expected='^https://github\.com/Shaugato/mainline/actions/runs/[0-9]+$'
            if ! printf '%s' "${recorded}" | grep -Eq "${expected}"; then
              echo "::error file=${adr}::run_url is filled in but is not an Actions run URL of this"
              echo "repository: '${recorded}'. Expected ${expected}."
              echo "The field records ONE observation — the run in which db.yml's CONFORMANCE step"
              echo "was red — and a value that cannot even be opened records nothing. This is a"
              echo "shape check only: this job has no token and blocks egress, so it cannot ask"
              echo "GitHub whether that run exists or what colour it was."
              exit 1
            fi
            echo "red run recorded: ${recorded}"
          fi

  # ---------------------------------------------------------------------------------
  summary:
    name: CI summary
    runs-on: ubuntu-24.04
    needs:
      - checkers
      - lockfile
      - format
      - types
      - imports
      - reuse
      - hermetic-tests
      - red-by-design
      - sql-lint
      - workflows
      - adr-red-recorded
    if: always()
    timeout-minutes: 5
    steps:
      - name: Fail if any lane did not pass
        env:
          R_CHECKERS: ${{ needs.checkers.result }}
          R_LOCKFILE: ${{ needs.lockfile.result }}
          R_FORMAT: ${{ needs.format.result }}
          R_TYPES: ${{ needs.types.result }}
          R_IMPORTS: ${{ needs.imports.result }}
          R_REUSE: ${{ needs.reuse.result }}
          R_TESTS: ${{ needs.hermetic-tests.result }}
          R_RED: ${{ needs.red-by-design.result }}
          R_SQL: ${{ needs.sql-lint.result }}
          R_WORKFLOWS: ${{ needs.workflows.result }}
          R_ADR: ${{ needs.adr-red-recorded.result }}
        run: |
          set -euo pipefail
          {
            echo "## ci"
            echo ""
            echo "| lane | what it proves | result |"
            echo "|---|---|---|"
            echo "| checker registry | the seven checkers below are on disk, and two of them run here | ${R_CHECKERS} |"
            echo "| lockfile · members | uv.lock describes every distribution on disk | ${R_LOCKFILE} |"
            echo "| ruff format · ratchet | formatting is clean; no lint count rose | ${R_FORMAT} |"
            echo "| mypy · coverage | types check, and no package is unchecked | ${R_TYPES} |"
            echo "| import contracts · registry | no forbidden import; no unlinted package | ${R_IMPORTS} |"
            echo "| REUSE | every file names its licence | ${R_REUSE} |"
            echo "| pytest --crdb=none | the hermetic suite MINUS the declared reds; a failure here is a REGRESSION | ${R_TESTS} |"
            echo "| RED BY DESIGN | the declared reds are still red; fails if one PASSES | ${R_RED} |"
            echo "| sequence ban | no sequence anywhere in any migration tree | ${R_SQL} |"
            echo "| actionlint | every workflow parses, shellcheck reads every \`run:\`, and the composite action is checked too | ${R_WORKFLOWS} |"
            echo "| PL-2 | the first red run has a recorded URL | ${R_ADR} |"
            echo "| \`cluster-tests.yml\` · demo-api | the demo-api suite against a real pinned CockroachDB — **not a job in this workflow** | not measured here; open that workflow for its colour |"
            echo ""
            echo "**Why the last row has no colour.** \`cluster-tests.yml\` is a separate"
            echo "workflow, so this job cannot read its result and will not guess one. It is"
            echo "named here because until 2026-08-13 no lane in this repository pointed a"
            echo "cluster at \`verticals/mainline/apps/demo-api/tests\` at all: every one of"
            echo "that suite's cluster-backed tests skipped in the row above and was executed"
            echo "nowhere. The live counts are in \`qa/ci-skip-census.json\` under"
            echo "\`roots\` and in that lane's own \`COLLECTED_FLOOR\`, and are deliberately not"
            echo "restated here — a count restated in two files is a count that goes stale in"
            echo "one of them. \`scripts/qa/skip_ratchet.py\`, in the \`checker registry\` row,"
            echo "is what keeps the claim true rather than merely written down: it fails the"
            echo "build when a cluster-backed test is executed by no lane at all."
            echo ""
            echo "**Two pytest rows, on purpose.** The hermetic suite is split in two so the"
            echo "colours mean different things. \`pytest --crdb=none\` runs everything EXCEPT"
            echo "the assertions this repository declares red-by-design, so a red there is a"
            echo "regression and nothing else. \`RED BY DESIGN\` runs exactly those and inverts"
            echo "the verdict: it is green while they fail, and it goes RED the day one of them"
            echo "PASSES — which is the PL-2 transition, and the one event a suppressed red"
            echo "would have thrown away. Nothing is skipped, xfailed or excused."
            echo ""
            echo "**What this lane does NOT prove.** Nothing here touches a database, so no"
            echo "claim about refusal, fingerprint stability or time travel is tested by it."
            echo "Measured 2026-08-13: 974 of the 988 tests this lane SKIPS name a cluster, a"
            echo "node, a database or a DSN. \`qa/skip-ratchet.json\` records which lane runs"
            echo "each of them and enumerates the 730 that no lane runs at all, with a reason"
            echo "and an owner for every one."
            echo ""
            echo "\`cluster-tests.yml\` is the demo-api cluster lane,"
            echo "\`db.yml\` is the schema cluster lane, \`release-proof.yml\` is the merge-gate"
            echo "refusal, \`cloud-verify.yml\` is the only lane that has ever spoken to"
            echo "CockroachDB Cloud, and \`console.yml\` is the only lane that compiles a line"
            echo "of TypeScript. See \`docs/release/ci-map.md\`."
            echo ""
            echo "Nothing in this workflow contacts AWS or CockroachDB Cloud. Egress is"
            echo "denied by default in every job (PL-1, and the determinism boundary)."
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for result in \
            "${R_CHECKERS}" "${R_LOCKFILE}" "${R_FORMAT}" "${R_TYPES}" "${R_IMPORTS}" \
            "${R_REUSE}" "${R_TESTS}" "${R_RED}" "${R_SQL}" "${R_WORKFLOWS}" "${R_ADR}" ; do
            if [ "${result}" != "success" ]; then
              echo "a lane reported '${result}'"
              failed=$((failed + 1))
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "${failed} lane(s) did not pass"
            exit 1
          fi
