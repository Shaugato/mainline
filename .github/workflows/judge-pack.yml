# SPDX-License-Identifier: Apache-2.0
#
# THE JUDGE LANE — the Tier-3 questions a stranger pastes into their own MCP client,
# checked against the database they are questions about.
#
# WHY THIS IS A LANE AND NOT A TEST. `demo/VERIFY.md` tells a judge what to paste. It
# cannot tell anyone whether what it says to paste is still legal, still names columns
# that exist, or still FAILS where it must. Three things rot underneath a paste-ready
# prompt and every one of them is discovered in front of the judge unless CI sees it
# first:
#
#   1. a column is renamed in a migration and the prompt selects one the view does not
#      project — the judge gets an error where the page promised an answer;
#   2. the statement drifts past a Managed-MCP limit. At the limit the server TRUNCATES
#      rather than raising, so a partial answer about how much is currently blocked
#      arrives looking exactly like a complete one;
#   3. a negative stops being negative. The four statements at the bottom of the pack
#      MUST fail, and a negative suite that has quietly gone green is the worst artefact
#      in a repository because it reads as the strongest one in it.
#
# THE RED HALF IS THE POINT (PL-2). The first job plants one realistic violation per
# family — a renamed column, a negative made legal, a dropped index hint, a prefix
# widened to `IN (...)` — and requires the validator to fire on every one. A validator
# that has only ever been green asserts nothing about the pack it validates.
#
# NO CREDENTIAL. No cloud account, no cluster, no MCP key, no network beyond the
# checkout and PyPI. Four of the five jobs run on a stranger's laptop with `python` and
# PyYAML; `envelope-teeth` adds `httpx` and puts `packages/mainline-mcp/src` on
# PYTHONPATH, for one reason given in full at that job. The one check that WOULD need a
# key — running the pack over the live endpoint — is deliberately absent, because with no
# key it would exit 3 (NOT RUN) and a workflow that tolerates NOT RUN as success is the
# failure this whole pack exists to refuse.

name: judge-pack

on:
  push:
    # `master`, not `main` — the default branch of this repository, measured
    # 2026-08-10 with `gh repo view --json defaultBranchRef`. `main` does not exist,
    # so this trigger had never fired once. See claims.yml for the full note.
    branches: [master]
    paths:
      - "verticals/mainline/demo/judge/**"
      - "verticals/mainline/demo/VERIFY.md"
      - "verticals/mainline/demo/REFUSAL-STRINGS.yaml"
      - "verticals/mainline/db/migrations/**"
      - "scripts/demo/claim_hygiene.py"
      - "tests/unit/demo/judge/**"
      # The SECOND implementation of the envelope. `envelope-teeth` compares the judge
      # tree's constants against these, so a limit edited here has to re-run this lane or
      # the cross-check is stale in exactly the direction it exists to catch.
      - "packages/mainline-mcp/src/mainline_mcp/limits.py"
      - ".github/workflows/judge-pack.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: judge-pack-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  FORCE_COLOR: "1"

jobs:
  # ── 1 · the validator must be able to go RED before its green means anything ────────
  red:
    name: the validator fires on every planted violation
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the one dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6"

      - name: RED — one planted violation per family, all of them caught
        run: python verticals/mainline/demo/judge/cli.py self-test

  # ── 1b · the red half's own red half ───────────────────────────────────────────────
  #
  # `self-test` mutates a copy of the pack and asks whether the validator noticed. Two
  # things make that question answerable "yes" while proving nothing, and both are silent:
  #
  #   * THE MUTATION DID NOTHING. Six of the nine mutations are `str.replace` against an
  #     anchor in the shipped SQL (`"site_id, state,"`, `"@cue_scoped_idx"`,
  #     `"c.tenant_id = $1"`). Rename the column, drop the hint from the pack, and
  #     `replace` becomes a no-op that raises nothing — the document is unmutated and the
  #     family reports itself caught.
  #   * THE FINDING WAS ALREADY THERE. `_fired` asks only whether a `fail` finding with
  #     that `check` exists. If the REAL pack already fails that check, the family is
  #     reported caught no matter what the mutation did.
  #
  # So this job asserts, against the real pack: every mutation changes the document, every
  # mutation is caught, and NONE of the nine checks fails on the unmutated pack. Measured
  # 2026-08-10 on the pinned interpreter: baseline fail-findings `(none)`, nine mutations,
  # nine document changes, nine catches.
  anti-vacuity:
    name: the red half is red for the reason it claims
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the one dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6"

      - name: Each planted mutation changes the pack, is caught, and is absent without it
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import sys
          from pathlib import Path

          ROOT = Path.cwd().resolve()
          JUDGE_DIR = ROOT / "verticals" / "mainline" / "demo" / "judge"
          sys.path.insert(0, str(JUDGE_DIR.parent))

          from judge import drift as drift_mod
          from judge.pack import load_pack, parse_pack, validate_pack
          from judge.selftest import PLANTED

          SOURCE = JUDGE_DIR / "QUESTIONS.yaml"
          failures: list[str] = []
          raw = load_pack(SOURCE).raw


          def check(document):
              pack = parse_pack(document, source=SOURCE)
              findings = validate_pack(pack, repo_root=ROOT)
              findings.extend(drift_mod.check_drift(pack, repo_root=ROOT, judge_dir=JUDGE_DIR))
              return findings

          # ── 1 · the UNMUTATED pack fails none of the checks the self-test plants ─────
          baseline = {f.check for f in check(copy.deepcopy(dict(raw))) if f.severity == "fail"}
          print(f"fail-findings on the real pack: {sorted(baseline) or '(none)'}")
          for planted, _ in PLANTED:
              if planted.check in baseline:
                  failures.append(
                      f"VACUOUS FAMILY {planted.check}: the real pack already produces a "
                      f"`fail` for this check WITHOUT the planted `{planted.name}` violation, "
                      "so `self-test` would report it caught even if the mutation did nothing."
                  )

          # ── 2 · every planted mutation actually changes the document ─────────────────
          for planted, mutate in PLANTED:
              before = copy.deepcopy(dict(raw))
              after = copy.deepcopy(dict(raw))
              mutate(after)
              if before == after:
                  failures.append(
                      f"NO-OP MUTATION {planted.check}: `{planted.name}` left the pack "
                      "byte-identical. A `str.replace` whose anchor has been renamed away "
                      "plants nothing and raises nothing, and the self-test then passes "
                      "over an unmutated document."
                  )
                  continue
              print(f"  mutation changes the pack: {planted.check} ({planted.name})")

          # ── 3 · and each one, present, is reported by the validator ──────────────────
          for planted, mutate in PLANTED:
              mutated = copy.deepcopy(dict(raw))
              mutate(mutated)
              if not any(
                  f.check == planted.check and f.severity == "fail" for f in check(mutated)
              ):
                  failures.append(
                      f"UNCAUGHT FAMILY {planted.check}: the planted `{planted.name}` "
                      "violation was not reported by the validator."
                  )

          for failure in failures:
              print(f"::error title=judge-pack self-test is vacuous::{failure}")
          if failures:
              raise SystemExit(1)
          print("")
          print(
              f"{len(PLANTED)} planted families: each mutation changes the pack, each is "
              "caught, and none of them is reported on the unmutated pack."
          )
          PY

      - name: The tracked tree was never mutated
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=no)"
          if [ -n "${dirty}" ]; then
            echo "::error::this job mutated the checkout. Every plant belongs in a scratch copy."
            echo "${dirty}"
            exit 1
          fi
          echo "working tree clean — every mutation lived in an in-memory copy"

  # ── 1c · the envelope step's own red half ──────────────────────────────────────────
  #
  # WHY THIS JOB EXISTS. `cli.py envelope` prints eleven limit rows, two bound-EXPLAIN
  # rows and a cross-check line, and until 2026-08-13 its exit code depended on exactly
  # one of them — and that one had never once run here. Measured at `2adad9e` on a bare
  # interpreter, six inputs, exit codes as recorded in `docs/ci/anti-vacuity.md`:
  #
  #   unmutated                                          0    (correct)
  #   REQUEST_TIMEOUT_SECONDS 20 → 25 in envelope.py     0    printed DISAGREES, exited 0
  #   MAX_RESPONSE_BYTES 10240 → 10241 in envelope.py    0    without mainline_mcp, silent
  #   Q10's EXPLAIN padded to 16 546 chars (cap 16 384)  0    printed DOES NOT FIT, exited 0
  #   select_page_rows 25 → 50 in QUESTIONS.yaml         0    printed DISAGREES, exited 0
  #   both judge-side files moved to 10241 together      0    NOTHING in the lane noticed
  #
  # The last line is why this job installs one extra wheel. `mainline_mcp.limits` is the
  # SECOND implementation of the envelope, and `mainline_mcp/__init__.py` reaches `client`,
  # which imports `httpx`. With only PyYAML the import fails, the cross-check reports NOT
  # RUN, and the judge tree can redefine a documented Managed-MCP limit in both of its own
  # files with no third party left to contradict it — `validate --strict` included, which
  # was measured at 0 for that mutation too. So: httpx, PYTHONPATH at the checkout (not an
  # install of the workspace package — a path into the tree the judge already cloned), and
  # `--require-cross-check`, which refuses to call a run where the second implementation
  # was never consulted a pass.
  #
  # The plants live in a temporary copy. The last step asserts the checkout is untouched.
  envelope-teeth:
    name: the envelope step goes red for each row it prints
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML, and httpx so the second implementation can be imported
        run: python -m pip install --disable-pip-version-check "PyYAML>=6" "httpx>=0.27"

      - name: The cross-check RAN, and the constants agree
        # Not `envelope` alone. Alone it would print `NOT RUN … This is not a pass` and
        # exit 0, which is the sentence this lane's header calls the failure it exists to
        # refuse, recorded as a success.
        env:
          PYTHONPATH: packages/mainline-mcp/src
        run: python verticals/mainline/demo/judge/cli.py envelope --require-cross-check

      - name: With mainline-mcp off the path, --require-cross-check must REFUSE
        # The negative control for the control. If this exited 0 the step above would be
        # asserting nothing about whether the import succeeded.
        run: |
          set +e
          python verticals/mainline/demo/judge/cli.py envelope --require-cross-check
          status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::envelope --require-cross-check exited ${status} with the second"
            echo "implementation absent. Only 1 is correct: nothing contradicted the limits."
            exit 1
          fi
          echo "envelope --require-cross-check exited 1 with mainline-mcp absent, as required"

      - name: Five plants, five reds, each naming its own row
        env:
          PYTHONPATH: packages/mainline-mcp/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          ROOT = Path.cwd().resolve()
          JUDGE = ROOT / "verticals" / "mainline" / "demo" / "judge"


          def sub(path, old, new):
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(
                      f"NO-OP PLANT: the anchor {old!r} is no longer in {path.name}. A plant "
                      "whose anchor has been renamed away mutates nothing, and the control "
                      "then passes over an unmutated copy."
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          def timeout(d):
              sub(d / "envelope.py",
                  "REQUEST_TIMEOUT_SECONDS: Final = 20",
                  "REQUEST_TIMEOUT_SECONDS: Final = 25")


          def respbytes(d):
              sub(d / "envelope.py",
                  "MAX_RESPONSE_BYTES: Final = 10_240",
                  "MAX_RESPONSE_BYTES: Final = 10_241")


          def widen_q10(d):
              anchor = "       WHERE c.site_id = $1 AND c.scope_id = $2 AND c.facet = $3\n"
              sub(d / "QUESTIONS.yaml",
                  anchor,
                  anchor + "        AND c.facet <> '" + "x" * 6000 + "'\n")


          def page_rows(d):
              sub(d / "QUESTIONS.yaml", "select_page_rows: 25", "select_page_rows: 50")


          def both_sides(d):
              respbytes(d)
              sub(d / "QUESTIONS.yaml", "max_response_bytes: 10240", "max_response_bytes: 10241")


          # (name, mutate, the row that MUST be named in the output). The third element is
          # what makes this a control rather than a count: a plant that goes red for some
          # other reason is not evidence that the row it targets is gated.
          PLANTS = [
              ("envelope.py REQUEST_TIMEOUT_SECONDS 20 -> 25", timeout,
               "request_timeout_seconds", "DISAGREES"),
              ("envelope.py MAX_RESPONSE_BYTES 10240 -> 10241", respbytes,
               "MAX_RESPONSE_BYTES", "DISAGREEMENT"),
              ("QUESTIONS.yaml Q10 EXPLAIN padded past the 16384 cap", widen_q10,
               "Q10", "DOES NOT FIT"),
              ("QUESTIONS.yaml select_page_rows 25 -> 50", page_rows,
               "select_page_rows", "DISAGREES"),
              ("both judge-side files move to 10241 together", both_sides,
               "MAX_RESPONSE_BYTES", "DISAGREEMENT"),
          ]

          ARGV = ["envelope", "--require-cross-check", "--root", str(ROOT)]


          # The copy keeps the judge package at its REPO-RELATIVE DEPTH, and that is not
          # cosmetic. `cli.py` computes `REPO_ROOT = JUDGE_DIR.parents[3]` at import time.
          # A copy at `/tmp/<dir>/judge` has two parents, so the module raises `IndexError`
          # before argparse ever sees `--root` — every plant then exits 1 for a reason that
          # is not its plant. Run 31661375603 is that failure, caught by the two controls
          # below rather than by a human: `BASELINE COPY IS RED` plus five
          # `RED FOR THE WRONG REASON`. It reproduces only where the temporary directory is
          # shallow, which is why a Windows workstation ran it green.
          REL = ("verticals", "mainline", "demo", "judge")


          def run(mutate):
              tmp = Path(tempfile.mkdtemp(prefix="envelope-plant-"))
              dest = tmp.joinpath(*REL)
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copytree(JUDGE, dest, ignore=shutil.ignore_patterns("__pycache__"))
              if mutate is not None:
                  mutate(dest)
              proc = subprocess.run(
                  [sys.executable, str(dest / "cli.py"), *ARGV],
                  capture_output=True, text=True, encoding="utf-8", errors="replace",
                  env={**os.environ, "PYTHONIOENCODING": "utf-8"},
              )
              shutil.rmtree(tmp, ignore_errors=True)
              return proc.returncode, proc.stdout + proc.stderr

          failures = []

          # ── 0 · an UNMUTATED copy, in the same temporary directory, must be GREEN ────
          # Without this every red below could be the copy itself rather than the plant.
          code, out = run(None)
          print(f"unmutated copy: exit {code}")
          if code != 0:
              failures.append(
                  "BASELINE COPY IS RED: an unmutated copy of the judge package exits "
                  f"{code}, so every plant below would be red for a reason that is not its "
                  "plant.\n" + out
              )

          for name, mutate, needle, verdict in PLANTS:
              code, out = run(mutate)
              named = needle in out and verdict in out
              print(f"  plant: {name} -> exit {code}, names {needle}/{verdict}: {named}")
              if code != 1:
                  failures.append(
                      f"UNGATED ROW [{name}]: `envelope` exited {code}. 1 is the only correct "
                      f"answer — the command printed a {verdict} row and called it a pass.\n"
                      + out
                  )
              elif not named:
                  failures.append(
                      f"RED FOR THE WRONG REASON [{name}]: exit 1, but the output never named "
                      f"{needle!r} with a {verdict!r} verdict. The plant is not what turned "
                      "this red.\n" + out
                  )

          for failure in failures:
              print(f"::error title=judge-pack envelope step is vacuous::{failure}")
          if failures:
              raise SystemExit(1)
          print("")
          print(
              f"{len(PLANTS)} plants: an unmutated copy is green, every plant is red, and "
              "every red names the row its plant targets."
          )
          PY

      - name: The tracked tree was never mutated
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=no)"
          if [ -n "${dirty}" ]; then
            echo "::error::this job mutated the checkout. Every plant belongs in a scratch copy."
            echo "${dirty}"
            exit 1
          fi
          echo "working tree clean — every plant lived in a temporary copy"

  # ── 2 · the pack is legal, and it still agrees with the repository ─────────────────
  green:
    name: envelope, negatives, and agreement with the migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    # Every red half first. `red` proves the validator fires; `anti-vacuity` proves it
    # fires *because* of the plant; `envelope-teeth` proves the envelope step below can
    # fail at all, which until 2026-08-13 it could not. A green that runs before any of
    # them is a green nobody has established the meaning of.
    needs: [red, anti-vacuity, envelope-teeth]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the one dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6"

      - name: The questions, printed into the log
        # So a reviewer reading a red build can see WHICH question broke without opening
        # the YAML.
        run: python verticals/mainline/demo/judge/cli.py list

      - name: The limits, the bound EXPLAIN lengths, and the cross-check
        # Deliberately WITHOUT httpx and without PYTHONPATH: this is the judge's own
        # environment, `python` and PyYAML, and the command must be usable in it. It gates
        # on every row it can check from here — declared-limit agreement and bound length —
        # and says in its last line that the cross-check did not run rather than implying
        # it passed. `envelope-teeth` is where the cross-check is required and where all
        # five plants are shown to fire.
        run: python verticals/mainline/demo/judge/cli.py envelope

      - name: GREEN — every prompt is legal, every negative is refused, nothing has drifted
        # `--strict` promotes a warn to a failure. A warn from this validator means an
        # AUTHORITY WAS ABSENT and a check did not run; in this repository every one of
        # them is present, so a warn is a loss of coverage rather than a cosmetic note.
        run: python verticals/mainline/demo/judge/cli.py validate --strict --verbose

      - name: GREEN — the page a judge reads matches the pack a validator checks
        run: python verticals/mainline/demo/judge/cli.py render --check

  # ── 3 · running the pack with nothing to talk to must NOT look like success ────────
  not-run-is-not-a-pass:
    name: a run with no cluster exits 3, never 0
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the one dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6"

      - name: Both channels report NOT RUN and exit 3
        # This is the assertion that keeps the runner honest. A green POSITIVE run against
        # no cluster asserts nothing; a green NEGATIVE run against no cluster asserts the
        # opposite of what it claims, because "crdb_internal was unreachable" is trivially
        # true when nothing at all was reachable.
        env:
          TRAPPOINT_DSN: ""
          MAINLINE_DSN: ""
          COCKROACH_URL: ""
          MAINLINE_MCP_API_KEY: ""
          MAINLINE_MCP_CLUSTER_ID: ""
        run: |
          set +e
          for channel in sql mcp; do
            python verticals/mainline/demo/judge/cli.py run --via "$channel"
            status=$?
            if [ "$status" -ne 3 ]; then
              echo "::error::run --via $channel exited $status with nothing to talk to."
              echo "Only 3 (NOT RUN) is correct here. 0 would be a pass nobody earned."
              exit 1
            fi
            echo "run --via $channel exited 3, as required"
          done
