# SPDX-FileCopyrightText: 2026 MAINLINE contributors
# SPDX-License-Identifier: Apache-2.0
#
# THE SUPPLY CHAIN, and one job in it that the loudest claim in this product rests on.
#
# ARCHITECTURE.md §8.2 says: no model can reach the merge gate. That sentence is
# asserted on four surfaces, and three of them are inside the repository looking at
# itself — an import-linter contract, an AST scan, a `sys.modules` walk after import.
# All three can be true of a build whose LOCKFILE nevertheless resolves `boto3` into the
# image, because a runtime absence with a declared dependency is still a supply-chain
# reach: the wheel is in the image, the transitive resolution pins it, and one future
# `import` turns it on with no dependency review at all.
#
# `gate-svc-has-no-model-sdk`, below, is the fourth surface. It reads the RESOLVED SET —
# what `uv.lock` actually installs — and refuses a model SDK anywhere in it. It is a
# named job with a named failure message for exactly one reason: when it goes red, the
# person reading the run must understand immediately that a security claim in the
# product documentation has become false, not that a lint rule fired.
#
# WHY THIS FILE DID NOT EXIST UNTIL 2026-08-10. It did not. Neither did `evidence/sbom/`
# — although `boundary.yml` has been gating on that path for days, which means it has
# been gating on nothing. Measured in docs/leads/quality-repair.md §1.7.
#
# NO NETWORK BEYOND THE INDEX. The SBOM is generated from `uv.lock` by reading it; the
# emitter below is forty lines of `json` and needs nothing installed. `pip-audit` is the
# one step that must reach out, to PyPI, for the advisory database — and it is the last
# step, in its own job, so that a PyPI outage cannot make the SBOM lane look broken.
#
# WHY `release-assets.githubusercontent.com:443` IS ON EVERY ALLOW-LIST BELOW.
#
# This lane was GREEN at `b0fe884` and all three of its jobs were RED at `1d41442` with
# no change to this file, to `uv.lock` or to the setup action in between. Run
# 31596446007, quoted from the harden-runner post-step's own agent log:
#
#     Downloading uv from "https://github.com/astral-sh/uv/releases/download/0.12.3/…"
#     Wed, 12 Aug 2026 12:26:48 GMT:domain not allowed: release-assets.githubusercontent.com.
#     ##[error]connect ECONNREFUSED 54.185.253.63:443
#
# GitHub now serves release-asset bodies from `release-assets.githubusercontent.com`
# rather than from `objects.githubusercontent.com`. The request to `github.com` is a
# redirect; the body comes from a host no list in this repository named, so
# `egress-policy: block` refused it — correctly. Nothing regressed here; the destination
# moved underneath a correct deny-list, which is what a deny-list is FOR.
#
# Two things this fix deliberately is not. It is not `egress-policy: audit` — that would
# retire the assertion instead of updating it. And it is not a version pin on `uv`: the
# URL in the log ALREADY carries an exact version (`0.12.3`), because `latest` had been
# resolved successfully against `api.github.com` one line earlier. Pinning `uv-version`
# changes which tag is fetched and nothing at all about which host serves it, so it
# would have left all three jobs exactly as red.

name: supply-chain

on:
  push:
    # `master`, not `main`. Measured 2026-08-10: `git branch --show-current` is `master`
    # and `gh run list --branch main` is empty, so every push-triggered run this file
    # ever declared has been declared against a branch that does not exist. The Actions
    # tab defaults to the default branch; a lane that never runs there is invisible
    # whatever colour it would have been.
    branches: [master]
    paths:
      - "**/pyproject.toml"
      - "uv.lock"
      - ".github/workflows/supply-chain.yml"
      - ".github/actions/setup-workspace/**"
  pull_request:
  schedule:
    # Weekly. A dependency does not have to change for a NEW advisory to be published
    # against the version already locked, which is the whole reason an audit is a
    # scheduled job and not only a push job.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  FORCE_COLOR: "1"

jobs:
  # ---------------------------------------------------------------------------------
  lock-fresh:
    name: uv.lock is fresh and describes this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deny egress except to the package indexes
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          sync: "false"

      - name: uv lock --check
        run: uv lock --check

      - name: Re-locking must not change the file
        # `uv lock --check` and "a re-lock is a no-op" are not the same assertion, and
        # the difference is the one that bit this repository: the lockfile's `[manifest]
        # members` listed SEVEN distributions against twenty-seven on disk. A check that
        # only validates internal consistency can pass over a lockfile that has stopped
        # describing the workspace. Running the resolver and diffing the result is the
        # assertion that cannot be satisfied by a stale file.
        run: |
          set -euo pipefail
          cp uv.lock uv.lock.before
          uv lock
          if ! diff -u uv.lock.before uv.lock; then
            echo "::error file=uv.lock::re-locking changed uv.lock — the committed lockfile is stale"
            echo "Run \`uv lock\` locally and commit the result."
            exit 1
          fi
          echo "uv.lock is byte-identical after a re-lock"
          rm -f uv.lock.before

  # ---------------------------------------------------------------------------------
  sbom:
    name: an SBOM for every distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Deny egress except to the package indexes
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          sync: "false"

      - name: Export the resolved set for each distribution
        # `uv export` reads `uv.lock` and resolves nothing, so this step needs no
        # network at all. `--frozen` makes that explicit: if the lockfile cannot answer,
        # the step fails rather than quietly reaching for an index.
        run: |
          set -euo pipefail
          mkdir -p build/sbom-input
          python3 - <<'PY' > build/sbom-input/distributions.txt
          import pathlib
          import tomllib

          roots = sorted(pathlib.Path(".").glob("packages/*/pyproject.toml"))
          roots += sorted(pathlib.Path(".").glob("verticals/*/packages/*/pyproject.toml"))
          for pyproject in roots:
              data = tomllib.loads(pyproject.read_text(encoding="utf-8"))
              name = data.get("project", {}).get("name")
              if name:
                  print(f"{name}\t{data['project'].get('version', '0.0.0')}\t{pyproject.parent.as_posix()}")
          PY
          count=0
          while IFS=$'\t' read -r name version directory; do
            [ -n "${name}" ] || continue
            echo "  ${name} ${version}  (${directory})"
            uv export --frozen --no-dev --package "${name}" \
              --format requirements-txt \
              --output-file "build/sbom-input/${name}.requirements.txt"
            count=$((count + 1))
          done < build/sbom-input/distributions.txt
          echo "exported ${count} distribution(s)"
          test "${count}" -gt 0

      - name: Emit CycloneDX 1.6
        # Written here rather than pulled from an emitter package, for two reasons that
        # are not "not-invented-here". (1) An SBOM produced by a tool that is itself an
        # unaudited dependency is an odd artefact to offer as supply-chain evidence.
        # (2) The timestamp is taken from the COMMIT, not from the clock, so two runs of
        # the same commit produce byte-identical SBOMs — which is what makes a diff
        # between two commits mean something.
        run: |
          set -euo pipefail
          mkdir -p evidence/sbom
          COMMIT_EPOCH="$(git log -1 --pretty=%ct)" \
          COMMIT_SHA="$(git rev-parse HEAD)" \
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import uuid

          OUT = pathlib.Path("evidence/sbom")
          SRC = pathlib.Path("build/sbom-input")
          stamp = datetime.datetime.fromtimestamp(
              int(os.environ["COMMIT_EPOCH"]), tz=datetime.timezone.utc
          ).isoformat().replace("+00:00", "Z")
          commit = os.environ["COMMIT_SHA"]
          lock_digest = hashlib.sha256(pathlib.Path("uv.lock").read_bytes()).hexdigest()
          # A stable namespace so `serialNumber` is a function of (lockfile, package)
          # rather than of the moment the run happened.
          NAMESPACE = uuid.uuid5(uuid.NAMESPACE_URL, "https://github.com/Shaugato/mainline")

          # `name==version` with optional extras and an optional environment marker,
          # which is the entire grammar `uv export` emits for a fully-pinned set.
          PINNED = re.compile(r"^([A-Za-z0-9][A-Za-z0-9._-]*)(?:\[[^\]]*\])?==([^\s;]+)")
          HASH = re.compile(r"--hash=sha256:([0-9a-f]{64})")

          written = []
          for line in pathlib.Path(SRC / "distributions.txt").read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              name, version, directory = line.split("\t")
              requirements = SRC / f"{name}.requirements.txt"
              components = []
              seen = set()
              current = None
              for raw in requirements.read_text(encoding="utf-8").splitlines():
                  text = raw.strip()
                  # Local/editable entries are the workspace itself, not third-party
                  # supply. They are recorded in `metadata.component`, not as parts.
                  if not text or text.startswith("#") or text.startswith("-e ") or "file://" in text:
                      current = None
                      continue
                  match = PINNED.match(text)
                  if match:
                      dep_name, dep_version = match.group(1), match.group(2)
                      key = (dep_name.lower(), dep_version)
                      if key in seen:
                          current = None
                          continue
                      seen.add(key)
                      purl = f"pkg:pypi/{dep_name.lower()}@{dep_version}"
                      current = {
                          "type": "library",
                          "bom-ref": purl,
                          "name": dep_name,
                          "version": dep_version,
                          "purl": purl,
                          "hashes": [],
                      }
                      components.append(current)
                      continue
                  found = HASH.search(text)
                  if found and current is not None:
                      current["hashes"].append({"alg": "SHA-256", "content": found.group(1)})

              for component in components:
                  if not component["hashes"]:
                      del component["hashes"]

              root_purl = f"pkg:pypi/{name}@{version}"
              document = {
                  "bomFormat": "CycloneDX",
                  "specVersion": "1.6",
                  "serialNumber": f"urn:uuid:{uuid.uuid5(NAMESPACE, f'{lock_digest}:{name}')}",
                  "version": 1,
                  "metadata": {
                      "timestamp": stamp,
                      "component": {
                          "type": "library",
                          "bom-ref": root_purl,
                          "name": name,
                          "version": version,
                          "purl": root_purl,
                      },
                      "properties": [
                          {"name": "mainline:commit", "value": commit},
                          {"name": "mainline:uv-lock-sha256", "value": lock_digest},
                          {"name": "mainline:source-directory", "value": directory},
                          {"name": "mainline:resolved-from", "value": "uv.lock (uv export --frozen --no-dev)"},
                      ],
                  },
                  "components": sorted(components, key=lambda c: (c["name"].lower(), c["version"])),
              }
              target = OUT / f"{name}.cdx.json"
              target.write_text(json.dumps(document, indent=2, sort_keys=False) + "\n", encoding="utf-8")
              written.append((name, len(components)))

          print(f"{len(written)} SBOM(s) written to {OUT}/")
          for name, count in sorted(written):
              print(f"  {count:4d} component(s)  {name}")

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## SBOM\n\n")
              handle.write(f"CycloneDX 1.6, {len(written)} distribution(s), resolved from `uv.lock`\n")
              handle.write(f"(sha256 `{lock_digest[:16]}…`) at commit `{commit[:12]}`.\n\n")
              handle.write("| distribution | third-party components |\n|---|---:|\n")
              for name, count in sorted(written):
                  handle.write(f"| `{name}` | {count} |\n")
          PY

      - name: REUSE needs a licence for generated evidence too
        # `evidence/sbom/*.json` cannot carry a comment header, so REUSE resolves it
        # through a `.license` sidecar. Writing it here rather than committing one keeps
        # the generated tree self-describing whether or not it is checked in.
        run: |
          set -euo pipefail
          for sbom in evidence/sbom/*.cdx.json; do
            {
              echo "SPDX-FileCopyrightText: 2026 MAINLINE contributors"
              echo "SPDX-License-Identifier: Apache-2.0"
            } > "${sbom}.license"
          done
          ls -1 evidence/sbom/

      - name: Upload the SBOM tree
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: evidence/sbom/
          if-no-files-found: error
          retention-days: 90

      - name: Note whether the committed tree matches
        # `boundary.yml` gates on `evidence/sbom/**`, and until this workflow existed
        # that path did not exist either — so the gate was a gate on nothing. This step
        # does not FAIL on an uncommitted tree, because committing generated artefacts
        # is a policy decision this workflow does not own; it makes the state visible so
        # the decision is made deliberately rather than by omission.
        if: always()
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch evidence/sbom >/dev/null 2>&1; then
            echo "evidence/sbom/ is tracked; comparing with what this run generated"
            git status --porcelain evidence/sbom/
          else
            echo "::notice::evidence/sbom/ is NOT tracked in git. boundary.yml gates on that path, so the gate is currently a gate on nothing. The SBOMs for this commit are attached as the 'sbom-cyclonedx' artifact."
          fi

  # ---------------------------------------------------------------------------------
  # THE NAMED JOB. Read its failure message before changing anything about it.
  # ---------------------------------------------------------------------------------
  gate-svc-has-no-model-sdk:
    name: SECURITY CLAIM — mainline-gate-svc's dependency closure contains no model SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Deny egress except to the package indexes
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          packages: "mainline-gate-svc"
          cache-suffix: "gate-svc"

      # ---------------------------------------------------------------------------
      # TWO WITNESSES, because one of them could not see the graph it was asked about.
      #
      # Measured on runs 31372088231, 31372058080, 31371945797, 31371788606,
      # 31371718663 and 31371705079 (2026-08-10): this job failed on its own anti-
      # vacuity guard every time — `the resolved set did not contain ['mainline-domain',
      # 'trappoint-core']` — and the SECURITY-CLAIM-BROKEN branch was never once taken.
      # The boundary was not observably broken; the INSTRUMENT could not see the graph.
      #
      # Why. `uv export --format requirements-txt` emits third-party distributions as
      # `name==version` and workspace members as EDITABLE PATH entries:
      #
      #     -e ./packages/trappoint-core
      #     -e ./verticals/mainline/packages/mainline-domain
      #
      # and the old parser skipped every line starting with `-`. So
      # `REQUIRED = {"psycopg", "trappoint-core", "mainline-domain"}` was unsatisfiable
      # by construction: the guard could never have passed non-vacuously with that
      # command, which means it also could never have reported a real breach.
      #
      # The repair is two independent witnesses, and BOTH must name the workspace
      # members and BOTH must be free of the deny-list:
      #
      #   witness one  `uv export` — the pinned resolution, versions and hashes. Its
      #                editable path entries are now resolved to distribution names by
      #                reading the `pyproject.toml` they point at, which is the honest
      #                reading: the export DOES name the workspace members, as paths.
      #   witness two  `uv tree` — the workspace graph, which names `trappoint-core`
      #                and `mainline-domain` as nodes and cannot be satisfied by a
      #                resolution that dropped them.
      #
      # The guard is strictly stronger than it was: it now fires if EITHER witness
      # loses a workspace member, and the model deny-list is checked against both.
      # ---------------------------------------------------------------------------
      - name: Witness one — the pinned resolution (uv export)
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --package mainline-gate-svc \
            --format requirements-txt --output-file gate-svc.requirements.txt
          echo "--- uv export --frozen --no-dev --package mainline-gate-svc ---"
          cat gate-svc.requirements.txt
          echo "--- end of witness one ---"

      - name: Witness two — the workspace graph (uv tree)
        # `uv tree` reads the same `uv.lock` under `--frozen`, so this adds a reading of
        # the graph, not a second resolution. It is the witness that can see a workspace
        # edge; the export is the witness that can see a pin. Neither alone is enough.
        run: |
          set -euo pipefail
          uv tree --frozen --no-dev --package mainline-gate-svc \
            > gate-svc.tree.txt
          echo "--- uv tree --frozen --no-dev --package mainline-gate-svc ---"
          cat gate-svc.tree.txt
          echo "--- end of witness two ---"
          test -s gate-svc.tree.txt

      - name: THE ASSERTION, written to a file so the red half and the green half are one
        # This is the surface the in-repository checks cannot see. `.importlinter`
        # contract 5 checks the IMPORT graph. `mainline_boundary.astscan` checks the
        # SOURCE. `test_no_model_in_closure.py` checks `sys.modules` and
        # `importlib.metadata`. All four can be green while `uv.lock` still resolves a
        # model SDK into the image that runs the gate — which is a reach, because the
        # wheel is present, the SBOM shows it, and a single future import activates it
        # with no review.
        #
        # The deny-list is repeated here rather than imported from the test module, and
        # that repetition is deliberate: a check and the thing it checks must not share
        # a failure mode. If someone edits the list in the test to make the test pass,
        # this job still fails.
        #
        # WHY IT IS A FILE NOW. Until this wave the assertion had never been shown to
        # REFUSE anything. The anti-vacuity guard below fired six times and the
        # SECURITY-CLAIM-BROKEN branch had never once been taken, so the branch that the
        # §8.2 claim actually rests on was untested code. The next two steps run this same
        # file against mutated copies of the two witnesses and require it to refuse; the
        # step after that runs it against the real ones. One definition, three uses.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anti-vacuity"
          cat > "$RUNNER_TEMP/anti-vacuity/assert_resolved_set.py" <<'PY'
          """Refuse a model SDK anywhere in mainline-gate-svc's RESOLVED set.

              python assert_resolved_set.py EXPORT_FILE TREE_FILE [--no-summary]
          """
          import os
          import pathlib
          import re
          import sys
          import tomllib

          MODEL_DISTRIBUTIONS = {
              "anthropic", "anthropic-bedrock",
              "boto3", "boto3-stubs", "botocore",
              "cohere",
              "google-generativeai",
              "huggingface-hub",
              "langchain", "langchain-community", "langchain-core",
              "llama-index", "llama-index-core",
              "mistralai",
              "ollama",
              "openai",
              "sentence-transformers",
              "strands", "strands-agents",
              "tokenizers",
              "torch",
              "transformers",
          }
          # Without these the closure could be reported clean because it was empty,
          # which is the exact failure mode this job exists to refuse in the code it
          # guards. A vacuous pass is the most dangerous kind. Both witnesses must
          # satisfy this set independently.
          REQUIRED = {"psycopg", "trappoint-core", "mainline-domain"}

          PINNED = re.compile(r"^([A-Za-z0-9][A-Za-z0-9._-]*)(?:\[[^\]]*\])?==\s*([^\s;]+)")
          EDITABLE = re.compile(r"^(?:-e|--editable)\s+(\S+)")
          DIRECT = re.compile(r"^([A-Za-z0-9][A-Za-z0-9._-]*)(?:\[[^\]]*\])?\s*@\s*(\S+)")
          # `uv tree` draws with U+2502 U+251C U+2514 U+2500 and prints `name vVERSION`.
          # ASCII fallbacks and the trailing `(*)` de-duplication marker are tolerated.
          TREE_NODE = re.compile(
              r"^[\s│├└─|+\\-]*"
              r"([A-Za-z0-9][A-Za-z0-9._-]*)(?:\[[^\]]*\])?\s+v[0-9]"
          )

          def normalise(name: str) -> str:
              return re.sub(r"[-_.]+", "-", name).lower()

          def workspace_name(reference: str) -> str | None:
              """Resolve `-e ./packages/trappoint-core` to the name it declares.

              This is the line the old parser threw away, and throwing it away is what
              made REQUIRED unsatisfiable. A path entry is not "not a distribution"; it
              is a distribution named by its directory, and the directory says its name.
              """
              text = reference
              if "file://" in text:
                  text = text.split("file://", 1)[1]
              pyproject = pathlib.Path(text) / "pyproject.toml"
              if not pyproject.is_file():
                  return None
              declared = tomllib.loads(pyproject.read_text(encoding="utf-8"))
              name = declared.get("project", {}).get("name")
              return normalise(name) if name else None

          export_path = pathlib.Path(sys.argv[1])
          tree_path = pathlib.Path(sys.argv[2])
          want_summary = "--no-summary" not in sys.argv[3:]

          export_names: set[str] = set()
          pins: list[tuple[str, str]] = []
          workspace: list[tuple[str, str]] = []
          unreadable: list[str] = []
          for line in export_path.read_text(encoding="utf-8").splitlines():
              text = line.strip()
              if not text or text.startswith("#") or text.startswith("--hash"):
                  continue
              pin = PINNED.match(text)
              if pin:
                  export_names.add(normalise(pin.group(1)))
                  marker = text.partition(";")[2].rstrip("\\").strip()
                  pins.append((f"{normalise(pin.group(1))}=={pin.group(2)}", marker))
                  continue
              editable = EDITABLE.match(text)
              if editable:
                  found = workspace_name(editable.group(1))
                  if found is None:
                      unreadable.append(text)
                  else:
                      export_names.add(found)
                      workspace.append((found, editable.group(1)))
                  continue
              direct = DIRECT.match(text)
              if direct:
                  export_names.add(normalise(direct.group(1)))
                  workspace.append((normalise(direct.group(1)), direct.group(2)))

          tree_names: set[str] = set()
          for line in tree_path.read_text(encoding="utf-8").splitlines():
              node = TREE_NODE.match(line.rstrip())
              if node:
                  tree_names.add(normalise(node.group(1)))

          witnesses = (
              ("uv export (the pinned resolution)", export_names),
              ("uv tree (the workspace graph)", tree_names),
          )
          denied_names = {normalise(name) for name in MODEL_DISTRIBUTIONS}

          for label, names in witnesses:
              print(f"{label}: {len(names)} distribution(s)")
              for name in sorted(names):
                  print(f"    {name}")

          # ---- the job summary, written BEFORE any exit so a red run shows it too ----
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY") if want_summary else None
          if summary_path:
              versions = dict(pin.split("==", 1) for pin, _ in pins)
              markers = {pin.split("==", 1)[0]: marker for pin, marker in pins}
              with pathlib.Path(summary_path).open("a", encoding="utf-8") as handle:
                  handle.write("## mainline-gate-svc — the whole dependency closure\n\n")
                  handle.write(
                      f"{len(export_names)} distribution(s): "
                      f"{len(workspace)} workspace member(s) and {len(versions)} "
                      "third-party distribution(s). Listed in full, because a clean "
                      "result and an EMPTY result look identical when only the verdict "
                      "is printed — and this job spent six runs reporting the second "
                      "while appearing to report the first.\n\n"
                  )
                  handle.write("| distribution | version | kind | note |\n|---|---|---|---|\n")
                  for name, reference in sorted(workspace):
                      handle.write(f"| `{name}` | — | workspace | `{reference}` |\n")
                  for name in sorted(versions):
                      marker = markers.get(name, "")
                      cell = f"marker: `{marker}`" if marker else ""
                      handle.write(f"| `{name}` | `{versions[name]}` | third-party | {cell} |\n")
                  handle.write("\n")
                  only_export = sorted(export_names - tree_names)
                  only_tree = sorted(tree_names - export_names)
                  handle.write(
                      "Two witnesses: `uv export` (pins) and `uv tree` (workspace edges). "
                      f"Named only by the export: {only_export or 'nothing'}. "
                      f"Named only by the tree: {only_tree or 'nothing'}. "
                      "The export is universal and carries platform-marked entries; the "
                      "tree is resolved for this platform, so a marked entry appearing in "
                      "one and not the other is expected and is not a disagreement about "
                      "the graph.\n"
                  )

          refused = False

          if unreadable:
              print("::error title=vacuous assertion::the export named a local entry whose "
                    f"pyproject.toml could not be read: {unreadable}")
              print("An unresolvable path entry is a hole in the closure, not an absence.")
              refused = True

          for label, names in witnesses:
              missing = sorted(REQUIRED - names)
              if missing:
                  print(f"::error title=vacuous assertion::{label} did not name {missing}, "
                        "so a clean result from it would have been measured over the wrong "
                        "set")
                  print(f"  what it did name: {sorted(names)}")
                  print("  This guard is not a formality: it is the reason six earlier runs "
                        "of this job were red rather than falsely green.")
                  refused = True

          for label, names in witnesses:
              denied = sorted(names & denied_names)
              if denied:
                  print("::error title=SECURITY CLAIM BROKEN::mainline-gate-svc now resolves "
                        f"model SDK distribution(s) {denied}, seen by {label}")
                  print("")
                  print("ARCHITECTURE.md §8.2 states that no model can reach the merge gate.")
                  print("That sentence is now FALSE, and it is false in the documentation, the")
                  print("README and the judge pack, not merely in a lint rule. The wheel is in")
                  print("the image the gate runs from; a single `import` away from being live,")
                  print("with no dependency review between here and there.")
                  print("")
                  print("This job is the assertion that claim rests on. Do not silence it.")
                  print("Remove the dependency, or withdraw the claim everywhere it is made.")
                  refused = True

          if refused:
              sys.exit(1)

          print("")
          print(f"both witnesses name {sorted(REQUIRED)}; neither names any of the "
                f"{len(denied_names)} denied model distributions")
          print("no model SDK in the resolved set; the §8.2 claim holds on this surface")
          PY
          echo "wrote $RUNNER_TEMP/anti-vacuity/assert_resolved_set.py"

      - name: RED — four planted violations, each refused BY NAME
        # The witnesses are copied to $RUNNER_TEMP and mutated there. The tracked tree is
        # never touched, and the step after this one runs the same file against the REAL
        # witnesses — so a mutation cannot leak into the green half, because the green half
        # reads different paths.
        #
        # `--no-summary` on the red runs: the summary block describes the closure of
        # `mainline-gate-svc`, and writing a *planted* closure into the job summary would
        # put a fabricated dependency table next to the real one under the same heading.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess
          import sys

          TEMP = pathlib.Path(os.environ["RUNNER_TEMP"])
          CHECKER = TEMP / "anti-vacuity" / "assert_resolved_set.py"
          WORK = TEMP / "resolved-set-mutant"
          WORK.mkdir(parents=True, exist_ok=True)
          EXPORT = pathlib.Path("gate-svc.requirements.txt")
          TREE = pathlib.Path("gate-svc.tree.txt")
          failures: list[str] = []


          def run(export, tree):
              done = subprocess.run(
                  [sys.executable, str(CHECKER), str(export), str(tree), "--no-summary"],
                  capture_output=True, text=True, check=False,
              )
              return done.returncode, done.stdout + done.stderr


          def fresh(family):
              export = WORK / f"{family}.requirements.txt"
              tree = WORK / f"{family}.tree.txt"
              shutil.copyfile(EXPORT, export)
              shutil.copyfile(TREE, tree)
              return export, tree

          # The untouched copies first. Without this, "it exited 1" below could be an
          # artefact of copying rather than of the plant.
          clean_export, clean_tree = fresh("clean")
          code, output = run(clean_export, clean_tree)
          print(f"unmutated copies exit: {code}")
          if code != 0:
              failures.append(
                  "COPIES ARE NOT CLEAN: byte copies of the two witnesses are already "
                  f"refused, so no refusal below is attributable to a plant:\n{output[-800:]}"
              )

          FAMILIES = (
              ("model-sdk-in-the-export", "SECURITY CLAIM BROKEN", "boto3"),
              ("model-sdk-in-the-tree", "SECURITY CLAIM BROKEN", "anthropic"),
              ("workspace-member-lost", "vacuous assertion", "mainline-domain"),
              ("unreadable-path-entry", "vacuous assertion", "could not be read"),
          )

          for family, title, needle in FAMILIES:
              export, tree = fresh(family)
              if family == "model-sdk-in-the-export":
                  with export.open("a", encoding="utf-8") as handle:
                      handle.write("boto3==1.40.71\n")
              elif family == "model-sdk-in-the-tree":
                  with tree.open("a", encoding="utf-8") as handle:
                      handle.write("    └── anthropic v0.75.0\n")
              elif family == "workspace-member-lost":
                  kept = [
                      line for line in export.read_text(encoding="utf-8").splitlines()
                      if "mainline-domain" not in line
                  ]
                  export.write_text("\n".join(kept) + "\n", encoding="utf-8")
              elif family == "unreadable-path-entry":
                  with export.open("a", encoding="utf-8") as handle:
                      handle.write("-e ./packages/there-is-no-such-distribution\n")

              code, output = run(export, tree)
              if code == 0:
                  failures.append(
                      f"PLANTED FAMILY {family}: the assertion ACCEPTED it. The §8.2 claim "
                      "rests on this branch and this branch does not fire."
                  )
              elif title not in output or needle not in output:
                  failures.append(
                      f"PLANTED FAMILY {family}: exit {code}, but the message does not carry "
                      f"both {title!r} and {needle!r}. An assertion that a program failed, "
                      "without checking WHY, passes when the program fails to start.\n"
                      + output[-800:]
                  )
              else:
                  print(f"  REFUSED  {family}: {title} / {needle}")

          for failure in failures:
              print(f"::error title=resolved-set assertion is vacuous::{failure}")
          if failures:
              raise SystemExit(1)
          print("")
          print(f"{len(FAMILIES)} planted violations, every one refused by name. The "
                "SECURITY-CLAIM-BROKEN branch is now executed on every run of this lane, "
                "which it had never been before 2026-08-10.")
          PY

      - name: GREEN — the assertion, over the REAL resolved set
        # The same file, the tracked witnesses, and the job summary written for real.
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/anti-vacuity/assert_resolved_set.py" \
            gate-svc.requirements.txt gate-svc.tree.txt

      - name: The tracked tree was never mutated
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=no)"
          if [ -n "${dirty}" ]; then
            echo "::error::this job mutated the checkout. Every plant belongs in a scratch copy."
            echo "${dirty}"
            exit 1
          fi
          echo "working tree clean — every planted violation lived under \$RUNNER_TEMP"

      - name: The other surfaces, as the gate service itself asserts them
        # Runtime `sys.modules`, declared `importlib.metadata` walked transitively with
        # requested extras followed, source AST, and the environment check that refuses
        # to start holding an AWS credential — plus the planted-reach tests that make all
        # of them red on demand (PL-2), and the pinned fifteen-name closure that refuses
        # growth no deny-list would catch. Measured locally on 2026-08-10: 61 passed in
        # 2.57 s (was 40 before this wave).
        run: |
          uv run --frozen --package mainline-gate-svc pytest \
            verticals/mainline/packages/mainline-gate-svc/tests/test_no_model_in_closure.py \
            -q --no-header

      - name: Record the claim and every surface that asserts it
        if: always()
        run: |
          {
            echo "## the §8.2 claim: no model can reach the merge gate"
            echo ""
            echo "| surface | mechanism | where |"
            echo "|---|---|---|"
            echo "| import graph | forbidden-module contract | \`.importlinter\` contract 5, run by \`ci.yml\` |"
            echo "| source | AST scan for a model import | \`test_no_model_in_closure.py\` |"
            echo "| runtime | \`sys.modules\` after a fresh import | \`test_no_model_in_closure.py\` |"
            echo "| declared | \`importlib.metadata.requires\`, transitively, extras followed | \`test_no_model_in_closure.py\` |"
            echo "| **resolved set** | **the locked install: \`uv export\` AND \`uv tree\`** | **this job** |"
            echo ""
            echo "The last is the one the others cannot see: a dependency that is RESOLVED"
            echo "but not yet imported is absent from the import graph, absent from the AST,"
            echo "and absent from \`sys.modules\` — and present in the image."
            echo ""
            echo "It is asserted with TWO witnesses. \`uv export\` emits workspace members as"
            echo "editable PATH entries rather than as \`name==version\` pins, so a parser that"
            echo "reads only pins cannot satisfy the anti-vacuity requirement and the check"
            echo "can never be non-vacuous. \`uv tree\` names workspace edges directly. Both"
            echo "must name \`trappoint-core\` and \`mainline-domain\`; both must be free of the"
            echo "deny-list. Losing either witness fails this job."
            echo ""
            echo "**A boundary question this job does not answer.** The closure carries"
            echo "\`numpy\`, \`scipy\`, \`pint\` and \`rapidfuzz\` — four BLAS/binary-wheel"
            echo "distributions — into a service whose whole job is one SERIALIZABLE"
            echo "transaction and one \`CALL mainline.merge_permit\`. None of them is a model"
            echo "SDK, so this job is silent about them by design. They enter through exactly"
            echo "one edge, \`mainline-domain\`, and that edge set is pinned by"
            echo "\`test_the_numeric_stack_enters_only_through_mainline_domain\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------
  audit:
    name: pip-audit over the locked set
    runs-on: ubuntu-24.04
    needs: [lock-fresh]
    timeout-minutes: 20
    steps:
      - name: Deny egress except to the package indexes
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          sync: "false"

      - name: Audit what uv.lock actually installs
        # The whole workspace's resolved set, deduplicated, with local path entries
        # dropped — auditing our own unpublished distributions against PyPI's advisory
        # database is a lookup that can only ever produce a false negative.
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --all-packages --no-hashes \
            --format requirements-txt --output-file audit.requirements.txt
          grep -vE '^\s*(#|-e |--)' audit.requirements.txt \
            | grep -v 'file://' \
            | grep -E '^[A-Za-z0-9]' \
            | sort -u > audit.pinned.txt
          echo "auditing $(wc -l < audit.pinned.txt) pinned distribution(s)"
          # `--no-project`: pip-audit is a tool, not a workspace dependency, and adding
          # it to the workspace would put an auditing library inside the graph it
          # audits. `--no-deps`: the list is already fully pinned by uv.lock, so any
          # resolution pip-audit performed would be a SECOND resolution, and a finding
          # against a version this repository does not install is a false positive that
          # teaches people to ignore the job.
          uv run --no-project --with pip-audit \
            pip-audit --requirement audit.pinned.txt --no-deps --progress-spinner off
