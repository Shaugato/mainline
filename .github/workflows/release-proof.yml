# SPDX-FileCopyrightText: 2026 MAINLINE contributors
# SPDX-License-Identifier: Apache-2.0
#
# THE PROOF LANE.
#
# One job, one question: does the database refuse a permit merge when a recalled
# precursor carries no signed disposition — and does it admit the same merge once a
# disposition is signed?
#
# Both halves are asserted. A lane that only checked the refusal would stay green
# against a schema in which nothing can ever merge, and "nothing merges" is a broken
# gate wearing a safe gate's colours.
#
# The evidence JSON is uploaded whether the job passes or fails. That is deliberate:
# BUILD_PLAN.md §0.2 PL-2 says a suite that has never been red asserts nothing, and the
# corollary is that a red run's artefact is worth more than a green run's, not less.
# `docs/release/gate-refusal-proof.md` carries the first red and the first green
# verbatim.
#
# No AWS account, no CockroachDB Cloud organisation, no credential of ours (PL-1). A
# judge reproduces this lane with Docker and a checkout.

name: release-proof

on:
  push:
    # `master` is this repository's default branch. It read `main` until
    # 2026-08-10, so this lane — the one that proves the product's central claim —
    # had never run on the branch the Actions tab opens on.
    branches: [master]
    paths:
      - "verticals/mainline/db/migrations/**"
      - "scripts/proof/**"
      - "tests/release/test_gate_refusal_proof.py"
      - "packages/trappoint-migrate/**"
      - "spec/conformance/manifest.toml"
      - "spec/errors.md"
      - "compose.yaml"
      - ".github/workflows/release-proof.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  # The node is created and destroyed inside this job and is reachable from nothing
  # else, so `--insecure` costs nothing and buys a DSN with no secret in it.
  LOCAL_DSN: "postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable"
  # Every cluster fixture in this repository checks these four names before reaching for
  # Docker (docs/leads/quality-repair.md §1.4). Exporting all four is what stops this job
  # from starting a second cluster beside the one it just started.
  MAINLINE_TEST_DSN: "postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable"
  TRAPPOINT_DSN: "postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable"
  COCKROACH_URL: "postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable"
  CRDB_URL: "postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable"
  FORCE_COLOR: "1"

jobs:
  prove:
    name: the database refuses the merge
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # There is no `services:` block, and that is not an oversight. GitHub Actions cannot
    # pass a command to a service container, and `start-single-node` IS a command — so
    # the node is started with `docker run` below. The image pin is exact: `latest-v26.2`
    # is a floating tag, and dev/CI schema skew is the drift the schema fingerprint
    # exists to catch, not to introduce.
    steps:
      - uses: actions/checkout@v4

      - name: Read the ONE version constant out of compose.yaml
        id: image
        # READ, not restate. This step used to open with an image literal and then check
        # compose.yaml AGAINST it, under the heading "assert the image pin agrees with
        # compose.yaml". It did assert that — and the assertion was between two copies of
        # the same constant, which is the situation the constant exists to prevent. The
        # old comment even boasted that it avoided `|| true`; it was scrupulous about the
        # wrong half. Two copies is two things to forget, and this file forgot: `sed`
        # matched `…:vN.N.N` only, so on the day compose.yaml moved to a tag of any other
        # shape `found` would be empty, the `if` would be skipped, and the workflow would
        # have gone on using its own stale literal while reporting agreement.
        #
        # The rule below is `trappoint_migrate.crdb.pinned_image`'s: find the line tagged
        # `trappoint:crdb-image-pin` and take the first `image:` key within the next three
        # lines. It is transcribed rather than imported because this job runs before any
        # workspace exists — waiting on `uv sync` to learn one string would be a slower
        # assertion about the same string — and because `release-proof` must stay runnable
        # when the lockfile is behind, which is the same reason its pip installs use
        # `--no-deps`. `packages/trappoint-migrate/tests/test_cli_offline.py` is what keeps
        # the rule itself honest.
        #
        # There is now no literal here to disagree with anything, which is what `db.yml`'s
        # `image-pin` job means by "the harness must not restate the pin".
        run: |
          set -euo pipefail
          image="$(python3 - <<'PY'
          import pathlib
          import re
          import sys

          MARKER = "trappoint:crdb-image-pin"
          IMAGE_LINE = re.compile(r"^\s*image:\s*(?P<image>\S+)\s*$")

          lines = pathlib.Path("compose.yaml").read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(lines):
              if MARKER not in line:
                  continue
              for candidate in lines[index + 1 : index + 4]:
                  found = IMAGE_LINE.match(candidate)
                  if found is not None:
                      print(found.group("image"))
                      sys.exit(0)
          sys.exit(
              f"compose.yaml carries no line marked {MARKER!r} followed by an 'image:' key "
              "within the next three lines; the CockroachDB version constant has moved or "
              "been deleted"
          )
          PY
          )"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "using ${image}"

      - name: Start the single-node cluster
        run: |
          set -euo pipefail
          docker run -d --name mainline-crdb \
            -p 26257:26257 \
            --health-cmd="curl -fsS http://127.0.0.1:8080/health?ready=1 || exit 1" \
            --health-interval=3s --health-retries=40 --health-start-period=5s \
            "${{ steps.image.outputs.image }}" \
            start-single-node --insecure --store=type=mem,size=2GiB \
            --cache=.25 --max-sql-memory=.25
          for _ in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Health.Status}}' mainline-crdb)"
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          docker exec mainline-crdb ./cockroach sql --insecure -e "SELECT version();"

      # gc.ttlseconds is 4500 on CockroachDB Cloud Basic and 14400 by default locally.
      # Local is MORE permissive, so a time-travel assumption that survives a laptop can
      # still fail on Cloud. Pinning the cluster default here means this lane is testing
      # under the tighter of the two, which is the only direction worth being wrong in.
      - name: Pin gc.ttlseconds to the value CockroachDB Cloud enforces
        run: |
          set -euo pipefail
          docker exec mainline-crdb ./cockroach sql --insecure -e "
            ALTER RANGE default CONFIGURE ZONE USING gc.ttlseconds = 4500;
            ALTER DATABASE defaultdb CONFIGURE ZONE USING gc.ttlseconds = 4500;
          "
          docker exec mainline-crdb ./cockroach sql --insecure -e \
            "SHOW ZONE CONFIGURATION FOR RANGE default;"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Deliberately not `uv sync`. The proof needs psycopg and trappoint-migrate and
      # nothing else, and `docs/leads/quality-repair.md` §1.1 records that the workspace
      # lockfile still describes seven of twenty-seven distributions. Depending on it here
      # would make the product's central claim un-provable for a reason that has nothing
      # to do with the product.
      - name: Install exactly what the proof needs
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # The floor packages/trappoint-migrate/pyproject.toml declares, spelled out here
          # because `--no-deps` below is what keeps this job independent of uv.lock.
          #
          # `pytest-timeout` is not decoration and not a convenience. The root
          # `pyproject.toml` sets `addopts = [… "--strict-config" …]` alongside
          # `timeout = 120`, and `--strict-config` makes an ini key that no installed
          # plugin claims a HARD error. Measured on this exact step in run 31372088271:
          # `ERROR: Unknown config option: timeout` → `no tests ran in 0.04s` → exit 4.
          # The lane had started a cluster, applied the chain and written the evidence
          # file, and then failed on a missing pytest plugin — a green proof reported as
          # a red job, which is the one direction of wrongness this repository cannot
          # afford. It is declared in the root `dev` group; this job pins its own floor
          # rather than depending on uv.lock, exactly as the two lines above do.
          python -m pip install "psycopg[binary,pool]>=3.3.4" pytest "pytest-timeout>=2.4"
          python -m pip install --no-deps -e packages/trappoint-migrate
          python -c "import psycopg, trappoint_migrate; print(psycopg.__version__)"
          python -m trappoint_migrate --help > /dev/null

      - name: Prove it
        id: prove
        run: |
          set -euo pipefail
          python scripts/proof/gate_refusal.py \
            --dsn "$LOCAL_DSN" \
            --database ci_gate_refusal_proof \
            --out evidence/gate-refusal/proof-ci-${{ github.run_id }}.json

      # Runs even when the proof failed. A red proof's evidence file is the artefact that
      # says WHICH half failed and with what SQLSTATE, and throwing it away because the
      # step before it was red is how a lane becomes unfalsifiable.
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-refusal-evidence-${{ github.run_id }}
          path: |
            evidence/gate-refusal/proof-ci-${{ github.run_id }}.json
            evidence/gate-refusal/proof-ci-${{ github.run_id }}.json.license
          if-no-files-found: error
          retention-days: 90

      - name: The release-suite gate, written once so its red half cannot drift from it
        # MEASURED 2026-08-10, and it is why this gate exists at all.
        # `tests/release/test_gate_refusal_proof.py` SKIPS when the proof cannot reach a
        # cluster — correctly, because "there was no database" is not evidence that the
        # gate admitted anything. But **pytest exits 0 when every test skips**:
        #
        #     $ MAINLINE_TEST_DSN=…:26299 python -m pytest tests/release/… -q --crdb=none
        #     15 skipped in 21.47s
        #     EXITCODE=0
        #
        # so the bare invocation this step used to carry reported the product's central
        # claim as held on a run where nothing was proved. The junit report closes it: a
        # count is a number, and a summary line is a sentence.
        #
        # It is a FILE because the next two steps use it twice — once against a run with
        # nothing to prove against, which it must refuse, and once against the real run,
        # which it must accept. A gate and its negative control that are two copies of the
        # same text are two things to keep in step, and the one that drifts is the one
        # nobody is watching.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anti-vacuity"
          cat > "$RUNNER_TEMP/anti-vacuity/assert_release_suite.py" <<'PY'
          """Refuse a release-suite run that skipped, collected too little, or failed."""
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          if suite is None:
              sys.exit("::error::pytest wrote no testsuite element; nothing was collected")
          tests = int(suite.get("tests", "0"))
          skipped = int(suite.get("skipped", "0"))
          failed = int(suite.get("failures", "0")) + int(suite.get("errors", "0"))
          print(f"release suite: {tests} test(s), {skipped} skipped, {failed} failed")
          if tests < 15:
              sys.exit(
                  f"::error::only {tests} release assertion(s) ran; this module carried 15 on "
                  "2026-08-10, and an assertion deleted rather than fixed is a claim quietly "
                  "withdrawn"
              )
          if skipped:
              sys.exit(
                  f"::error::{skipped} of {tests} release assertions were SKIPPED. A skip here "
                  "means the proof could not reach a cluster, and pytest exits 0 on an "
                  "all-skipped run — so without this line the step would report the product's "
                  "central claim as held on a run where NOTHING WAS PROVED."
              )
          if failed:
              sys.exit(f"::error::{failed} release assertion(s) failed")
          print("every release assertion ran, none of them skipped")
          PY
          echo "wrote $RUNNER_TEMP/anti-vacuity/assert_release_suite.py"

      - name: RED — the gate refuses a run where nothing was proved
        # Every DSN spelling points at a closed port and `--crdb=none` stops the testkit
        # from starting a container of its own, so the proof exits 2, every assertion
        # skips, and pytest exits 0. This step asserts BOTH halves of the defect: that the
        # bare run really does exit 0, and that the gate above refuses it by name.
        #
        # The mutation is four environment variables scoped to this step. It cannot reach
        # the green half below, which runs under the workflow's own DSNs against the
        # cluster this job started.
        env:
          PGCONNECT_TIMEOUT: "3"
          MAINLINE_TEST_DSN: "postgresql://root@127.0.0.1:26299/defaultdb?sslmode=disable"
          TRAPPOINT_DSN: "postgresql://root@127.0.0.1:26299/defaultdb?sslmode=disable"
          COCKROACH_URL: "postgresql://root@127.0.0.1:26299/defaultdb?sslmode=disable"
          CRDB_URL: "postgresql://root@127.0.0.1:26299/defaultdb?sslmode=disable"
          LOCAL_DSN: "postgresql://root@127.0.0.1:26299/defaultdb?sslmode=disable"
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/nothing-proved.junit.xml"
          set +e
          python -m pytest tests/release/test_gate_refusal_proof.py \
            -q --no-header -p no:cacheprovider --crdb=none --junit-xml="$report" > "$RUNNER_TEMP/bare.log" 2>&1
          bare=$?
          set -e
          tail -n 5 "$RUNNER_TEMP/bare.log"
          echo "the BARE pytest invocation exited ${bare} with nothing to prove against"
          if [ "${bare}" -ne 0 ]; then
            echo "::error title=release-suite control did not reach its state::the bare run exited ${bare}, not 0. This control describes an ALL-SKIPPED run that pytest reports as success; something answered on the closed port, or the module stopped skipping, or --crdb=none was not accepted."
            exit 1
          fi
          set +e
          out="$(python "$RUNNER_TEMP/anti-vacuity/assert_release_suite.py" "$report" 2>&1)"
          gated=$?
          set -e
          echo "${out}"
          if [ "${gated}" -eq 0 ]; then
            echo "::error title=release suite is vacuous::the gate ACCEPTED a run in which every assertion skipped. The step below would report the product's central claim as held on a run where nothing was proved."
            exit 1
          fi
          case "${out}" in
            *"were SKIPPED"*)
              echo "CONFIRMED: bare pytest exits 0 on an all-skipped run, and the gate refuses it by name." ;;
            *)
              echo "::error title=release suite is vacuous::the gate exited ${gated} but its message does not name the skips. An assertion that a program failed, without checking WHY, passes when the program fails to start."
              exit 1 ;;
          esac

      - name: GREEN — assert the proof from the release suite
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/release-proof.junit.xml"
          python -m pytest tests/release/test_gate_refusal_proof.py \
            -q --no-header -p no:cacheprovider --junit-xml="$report"
          python "$RUNNER_TEMP/anti-vacuity/assert_release_suite.py" "$report"

      - name: Summarise
        if: always()
        env:
          EVIDENCE: evidence/gate-refusal/proof-ci-${{ github.run_id }}.json
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          import pathlib

          print("## Gate-refusal proof\n")
          path = pathlib.Path(os.environ["EVIDENCE"])
          if not path.is_file():
              print("No evidence file was written, so the proof did not get far enough to say anything.")
              raise SystemExit(0)

          evidence = json.loads(path.read_text(encoding="utf-8"))
          chain = evidence.get("chain", {})
          print(f"**Verdict: {evidence.get('verdict')}**\n")
          print(f"- cluster `{evidence['cluster']['version']}`")
          print(
              f"- chain {chain.get('applied_count')}/{chain.get('files')} applied, "
              f"{chain.get('failed_count')} failed, reached 0115: "
              f"{chain.get('reached_0115_fn_permit_merge_gate')}"
          )
          for key, label in (("refusal", "CF-01"), ("drift_refusal", "CF-03")):
              section = evidence.get(key) or {}
              print(
                  f"- {label} {section.get('outcome')} `[{section.get('sqlstate')}]` "
                  f"`{section.get('constraint')}` ({section.get('constraint_source')})"
              )
          admission = evidence.get("admission") or {}
          print(f"- admission {admission.get('outcome')} `[{admission.get('sqlstate')}]`")
          for entry in chain.get("failures_unexplained", []):
              print(f"- **UNEXPLAINED** `{entry['version']}` `[{entry['sqlstate']}]`")
          for entry in chain.get("failures_attributable_to_an_unproduced_table", []):
              print(f"- no producer: `{entry['version']}` needs `{entry['unproduced_table']}`")
          for caveat in evidence.get("caveats", []):
              print(f"- caveat: {caveat}")
          for failure in evidence.get("failures", []):
              print(f"- **FAILURE**: {failure}")
          PY

      - name: Cluster logs on failure
        if: failure()
        run: docker logs mainline-crdb --tail 200 || echo "(no container logs — it never started)"

      - name: Stop the cluster
        if: always()
        run: docker rm -f mainline-crdb || echo "(no container to remove)"

  # ─────────────────────────────────────────────────────────────────────────────────────
  # THE MOST IMPORTANT NEGATIVE CONTROL IN THIS REPOSITORY.
  #
  # The job above proves the product's central claim: the database refuses the merge. A
  # lane that can only ever say PROVEN says nothing. Two schema families are planted here,
  # each into a SCRATCH COPY of the migration tree under `$RUNNER_TEMP` — the checkout is
  # never touched, and `--migrations` is an option `gate_refusal.py` already carries, so
  # this runs the lane's own checker against a mutated copy of the lane's own input.
  #
  #   gate-disabled       `gate_closed_when_issued` weakened to a tautology in a copy of
  #                       `0050_permit.sql`. MEASURED 2026-08-10 against CockroachDB
  #                       v26.2.5: chain 271/271 applied, `REFUSAL ADMITTED [00000]`,
  #                       `! CF-01: the merge was ADMITTED with an open obligation`,
  #                       `VERDICT NOT PROVEN`, exit 1.
  #   expected-sqlstate   `fn_permit_merge_gate` raising `22000` instead of `P0001` in a
  #                       copy of `0115_fn_permit_merge_gate.sql`. MEASURED the same day:
  #                       `DRIFT REFUSED [22000]`, `! CF-03: expected SQLSTATE P0001,
  #                       observed 22000`, `VERDICT NOT PROVEN`, exit 1. A refusal for the
  #                       wrong reason is the failure mode a bare "did it raise?" check
  #                       cannot see, and it is why this family is planted separately.
  #
  # Both plants are asserted to have an ANCHOR first. A `str.replace` whose anchor has
  # been renamed away plants nothing and raises nothing, and the control then passes over
  # an unmutated tree — which is how an anti-vacuity job silently stops being one.
  #
  # The third family, "a run where nothing was proved", lives in the `prove` job above,
  # beside the gate it is the control for.
  # ─────────────────────────────────────────────────────────────────────────────────────
  can-fail:
    name: RED — the proof reports NOT PROVEN when the gate is removed
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Read the ONE version constant out of compose.yaml
        id: image
        # The `prove` job's copy of this step carries the reasoning. The negative control
        # has to run against the SAME node as the proof it is the control for, or "the
        # proof reports NOT PROVEN when the gate is removed" would be a claim about a
        # different database.
        run: |
          set -euo pipefail
          image="$(python3 - <<'PY'
          import pathlib
          import re
          import sys

          MARKER = "trappoint:crdb-image-pin"
          IMAGE_LINE = re.compile(r"^\s*image:\s*(?P<image>\S+)\s*$")

          lines = pathlib.Path("compose.yaml").read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(lines):
              if MARKER not in line:
                  continue
              for candidate in lines[index + 1 : index + 4]:
                  found = IMAGE_LINE.match(candidate)
                  if found is not None:
                      print(found.group("image"))
                      sys.exit(0)
          sys.exit(
              f"compose.yaml carries no line marked {MARKER!r} followed by an 'image:' key "
              "within the next three lines; the CockroachDB version constant has moved or "
              "been deleted"
          )
          PY
          )"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "using ${image}"

      - name: Start the single-node cluster
        run: |
          set -euo pipefail
          docker run -d --name mainline-crdb-red \
            -p 26257:26257 \
            --health-cmd="curl -fsS http://127.0.0.1:8080/health?ready=1 || exit 1" \
            --health-interval=3s --health-retries=40 --health-start-period=5s \
            "${{ steps.image.outputs.image }}" \
            start-single-node --insecure --store=type=mem,size=2GiB \
            --cache=.25 --max-sql-memory=.25
          for _ in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Health.Status}}' mainline-crdb-red)"
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          docker exec mainline-crdb-red ./cockroach sql --insecure -e "SELECT version();"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install exactly what the proof needs
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary,pool]>=3.3.4" pytest "pytest-timeout>=2.4"
          python -m pip install --no-deps -e packages/trappoint-migrate

      - name: RED — the proof reports a named FAILURE for every planted family
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess
          import sys

          ROOT = pathlib.Path.cwd().resolve()
          PROOF = ROOT / "scripts" / "proof" / "gate_refusal.py"
          MIGRATIONS = ROOT / "verticals" / "mainline" / "db" / "migrations"
          TEMP = pathlib.Path(os.environ["RUNNER_TEMP"])
          DSN = os.environ["LOCAL_DSN"]
          failures: list[str] = []

          FAMILIES = (
              (
                  "gate-disabled",
                  "0050_permit.sql",
                  "CHECK (state <> 'merged' OR open_blocking = 0)",
                  "CHECK (state <> 'merged' OR open_blocking >= 0)",
                  ("CF-01: the merge was ADMITTED with an open obligation", "NOT PROVEN"),
              ),
              (
                  "expected-sqlstate",
                  "0115_fn_permit_merge_gate.sql",
                  "ERRCODE = 'P0001'",
                  "ERRCODE = '22000'",
                  ("CF-03: expected SQLSTATE P0001, observed 22000", "NOT PROVEN"),
              ),
          )

          for family, filename, anchor, replacement, needles in FAMILIES:
              work = TEMP / f"migrations-{family}"
              if work.exists():
                  shutil.rmtree(work)
              shutil.copytree(MIGRATIONS, work)
              target = work / filename
              text = target.read_text(encoding="utf-8")
              if anchor not in text:
                  failures.append(
                      f"PLANTED FAMILY {family}: the anchor {anchor!r} is no longer present "
                      f"in {filename}, so NOTHING was planted and this control is vacuous. "
                      "A no-op mutation is how an anti-vacuity job silently stops being one."
                  )
                  continue
              target.write_text(text.replace(anchor, replacement), encoding="utf-8")

              done = subprocess.run(
                  [
                      sys.executable, str(PROOF),
                      "--dsn", DSN,
                      "--database", "ci_red_" + family.replace("-", "_"),
                      "--migrations", str(work),
                      "--out", str(TEMP / ("proof-" + family + ".json")),
                  ],
                  capture_output=True, text=True, cwd=str(ROOT), check=False,
              )
              log = done.stdout + done.stderr
              print(f"--- {family}: exit {done.returncode} ---")
              print(log[-2000:])
              if done.returncode == 0:
                  failures.append(
                      f"PLANTED FAMILY {family}: `gate_refusal.py` exited 0 against a schema "
                      "carrying this violation. The proof cannot tell a gate that refuses "
                      "from a gate that does not, and the central claim of this repository "
                      "rests on it being able to."
                  )
                  continue
              if done.returncode == 2:
                  failures.append(
                      f"PLANTED FAMILY {family}: exit 2 means the proof could not reach the "
                      "cluster. That is not a statement about the gate, so this control did "
                      f"not run:\n{log[-800:]}"
                  )
                  continue
              absent = [needle for needle in needles if needle not in log]
              if absent:
                  failures.append(
                      f"PLANTED FAMILY {family}: exit {done.returncode}, but the report never "
                      f"names {absent}. An assertion that a program failed, without checking "
                      "WHY, passes when the program fails to start."
                  )
                  continue
              print(f"  REPORTED FAILURE  {family} -> {needles[0]}")

          for failure in failures:
              print(f"::error title=the proof cannot say NOT PROVEN::{failure}")
          if failures:
              raise SystemExit(1)
          print("")
          print(f"{len(FAMILIES)} planted schema violations, each turning VERDICT PROVEN into "
                "VERDICT NOT PROVEN with the failing clause named in the report.")
          PY

      - name: The tracked tree was never mutated
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=no)"
          if [ -n "${dirty}" ]; then
            echo "::error::this job mutated the checkout. Every plant belongs in a scratch copy."
            echo "${dirty}"
            exit 1
          fi
          echo "working tree clean — every planted violation lived under \$RUNNER_TEMP"

      - name: What the red half proved
        if: always()
        run: |
          {
            echo "## release-proof — the lane can say NOT PROVEN"
            echo ""
            echo "| planted violation | where | the report must say |"
            echo "|---|---|---|"
            echo "| \`gate_closed_when_issued\` weakened to a tautology | scratch copy of \`0050_permit.sql\` | \`CF-01: the merge was ADMITTED with an open obligation\` |"
            echo "| \`fn_permit_merge_gate\` raising \`22000\` | scratch copy of \`0115_fn_permit_merge_gate.sql\` | \`CF-03: expected SQLSTATE P0001, observed 22000\` |"
            echo "| no cluster to prove anything against | the \`prove\` job's environment | the release-suite gate must refuse, not skip to green |"
            echo ""
            echo "The third one was a LIVE DEFECT until this wave. \`pytest\` exits **0** when"
            echo "every test skips, and \`test_gate_refusal_proof.py\` skips when the proof cannot"
            echo "reach a cluster — so \`Assert the proof from the release suite\` reported the"
            echo "product's central claim as held on a run where nothing was proved. It is"
            echo "asserted in the \`prove\` job, beside the gate that now closes it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the cluster
        if: always()
        run: docker rm -f mainline-crdb-red || echo "(no container to remove)"
