# SPDX-FileCopyrightText: 2026 MAINLINE contributors
# SPDX-License-Identifier: Apache-2.0
#
# THE RATCHET LANE — PL-2 made mechanical (docs/leads/datamodel.md DM-8).
#
# `db.yml` is the RED lane: one conformance case that is expected to fail until the
# kernel DDL lands. This lane is the *ratchet* that keeps every other test honest, and it
# is deliberately a separate workflow: db.yml's failure has to mean "the conformance case
# is red" and nothing else, so a promotion owed three directories away must not be able
# to change its colour.
#
# TWO LAWS, ONE SUITE.
#
#   mi-green   every `enforced` invariant's owning tests must PASS.
#              A skip is not a pass. An invariant certified by a test that did not run is
#              precisely the assertion-free green PL-2 exists to forbid, so `green`
#              refuses to certify on a skip — which is why this job starts a cluster
#              rather than letting the suite skip its way to success.
#
#   mi-red     every `pending` invariant must have at least one owning test that
#              currently FAILS. A pending invariant whose tests all pass fails the build:
#
#                  MI25 is pending but its tests pass — promote it in mi_catalogue.yaml
#
#              Promotion is therefore a pull request that shows up in blame forever, and
#              `demote-check` makes the ratchet one-way.
#
# EXIT CODES ARE LOAD-BEARING. `scripts/mi_ratchet.py` exits 2 for *cannot determine* —
# a missing source, an uncollectable suite — and 1 for *the law was broken*. A job that
# conflated them would publish colours it never measured, which is the failure this whole
# lane exists to prevent. Neither is `continue-on-error`.
#
# No AWS account. No CockroachDB Cloud organisation. No credential of ours (PL-1). The
# cluster is a container this job creates and destroys.

name: db-schema

on:
  push:
    # `master`, not `main`. MEASURED 2026-08-10: `git branch --show-current` is `master`,
    # `gh run list --branch main` is empty. A lane keyed to a branch that does not exist has
    # never run on push in this repository's history, and the Actions tab's default view is the
    # DEFAULT branch — so the colour this lane publishes was invisible where it is read.
    branches: [master]
    paths:
      - "verticals/*/db/**"
      - "packages/trappoint-migrate/**"
      - "tests/integration/schema/**"
      # `mi-red`/`mi-green` collect and run this suite — it is how the missing `0110`
      # producer surfaced at all — so an edit to it must be able to trigger this lane.
      - "tests/integration/recall_schema/**"
      - "scripts/mi_ratchet.py"
      - "compose.yaml"
      - "uv.lock"
      - ".github/workflows/db-schema.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-schema-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_DSN: "postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable"
  FORCE_COLOR: "1"

jobs:
  # ── Hermetic. No cluster, no docker, nothing that can be flaky. ─────────────────────
  catalogue:
    name: the catalogue is committed, current and well-formed
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the migration runner
        run: uv sync --frozen --package trappoint-migrate

      - name: Runner semantics with no cluster (tier 0)
        # The lint, the lock, the protected floor and the fingerprint's stability. If
        # these are wrong, every statement the rest of this lane makes is about a tool
        # that does not work.
        #
        # ONE TEST IS DESELECTED HERE, BY NODE ID, AND IT IS NOT SKIPPED.
        # `test_delegated_verb_actually_delegates_when_present` asserts that `trappoint
        # render` reaches the real implementation in `trappoint-sql` instead of printing the
        # "that distribution is not installed" fallback. `uv run --package trappoint-migrate`
        # builds an environment containing trappoint-migrate and its ONE dependency (psycopg);
        # trappoint-sql is a sibling workspace member that deliberately has no dependency edge
        # in either direction — an edge would be an import cycle, and both pyprojects say so.
        # So trappoint-sql is absent HERE BY CONSTRUCTION, the fallback fires, and the test
        # fails on the environment rather than on the runner:
        #
        #     AssertionError: delegation regressed to the not-installed path
        #
        # The test's precondition was real and unstated. It is stated by the step below, which
        # runs that exact node id in an environment where trappoint-sql IS installed — so the
        # delegation claim is still made on every run, once, in the only environment that can
        # make it. Deselecting it in both places would be the suppression this repair forbids.
        run: |
          uv run --frozen --package trappoint-migrate python -m pytest \
            packages/trappoint-migrate/tests -q \
            --deselect packages/trappoint-migrate/tests/test_cli_offline.py::test_delegated_verb_actually_delegates_when_present

      - name: Delegation reaches trappoint-sql when trappoint-sql is installed (tier 0b)
        # The other half of the pair above, and the environment is the assertion. `--all-packages`
        # is what puts trappoint-sql in the environment: `--package trappoint-sql` alone would
        # remove trappoint-migrate, whose `main()` is the thing under test, and the two
        # distributions cannot depend on each other. This is the same flag ci.yml resolves the
        # whole workspace with, so it is not a new mechanism introduced for one test.
        #
        # If this step goes red, `trappoint render` has stopped delegating and a fresh clone is
        # being handed the "not installed" message for a distribution it has. That is a real
        # regression in the one verb-first entry point, and it must be red.
        run: |
          uv run --frozen --all-packages python -m pytest \
            packages/trappoint-migrate/tests/test_cli_offline.py::test_delegated_verb_actually_delegates_when_present \
            -q

      - name: The sequence ban, the citation rule and the mandatory header block
        run: uv run --frozen --package trappoint-migrate trappoint migrate lint

      - name: migrations.lock.json is a manifest, and it is current
        # MR-6 lock 1: the lock is DERIVED. A stale one is regenerated, never patched,
        # and the failure names the command.
        run: uv run --frozen --package trappoint-migrate trappoint migrate lock

      - name: Every hermetic check this runner can make
        run: uv run --frozen --package trappoint-migrate trappoint migrate verify --offline

      - name: The catalogue must be committed and current
        # Exit 1 on drift, 2 on a missing source. `owning_migrations` is a projection of
        # the `-- MI:` headers, and a projection over a missing source refuses rather
        # than reporting that nothing enforces anything (P2, applied to the build system).
        run: uv run --frozen python scripts/mi_ratchet.py check

      - name: Both laws bite
        # The ratchet asserting itself against synthetic outcome maps, so "the law held"
        # is never a statement about a suite nobody measured.
        run: uv run --frozen python scripts/mi_ratchet.py selftest

      - name: Which derived artefact is stale, what regenerates it, and who owns it
        # R3: an intentional red names its missing artefact and its owner, in the log.
        # This job is red for one of two reasons and they read identically from outside:
        # a derived artefact has fallen behind the tree, or the runner is genuinely
        # broken. It has to be able to say which.
        #
        # MEASURED 2026-08-12, run 31596638185 and again on 31600802469: the whole job was
        # red because `verticals/mainline/db/migrations.lock.json` records the sha256 of
        # ten migrations that were edited at b0fe884 and never re-locked. The only trace
        # of that in the log was an assertion diff buried inside one of the 300 tier-0
        # tests, `test_the_committed_manifest_is_current`, printed under `-q`. Everything
        # else about the runner worked: 299 of 300 tier-0 cases passed with no cluster, so
        # the tier-0 claim IS supportable without a database and this lane is not
        # over-claiming — it was merely failing opaquely.
        #
        # Nothing below is written down here. The stale entries come from
        # `trappoint_migrate.lockfile.verify_lock` — the same function the tier-0 test
        # calls — the catalogue drift from `mi_ratchet.check_violations`, and the owner of
        # every affected migration from `migrations.allocation.toml` via the band table. A
        # hand-listed set of ten filenames would be a lie the day an eleventh joins.
        #
        # `if: failure()` — an earlier step has already failed, so this cannot rescue the
        # job and is not a suppression. It is not `continue-on-error` either: if the
        # diagnosis itself cannot be made, that is a finding and this step fails too.
        if: failure()
        run: |
          set -euo pipefail
          cat > catalogue-drift.py <<'PY'
          """Name every derived artefact this job asserts, and whether it is current."""

          from __future__ import annotations

          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import mi_ratchet as mi
          from trappoint_migrate.lockfile import lock_path_for, verify_lock

          for stream in (sys.stdout, sys.stderr):
              if hasattr(stream, "reconfigure"):
                  stream.reconfigure(encoding="utf-8", errors="replace")

          root = mi.REPO_ROOT
          migrations = root / mi.MIGRATIONS_RELPATH
          bands = mi.load_bands(root / mi.ALLOCATION_RELPATH)
          paths = mi.Paths.under(root)


          def owners_for(lines: list[str]) -> str:
              """The band owners behind a set of findings, read from the allocation table.

              A finding opens with the migration filename it is about. `verify_lock` also
              returns one trailing advisory line that names no file; it simply fails to match
              the migration-number pattern and drops out here, rather than being filtered by a
              guess about its punctuation.
              """
              numbers = []
              for line in lines:
                  found = mi.MIGRATION_NUMBER_RE.match(line.split(":", 1)[0])
                  if found:
                      numbers.append(found.group("number"))
              owners = mi.owners_of(numbers, bands)
              return "; ".join(owners) if owners else "unallocated — no band claims these numbers"


          sections: list[tuple[str, str, str, list[str]]] = []

          lock = lock_path_for(migrations)
          stale = verify_lock(lock, migrations, repo_root=root)
          if stale:
              sections.append(
                  (
                      lock.relative_to(root).as_posix(),
                      "trappoint migrate lock --write",
                      owners_for(stale),
                      stale,
                  )
              )

          drift = mi.check_violations(paths)
          if drift:
              sections.append(
                  (
                      mi.RENDERED_RELPATH,
                      "python scripts/mi_ratchet.py reconcile --write",
                      (
                          "scripts/mi_ratchet.py renders it; the drift is owed by whoever last "
                          "changed mi_catalogue.yaml or a `-- MI:` header without re-rendering. "
                          "`check` also asserts the owning_migrations projection and the red "
                          "suite's shape, so read the findings before assuming a re-render is all "
                          "that is owed."
                      ),
                      drift,
                  )
              )

          if not sections:
              print(
                  "::notice title=no derived artefact is stale::Every artefact this job asserts "
                  "is current: the migration manifest verifies against the tree and the invariant "
                  "catalogue matches its rendering. The red above is therefore NOT a staleness — "
                  "read the failing step's own output, because the runner itself is what refused."
              )
              print("## db-schema — the catalogue job is red, and it is not a stale artefact")
              print("")
              print(
                  "`trappoint_migrate.lockfile.verify_lock` and `mi_ratchet.py check` were both "
                  "re-run here and both are clean. Whatever failed above failed on its own terms."
              )
              raise SystemExit(0)

          names = ", ".join(name for name, _, _, _ in sections)
          print(
              f"::error title=db-schema is red on a stale derived artefact::{len(sections)} "
              f"derived artefact(s) are out of date with the tree — {names}. Each is GENERATED; "
              f"the fix is to re-run its generator and commit the result, never to edit it."
          )
          print("## db-schema — the derived artefact that is out of date, and who owes it")
          print("")
          print(
              "Every step in this job asserts that something DERIVED is current. When one of "
              "them fails the reader gets that tool's own output, which for the tier-0 suite is "
              "an assertion diff inside one of 300 tests. The table below is the same question "
              "asked directly."
          )
          print("")
          print("| artefact | regenerate with | owner |")
          print("|---|---|---|")
          for artefact, generator, owner, _ in sections:
              print(f"| `{artefact}` | `{generator}` | {owner} |")
          print("")
          for artefact, generator, owner, lines in sections:
              print(f"### `{artefact}` — {len(lines)} finding(s)")
              print("")
              print(f"* **regenerate with** `{generator}` — it is derived, never authored.")
              print(f"* **owner** — {owner}")
              print("")
              print("```")
              for line in lines:
                  print(line)
              print("```")
              print("")
          print(
              "**This job stays red.** No `continue-on-error`, no `|| true`, no threshold moved. "
              "A manifest that disagrees with the bytes it manifests is exactly the condition "
              "this lane exists to catch, and it goes green the moment the generator is re-run."
          )
          PY
          uv run --frozen --all-packages python catalogue-drift.py | tee catalogue-drift.md
          cat catalogue-drift.md >> "$GITHUB_STEP_SUMMARY"

  # ── The two laws. Both need a cluster, for opposite reasons. ────────────────────────
  ratchet:
    name: mi-red and mi-green
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the ONE version constant out of compose.yaml
        id: image
        # The version constant lives in compose.yaml and nowhere else. `services:` in
        # GitHub Actions cannot pass a command to a container and `start-single-node` IS
        # a command, so the node is started with `docker run` — the version still comes
        # from the same line `trappoint migrate image` parses.
        run: |
          set -euo pipefail
          image="$(python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("compose.yaml").read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if "trappoint:crdb-image-pin" in line:
                  for candidate in lines[i + 1 : i + 4]:
                      m = re.match(r"^\s*image:\s*(\S+)\s*$", candidate)
                      if m:
                          print(m.group(1))
                          raise SystemExit(0)
          raise SystemExit("compose.yaml carries no marked image pin")
          PY
          )"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "CockroachDB image: ${image}"

      - name: Pull the image and record its digest
        id: digest
        # Digest pinning without a fabricated hash, exactly as db.yml does it. The digest
        # is resolved and printed on every run; when the repository variable
        # CRDB_IMAGE_DIGEST is set it is ASSERTED. An invented digest committed today
        # would be a lie in the repository; an assertion that activates the moment
        # somebody records the real one is the honest version of the same control.
        run: |
          set -euo pipefail
          docker pull "${{ steps.image.outputs.image }}"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${{ steps.image.outputs.image }}")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "resolved: ${digest}"
          expected="${{ vars.CRDB_IMAGE_DIGEST }}"
          if [ -n "${expected}" ] && [ "${expected}" != "${digest}" ]; then
            echo "::error::image digest ${digest} does not match the pinned ${expected}"
            exit 1
          fi
          if [ -z "${expected}" ]; then
            echo "::notice::CRDB_IMAGE_DIGEST is unset; the digest is recorded but not asserted"
          fi

      - name: Start a single-node CockroachDB
        # MEASURED 2026-08-10 against the pin `compose.yaml` names and the `image` step
        # above resolves — the version is NOT restated here, because a comment naming a
        # version is a comment that goes stale and then misleads, and `db.yml`'s census
        # counts this file. `--listen-addr` is DELIBERATELY ABSENT and must stay absent:
        #
        #   $ docker run … start-single-node --insecure --listen-addr=0.0.0.0:26257 …
        #   error: hostname of listen_addr must be "127.0.0.1" or "localhost"
        #
        # The node refuses to start. `--advertise-addr=localhost:26257` does not rescue
        # it; the check is on listen_addr itself. And `--listen-addr=localhost:26257`
        # starts, but binds inside the container's loopback where a published port cannot
        # reach it. The default binds where `-p` can forward, which is what this job needs
        # and what the pgwire probe below actually proves. `--http-addr` is unaffected.
        run: |
          set -euo pipefail
          docker run -d --name trappoint-schema-crdb \
            -p 127.0.0.1:26257:26257 -p 127.0.0.1:8080:8080 \
            "${{ steps.image.outputs.image }}" \
            start-single-node --insecure \
              --http-addr=0.0.0.0:8080 \
              --store=type=mem,size=2GiB
          for attempt in $(seq 1 60); do
            if docker exec trappoint-schema-crdb ./cockroach sql --insecure --execute "SELECT 1" >/dev/null 2>&1; then
              echo "cluster answering SQL after ${attempt} attempt(s)"
              # The `SELECT version()` that was PRINTED here is gone, and the removal is
              # the point of the step below rather than a tidy-up. A version printed and
              # never compared has the shape of an assertion without being one: a reader
              # scanning this log saw the right number and concluded the pin had been
              # checked. Nothing was checked. The comparison now lives where it can fail.
              exit 0
            fi
            sleep 2
          done
          echo "::error::the cluster never answered SQL"
          docker logs trappoint-schema-crdb | tail -50
          exit 1

      - name: The server that answered IS the pinned version
        # ANTI-VACUITY, 2026-08-13. Every step above this one reads the pin, hands it to
        # `docker run`, resolves a digest and polls `SELECT 1`. Not one of them ever asks
        # the running server which version it is, so the whole sequence catches a pin that
        # failed to ARRIVE — the container did not start, or did not answer pgwire — and
        # nothing else. A tag resolving to different bytes than compose.yaml names went
        # green identically: a moving tag, a layer already cached under that name, a
        # container of this fixed name left behind by an earlier run, a registry
        # substitution. mi-red and mi-green are claims about what a specific engine
        # accepts and refuses; on a different engine they are measurements of something
        # else wearing this lane's name.
        #
        # The expectation is DERIVED from the pin the `image` step resolved and is never
        # written out here. `db.yml`'s census counts restated image literals across
        # `.github/workflows/` against a ceiling being driven down, and a second copy of
        # the version constant is the defect that census exists to refuse.
        #
        # `image-pin-bites` in this same lane is the negative control: it runs this
        # comparison against a deliberately neighbouring tag and is red if it passes.
        env:
          PINNED_IMAGE: ${{ steps.image.outputs.image }}
          CRDB_CONTAINER: trappoint-schema-crdb
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          image = os.environ["PINNED_IMAGE"]
          container = os.environ["CRDB_CONTAINER"]
          tag = image.rsplit(":", 1)[-1]
          wanted = tag[len("latest-") :] if tag.startswith("latest-") else tag

          probe = subprocess.run(
              ["docker", "exec", container, "./cockroach", "sql", "--insecure",
               "--format=csv", "--execute", "SELECT version()"],
              capture_output=True, text=True, check=False,
          )
          if probe.returncode != 0:
              detail = (probe.stderr or probe.stdout).strip().replace("\n", " · ")
              print("::error title=the node would not report its version::"
                    "`SELECT version()` failed against a node that had just answered "
                    f"`SELECT 1` — container {container}: {detail}")
              sys.exit(1)
          served = [row for row in probe.stdout.splitlines() if row.strip()][-1]
          served = served.strip().strip('"')

          if re.search(rf"(?<![0-9A-Za-z.]){re.escape(wanted)}(\.\d+)*(?![0-9A-Za-z.])", served):
              print(f"compose.yaml asked for {wanted}; the server said: {served}")
              sys.exit(0)
          print("::error title=the running server is not the pinned version::compose.yaml "
                f"asked for {wanted} (pin {image}); the node that answered reports "
                f"{served!r}. mi-red and mi-green below would be measured against that "
                "other engine, under this lane's name.")
          sys.exit(1)
          PY

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --frozen

      - name: Bootstrap the `trappoint` schema
        run: uv run --frozen trappoint migrate bootstrap --dsn "$LOCAL_DSN"

      - name: mi-red — every pending invariant must have a failing owning test
        # NOT continue-on-error. This job going red means a promotion is owed, and the
        # message names the invariant and the file to edit.
        #
        # `--on-collect-error-red` treats an uncollectable suite as red rather than as
        # "cannot determine". That is the right reading HERE and only here: a suite that
        # will not collect certainly has no passing tests, so the pending law is
        # satisfied — vacuously, and the collection error is printed either way.
        #
        # THE OUTPUT IS CAPTURED, AND THE EXIT STATUS IS NOT. `tee` is in the pipeline so
        # the step after this one can name the held invariants without re-running a
        # three-minute suite; `PIPESTATUS[0]` is then re-raised verbatim. This is not a
        # `|| true` in disguise — nothing is swallowed, the status the ratchet returned is
        # the status this step exits with.
        #
        # `set -u`, NOT `set -uo pipefail`, and the difference was a live defect until
        # 2026-08-12. The step's own comment already said `pipefail` "would abort before
        # the capture could be used" — and then the line below set it anyway. MEASURED on
        # run 31600802469: `pipefail` made the pipeline's status 1, the shell's `-e` (from
        # `bash -e {0}`) fired on it, and the three lines after the pipeline never ran, so
        # the log carried the command echo of the status line and never its output. The
        # colour was right by accident and the sentence explaining it was lost every time.
        # Without `pipefail` the pipeline exits with `tee`'s 0, `-e` stays quiet, and the
        # explicit `exit "${status}"` below is what decides this step — which is what the
        # comment always claimed and now is what happens.
        env:
          TRAPPOINT_DSN: ${{ env.LOCAL_DSN }}
        run: |
          set -u
          uv run --frozen python scripts/mi_ratchet.py red --on-collect-error-red 2>&1 \
            | tee mi-red.log
          status="${PIPESTATUS[0]}"
          # THE ECHO THAT CREATED A CONTRADICTION, AND WHAT IT SAYS NOW.
          #
          # It read `(0 held, 1 law broken, 2 cannot determine)`. Six words, and one of
          # them — "law broken" — lands immediately under pytest's own `N failed, M passed`
          # summary, which the in-process run above prints to this same stream. MEASURED on
          # run 31770240275: `7 failed, 460 passed`, every one of the seven captioned
          # *"PL-2 RED, as intended"*, and then `exited 1 … law broken`. Read together those
          # two lines say that seven deliberately-red tests broke the law they exist to
          # satisfy. They did not, and the lane had no way to say so.
          #
          # RESOLVED BY READING `scripts/mi_ratchet.py`, and FALSIFIED rather than argued.
          # Exit 1 from the pending law is reachable from exactly one place — `violations`
          # being non-empty — and `red_violations` populates it only for a pending
          # invariant whose owning tests ALL PASSED. pytest's own status is consumed
          # separately: `MEASURABLE_PYTEST_EXITS` is `{0, 1}`, so "some tests failed" is a
          # MEASUREMENT here and 2/3/4 return 2, never 1. Proven with two hermetic `--junit`
          # controls at HEAD 7535670, no cluster: a report recording 26 failures over the
          # owning set exits **0**; the same report with ONE invariant's owning tests
          # flipped to passing exits **1** naming it. THE POLARITY IS NOT INVERTED. This
          # lane is an HONEST RED and the defect was legibility, so nothing below changes a
          # law, an expectation or a status — it changes what the log SAYS about them.
          echo "scripts/mi_ratchet.py red exited ${status}."
          echo "  0 = the pending law HELD."
          echo "  1 = the pending law was BROKEN: at least one PENDING invariant is witnessed"
          echo "      and every one of its owning tests PASSED, so the catalogue claims"
          echo "      'not yet enforced' while the suite says otherwise."
          echo "  2 = the colour of the suite could not be measured at all."
          echo "THIS NUMBER IS NOT PYTEST'S. A 'N failed' line in the run above is the pending"
          echo "law WORKING for the invariants those tests own -- a pending invariant is"
          echo "REQUIRED to have a failing owning test -- and most of what pytest ran owns no"
          echo "invariant at all, because the law is evaluated over node ids while pytest is"
          echo "handed their whole FILES. The ratchet's own 'WHY THIS EXIT STATUS' block above"
          echo "names the three populations and which one produced this number."
          exit "${status}"

      - name: The invariants this lane is HOLDING, and why none may be promoted
        # R3: an intentional red must name its missing artefact and its owner, in the log.
        #
        # `mi_ratchet.py red` already prints the mechanism, the located object and the
        # passing tests. What it cannot print from inside the red law is the BAND OWNER —
        # `owners_of()` is only wired into the unwitnessed report — and what no message
        # yet says is the ruling: that these are held deliberately, that the equation
        # "the owning tests pass" == "the invariant is enforced" is false for each of
        # them, and that the fix is to STRENGTHEN the owning tests until they fail.
        #
        # Everything below is DERIVED. The held ids come from the ratchet's own refusal
        # line (`RED_VIOLATION_PREFIX`, a constant this reads rather than restates), the
        # objects from `locate_mechanisms` over the real migration tree, the owners from
        # `migrations.allocation.toml`. Nothing about MI06/MI10/MI21/MI22/MI27 is written
        # into this file: a hand-listed set of five would be a lie the day a sixth joins.
        if: failure()
        run: |
          set -euo pipefail
          cat > mi-held-ledger.py <<'PY'
          """Name every held invariant: the absent object, the too-weak test, the owner."""

          from __future__ import annotations

          import ast
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import mi_ratchet as mi

          for stream in (sys.stdout, sys.stderr):
              if hasattr(stream, "reconfigure"):
                  stream.reconfigure(encoding="utf-8", errors="replace")

          ANSI = re.compile(r"\x1b\[[0-9;]*m")
          HELD = re.compile(r"^REFUSED: (MI\d\d) " + re.escape(mi.RED_VIOLATION_PREFIX) + r"\s*$")
          NODEID = re.compile(r"^\s{6}(tests/\S+::\S+)\s*$")

          transcript = Path(sys.argv[1])
          if not transcript.is_file():
              print(f"no mi-red transcript at {transcript}: an earlier step failed first.")
              raise SystemExit(0)

          lines = ANSI.sub("", transcript.read_text(encoding="utf-8", errors="replace")).splitlines()

          held: dict[str, list[str]] = {}
          current: str | None = None
          for raw in lines:
              found = HELD.match(raw)
              if found:
                  current = found.group(1)
                  held[current] = []
                  continue
              if current is None:
                  continue
              node = NODEID.match(raw)
              if node:
                  held[current].append(node.group(1))
              elif raw.startswith("REFUSED:") or (raw and not raw.startswith(" ")):
                  current = None

          def pending_ledger_block() -> list[str]:
              """The ratchet's own PENDING LEDGER, lifted out of the transcript verbatim.

              Sliced on `mi.PENDING_LEDGER_HEADING` rather than on a literal spelled here, so
              the heading has exactly one definition. The slice ends at the first `REFUSED:`
              because that is where the ledger stops and the red law's refusals begin.
              """
              start = next(
                  (i for i, raw in enumerate(lines) if raw.startswith(mi.PENDING_LEDGER_HEADING)),
                  None,
              )
              if start is None:
                  return []
              block: list[str] = []
              for raw in lines[start:]:
                  if raw.startswith("REFUSED:"):
                      break
                  block.append(raw)
              return block

          if not held:
              print("mi-red named no held invariant in this transcript; the red is elsewhere.")
              raise SystemExit(0)

          root = mi.REPO_ROOT
          catalogue = mi.load_catalogue(root / mi.CATALOGUE_RELPATH)
          bodies = mi.read_migration_bodies(root / mi.MIGRATIONS_RELPATH)
          objects = mi.locate_mechanisms(catalogue, bodies)
          bands = mi.load_bands(root / mi.ALLOCATION_RELPATH)
          sources: dict[str, str] = {}


          def function_text(nodeid: str) -> str:
              """The source of one test FUNCTION, never of its module.

              Module scope flatters: a sibling test in the same file often names the
              SQLSTATE, and a module-wide grep would report ten witnesses where there
              may be none.
              """
              rel, _, name = nodeid.partition("::")
              name = name.rsplit("::", 1)[-1]
              if rel not in sources:
                  path = root / rel
                  sources[rel] = path.read_text(encoding="utf-8", errors="replace") if path.is_file() else ""
              text = sources[rel]
              if not text:
                  return ""
              try:
                  tree = ast.parse(text)
              except SyntaxError:
                  return text
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name:
                      return ast.get_source_segment(text, node) or ""
              return ""


          names = ", ".join(sorted(held))
          print(
              f"::error title=db-schema is red on purpose::{len(held)} invariant(s) HELD "
              f"pending — {names}. None may be promoted; the ledger names the absent "
              f"object, the too-weak owning test and the owner for each."
          )
          print("## db-schema — RED ON PURPOSE. Every invariant it is holding, and why.")
          print("")
          print(
              f"`mi_ratchet.py red` asked for {len(held)} promotion(s): {names}. Not one of "
              "them may be made. The ratchet's law is *the owning tests all pass*; the "
              "catalogue's claim is *the invariant is enforced*; and those are the same "
              "sentence only when a passing test would FAIL if the mechanism were dropped. "
              "For these, they are not."
          )
          print("")
          ledger = pending_ledger_block()
          if ledger:
              print("### Every pending invariant, its missing artefact and its owner")
              print("")
              print(
                  "The block below is `mi_ratchet.py red`'s own ledger, verbatim. It covers the "
                  "WHOLE pending set — the ones held above, the ones whose owning tests already "
                  "fail, and the ones with no owning test at all — because a lane that is red on "
                  "purpose has to be able to say all of what it is holding, not a subset."
              )
              print("")
              print("```")
              for raw in ledger:
                  print(raw)
              print("```")
              print("")
          else:
              print(
                  f"*No `{mi.PENDING_LEDGER_HEADING}` block is present in this transcript: the "
                  f"ratchet refused before it could measure a position for each pending "
                  f"invariant. The held table below is all this run can say.*"
              )
              print("")
          print("| invariant | object §16 names | in the tree? | passing owning tests | owner |")
          print("|---|---|---|---|---|")
          for mi_id in sorted(held):
              inv = catalogue.by_id(mi_id)
              found = objects.get(mi_id, ())
              absent = [o.name for o in found if o.state == mi.OBJECT_ABSENT]
              shown = ", ".join(f"`{o.name}`" for o in found) or "*names no SQL identifier*"
              verdict = (
                  f"**ABSENT: {', '.join(absent)}**"
                  if absent
                  else ("present" if found else "not locatable by name")
              )
              owners = mi.owners_of(inv.owning_migrations, bands) or ("unallocated",)
              print(f"| {mi_id} | {shown} | {verdict} | {len(held[mi_id])} | {'; '.join(owners)} |")
          print("")

          for mi_id in sorted(held):
              inv = catalogue.by_id(mi_id)
              found = objects.get(mi_id, ())
              absent = [o for o in found if o.state == mi.OBJECT_ABSENT]
              present = [o for o in found if o.state != mi.OBJECT_ABSENT]
              codes = tuple(inv.sqlstate)
              passing = held[mi_id]
              blind = [n for n in passing if not any(c in function_text(n) for c in codes)]
              owners = mi.owners_of(inv.owning_migrations, bands) or ("unallocated — no band claims these",)
              print(f"### {mi_id} — HELD pending. Promoting it would record a claim nobody measured.")
              print("")
              print(f"* **statement** — {inv.statement}")
              print(f'* **mechanism (§16)** — "{inv.mechanism}", refuses {"/".join(codes)}')
              for obj in absent:
                  print(
                      f"* **the object that does not exist** — `{obj.name}` is in none of the "
                      f"{obj.searched} files under `{mi.MIGRATIONS_RELPATH}`. Every mention of "
                      f"it is a `--` comment. No test can be exercising it, so `enforced` would "
                      f"be a statement about an object the database has never had."
                  )
              for obj in present:
                  where = ", ".join(obj.files[:3]) or "—"
                  more = f" (+{len(obj.files) - 3} more)" if len(obj.files) > 3 else ""
                  print(f"* **present** — `{obj.name}` ({obj.state}) in {where}{more}")
              if not found:
                  print(
                      f"* **the object that does not exist** — cannot be answered by name: §16's "
                      f"mechanism column for {mi_id} names no SQL identifier, so there is nothing "
                      f"to look for. Its only locator is the `-- MI:` citation on "
                      f"{len(inv.owning_migrations)} migrations. An invariant whose enforcing "
                      f"object cannot even be named is not one to promote on a green test run."
                  )
              print(f"* **the owning tests that are too weak to notice** — {len(passing)} passing:")
              for node in passing:
                  mark = (
                      f"its body never names {'/'.join(codes)}"
                      if node in blind
                      else f"its body names {'/'.join(codes)}"
                  )
                  if absent:
                      mark += f"; either way it cannot exercise `{absent[0].name}`, which is absent"
                  print(f"  * `{node}` — {mark}")
              if blind:
                  print(
                      f"  * measured: {len(blind)} of {len(passing)} passing owning test(s) do "
                      f"not contain {' or '.join(codes)} anywhere in the FUNCTION body. A "
                      f"witness for {mi_id} has to observe that refusal; a body that never "
                      f"names it cannot have observed it."
                  )
              print(f"* **owner** — {'; '.join(owners)}")
              print(
                  f"* **the fix, and it is not a promotion** — strengthen {mi_id}'s owning "
                  f"tests until at least one of them FAILS: a test that makes "
                  f"{'/'.join(codes)} the assertion and would go red if the mechanism were "
                  f"dropped. `mi-red` then holds because the law is satisfied, and the "
                  f"promotion that follows is a measurement rather than a bookkeeping entry."
              )
              print("")

          print(
              "**This job stays red.** No `continue-on-error`, no `|| true`, no threshold "
              "moved, no status flipped. The red is the true statement: "
              f"{len(held)} invariant(s) are pending, their owning tests pass, and those two "
              "facts do not contradict each other because the tests are too weak to tell."
          )
          PY
          uv run --frozen python mi-held-ledger.py mi-red.log | tee mi-held.md
          cat mi-held.md >> "$GITHUB_STEP_SUMMARY"

      - name: mi-green — every enforced invariant's owning tests must pass
        # The cluster above is why this job is not hermetic. `green` refuses to certify
        # an invariant on a SKIP, and without a reachable database every cluster-side
        # test skips — which would turn "the mechanism works" into "the mechanism was
        # never exercised" while the board stayed green.
        env:
          TRAPPOINT_DSN: ${{ env.LOCAL_DSN }}
        run: uv run --frozen python scripts/mi_ratchet.py green

      - name: The ratchet is one-way
        # enforced → pending needs an ADR-NNNN in the commit body. A mechanism that stops
        # being enforced is a decision about what this system no longer promises, and
        # decisions here are written down.
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          CAT=verticals/mainline/db/invariants/mi_catalogue.yaml
          git fetch --no-tags --depth=1 origin "$BASE"
          git show "$BASE:$CAT" > /tmp/base-catalogue.yaml
          uv run --frozen python scripts/mi_ratchet.py demote-check \
            --base /tmp/base-catalogue.yaml \
            --message "$(git log -1 --format=%B)"

      - name: Record the ratchet's position in the job summary
        if: always()
        # `|| true` used to sit on the `report` call below and it is gone. A suppression
        # in a summary step is still a suppression: it turns "the catalogue could not be
        # read" into an empty code fence, and an empty fence in a summary reads as "there
        # was nothing to say". `report` is hermetic — it reads the catalogue, the
        # migration headers and the allocation table, none of which depend on the cluster
        # — so if it cannot answer, that is a finding and this step is entitled to fail.
        run: |
          set -euo pipefail
          {
            echo "## db-schema — the MI ratchet"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| image | \`${{ steps.image.outputs.image }}\` |"
            echo "| digest | \`${{ steps.digest.outputs.digest }}\` |"
            echo ""
            echo '```'
            uv run --frozen python scripts/mi_ratchet.py report 2>&1 | tail -8
            echo '```'
            echo ""
            echo "**PL-2.** \`pending\` does not mean unwritten — it means no owning test has"
            echo "been observed to pass, and \`mi-red\` REQUIRES at least one owning test of"
            echo "every pending invariant to be failing right now. A suite for a product whose"
            echo "deliverable is a refusal, that has never been red, asserts nothing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cluster logs on failure
        # FOLDED AND FILED, NOT QUIETED AND NOT SHORTENED — ruling R8. The `tail -100` is
        # unchanged; what is new is that the WHOLE log goes to `schema-engine.log` first
        # and the tail is taken from that file, so the two readers get what each needs and
        # neither is the wall the other has to scroll past. A `::group::` collapses it in
        # the UI and keeps every byte one click away. The alternatives were both refused:
        # a shorter tail throws away the part of an event log furthest from the failure,
        # which is usually the part that explains it, and a `--log` filter on the container
        # would silence exactly the case this step exists for.
        if: failure()
        run: |
          set -euo pipefail
          docker logs trappoint-schema-crdb > schema-engine.log 2>&1
          total="$(wc -l < schema-engine.log | tr -d ' ')"
          echo "::group::docker logs trappoint-schema-crdb | tail -100 (of ${total} line(s))"
          tail -100 schema-engine.log
          echo "::endgroup::"

      - name: The engine's own account, as a file
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-schema-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: schema-engine.log
          if-no-files-found: warn
          retention-days: 30

      - name: Tear down
        if: always()
        # A conditional, not a suppression. `|| true` here would also hide a `docker rm`
        # that failed for a reason worth knowing — a daemon that has stopped answering,
        # a container wedged in `Removal In Progress`. The only expected non-failure is
        # "the container was never created", because an earlier step failed before
        # `docker run`, and that case is tested for by name rather than swallowed.
        run: |
          set -euo pipefail
          if [ -n "$(docker ps -aq --filter 'name=^trappoint-schema-crdb$')" ]; then
            docker rm -f trappoint-schema-crdb
          else
            echo "no container named trappoint-schema-crdb exists; nothing to tear down"
          fi

      # ── THE LAST THING A FAILING RUN SAYS ─────────────────────────────────────────
      #
      # RULING R8, and the answer to the `mi-red` contradiction. This step is LAST in the
      # job — after the engine log, after the tear-down — so the bottom of the run is the
      # diagnosis rather than CockroachDB's session chatter. It is ANSI-free by
      # construction: this workflow sets `FORCE_COLOR: "1"` at file scope, which is left
      # alone because the escapes are a defect only for a reader consuming the raw log,
      # and that is exactly how the lead read this lane and why it could not be read
      # without filtering by hand.
      #
      # IT DECIDES NOTHING. It exits 0 on every input, emits no annotation, and runs only
      # when the job has ALREADY failed. The verdict is `mi_ratchet.py`'s own exit status,
      # re-raised by the `mi-red` step several steps above. Deleting this step cannot turn
      # a red run green and neither can breaking it.
      #
      # NOTHING BELOW IS WRITTEN DOWN. The exit-status paragraph is lifted verbatim out of
      # the ratchet's own transcript by slicing on `mi.EXIT_NOTE_HEADING`, the held ids
      # come from `mi.RED_VIOLATION_PREFIX`, and the pytest summary is pytest's own line.
      # A hand-written count would be a lie the day an invariant moves.
      - name: VERDICT — an HONEST RED, and the arithmetic that proves it is not an inverted polarity
        if: failure()
        run: |
          set -euo pipefail
          # THE TRANSCRIPT IS CHECKED BEFORE ANYTHING IS RUN, AND THIS IS NOT A
          # SUPPRESSION. `mi-red.log` is written by step 9; `uv` arrives at step 6. A job
          # that died on the version comparison at step 5 has neither, and calling
          # `uv run` there would fail with `command not found` — a SECOND red, for a cause
          # that has nothing to do with the ratchet, emitted by the step whose entire
          # purpose is to make the FIRST one readable. Exiting 0 with a sentence is this
          # step's contract: it decides nothing, and it has nothing to diagnose.
          #
          # `python3` is not used here as it is in `cluster-tests.yml`, because this
          # program imports `scripts/mi_ratchet.py` to read `RED_VIOLATION_PREFIX` and
          # `EXIT_NOTE_HEADING` rather than restating them, and that module needs `yaml`.
          # A restated literal is how the wording drifts out from under the reader; the
          # workspace this step needs is already installed by the time it can have work.
          if [ ! -f mi-red.log ]; then
            echo "no mi-red transcript: this job failed before the pending law ran, so this"
            echo "block has nothing to report. Read the step above that exited non-zero -"
            echo "the version comparison, the cluster probe and mi-green each carry their own."
            exit 0
          fi
          cat > mi-verdict.py <<'PY'
          """State which of the two possible readings of `mi-red` is the true one."""

          from __future__ import annotations

          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import mi_ratchet as mi

          for stream in (sys.stdout, sys.stderr):
              if hasattr(stream, "reconfigure"):
                  stream.reconfigure(encoding="utf-8", errors="replace")

          ANSI = re.compile(r"\x1b\[[0-9;?]*[ -/]*[@-~]")
          HELD = re.compile(r"^REFUSED: (MI\d\d) " + re.escape(mi.RED_VIOLATION_PREFIX) + r"\s*$")
          SUMMARY = re.compile(r"^=*\s*\d+ (failed|passed)[^=]*=*$")
          RULE = "=" * 86

          transcript = Path(sys.argv[1])
          if not transcript.is_file():
              print(f"no mi-red transcript at {transcript}: an earlier step failed first.")
              raise SystemExit(0)
          lines = ANSI.sub("", transcript.read_text(encoding="utf-8", errors="replace")).splitlines()

          held = [found.group(1) for found in map(HELD.match, lines) if found]
          summary = [raw.strip() for raw in lines if SUMMARY.match(raw.strip())]
          note: list[str] = []
          for index, raw in enumerate(lines):
              if raw.startswith(mi.EXIT_NOTE_HEADING):
                  for tail in lines[index:]:
                      if tail.startswith("REFUSED:") or (note and not tail.strip()):
                          break
                      note.append(tail)
                  break

          print("")
          print(RULE)
          print("DB-SCHEMA / mi-red — VERDICT. Read this block; you should not need `grep`.")
          print(RULE)
          # A BLOCK THAT EXPLAINS A RED IT CANNOT SEE WOULD BE THE SAME DEFECT IN A NEWER
          # COAT. This job can fail for reasons that are not `mi-red` at all — the image
          # comparison, `mi-green`, the one-way check, a cluster that never answered — and
          # every one of those leaves a transcript naming no held invariant and carrying no
          # exit-status paragraph. Saying "an honest red" over one of those would be a
          # confident sentence about something this step did not measure.
          if not held and not note:
              print("  This job is red, and `mi-red` is NOT why: its transcript names no held")
              print("  invariant and carries no exit-status paragraph, so the pending law either")
              print("  held or never ran. Read the step above that exited non-zero — `mi-green`,")
              print("  the version comparison, the one-way check and the cluster probe all fail")
              print("  on their own terms and each carries its own diagnosis.")
              print(RULE)
              raise SystemExit(0)
          print("  the two statements that look like a contradiction:")
          for raw in summary or ["    (pytest printed no summary line in this transcript)"]:
              print(f"    pytest  : {raw}")
          print(f"    ratchet : scripts/mi_ratchet.py red refused {len(held)} invariant(s)"
                f"{': ' + ', '.join(held) if held else ''}")
          print("")
          print("  THE RESOLUTION — an HONEST RED. The polarity is NOT inverted.")
          print("    Exit 1 from the pending law is reachable from exactly one place: a PENDING")
          print("    invariant that is witnessed and whose owning tests ALL PASSED. A failing")
          print("    test never produces it. pytest's own status is consumed separately -")
          print("    MEASURABLE_PYTEST_EXITS is {0, 1}, so 'some tests failed' is a MEASUREMENT")
          print("    here, and 2/3/4 return 2 rather than 1.")
          print("    Falsified hermetically with --junit and no cluster: a report recording a")
          print("    failure on every owning node id exits 0; the same report with ONE")
          print("    invariant's owning tests flipped to passing exits 1 naming that invariant.")
          print("")
          if note:
              print("  the ratchet's own account of which population produced its status:")
              for raw in note:
                  print(f"  {raw}")
              print("")
          print("  WHAT TURNS THIS LANE GREEN")
          print("    * strengthen each held invariant's owning tests until at least one FAILS -")
          print("      a test that makes the SQLSTATE the assertion and would go red if the")
          print("      mechanism were dropped. The step above names the absent object for each.")
          print("    * then promote it in mi_catalogue.yaml, which is a measurement rather than")
          print("      a bookkeeping entry, and shows up in blame forever.")
          print("  WHAT DOES NOT")
          print("    * flipping an expectation, or making a deliberately-red test pass. Those")
          print("      tests are the red law WORKING; a pending invariant is REQUIRED to have a")
          print("      failing owning test.")
          print("    * promoting a held invariant on a green test run. Its enforcing object is")
          print("      ABSENT from the migration tree, so the promotion would record a claim")
          print("      nobody measured - which is the exact motion this ratchet exists to refuse.")
          print("    * continue-on-error, || true, an exemption, or a threshold moved.")
          print(RULE)
          PY
          uv run --frozen python mi-verdict.py mi-red.log

  # ── The negative control for the version assertion in `ratchet` ─────────────────────
  #
  # An assertion nobody has ever watched fail is the same vacuity in a newer coat. The
  # `ratchet` job compares `SELECT version()` against the version derived from
  # compose.yaml's pin; this job runs the SAME comparison — one compiled pattern, one
  # function, used twice inside one step — against two nodes:
  #
  #   the pinned tag       MUST match      (or the comparison is broken, not the tree)
  #   a NEIGHBOURING tag   MUST NOT match  (or the comparison cannot tell versions apart)
  #
  # The job is RED if the wrong node satisfies the comparison. A control that fails to
  # fail is a failure, and it is reported as one, with the half that broke named.
  #
  # The control tag is DERIVED — the pin's patch component minus one — and never written
  # down, for the same reason the expectation is not: `db.yml`'s census counts restated
  # image literals across `.github/workflows/` against a ceiling being driven DOWN, and a
  # literal here would push it back up and turn the `db` lane red. A released x.y.z
  # implies x.y.(z-1) was released, so the derived tag exists; a .0 patch falls back to
  # the previous minor, and when neither is derivable the job fails saying the control
  # could not be exercised — which is the honest verdict, not a green.
  image-pin-bites:
    name: the version comparison bites — a neighbouring tag must fail it
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read the ONE version constant out of compose.yaml
        id: image
        run: |
          set -euo pipefail
          image="$(python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("compose.yaml").read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if "trappoint:crdb-image-pin" in line:
                  for candidate in lines[i + 1 : i + 4]:
                      m = re.match(r"^\s*image:\s*(\S+)\s*$", candidate)
                      if m:
                          print(m.group(1))
                          raise SystemExit(0)
          raise SystemExit("compose.yaml carries no marked image pin")
          PY
          )"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Two nodes, one comparison, opposite verdicts
        env:
          PINNED_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import time

          IMAGE = os.environ["PINNED_IMAGE"]
          repository, _, tag = IMAGE.rpartition(":")
          WANTED = tag[len("latest-") :] if tag.startswith("latest-") else tag

          # THE comparison. Compiled once, applied to both nodes, so "the identical
          # comparison" is a property of the code rather than of a copy-paste.
          MATCH = re.compile(rf"(?<![0-9A-Za-z.]){re.escape(WANTED)}(\.\d+)*(?![0-9A-Za-z.])")

          def version_of(container: str) -> str:
              probe = subprocess.run(
                  ["docker", "exec", container, "./cockroach", "sql", "--insecure",
                   "--format=csv", "--execute", "SELECT version()"],
                  capture_output=True, text=True, check=False,
              )
              if probe.returncode != 0:
                  detail = (probe.stderr or probe.stdout).strip().replace("\n", " · ")
                  raise SystemExit(f"SELECT version() failed on {container}: {detail}")
              row = [line for line in probe.stdout.splitlines() if line.strip()][-1]
              return row.strip().strip('"')

          def start(container: str, image: str) -> None:
              made = subprocess.run(
                  ["docker", "run", "-d", "--name", container, image,
                   "start-single-node", "--insecure", "--store=type=mem,size=1GiB"],
                  capture_output=True, text=True, check=False,
              )
              if made.returncode != 0:
                  detail = (made.stderr or made.stdout).strip().replace("\n", " · ")
                  raise SystemExit(
                      f"the negative control could not be exercised: {image} would not "
                      f"start — {detail}. This job asserts nothing until it can."
                  )
              for _ in range(60):
                  alive = subprocess.run(
                      ["docker", "exec", container, "./cockroach", "sql", "--insecure",
                       "--execute", "SELECT 1"],
                      capture_output=True, text=True, check=False,
                  )
                  if alive.returncode == 0:
                      return
                  time.sleep(2)
              raise SystemExit(
                  f"the negative control could not be exercised: {image} never answered "
                  "pgwire within 120 seconds"
              )

          # The deliberately wrong tag, derived from the pin and never restated.
          parts = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", WANTED)
          if parts is None:
              print("::error title=the negative control cannot be derived::the pin's tag is "
                    f"not a vMAJOR.MINOR.PATCH triple — got {WANTED!r}. Deriving a "
                    "neighbouring tag is how this control avoids restating the version "
                    "constant; rewrite the derivation rather than hard-coding a tag.")
              sys.exit(1)
          major, minor, patch = (int(part) for part in parts.groups())
          if patch > 0:
              control_tag = f"v{major}.{minor}.{patch - 1}"
          elif minor > 0:
              control_tag = f"v{major}.{minor - 1}.0"
          else:
              print("::error title=the negative control cannot be derived::the pin is a "
                    f".0.0 release ({WANTED}) and no neighbouring tag can be derived from "
                    "it without inventing one.")
              sys.exit(1)

          NODES = (
              ("pin-truth", IMAGE, True),
              ("pin-control", f"{repository}:{control_tag}", False),
          )

          failures: list[str] = []
          try:
              for container, image, must_match in NODES:
                  start(container, image)
                  served = version_of(container)
                  matched = MATCH.search(served) is not None
                  print(f"{container}: tag {image.rsplit(':', 1)[-1]} -> server said "
                        f"{served!r} -> {'MATCHES' if matched else 'does not match'} the "
                        f"pin {WANTED}")
                  if matched == must_match:
                      continue
                  if must_match:
                      failures.append(
                          f"the comparison REJECTED the pinned node itself: a node started "
                          f"from {image} reports {served!r} and the pattern built from "
                          f"{WANTED} did not find it. The version assertion in `ratchet` is "
                          "broken, not the tree it asserts over."
                      )
                  else:
                      failures.append(
                          f"the comparison ACCEPTED a node started from {image}, whose "
                          f"server reports {served!r}, while asserting {WANTED}. It cannot "
                          "tell two versions apart, so every green the version assertion in "
                          "`ratchet` has produced is worth nothing and it must be treated "
                          "as unproven."
                      )
          finally:
              for container, _image, _expected in NODES:
                  subprocess.run(["docker", "rm", "-f", container],
                                 capture_output=True, text=True, check=False)

          if failures:
              for line in failures:
                  print(f"::error title=the version comparison does not bite::{line}")
              sys.exit(1)
          print(f"the comparison bites: {WANTED} accepted and {control_tag} rejected by the "
                "same pattern, in the same step, against two nodes that both answered SQL")
          PY
