#
# THE OSS / DISTRIBUTION LANE.
#
# BUILD_PLAN.md §11 makes this a parallel track that must never touch the critical path:
# nothing downstream may depend on an upstream maintainer doing anything. So this lane
# asserts only things that are true inside this repository — that every skill validates,
# that every script it ships can actually fail, that the de-branded tree really is
# de-branded, and that our own documentation does not claim an upstream merge we have not
# been given.
#
# THREE PROPERTIES ARE ASSERTED HERE THAT NOTHING ELSE ASSERTS:
#
#   1. `assert_gate_refuses.py` goes RED against an unwelded schema. A skill whose selling
#      point is "this script fails when the gate does not refuse" has to demonstrate the
#      failing half in CI, on every push, or it is a claim rather than a control.
#   2. `skills/upstream/` contains no vocabulary from this project. A file destined for
#      somebody else's repository that mentions our brand is not a contribution.
#   3. We claim THE FILING, NEVER THE MERGE. The grep below fails the build on a string
#      that asserts an upstream acceptance, and on a string that characterises the upstream
#      repository as stalled or dead. It is not stalled — PR #18 merged 2026-07-22 — and
#      the honest sentence is about two specific pull requests having had no maintainer
#      engagement, which is a fact rather than a verdict on a team.
#
# NO AWS ACCOUNT, NO COCKROACHDB CLOUD ORGANISATION, NO CREDENTIAL OF OURS. Every proof in
# this lane runs on a stranger's laptop, which is PL-1 and is why the skills ship even if
# the cloud, the vertical and the demo all slip.

name: skills

on:
  push:
    # `master`, not `main` — the default branch of this repository, measured
    # 2026-08-10 with `gh repo view --json defaultBranchRef`. `main` does not exist,
    # so this trigger had never fired once. See claims.yml for the full note.
    branches: [master]
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "docs/upstream/**"
      - "README.md"
      - "VERIFY.md"
      - ".github/workflows/skills.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  FORCE_COLOR: "1"

jobs:
  # ── 1 · every SKILL.md validates, against two independent validators ──────────────────
  #
  # RED HALF FIRST, then the green half, in ONE job — the shape `claims.yml` uses. The
  # marketplace checker below is written to a file ONCE and invoked twice: against mutated
  # copies in the red half and against the tracked `.claude-plugin/marketplace.json` in the
  # green half. Two copies of a checker are two things to keep in step, and the one that
  # drifts is always the one nobody is watching.
  validate:
    name: spec conformance (red half, then green half)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: The marketplace checker, written once so the two halves cannot drift
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anti-vacuity"
          cat > "$RUNNER_TEMP/anti-vacuity/check_marketplace.py" <<'PY'
          """The plugin marketplace resolves to skills that exist.

              python check_marketplace.py <marketplace.json>

          Plugins are the distribution format; skills are the content. A marketplace entry
          pointing at a directory that is not there installs cleanly and does nothing,
          which is the worst possible failure for a distribution artefact.
          """
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text("utf-8"))
          problems = []
          for required in ("name", "owner", "plugins"):
              if required not in data:
                  problems.append(f"marketplace.json is missing `{required}`")
          for plugin in data.get("plugins", []):
              if "name" not in plugin or "source" not in plugin:
                  problems.append(f"plugin entry lacks name or source: {plugin.get('name', plugin)}")
              paths = plugin.get("skills", [])
              if isinstance(paths, str):
                  paths = [paths]
              for entry in paths:
                  target = pathlib.Path(entry.lstrip("./"))
                  if not (target / "SKILL.md").is_file():
                      problems.append(f"declared skill path has no SKILL.md: {entry}")
          # The upstream staging tree must never be distributed as one of ours.
          declared = " ".join(
              str(p) for pl in data.get("plugins", []) for p in pl.get("skills", [])
          )
          if "upstream" in declared:
              problems.append(
                  "a plugin declares a path under skills/upstream/, which is a staging area "
                  "for a de-branded contribution and is not ours to ship"
              )
          for problem in problems:
              print(f"::error file={path}::{problem}")
          if not problems:
              print(f"{path}: every declared skill path resolves to a SKILL.md")
          sys.exit(1 if problems else 0)
          PY
          echo "wrote $RUNNER_TEMP/anti-vacuity/check_marketplace.py"

      - name: RED — five planted spec violations, each refused BY NAME
        # A copy of a shipped skill, one violation planted per family, `validate-spec.py
        # --strict` run against the copy. The unmutated copy is validated FIRST: without
        # that, a refusal below could be an artefact of copying rather than of the plant,
        # and "it exited 1" would be a claim about nothing.
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path.cwd().resolve()
          VALIDATOR = ROOT / "skills" / "validate-spec.py"
          SOURCE = ROOT / "skills" / "designing-diachronic-gates"
          WORK = Path(__import__("os").environ["RUNNER_TEMP"]) / "skills-mutant"
          failures: list[str] = []


          def rebuild():
              if WORK.exists():
                  shutil.rmtree(WORK)
              WORK.mkdir(parents=True)
              shutil.copytree(SOURCE, WORK / SOURCE.name)
              return WORK / SOURCE.name


          def validate():
              done = subprocess.run(
                  [sys.executable, str(VALIDATOR), str(WORK), "--strict"],
                  capture_output=True, text=True, cwd=str(ROOT), check=False,
              )
              return done.returncode, done.stdout + done.stderr


          def split(target):
              lines = target.joinpath("SKILL.md").read_text(encoding="utf-8").splitlines()
              end = lines.index("---", 1)
              return lines[1:end], lines[end + 1:]


          def write(target, matter, body):
              target.joinpath("SKILL.md").write_text(
                  "---\n" + "\n".join(matter) + "\n---\n" + "\n".join(body) + "\n",
                  encoding="utf-8",
              )

          rebuild()
          code, output = validate()
          print(f"unmutated scratch copy exit: {code}")
          if code != 0:
              failures.append(
                  "COPY IS NOT CLEAN: a byte copy of a shipped skill does not validate, so "
                  "no refusal below can be attributed to a planted violation:\n"
                  + output.strip()[:600]
              )

          FAMILIES = (
              ("missing-required-field", "frontmatter is missing `description`"),
              ("malformed-name", "must be lowercase words joined by single hyphens"),
              ("dangling-link", "link target does not exist:"),
              ("out-of-spec-field", "is not in the spec"),
              ("empty-body", "the body after the frontmatter is empty"),
          )

          for family, expected in FAMILIES:
              target = rebuild()
              matter, body = split(target)
              if family == "missing-required-field":
                  matter = [m for m in matter if not m.startswith("description:")]
              elif family == "malformed-name":
                  matter = [
                      "name: Designing_Diachronic_Gates" if m.startswith("name:") else m
                      for m in matter
                  ]
              elif family == "dangling-link":
                  body = [*body, "", "See [the missing reference](./reference/not-here.md)."]
              elif family == "out-of-spec-field":
                  matter = [*matter, "planted_field: this key is not in the specification"]
              elif family == "empty-body":
                  body = []
              write(target, matter, body)

              code, output = validate()
              if code == 0:
                  failures.append(
                      f"PLANTED FAMILY {family}: `validate-spec.py --strict` ACCEPTED a skill "
                      "carrying this violation. On this family the validator is decoration."
                  )
              elif expected not in output:
                  failures.append(
                      f"PLANTED FAMILY {family}: the validator exited {code} but its message "
                      f"never names the family — expected {expected!r}. A non-zero exit whose "
                      "reason is unknown is not evidence; a program that fails to START also "
                      f"exits non-zero.\n{output.strip()[:600]}"
                  )
              else:
                  print(f"  REFUSED  {family}: {expected}")

          shutil.rmtree(WORK, ignore_errors=True)
          for failure in failures:
              print(f"::error title=skills spec validator::{failure}")
          if failures:
              raise SystemExit(1)
          print("")
          print(f"{len(FAMILIES)} planted spec violations, every one refused by name.")
          PY

      - name: RED — four planted marketplace violations, each refused BY NAME
        # Same checker as the green step below, pointed at mutated copies of the real
        # marketplace. The dangling-skill-path family is the one this lane exists for: an
        # entry naming a directory that is not there installs cleanly and does nothing.
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          CHECKER = pathlib.Path(os.environ["RUNNER_TEMP"]) / "anti-vacuity" / "check_marketplace.py"
          WORK = pathlib.Path(os.environ["RUNNER_TEMP"]) / "marketplace-mutant"
          WORK.mkdir(parents=True, exist_ok=True)
          REAL = pathlib.Path(".claude-plugin/marketplace.json")
          failures: list[str] = []


          def run(path):
              done = subprocess.run(
                  [sys.executable, str(CHECKER), str(path)],
                  capture_output=True, text=True, check=False,
              )
              return done.returncode, done.stdout + done.stderr

          # The untouched copy first: a refusal below must be caused by its plant.
          clean = WORK / "clean.json"
          clean.write_text(REAL.read_text("utf-8"), encoding="utf-8")
          code, output = run(clean)
          print(f"unmutated copy exit: {code}")
          if code != 0:
              failures.append(
                  "COPY IS NOT CLEAN: a byte copy of the marketplace is already refused, so "
                  f"no refusal below is attributable to a plant:\n{output.strip()[:400]}"
              )

          FAMILIES = (
              ("dangling-skill-path", "declared skill path has no SKILL.md"),
              ("upstream-staging-shipped", "a plugin declares a path under skills/upstream/"),
              ("plugin-without-source", "plugin entry lacks name or source"),
              ("missing-top-level-key", "marketplace.json is missing `owner`"),
          )

          for family, expected in FAMILIES:
              data = json.loads(REAL.read_text("utf-8"))
              if family == "dangling-skill-path":
                  data["plugins"][0]["skills"].append("./skills/a-skill-that-does-not-exist")
              elif family == "upstream-staging-shipped":
                  data["plugins"][0]["skills"].append(
                      "./skills/upstream/cockroachdb-resilience-and-disaster-recovery"
                      "/verifying-a-restore-by-merkle-root"
                  )
              elif family == "plugin-without-source":
                  del data["plugins"][0]["source"]
              elif family == "missing-top-level-key":
                  del data["owner"]
              mutant = WORK / f"{family}.json"
              mutant.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

              code, output = run(mutant)
              if code == 0:
                  failures.append(
                      f"PLANTED FAMILY {family}: the marketplace checker ACCEPTED this. A "
                      "marketplace that cannot refuse is a distribution artefact nobody has "
                      "checked."
                  )
              elif expected not in output:
                  failures.append(
                      f"PLANTED FAMILY {family}: exit {code} but the message never names the "
                      f"family — expected {expected!r}.\n{output.strip()[:400]}"
                  )
              else:
                  print(f"  REFUSED  {family}: {expected}")

          for failure in failures:
              print(f"::error title=marketplace checker::{failure}")
          if failures:
              raise SystemExit(1)
          print("")
          print(f"{len(FAMILIES)} planted marketplace violations, every one refused by name.")
          PY

      - name: Our validator, warnings promoted to errors
        # `skills/validate-spec.py` is OUR implementation of the published rules, not a
        # byte copy of upstream's `scripts/validate-spec.py` — which is stated in that
        # file's docstring and in skills/README.md, because a local validator agreeing
        # with itself is not evidence about somebody else's CI. It runs in --strict mode
        # so a warning is a red build here and never a surprise there.
        run: python skills/validate-spec.py skills/ --strict --github

      - name: skills-ref — the specification's own reference implementation
        # This is the check that matters. Run it per skill directory rather than over the
        # tree, so the failing skill is named in the log rather than inferred.
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r skill; do
            directory="$(dirname "$skill")"
            echo "::group::skills-ref validate ${directory}"
            if ! npx --yes skills-ref validate "${directory}"; then
              echo "::error file=${skill}::skills-ref rejected this skill"
              status=1
            fi
            echo "::endgroup::"
          done < <(find skills -name SKILL.md | sort)
          exit "${status}"

      - name: GREEN — the plugin marketplace resolves to skills that exist
        # The SAME file the red half ran four planted violations through, now pointed at
        # the tracked marketplace. One definition, two halves; the mutated copies live in
        # $RUNNER_TEMP and are never on this path.
        run: python "$RUNNER_TEMP/anti-vacuity/check_marketplace.py" .claude-plugin/marketplace.json

      - name: The tracked tree was never mutated
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=no)"
          if [ -n "${dirty}" ]; then
            echo "::error::this job mutated the checkout. Every plant belongs in a scratch copy."
            echo "${dirty}"
            exit 1
          fi
          echo "working tree clean — every planted violation lived under \$RUNNER_TEMP"

  # ── 2 · the claims we are allowed to make ─────────────────────────────────────────────
  claims:
    name: filing not merge · de-branded upstream tree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: No string claims an upstream merge, and none disparages the repository
        # SCOPE. Published copy only: the root documents, the upstream proposal, and the
        # skills tree. `docs/leads/**` is excluded deliberately — those are internal
        # planning documents whose job is to STATE this rule, and they state it by quoting
        # the forbidden phrase. For the same reason a line that also contains `never`,
        # `must not`, `do not` or `forbidden` is read as the rule rather than the offence.
        # That exemption is narrow, visible here, and the alternative is a check nobody can
        # write documentation past.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          MERGE = re.compile(
              r"(our|the)\s+(skill|contribution|pull request|pr)[^.]{0,60}"
              r"(was|has been|is|were|have been)\s+(merged|accepted)"
              r"|merged\s+(in)?to\s+upstream|merged\s+upstream"
              r"|upstream\s+(has\s+)?(merged|accepted)"
              r"|accepted\s+(in)?to\s+(the\s+)?(cockroach|upstream)"
              r"|landed\s+(in\s+)?upstream"
              r"|now\s+(part of|in)\s+(the\s+)?cockroachdb-skills"
              r"|shipped\s+(in|to)\s+(the\s+)?cockroachdb-skills",
              re.IGNORECASE,
          )
          DISPARAGE = re.compile(
              r"repo(sitory)?\s+(is|was|has been)\s+"
              r"(stalled|dead|unmaintained|abandoned|inactive)"
              r"|(stalled|dead|abandoned|unmaintained)\s+repo(sitory)?"
              r"|no longer maintained",
              re.IGNORECASE,
          )
          EXEMPT = re.compile(r"\bnever\b|\bmust not\b|\bdo not\b|\bforbidden\b", re.IGNORECASE)

          targets = [pathlib.Path(name) for name in ("README.md", "VERIFY.md", "NOTICE")]
          targets += sorted(pathlib.Path("docs/upstream").rglob("*.md"))
          targets += [p for p in sorted(pathlib.Path("skills").rglob("*"))
                      if p.is_file() and p.suffix in {".md", ".py"}]

          failures = 0
          for path in targets:
              if not path.is_file():
                  continue
              for number, line in enumerate(path.read_text("utf-8").splitlines(), start=1):
                  if EXEMPT.search(line):
                      continue
                  for label, pattern in (("claims an upstream merge", MERGE),
                                         ("disparages the upstream repository", DISPARAGE)):
                      if pattern.search(line):
                          failures += 1
                          print(f"::error file={path},line={number}::this line {label}: "
                                f"{line.strip()[:160]}")
          if failures:
              print("We claim THE FILING, never the merge. Upstream acceptance is not ours "
                    "to promise and nothing downstream depends on it.")
          sys.exit(1 if failures else 0)
          PY

      - name: The upstream tree carries none of this project's vocabulary
        # A contribution that mentions our brand is an advertisement. The `.license`
        # sidecars are excluded because that is exactly why they exist: the SPDX header
        # lives beside the file rather than inside it, so the file itself stays clean.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          BRANDED = re.compile(
              r"mainline|trappoint|diachronic|permit[- ]to[- ]work|blame (edge|pointer|closure)"
              r"|precursor|unwelding|SSE\b",
              re.IGNORECASE,
          )
          failures = 0
          for path in sorted(pathlib.Path("skills/upstream").rglob("*")):
              if not path.is_file() or path.name.endswith(".license"):
                  continue
              for number, line in enumerate(path.read_text("utf-8").splitlines(), start=1):
                  found = BRANDED.search(line)
                  if found:
                      failures += 1
                      print(f"::error file={path},line={number}::branded vocabulary "
                            f"{found.group(0)!r} in a file destined for another repository")
          sys.exit(1 if failures else 0)
          PY

  # ── 3 · the scripts, including the half that has to FAIL ──────────────────────────────
  proofs:
    name: every shipped script proves it can fail
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: No third-party packages are installed for these steps
        # The skills claim "standard library only". Asserting it costs one line, and the
        # claim is load-bearing: a stranger runs these on a machine we do not control.
        run: |
          python -c "import sys; print(sys.version)"
          # `sed -E …d` rather than `grep -v … || true`: grep exits 1 on an empty result
          # and `|| true` is banned here, because the same idiom used one line further
          # down would turn a real refusal into a silence.
          pip list --format=freeze | sed -E '/^(pip|setuptools|wheel)==/d'

      - name: Diagnostic parser, no database required
        run: |
          python skills/designing-diachronic-gates/scripts/assert_gate_refuses.py \
            --parser-self-test

      - name: Merkle restore verifier, no database required
        run: |
          python "skills/upstream/cockroachdb-resilience-and-disaster-recovery/verifying-a-restore-by-merkle-root/scripts/verify_restore_merkle_root.py" \
            --self-test

      - name: Vector-plan assertion, no database required
        run: |
          python skills/designing-vector-recall-prefixes/scripts/assert_prefix_index_used.py \
            --self-test

      - name: Pull the CockroachDB image the gate assertion will use
        run: docker pull cockroachdb/cockroach:v26.2.5

      - name: THE UNWELDING MATRIX — welded refuses, unwelded ADMITS
        # Nine histories against nine freshly created databases on one throwaway node.
        # Four of the rows must end in ADMITTED; those are the rows that make the other
        # five mean anything. The script exits non-zero if any row disagrees with its
        # prediction, in either direction.
        run: |
          python skills/designing-diachronic-gates/scripts/assert_gate_refuses.py \
            --self-test --docker-only --image cockroachdb/cockroach:v26.2.5

      - name: RED BEFORE GREEN — the assertion must fail on a schema with the gate removed
        # PL-2 made executable for this lane. `--print-schema` emits the reference gate;
        # we then remove the CHECK and disable the re-derivation trigger and require the
        # SAME assertion that passed above to exit 1. A test suite that has never been red
        # asserts nothing about a product whose deliverable is a refusal.
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gate="skills/designing-diachronic-gates/scripts/assert_gate_refuses.py"
          python "${gate}" --print-schema > "${work}/unwelded.sql"
          cat >> "${work}/unwelded.sql" <<'SQL'
          ALTER TABLE subject DROP CONSTRAINT gate_closed_when_issued;
          ALTER TABLE subject DISABLE TRIGGER subject_close_gate;
          SQL
          cat > "${work}/prelude.sql" <<'SQL'
          INSERT INTO subject (subject_id) VALUES (101);
          INSERT INTO obligation (obligation_id, subject_id, severity) VALUES (1101, 101, 4);
          SQL
          cat > "${work}/illegal.sql" <<'SQL'
          UPDATE subject SET state = 'closed' WHERE subject_id = 101;
          SQL
          set +e
          python "${gate}" --docker-only --image cockroachdb/cockroach:v26.2.5 \
            --schema "${work}/unwelded.sql" --prelude "${work}/prelude.sql" \
            --history "${work}/illegal.sql" \
            --expect-sqlstate 23514 --expect-exhibit gate_closed_when_issued
          code=$?
          set -e
          if [ "${code}" -ne 1 ]; then
            echo "::error::the gate assertion exited ${code} against an UNWELDED schema; it must exit 1."
            echo "::error::An assertion that cannot go red is not an assertion."
            exit 1
          fi
          echo "the assertion went red against the unwelded schema, as it must"

      - name: Summary
        if: always()
        run: |
          {
            echo "## skills lane"
            echo ""
            echo "| proof | meaning |"
            echo "|---|---|"
            echo "| unwelding matrix | the welded gate refuses; each mechanism removed makes it ADMIT |"
            echo "| red before green | the same assertion exits 1 on an unwelded schema |"
            echo "| merkle self-test | truncation, tampering and reordering are all caught |"
            echo "| claims grep | we claim the filing, never the merge |"
            echo "| spec red half | 5 planted spec violations, each refused BY NAME |"
            echo "| marketplace red half | 4 planted marketplace violations, each refused BY NAME |"
            echo ""
            echo "The last two rows are new on 2026-08-10. \`validate-spec.py --strict\` and the"
            echo "marketplace checker were both green and neither had ever been shown to refuse"
            echo "anything; the marketplace checker now has ONE definition, written to a file and"
            echo "run against four mutated copies before it is run against the tracked one. See"
            echo "\`docs/ci/anti-vacuity.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
