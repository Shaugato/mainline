# ═══════════════════════════════════════════════════════════════════════════════════
# DISCLOSURE-DECISIONS — every value this repository publishes on purpose
# ═══════════════════════════════════════════════════════════════════════════════════
#
# Decision D2, docs/leads/ship-final.md §1.6.
#
# `scripts/submission/audit_public_readiness.py` has three dispositions:
#
#   UNRESOLVED   gating, red, the default for every hit.
#   ALLOWLISTED  non-gating; granted by the ALLOWLIST *in the scanner's source*.
#   DISCLOSED    non-gating; granted ONLY by an entry in THIS FILE naming the exact
#                path, with a family, a class, a date, a decider and a reason.
#
# An occurrence in a file this register does not name stays UNRESOLVED and stays red.
# That is the whole point. This file is not an allowlist, and it is not permitted to
# behave like one:
#
#   * A grant is keyed by EXACT PATH plus FAMILY. There are no globs, no prefixes and
#     no wildcards, because the reader is the point and a glob is not readable.
#   * A grant covers only the SCOPES it declares. `scopes: [history]` means the value
#     is accepted in a commit that is already on origin/master and is NOT accepted if
#     it reappears at HEAD.
#   * A grant that matches nothing on a run is a FAILURE (check 8, `stale_entries`).
#     An entry cannot sit here as standing permission for a hit nobody has looked at.
#   * A grant CANNOT ask for a value to be printed verbatim. Disclosed previews are
#     redacted to a six-character prefix and a length, exactly like unresolved ones.
#   * `class` comes from a fixed vocabulary in the scanner. `class: fine` is a parse
#     error, not a decision.
#
# The scanner reads this file with a strict minimal YAML reader written into it, not
# with PyYAML, so `python -I -S scripts/submission/audit_public_readiness.py` still
# runs with site-packages disabled. The self-test cross-checks that reader against
# PyYAML where PyYAML happens to be importable, and asserts that eight malformed
# registers are all refused.
#
# WHAT IS NOT IN HERE, and never will be: a real credential. Nothing in this register
# authenticates against anything. The rotated `mainline_judge` password is the case
# this rule was written for, and it is checked separately and positively:
#
#     printf '%s' "$PASSWORD" | python scripts/submission/audit_public_readiness.py \
#         --assert-absent
#
# ───────────────────────────────────────────────────────────────────────────────────
#
# 56 entries in seven classes. `entries` is the count of grants written here; `grants`
# is the number of findings each one actually disposed of on the run that produced
# qa/public-readiness.json — one entry covering both the tracked and the history scope
# disposes of two. Both numbers are re-derived by the scanner on every run and appear
# in that JSON under `totals.disclosed_by_class`; if they disagree with this comment,
# the JSON is right and this comment is stale.
#
#   class                          entries  grants
#   abs-path-layout                     25      27   D:/CoackroachDBxAWS/mainline and
#                                                    similar — layout, no account name
#   history-already-pushed              14      14   values in commits that are already
#                                                    on origin/master; masking HEAD
#                                                    does not retract them
#   recorded-evidence-account-id         6      22   the AWS account id inside a quoted
#                                                    command, a refusal transcript or a
#                                                    committed plan
#   abs-path-username                    5       7   paths that DO disclose the
#                                                    founder's Windows account name
#   synthetic-test-fixture               3       7   credential-shaped literals in
#                                                    another program's self-test
#   detector-context-artefact            2       6   the pattern is right and the intent
#                                                    is not: the matched token is a
#                                                    hostname or a file path
#   aws-documentation-placeholder        1       2   AKIAIOSFODNN7EXAMPLE, published by
#                                                    AWS itself
#
# ───────────────────────────────────────────────────────────────────────────────────
# RE-COUNTED 2026-08-14 — THE COMMENT ABOVE IS THE STALE ONE, EXACTLY AS IT PREDICTED
# ───────────────────────────────────────────────────────────────────────────────────
#
# The block above says 56 entries in seven classes. It also says, in terms, that the
# scanner is the authority and this comment is what goes stale. It has. Three entries
# have been added since it was written, and the classes did not change.
#
#     $ grep -c '^  - path:' docs/submission/DISCLOSURE-DECISIONS.yaml
#     59
#     $ python scripts/submission/audit_public_readiness.py     # the check-8 row
#     PASS  disclosure_register  59 entry/entries granting 84 finding(s); 0 stale;
#           classes abs-path-layout=26, abs-path-username=6,
#           aws-documentation-placeholder=2, detector-context-artefact=2,
#           history-already-pushed=14, recorded-evidence-account-id=6,
#           synthetic-test-fixture=3
#
#   class                          entries (2026-08-14)   was
#   abs-path-layout                                  26    25
#   history-already-pushed                           14    14
#   abs-path-username                                 6     5
#   recorded-evidence-account-id                      6     6
#   synthetic-test-fixture                            3     3
#   detector-context-artefact                         2     2
#   aws-documentation-placeholder                     2     1
#                                                    --    --
#                                                    59    56
#
# `0 stale` is the number that matters and it is the one to keep watching. Every one of
# the 59 grants still matched a finding that still exists on 2026-08-14. A register
# whose grants outlive their findings has stopped disposing of anything and started
# excusing things in general, and check 8 goes red the day that happens.
#
# WHAT THIS RE-COUNT DOES NOT DO. It does not touch a grant, add one, or widen one. The
# live audit reports 160 UNRESOLVED findings, up from 54 on 2026-08-12, and NONE of
# them was disposed of here to make that number smaller. Writing entries into this file
# to shrink a red count — rather than because somebody read the value and decided about
# it — is the single failure mode this register was built to make visible, and adding
# 106 grants in one commit would be exactly what it looks like.
#
# ALSO RE-CHECKED, because it is the founder's own name: the `abs-path-username` class
# now covers 6 entries, and the audit reports 11 files disclosing a Windows account
