  # A THIRD ENTRY WAS HERE AND HAS BEEN DELETED, which is the best evidence in this file
  # that check 8 does what it says.
  #
  # `qa/public-readiness.json :: high_entropy_secret` was granted while the reasons in §3
  # still quoted the judge pack's filename immediately after the word "password" — in
  # YAML those sit on different wrapped lines and the detector never arms, but serialised
  # into JSON each reason becomes ONE line and the two land inside the 60-character
  # window. Rewriting the §3 reason to describe the token instead of reproducing it
  # removed the hits at the source. The grant then covered nothing, the scanner reported
  # `granted nothing this run`, and the audit stayed red until the entry was deleted.
