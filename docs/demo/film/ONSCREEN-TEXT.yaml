    reason: >-
      AGENT SKILLS IS DESIGNED, AND THE REPOSITORY SAYS SO IN ITS OWN CENSUS.
      `evidence/tool-usage/crdb-features.json` → `rows.crdb_agent_skills.verdict` reads
      DESIGNED, against EXERCISED on the other three contest tools, and that file's own
