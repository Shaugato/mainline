  - id: F-8
    severity: HIGH — R-4 and R-5 both depend on it and neither plan says so
    finding: >-
      THE CHANGE REQUEST'S OWN OBLIGATION IS NOT ADDRESSABLE FROM ANY DECLARED ROUTE, and
      that is a different problem from the one the plan describes.
      `GET /v1/demo/subjects` returns `check_id: dec0de00-0007-…` — the PERMIT's blocking
      check — because its statement filters `WHERE bc.permit_id = %s`
      (visible in the payload's own `statement_refs`). The CR's check
      `dec0de00-000d-…` is returned by nothing. `GET
      /v1/change-requests/{cr_id}/blocking-checks` answers 404.
    what_the_screen_therefore_does_today: >-
      `ChangeScreen.ts:675` computes `latticeCheckId = ownCheckIds[0] ?? addressing.checkId`.
      With blocking-checks 404, `ownCheckIds` is empty and it falls back to the permit's
      check. So the Management-of-Change screen reads the PERMIT's disposition and renders
      the PERMIT's lattice and the PERMIT's three defeater prompts — correctly labelled,
      under its own scope note saying "Nothing is claimed here about this change request's
      obligation" (ChangeScreen.ts:711-715). The screen is honest. The BEAT is impossible.
    why_it_matters_more_than_the_plan_says: >-
      film-recut-plan.md §1.4 treats the 404 as a broken panel and §6 lists it as decision-
      gate condition 2 without saying what it is load-bearing FOR. It is load-bearing for
      both of the rulings the wave turns on. R-4 requires the three CR defeater prompts on
      screen in b10 — they arrive only if the CR's check id is addressable. R-5 requires the
      shared clause and the shared precursor legible in the refusal's frame — `7.3.2(b)`
      arrives as the `clause_label` column of the CR's own blocking-check row, and
      `DEMO-INC-0001` arrives inside the text of the `PRECURSOR_ANSWERED_ELSEWHERE` prompt.
      BOTH ROUTES INTO THAT FRAME RUN THROUGH THE SAME CHECK ID. If it is not addressable,
      R-5 fails, and R-5 says the wave should then be abandoned in favour of §6.
    the_good_news_inside_it: >-
      Nothing needs to be built into the console. `absence.ts:52-58` already drives discovery
      off the 404 body's own declared route table, by predicate over the templates rather
      than by matching a string it hopes to find: "On the day that route is added,
      `discoverCrCheckIds` follows it, fetches the checks, and the prompts appear, with no
      edit to this file." The console is waiting for the route. The route is the whole fix.
    a_second_way_that_would_also_work: >-
      `/v1/demo/subjects` carrying the CR's `check_id` beside the permit's. Cheaper, and
      worse: the console deliberately refuses to take ids from source or from a fixed
      shape, and an addressing route that special-cases one subject is the kind of thing
      that stops being true when the seed changes.
    measured: '2026-08-16, against the live origin, GET only'
    owner: whoever owns the demo API's route table; film lead, for the decision gate

