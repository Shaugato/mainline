        kind: ui_label
        text: Management of change
        chip: editorial
        editorial: true
        source: operator/change/ChangeScreen.ts:285 (h1) and :280 (the region's aria-label)
        deployed_2026_08_16: 'present in the served bundle, 3 occurrences'
        note: >-
          Still the supervisor's own product, not MAINLINE — the same move b0 makes with
          CONTROL OF WORK. The refusal in b10 lands inside somebody else's software for the
          second time, on a different screen of it, and that is half of what use case two
