# ══════════════════════════════════════════════════════════════════════════════════════
# FORBIDDEN ON CAMERA — strings, values and frames that may never appear
# This block is a `claim_hygiene.py` PROHIBITION_KEY: everything indented under it is read
# as quoting the ban rather than committing it. That is why the banned words can be
# written down here, and why they may not be written down anywhere else in this file.
# ══════════════════════════════════════════════════════════════════════════════════════
forbidden_on_camera:

  - value: clearance_digest captioned, spoken or overlaid as a constant
    reason: >-
      Four gate-runs on 2026-08-15 produced four different digests, because disposition_id
      is a fresh uuid4 per run. If it were ever stable the rollback proof would be broken.
      The panel may render the digest the run produced; nothing may present it as a value
      that will be there tomorrow.
    authority: plan R-K; r6-honesty A14; CLICKS.md §5 B7

  - value: any 7-hex-character or 40-hex-character SHA literal, on screen or in a caption
    reason: >-
      commit_id is a sha256 over the JCS envelope and cannot be chosen in advance, so a SHA
      written down before the shoot is a SHA that will be wrong. The honesty-card generator
      refuses to emit runs of seven or more hex characters for the same reason. Content
      digests render at eight-plus-four or at sixty-four, never at seven and never at forty.
    authority: CAMERA-STRINGS.yaml:108-109; r6-honesty A14; claim_hygiene.py HYG-sha-literal

  - value: any bare invariant id — I01, MI07, and every sibling
    reason: >-
      Two invariant catalogues collide and one of them is a versioned public API, so a bare
      id is ambiguous. The film cites constraint names, which are unambiguous.
    authority: CAMERA-STRINGS.yaml:110-111; claim_hygiene.py HYG-bare-invariant

  - value: docs/submission/SUBMISSION.json, in any frame, while its demo_url field reads UNRESOLVED
    reason: >-
      That field still holds the sentinel and its note gives a reason that is now false.
      Filming the file would put a stale artefact on camera; the URL itself is fine to film
      and is read from the deploy record instead.
    authority: plan R-M; r6-honesty A4.3; CAMERA-STRINGS.yaml:146-148

  - value: CloudFront
    reason: No distribution exists on this account, and the conditional grant in Terraform is not taken.
    authority: CAMERA-STRINGS.yaml:127-131; r6-honesty A6

  - value: CDN
    reason: Same as CloudFront — there is no distribution, so the noun has nothing to name.
    authority: CAMERA-STRINGS.yaml:127-131

  - value: edge
    reason: >-
      Banned as a word, not merely as an architecture, because it implies a distribution
      tier this deployment does not have. One Lambda in one region is the whole of it.
    authority: CAMERA-STRINGS.yaml:127-131

  - value: multi-region
    reason: Basic tier, one cluster, one region — aws-ap-southeast-1. Nothing here is multi-region.
    authority: r6-honesty A7

  - value: tamper-proof
    reason: >-
      The claim is tamper-EVIDENT. A cluster admin can drop a constraint; what they cannot do
      is drop it unobserved. Anyone saying a database stops its own administrator is selling
      something.
    authority: r6-honesty A10; DEMO-HONESTY.md:58-62

  - value: split-view resistant
    reason: >-
      There is one witness, it is ours, q = 1, and the property is not claimed in any form,
      on any screen, in any caption.
    authority: r6-honesty A10; claim_hygiene.py MNC-14; docs/decisions/demo-use-cases.md:204-264

  - value: a CloudWatch console window, or any cloud console
    reason: >-
      The cost guard is real and applied; a console on camera is trademark-dense and would be
      some other stack's window. Name the guard in the overlay and film nothing else.
    authority: CAMERA-STRINGS.yaml:127-131; r6-honesty A6

  - value: CMEK, customer-managed encryption keys, PrivateLink
    reason: Tier features this deployment does not have. Never named affirmatively, not even as a plan.
    authority: claim_hygiene.py MNC-03

  - value: a vector-search visualisation, a similarity score, an embedding plot, an EXPLAIN plan beside a live beat
    reason: >-
      The demo world seeds no embeddings and runs no vector query. The channel that produced
      this obligation is blame_ancestry, and tau_applied is 0 because no threshold was
      consulted. A shimmering embedding cloud would be a fabricated exhibit.
    authority: r6-honesty A7; demo_permit.sql:181-185

  - value: a changefeed, a CDC stream, or the words "changefeeds propagate the lesson"
    reason: >-
      There is no CREATE CHANGEFEED in any of the 271 migrations and v_changefeed_health
      returns zero rows. What the trigger writes is an outbox row.
    authority: r6-honesty A7

  - value: the propagation screen, or any narration of it
    reason: >-
      All five of its provenance pointers are chipped staged, three of its tables do not
      exist, and every identifier in it is a digest of its own label. It may be linked under
      a badge; it may not be narrated, demonstrated or filmed.
    authority: r6-honesty A13.1; docs/decisions/demo-use-cases.md:136-142

  - value: 'the second permit WO-88213, the 2013 gland-seal fire, INC-2013-044, INC-2024-0117, or the year 2024 in any sentence'
    reason: >-
      Those belong to the console-and-corpus world, which is a different database. This film
      is one world: DEMO-PTW-0001, DEMO-INC-0001, 2019-03-14, demo_site, demo.signer,
      DEMO-MOC-0001.
    authority: plan R-E; r6-honesty A3, A15.3

  - value: 'a defeater option named not_applicable, or any global "N/A" on a disposition screen'
    reason: >-
      The shipped constructor is mechanism_absent. The other name says something the schema
      cannot represent, and inventing an escape hatch on camera would destroy the point of
      rendering the three prompts as questions.
    authority: claim_hygiene.py MNC-19; r3-operator §7.3

  - value: a real person's name, a real incident, a real operator, a real employer's logo or form number
    reason: >-
      Every clause, procedure, incident, permit, operator, site and person in this demo was
      written for this repository. The mechanism is real; the inputs are authored, and the
      watermark says so for the whole film.
    authority: r6-honesty A3, A17.2

  - value: music of any kind
    reason: No music at all removes the whole licensing question.
    authority: CAMERA-STRINGS.yaml forbidden_on_camera

  - value: a permit header counter shown or narrated as ticking from 1 to 0
    reason: >-
      The header was rendered before the press, the beat-3 write was rolled back, and this
      page never re-reads it. The only legitimate zero is inside the beat-3 panel, in the
      payload's own statement and its own counter_forced_to.
    authority: CLICKS.md §3 first boxed warning; plan R-D

  - value: the permit screen shown turning from blocked to issued
    reason: >-
      The admission happened inside a transaction that was rolled back; on the live row the
      permit is still dispositioned. A screen made to flip would be asserting a state the
      database does not hold, and that is the one act this wave exists to prevent.
    authority: CLICKS.md §3 second boxed warning and §7.1

  - value: a 423 Locked response rendered in a refusal banner
    reason: >-
      A 423 is the demonstration protecting itself and its message is about a lock, not about
      an obligation. Rendering it as a gate refusal would put a fabricated exhibit in front of
      a judge. The ISSUE button posts to the gate-run route and to nothing else.
    authority: r3-operator §5.5; CLICKS.md §2

  # ── ADDED FOR THE CHANGE-REQUEST BLOCKS · b9, b10, k1-k3 ──────────────────────────

  - value: >-
      the 2019 incident date and the staged propagation title in the SAME SHOT — the
      precursor dated 2019 on screen while any panel, tab, drawer or scroll position
      carries the payload that reuses that uuid under a title naming a 2024 incident
    reason: >-
      r6-honesty A3's two-incident trap. `DEMO-INC-0001` renders with its own
      `occurred_at` in b3, and the staged lesson-propagation payload reuses the same uuid
      while titling it after a different, later incident. One uuid, two stories, and a
      frame carrying both would let a viewer conclude the record had been rewritten. The
      ban is on the PAIR; each alone is governed by its own row above, which already bans
      the propagation screen outright and bans the 2024 incident in any sentence.
    measured_2026_08_16: >-
      THE MANAGEMENT-OF-CHANGE SCREEN CANNOT RENDER IT, and this was checked rather than
      assumed. The deployed operator entry `/assets/operator-D24tzVGh.js` (96,734 B
      decoded) contains ZERO occurrences of `propagation`, `lessons/`, `strengthened
      after`, `INC-2024-0117` and the four-digit year `2024`. The operator subtree in the
      tree mentions propagation exactly once, in a source comment at
      `operator/hazard/precursor.ts:22` recording that the card never renders it. The
      route `/v1/lessons/{lesson_id}/propagation` is declared by the deployment, so the
      payload is reachable — it is simply not reachable FROM THIS SCREEN, because no
      module in the operator entry builds that path.
    so_the_residual_risk_is_named: >-
      Not the screen. A second browser tab left open on the propagation surface, or a
      devtools Network list still holding a `/v1/lessons/…` row from earlier in the
      session. Both are shoot hygiene rather than software, which is why this row survives
      the measurement instead of being closed by it: clear the Network list before the
      press, and open no tab in the take that the take does not need.
    authority: r6-honesty A3; film-recut-plan.md §4.3; W4's brief

  - value: >-
      `cr_gate_closed_when_merged`, `cr_merge_gate` and `mainline.fn_cr_merge_gate` used
      as if they named the same object, in a caption, an overlay, a label or a column
      heading
    reason: >-
      THEY ARE THREE DIFFERENT OBJECTS AND THE DIFFERENCE IS ONE WORD WIDE.
      `cr_gate_closed_when_merged` is the CHECK constraint
      (`db/migrations/0051_change_request.sql:85`). `cr_merge_gate` is a TRIGGER on the
      same table (`db/migrations/0131_trg_cr_merge_gate.sql:38`), and `z_cbm_gate_cr` is a
      second one (`db/migrations/0145d_trg_cbm_gate_cr.sql:63`).
      `mainline.fn_cr_merge_gate` is the function a trigger calls
      (`db/migrations/0116_fn_cr_merge_gate.sql`) and is what a `P0001` names. A `23514`
      belongs to the CHECK and a `P0001` belongs to the function; putting either name
      beside the other's SQLSTATE writes a claim the kernel did not make. This is the most
      likely single defect in the second use case's on-screen text.
    authority: VO-DEMO-CR.md B10's boxed warning; the four migrations named above

  - value: >-
      `severity 4` rendered, captioned or spoken as a property of the change request's
      obligation, sourced from anything other than that obligation's own row
    reason: >-
      No 200 route returns it today. `/v1/checks/{check_id}/disposition` returns
      `virulence` and the defeater vocabulary and carries NO severity member;
      `/v1/change-requests/{cr_id}/blocking-checks` answers 404. The only `4` this
      deployment will hand over is `/v1/demo/subjects` ·
      /data/subjects/event/severity_gate — the EVENT's severity gate, a different column
      on a different table, describing the incident rather than the obligation. Borrowing
      it would be a value measured on one row asserted about another, which is the same
      class of act as reading a counter off the wrong subject.
    it_becomes_legal_the_moment_this_is_true: >-
      the CR blocking-checks route answers 200 and `/data/checks/0/severity` is on screen
      in the seven-column table the console already builds for it.
    authority: measured 2026-08-16; findings.F-10

  - value: >-
      a third mutating request in the take — any POST row in the network panel beyond the
      two the film narrates, or either of those two appearing without its narration
    reason: >-
      R-9's amended F-11, and it is strictly STRONGER than the rule it replaces, not a
      loosening made to fit a beat. Exactly two mutating requests exist in this film: the
      permit gate-run under b1, and the change-request attempt under b9. Each is narrated
      while it is in flight and each is visible in the panel. A third row means something
      pressed something nobody scripted, and an unnarrated row means the audience is
      watching a write they were not told about. Either stops the take.
    authority: film-recut-plan.md R-9; CLICKS.md §6

  - value: >-
      the change request shown or narrated as CARRYING the clause, as targeting it, or as
      holding an edge to it
    reason: >-
      `mainline.change_request` has no target-clause column, and the screen says so in its
      own words in the frame (`b9.clause.relation_note`). The clause of record is quoted
      because the deployment returned it, and the change request asserts no edge to it.
      Where the shared clause IS asserted is on the OBLIGATION — `clause_label` on the
      change request's own blocking-check row — and that is a different sentence with a
      different pointer behind it. A film that upgraded the juxtaposition into an edge
      would be inventing a foreign key.
    authority: ChangeScreen.ts:654-658; measured 2026-08-16

  - value: >-
      the typed proposed wording shown or narrated as the cause of the refusal, or as
      something the request sent
    reason: >-
      TWO SEPARATE FALSEHOODS, BOTH EASY TO FALL INTO IN THIS FRAME. First, nothing about
      the typed text reaches the database: the compare is computed in the browser
      (`osha-sections.ts:329-336`) and the attempt control POSTs to a path that takes no
      body and no path parameter at all (`ChangeScreen.ts:143-158` — "One POST. The only
      one this screen can make, and it takes no identifier from this page"). Second, the
      refusal is not about the words. It is about `open_blocking = 1` against a predicate
      that reads that counter, and both are in the same frame saying so. A typed proposal
      filmed beside a refusal, narrated as though the one produced the other, is a claim
      about causation that nothing on screen supports — the same defect
      `b6.do_not_render` guards against on the permit side.
    the_frame_carries_its_own_answer: >-
      Which is why this is survivable at all: the constraint row prints the predicate and
      the counter side by side, so a judge who wonders what was refused reads it off the
      screen rather than inferring it from the typing.
    authority: measured 2026-08-16; film-recut-plan.md R-2

  - value: >-
      `23514`, `cr_gate_closed_when_merged`, `persisted false` or any beat value burned
      into an overlay for b10 before the run that produced it
    reason: >-
      The endpoint declares those two as EXPECTATIONS (`cr_gate_run.py:212-213`) and
      returns its own `matched_expectation` beside what actually happened. An overlay
      prepared in advance is an overlay that will still be right-looking on a run that went
      wrong, which is precisely the failure the payload's own field exists to expose.
      Every value in b10 is a slot filled from the take's response, and a run whose verdict
      is not `PROVEN` is filmed as not proven or not filmed.
    authority: rule 1 of film-recut-plan.md §8; cr_gate_run.py:40-44

  - value: >-
      b9 shot without b10, or either of them shot while the decision gate is open
    reason: >-
      R-10. Use case two is ATOMIC. A setup with no answer is worse than neither: it
      spends twelve seconds raising the judge's own objection and never answers it. And a
      beat shot against a route that does not answer is a beat that has to be staged, which
      is the one thing this repository has refused at every turn. If the gate is open on
      the day, §6's NO-GO path is the film — b8 returns to 10 s, the `b8b.*` rows are on
      screen, and the cut is 152 s and legal.
    authority: film-recut-plan.md R-10, §6

  # ── ADDED BY THE CLOSE-CARD WAVE · the k3 eligibility panel ──────────────────────

  - value: >-
