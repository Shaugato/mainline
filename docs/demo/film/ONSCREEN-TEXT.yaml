# ══════════════════════════════════════════════════════════════════════════════════════
# FORBIDDEN ON CAMERA — strings, values and frames that may never appear
# This block is a `claim_hygiene.py` PROHIBITION_KEY: everything indented under it is read
# as quoting the ban rather than committing it. That is why the banned words can be
# written down here, and why they may not be written down anywhere else in this file.
# ══════════════════════════════════════════════════════════════════════════════════════
forbidden_on_camera:

  - value: clearance_digest captioned, spoken or overlaid as a constant
    reason: >-
      Four gate-runs on 2026-08-15 produced four different digests, because disposition_id
      is a fresh uuid4 per run. If it were ever stable the rollback proof would be broken.
      The panel may render the digest the run produced; nothing may present it as a value
      that will be there tomorrow.
    authority: plan R-K; r6-honesty A14; CLICKS.md §5 B7

  - value: any 7-hex-character or 40-hex-character SHA literal, on screen or in a caption
    reason: >-
      commit_id is a sha256 over the JCS envelope and cannot be chosen in advance, so a SHA
      written down before the shoot is a SHA that will be wrong. The honesty-card generator
      refuses to emit runs of seven or more hex characters for the same reason. Content
      digests render at eight-plus-four or at sixty-four, never at seven and never at forty.
    authority: CAMERA-STRINGS.yaml:108-109; r6-honesty A14; claim_hygiene.py HYG-sha-literal

  - value: any bare invariant id — I01, MI07, and every sibling
    reason: >-
      Two invariant catalogues collide and one of them is a versioned public API, so a bare
      id is ambiguous. The film cites constraint names, which are unambiguous.
    authority: CAMERA-STRINGS.yaml:110-111; claim_hygiene.py HYG-bare-invariant

  - value: docs/submission/SUBMISSION.json, in any frame, while its demo_url field reads UNRESOLVED
    reason: >-
      That field still holds the sentinel and its note gives a reason that is now false.
      Filming the file would put a stale artefact on camera; the URL itself is fine to film
      and is read from the deploy record instead.
    authority: plan R-M; r6-honesty A4.3; CAMERA-STRINGS.yaml:146-148

  - value: CloudFront
    reason: No distribution exists on this account, and the conditional grant in Terraform is not taken.
    authority: CAMERA-STRINGS.yaml:127-131; r6-honesty A6

  - value: CDN
    reason: Same as CloudFront — there is no distribution, so the noun has nothing to name.
    authority: CAMERA-STRINGS.yaml:127-131

  - value: edge
    reason: >-
      Banned as a word, not merely as an architecture, because it implies a distribution
      tier this deployment does not have. One Lambda in one region is the whole of it.
    authority: CAMERA-STRINGS.yaml:127-131

  - value: multi-region
    reason: Basic tier, one cluster, one region — aws-ap-southeast-1. Nothing here is multi-region.
    authority: r6-honesty A7

  - value: tamper-proof
    reason: >-
      The claim is tamper-EVIDENT. A cluster admin can drop a constraint; what they cannot do
      is drop it unobserved. Anyone saying a database stops its own administrator is selling
      something.
    authority: r6-honesty A10; DEMO-HONESTY.md:58-62

  - value: split-view resistant
    reason: >-
      There is one witness, it is ours, q = 1, and the property is not claimed in any form,
      on any screen, in any caption.
    authority: r6-honesty A10; claim_hygiene.py MNC-14; docs/decisions/demo-use-cases.md:204-264

  - value: a CloudWatch console window, or any cloud console
    reason: >-
      The cost guard is real and applied; a console on camera is trademark-dense and would be
      some other stack's window. Name the guard in the overlay and film nothing else.
    authority: CAMERA-STRINGS.yaml:127-131; r6-honesty A6

  - value: CMEK, customer-managed encryption keys, PrivateLink
    reason: Tier features this deployment does not have. Never named affirmatively, not even as a plan.
    authority: claim_hygiene.py MNC-03

  - value: a vector-search visualisation, a similarity score, an embedding plot, an EXPLAIN plan beside a live beat
    reason: >-
      The demo world seeds no embeddings and runs no vector query. The channel that produced
      this obligation is blame_ancestry, and tau_applied is 0 because no threshold was
      consulted. A shimmering embedding cloud would be a fabricated exhibit.
    authority: r6-honesty A7; demo_permit.sql:181-185

  - value: a changefeed, a CDC stream, or the words "changefeeds propagate the lesson"
    reason: >-
      There is no CREATE CHANGEFEED in any of the 271 migrations and v_changefeed_health
      returns zero rows. What the trigger writes is an outbox row.
    authority: r6-honesty A7

  - value: the propagation screen, or any narration of it
    reason: >-
      All five of its provenance pointers are chipped staged, three of its tables do not
      exist, and every identifier in it is a digest of its own label. It may be linked under
      a badge; it may not be narrated, demonstrated or filmed.
    authority: r6-honesty A13.1; docs/decisions/demo-use-cases.md:136-142

  - value: 'the second permit WO-88213, the 2013 gland-seal fire, INC-2013-044, INC-2024-0117, or the year 2024 in any sentence'
    reason: >-
      Those belong to the console-and-corpus world, which is a different database. This film
      is one world: DEMO-PTW-0001, DEMO-INC-0001, 2019-03-14, demo_site, demo.signer,
      DEMO-MOC-0001.
    authority: plan R-E; r6-honesty A3, A15.3

  - value: 'a defeater option named not_applicable, or any global "N/A" on a disposition screen'
    reason: >-
      The shipped constructor is mechanism_absent. The other name says something the schema
      cannot represent, and inventing an escape hatch on camera would destroy the point of
      rendering the three prompts as questions.
    authority: claim_hygiene.py MNC-19; r3-operator §7.3

  - value: a real person's name, a real incident, a real operator, a real employer's logo or form number
    reason: >-
      Every clause, procedure, incident, permit, operator, site and person in this demo was
      written for this repository. The mechanism is real; the inputs are authored, and the
      watermark says so for the whole film.
    authority: r6-honesty A3, A17.2

  - value: music of any kind
    reason: No music at all removes the whole licensing question.
    authority: CAMERA-STRINGS.yaml forbidden_on_camera

  - value: a permit header counter shown or narrated as ticking from 1 to 0
    reason: >-
      The header was rendered before the press, the beat-3 write was rolled back, and this
      page never re-reads it. The only legitimate zero is inside the beat-3 panel, in the
      payload's own statement and its own counter_forced_to.
    authority: CLICKS.md §3 first boxed warning; plan R-D

  - value: the permit screen shown turning from blocked to issued
    reason: >-
      The admission happened inside a transaction that was rolled back; on the live row the
      permit is still dispositioned. A screen made to flip would be asserting a state the
      database does not hold, and that is the one act this wave exists to prevent.
    authority: CLICKS.md §3 second boxed warning and §7.1

  - value: a 423 Locked response rendered in a refusal banner
    reason: >-
      A 423 is the demonstration protecting itself and its message is about a lock, not about
      an obligation. Rendering it as a gate refusal would put a fabricated exhibit in front of
      a judge. The ISSUE button posts to the gate-run route and to nothing else.
    authority: r3-operator §5.5; CLICKS.md §2

