        kind: payload_value
        label: Valid from · Expires
        text: 2 August 2026, 00:00 UTC → 2 August 2027, 00:00 UTC
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/permits/{permit_id} · /data/opened_at and /data/horizon_at
