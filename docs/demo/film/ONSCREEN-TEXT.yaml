#
# prose-hygiene: register
#
# ONSCREEN-TEXT.yaml — EVERY STRING THAT APPEARS ON SCREEN IN THE 172 s, AND WHERE IT CAME
# FROM. Owner: W5 (story-and-script wave). Beat ids and durations are inherited from
# `docs/demo/film/BEATS.yaml`, which wins on timing; nothing here re-decides a duration.
#
# This file quotes forbidden strings beside true ones, in the same register form
# `verticals/mainline/demo/script/CAMERA-STRINGS.yaml` uses, so it carries the
# `prose-hygiene: register` marker above. Structurally it does not need it —
# `forbidden_on_camera` is one of `claim_hygiene.py`'s PROHIBITION_KEYS and the whole
# indented block under it is read as quoting the ban rather than committing it — but a
# reader who does not know that should not have to work it out from a regex.
#
# ── SCANNER VERDICT (plan R-B) ────────────────────────────────────────────────────────
# `docs/demo/film/` is outside every glob in `claim_hygiene.py`'s TARGET_GLOBS, so the
# scanner is invoked by hand and its verdict is recorded here rather than inferred from a
# green lane. Command and result, run on this file, 2026-08-16:
#
#   .venv/Scripts/python.exe scripts/demo/claim_hygiene.py --check \
#       docs/demo/film/ONSCREEN-TEXT.yaml
#
#   scanned 1 file(s) against 21 rules
#   claim hygiene OK
#   exit 0
#
# VERDICT: PASS, on the first run of this file, and a pass that has never gone red asserts
# nothing — so it was falsified rather than trusted. A copy of this file with three
# violations planted at the end was scanned on 2026-08-16:
#
#   .venv/Scripts/python.exe scripts/demo/claim_hygiene.py --check <scratch>/onscreen-red.yaml
#
#   FAIL :2395: [HYG-sha-literal]     a seven-hex tree ref written into a note
#   FAIL :2396: [HYG-bare-invariant]  a bare invariant id written outside the prohibition block
#   FAIL :2397: [MNC-14-split-view]   a banned property claimed in prose
#   3 claim-hygiene violation(s) · exit 1
#
# All three families are quiet on the real file and loud on the planted one, which is the
# reading that matters: the silence above is the rules holding, not the rules asleep. The
# third probe is the important one — those words DO appear in this file, inside
# `forbidden_on_camera`, and the planted copy proves the exemption is structural (a
# PROHIBITION_KEY block) rather than a hole. Why the first run was clean is recorded under
# `findings.F-6`; it is not a boast, it is a note about which red somebody else already
# paid for.
#
# ── RE-RUN AFTER THE FILM RE-CUT WAVE (b0b, b8's retime, b9, b10, k1-k3) ──────────────
# The file grew by roughly a thousand lines, so the verdict above was re-earned rather
# than assumed. Same command, 2026-08-16:
#
#   scanned 1 file(s) against 21 rules
#   claim hygiene OK
#   exit 0
#
# And falsified again on a copy of the NEW file, because a pass inherited from an older
# shape is not a pass on this one:
#
#   FAIL :3781: [HYG-sha-literal]     a seven-hex tree ref planted in a note
#   FAIL :3782: [HYG-bare-invariant]  a bare other-catalogue invariant id, planted outside
#                                     the prohibition block
#   FAIL :3783: [MNC-14-split-view]   a banned property claimed in prose
#   3 claim-hygiene violation(s) · exit 1
#
# ⚠ TWO THINGS THE FALSIFICATION FOUND, AND BOTH ARE WORTH MORE THAN THE PASS.
#
# FIRST — THE PROBE ITSELF WENT RED IN THIS HEADER, AND THE FILE WAS FIXED RATHER THAN THE
# SCANNER. Writing the planted ids into this comment block put two bare ids OUTSIDE the
# `forbidden_on_camera` PROHIBITION_KEY, where nothing exempts them, and the check failed
# on the real file with exit 1. That is the same trap BEATS.yaml's header already records
# in its own words — a quoted prohibition on a line the exemption does not reach. The
# resolution is the one this repository takes every time: the ids are DESCRIBED here and
# written only inside the block that is allowed to hold them. If this paragraph ever
# quotes one again, the check fails again, which is the point.
#
# SECOND — A CORRECTION TO ONE OF THIS FILE'S OWN CITATIONS. The first attempt at the
# second probe planted the `M`-prefixed MAINLINE form and the scanner stayed SILENT. That
# is the scanner being right, not asleep: `BARE_INVARIANT` is
# `(?<![A-Za-z0-9_])I\d{2}(?![0-9])` (claim_hygiene.py:247), whose lookbehind excludes the
# `M`, and the rule's own message reads "Cite a constraint name, or MI\d\d for MAINLINE's
# own." So the `M`-prefixed form is the one that rule SANCTIONS. The `forbidden_on_camera`
# row that bans every bare invariant id, both catalogues included, is therefore STRICTER
# THAN ITS CITED AUTHORITY on that half. The row stays exactly as it is — its reason (two
# catalogues collide; the film cites constraint names, which are unambiguous) is the film's
# own and does not need the scanner's permission — but a reader should know that half of it
# is enforced by people rather than by a rule. Recorded rather than quietly corrected,
# because the whole value of that block is that its authorities are checkable.
#
# ── WHAT WAS MEASURED BEFORE THIS FILE WAS WRITTEN ────────────────────────────────────
# Ten payload GETs against the live origin on 2026-08-16 (server_date 2026-08-15T14:00-
# 14:02Z), and no POST — the plan forbids one and the recorded gate-run payload is the
# reference. Three further GETs (`/operator.html`, its script asset, `/v1/demo/subjects`)
# are recorded under `findings.F-1` and `F-5` rather than here, because they measured the
# delivery of the page and not the value of a string:
#
#   GET /v1/health                              200    409 B
#   GET /v1/permits/{permit_id}                 200  5,691 B
#   GET /v1/permits/{permit_id}/blocking-checks 200  2,408 B
#   GET /v1/checks/{check_id}/disposition       200  3,805 B
#   GET /v1/recall-runs/{run_id}                200  2,223 B
#   GET /v1/clauses/{clause_uuid}/versions/{commit_id}  200  3,230 B
#   GET /v1/clauses/{clause_uuid}/ancestry      200  3,744 B   (bare path; the same route
#                                                               with ?as_of_commit= answers
#                                                               400, measured the same day)
#   GET /v1/receipts/{receipt_id}               200  1,817 B
#   GET /v1/change-requests/{cr_id}             200  3,295 B
#   GET /v1/checks/{cr_check_id}/disposition    200  3,850 B
#
# Every `payload_value` row below carries the pointer it was read from. Values that change
# per run are NOT written down as text; they are slots (see `conventions.volatile`).
# The POST-side values are read from `evidence/deploy/live-gate-run.json` (run `judge-walk`,
# generated 2026-08-14T22:10:33Z) and are labelled `reference`, never `text`.
#
# ── THE ONE THING A READER MUST KNOW BEFORE TRUSTING A `ui_label` ROW ─────────────────
# Every `ui_label` string here is quoted from the operator source in THIS repository at
# HEAD. THE PARAGRAPH THAT USED TO STAND HERE IS SUPERSEDED AND ITS REPLACEMENT IS THE
# BETTER NEWS: on 2026-08-16 at 15:0x local the operator package IS in the bytes the live
# origin serves. `GET /operator.html` answers 200 (5,097 B) with
# `<title>Control of Work</title>` and loads its own entry `/assets/operator-D24tzVGh.js`
# (96,734 B decoded), and that bundle contains `CONTROL OF WORK`, `PERMIT NOT ISSUED`,
# `Hazard identification`, `not carried by this deployment` ×4, `cow-` ×212, `hz-card` ×2
# and `moc-` ×105. The old paragraph's figures (4,655 B, `MAINLINE console`,
# `/assets/index-LoN3Sn_L.js`, zero occurrences) were true when they were taken and are
# not true now; they are kept in `findings.F-1`, which is rewritten rather than deleted,
# because a research reading is superseded, not erased.
#
# ⚠ THE CHECK F-1 HANDED TO THE ORCHESTRATOR IS BROKEN AND WOULD HAVE FAILED THE SHOOT.
# F-1 named `1 obligation outstanding` as the pre-flight string to grep the bundle for.
# That substring occurs ZERO times in the correctly-deployed bundle — and so does
# `obligation outstanding` — because the sentence is COMPOSED at runtime, singular or
# plural chosen from the count (`issue/beats.ts:476-477`, recorded at
# `b0.actionbar.standing`). A pre-flight built on it says NO-GO on a good deployment. The
# check that actually works is recorded at `findings.F-1.the_check_that_catches_it`.
#
# ── THE SECOND USE CASE, AND THE ONE SENTENCE THAT GOVERNS IT ─────────────────────────
# `b9` and `b10` are the change-request blocks added by `docs/demo/film-recut-plan.md`.
# THEY CANNOT BE SHOT AGAINST THIS ORIGIN TODAY and every string in them says so in its
# own row. Measured 2026-08-16 against the live origin, GET only:
#
#   GET  /v1/change-requests/dec0de00-000c-…-000000000001                200  3,295 B
#   GET  /v1/checks/dec0de00-000d-…-000000000001/disposition             200  3,850 B
#   GET  /v1/change-requests/{cr_id}/blocking-checks                     404    693 B
#   GET  /v1/change-requests/{cr_id}/checks                              404    684 B
#   GET  /v1/change-requests/{cr_id}/merge                               404    683 B
#   GET  /v1/demo/subjects · /data/check_id                              dec0de00-0007-… (the PERMIT's)
#   the 404 body's own `error.declared` list                             17 routes, no CR merge, no cr-gate-run
#
# The plan's §6 decision gate is therefore OPEN, not closed, and `beats.b9.decision_gate`
# carries the three conditions with today's reading beside each. Under NO-GO the `b9` and
# `b10` blocks are never shot, `b8` is restored to 10 s, and the `no_go_only: true` rows
# inside `b8` are the ones on screen. Nothing in this file assumes the gate closes.
#
# ── HOW TO READ AN ENTRY ──────────────────────────────────────────────────────────────
#   id            stable handle: <beat>.<region>.<thing>
#   kind          watermark | lower_third | overlay | ui_label | payload_value
#   text          the string VERBATIM, exactly as it appears — or
#   text_slot     a description of the value to be filled from THIS RUN's own response,
#                 used wherever the value moves between runs. A slot is never a
#                 placeholder to be typed over: it names the pointer that fills it.
#   label         the row label the app prints beside the value. EVERY `label` in this
#                 file is our own word, i.e. editorial; it is recorded once here rather
#                 than doubling every entry.
#   chip          the provenance chip: db:column | derived | recomputed | reported |
#                 parsed | staged | typed | editorial | none_claimed
#   envelope_chip the chip the WIRE claimed for this pointer, where the wire's vocabulary
#                 and the chip vocabulary above differ. Recorded, never substituted.
#   editorial     true when the words are ours rather than the database's.
#   source        pointer, file:line, or the endpoint the value came back on.
#
# ── TWO DECLARED EXTENSIONS TO THE BRIEF'S VOCABULARIES, EACH WITH ITS REASON ─────────
# 1. `chip: none_claimed`. The brief's chip vocabulary has eight values; the deployed
#    envelope claims a chip for some pointers and NONE for others, and beats 1 and 4 —
#    including their `00000` SQLSTATEs — are in the second group (`transitions.py` claims
#    `db:constraint` for `/beats/1/sqlstate` and `/beats/2/sqlstate` only;
#    `docs/demo/memory-visible-CONTRACT.md` §2.1). Choosing any of the eight for those
#    values would be this file inventing a claim the emitter did not make. `none_claimed`
#    is the console's own third answer (`features/gate/provenance.ts::lookupProvenance`)
#    and it is used here for exactly that case.
# 2. `envelope_chip`. The wire's five chips are `db:column`, `db:constraint`,
#    `recomputed`, `staged`, `derived` (`envelope.py:93`). `reported` and `parsed` are not
#    wire chips at all — they are the payload's own `constraint_source` values, which the
#    refusal banner renders AS a chip beside the constraint name (`RefusalBanner.ts:171`).
#    Both are true of the same string, so both are recorded: `chip` is what the frame
#    shows, `envelope_chip` is what the envelope claimed.
#
# ── kind: editorial ───────────────────────────────────────────────────────────────────
# The brief asks that every editorial string be marked `kind: editorial`. `editorial` is a
# member of the CHIP vocabulary and not of the KIND vocabulary, and a string is both a
# watermark (kind) and ours (provenance) at once. So the mark is carried twice and
# unambiguously: `chip: editorial` AND `editorial: true`, on every string whose words are
# ours — the lower third, the straplines, the reveal-control labels, every overlay in the
# naming block, and every row label. Grep `editorial: true` and you have the complete list
# of words a judge would be right to call ours.

