  # ── b10 · REFUSED AGAIN · 2:16 → 2:28 ──────────────────────────────────────────────
  # The mirror. You cannot USE the clause; you cannot quietly EDIT IT AWAY either. R-5 and
  # R-4 both bind on this frame and they are the two rulings that decide whether the beat
  # is worth its twelve seconds.
  - beat_id: b10
    t: 136
    dur: 12
    title: REFUSED AGAIN
    conditional_on: b9.decision_gate

    the_one_frame_this_beat_must_produce:
      authority: film-recut-plan.md R-5 (binding, non-negotiable) and R-4
      requirement: >-
        FIVE THINGS, LEGIBLE AT ONCE, IN ONE FRAME. If they are not all in it, use case two
        is a second refusal, the axis-1 trade is a straight loss, and R-5 says the wave
        should be abandoned in favour of §6 rather than shot.
      the_five:
        - '1 · the refusal — SQLSTATE and constraint name, from the run''s own response (b10.refusal.*)'
        - '2 · the clause, at label 7.3.2(b), the same one a judge read in b3 (b10.check.row · b9.clause.provenance_row), with its uuid dec0de00-0004-4000-8000-000000000001 legible in b9.clause.exchange_line'
        - '3 · the precursor DEMO-INC-0001, the same one a judge read in b3 (b10.defeater.precursor_answered_elsewhere)'
        - '4 · the predicate of cr_gate_closed_when_merged, with open_blocking = 1 beside it (b10.constraint.row)'
        - '5 · the three live defeater prompts (b10.defeater.*) — R-4''s mitigation for having no admission'
      how_the_shared_identifiers_get_into_the_frame_honestly: >-
        NOT by juxtaposition and not by an overlay. Both come back as COLUMN VALUES on
        reads this screen makes: `7.3.2(b)` as the `clause_label` column of the change
        request's own blocking-check row, and `DEMO-INC-0001` inside the text of the
        `PRECURSOR_ANSWERED_ELSEWHERE` defeater prompt, which is a `db:column` value on
        `/v1/checks/{check_id}/disposition`. The database says *same clause, same incident*
        in its own strings. The film does not have to.
      what_it_depends_on: >-
        Condition 2 of the decision gate. Both routes into the frame run through the change
        request's own check id, and that id is not addressable today. See findings.F-8.

    strings:

      - id: b10.refusal.sqlstate
        kind: payload_value
        label: SQLSTATE
        text_slot: /data/beats/1/sqlstate on the run actually filmed
        chip: reported
        envelope_chip: db:constraint
        editorial: false
        source: POST /v1/demo/cr-gate-run
        the_expectation_this_is_matched_against: >-
          `cr_gate_run.py:212` declares `CR_CF01_SQLSTATE = "23514"` as the EXPECTATION for
          beat 2, and the payload carries its own `matched_expectation` field. What is on
          screen is what came back; the expectation is recorded here so a reader knows what
          a mismatch would look like rather than discovering one on the day.
        must_not: >-
          NEVER pre-render `23514` into an overlay for this beat. It is the film's most
          quotable value and it is the easiest one to burn in before the run that produces
          it. If the run returns something else, the something else is what is filmed and
          the take is stopped, not the caption.

      - id: b10.refusal.constraint
        kind: payload_value
        label: constraint
        text_slot: /data/beats/1/constraint on the run actually filmed
        chip: reported
        envelope_chip: db:constraint
        editorial: false
        source: 'POST /v1/demo/cr-gate-run, with /data/beats/1/constraint_source rendered as the chip beside it'
        the_expectation_this_is_matched_against: >-
          `cr_gate_run.py:213` declares `CR_CF01_EXHIBIT = "cr_gate_closed_when_merged"` and
          `:591` declares `constraint_source="reported"` — the same strength of diagnosis
          the permit's b2 refusal had, and stronger than b5's `parsed`.
        the_word_the_voice_over_leans_on: >-
          *different*. The permit's refusal named `gate_closed_when_issued`; this one names
          `cr_gate_closed_when_merged`. Two constraints, two tables, one arithmetic. Both
          names must be legible in the cut for that word to be checkable — b2's is on the
          locked ISSUE control, which has not left the film since 0:30.

      - id: b10.constraint.row
        kind: payload_value
        label: 'cr_gate_closed_when_merged · predicate · counters it reads'
        text: "CHECK (((state != 'merged'::mainline.subject_state) OR (open_blocking = 0)))   ·   open_blocking = 1"
        chip: db:column
        envelope_chip: db:constraint
        editorial: false
        source: >-
          GET /v1/change-requests/{cr_id} · /data/constraints/0/{constraint,predicate} and
          /data/constraints/0/counters/0/{column,value}, read out of pg_catalog at request
          time; rendered as the three-column table at absence.ts:369-386
        measured_2026_08_16: 'verbatim as quoted; /constraints/0 chipped db:constraint, /constraints/0/counters/0/value chipped db:column'
        catalogue_form: >-
          This is the `::` form, the same renderer as b2.constraint_table.predicate. The
          `:::` form belongs to the refusal MESSAGE and will arrive on this beat's own
          message field. BOTH WILL BE IN THIS FRAME AT ONCE, which is the first time in the
          film that happens — see findings.F-9. Neither may be corrected into the other and
          the frame must not imply they are the same bytes.
        third_form_that_is_not_on_camera: >-
          `0051_change_request.sql:85` writes the constraint as
          `CHECK (state <> 'merged' OR open_blocking = 0)`. That is the source form, it is a
          third true rendering, and no migration file is on camera in this film.
        why_the_predicate_and_not_a_gloss: >-
          The predicate is the whole argument in one line: the state may not be `merged`
          unless the counter is zero. A judge reads it and needs no explanation of why a
          record with `open_blocking = 1` cannot merge. The counter is printed in the same
          row by the screen's own third column.

      - id: b10.refusal.message
        kind: payload_value
        label: message
        text_slot: /data/beats/1/message on the run actually filmed
        chip: none_claimed
        editorial: false
        source: POST /v1/demo/cr-gate-run
        note: >-
          The database's own sentence for this refusal, printed. It carries the `:::` form
          of the predicate the way b2's does, and it is the second operand of F-9.
        must_not: >-
          Not paraphrased, not truncated, not pretty-printed, and not covered by an overlay.

      - id: b10.refusal.statement
        kind: payload_value
        label: statement
        text_slot: /data/beats/1/statement on the run actually filmed — the merge the endpoint attempted
        chip: none_claimed
        editorial: false
        source: POST /v1/demo/cr-gate-run

      - id: b10.refusal.label
        kind: payload_value
        text: >-
          MERGE the change request — the edit lands on the protected branch. One open
          obligation, no signed disposition.
        chip: none_claimed
        editorial: false
        source: POST /v1/demo/cr-gate-run · /data/beats/1/label
        measured_from: 'the tree, cr_gate_run.py:586-587 — the endpoint''s own label for its second beat'
        note: >-
          The payload's own words for what it tried. Nobody on the film's side wrote this
          sentence, and it is the line that makes the beat an ATTEMPT rather than a
          description — the same job b4.panel.attack_label does for the permit run.

      - id: b10.rollback.persisted
        kind: payload_value
        label: this run persisted anything
        text_slot: /data/persistence_check/self_persisted on the run actually filmed
        reference_expected: 'false'
        chip: recomputed
        editorial: false
        source: POST /v1/demo/cr-gate-run
        must_be_in_frame: true
        why_it_cannot_be_left_to_b8: >-
          b8 proved the PERMIT run persisted nothing. It proves nothing about this one. This
          endpoint takes its own fingerprint before the transaction opens and again after it
          closes and puts BOTH readings in the payload (cr_gate_run.py:569, :723); what is
          on screen is the two readings, not the conclusion. A second mutating request whose
          rollback is asserted by inheritance from the first is a claim with no measurement
          under it.
        must_say: >-
