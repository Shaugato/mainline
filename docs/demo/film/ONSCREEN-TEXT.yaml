          The anchor the proposal walks away from, `ZERO_ENERGY`, is printed in the same panel
          by b9.clause.provenance_row, so the removal is anchored rather than asserted. THIS
          IS THE SAME ARGUMENT THE RETIRED PAIR MADE AND IT SURVIVES THE SHORTENING INTACT.
        constraint_check: >-
          Three words, so the typing rate is visible on camera. No date, no site, no job
          title, no injury, no identifier, no code, no uuid, no company, no plant, no asset
