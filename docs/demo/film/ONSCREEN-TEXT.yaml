        THIS_ROW_WAS_CORRECTED_2026_08_16: >-
          IT CARRIED A DIFFERENT STRING AND A DIFFERENT SHOOTING MODEL, AND BOTH WERE WRONG.
          It read `Before any intrusive work, stored energy shall be` marked "pre-typed in
          pre-roll, 48 characters", joined to b9.proposed.tail_typed's ` isolated and
          locked.` for a 69-character composite. TWO THINGS WERE WRONG WITH THAT PAIR AND
          NEITHER WAS NEW. (1) THE HEAD COULD NOT BE PRE-TYPED AT ALL: the change screen
          MOUNTS at Click 5, 2:05.5, INSIDE the take, and CLICKS.md §1.5 step 3 measured the
          router tearing the moc-proposed-text textarea down and re-creating it EMPTY on the
          hash change — the same measurement this file already records at todo.T-7 and the
          same one that ruled b9 cannot be shot in 10 s. Nothing typed before the red light
          survives to this frame. (2) 69 CHARACTERS WILL NOT TYPE IN R-SD4's 2.5 s AT ANY
          HUMAN RATE: it is 27.6 characters per second against the 6.8 this film has actually
          filmed. The row borrowed b0's head/tail convention for a screen b0's convention does
          not fit.
        where_the_new_string_came_from: >-
          CLICKS.md §5 B9, "WHAT THE RULING COSTS B9" — which owns the typed string under
          shoot-docs-plan.md R-SD4 and states it verbatim with its character count. THIS FILE
          COPIED IT; IT DID NOT CHOOSE IT. A string invented here to hit a stopwatch would be
          a string somebody then matches the build to, which is the wrong direction of travel
          — the same rule b9.attempt.control states about the control's label.
        why_this_string: >-
          IT IS A WEAKENING EDIT OF THE CLAUSE OF RECORD AND THE WEAKENING IS LEGIBLE WITHOUT
          NARRATION. The clause b9.clause.text quotes six lines above reads `SYNTHETIC —
          Before any intrusive work, stored energy shall be isolated, locked and verified at
          zero by a competent person.` The proposal stops at `lock`. THE VERIFICATION IS GONE
          — and `verified at zero` is the very phrase b0's supervisor typed into his own
