      nothing recorded has run it end to end". Two authored skills, one de-branded upstream
      contribution and a green validator are on disk under `skills/`; NO RUN IS COMMITTED
      under `evidence/`. AUDIT.md S5 struck exactly this sentence where it survived in
      census/close-block.md §3. THE REMEDY IS NEVER TO CAPTURE A RUN SO THE CLAIM BECOMES
      TRUE BEFORE THE SHOOT: the tool is stated in the state it is in — three exercised with
      committed transcripts, one shipped and not evidenced — or it is not stated at all.
      The scoping is the reason the rest of the card is believable, which is the same
      argument that boxes Bedrock inside k2's AWS column and keeps S3 Object Lock at
      DESIGNED. A card that claimed four would be trading the one property this film has
      spent 172 seconds earning for a word nobody asked for.
    where_the_true_form_lives: >-
      k3.overlay.tools, whose heading reads `three EXERCISED, one DESIGNED` and whose fourth
      row reads `DESIGNED  shipped, validated;  NO RUN IS COMMITTED  skills/` in the same
      size, weight, column and capitals as the three above it.
    authority: >-
      docs/submission/AUDIT.md S5 and FIX 1; docs/demo/close-card-plan.md R-C5;
      evidence/tool-usage/crdb-features.json rows.crdb_agent_skills.verdict

