          It has never carried a character count, so a shorter honest proposal discharges it
          identically. FALLBACKS.md F-8 is satisfied rather than waived either way, because
          the right-hand side of any comparison is visibly a human's and never the database's.
        source: 'operator/change/osha-sections.ts:290-298 — the app''s own input, id `moc-proposed-text`'
        authority: >-
          film-recut-plan.md R-2 and §1.5; CLICKS.md §4 and §5 B9 (the string of record);
          convention C3; shoot-docs-plan.md R-SD4; FALLBACKS.md F-8 satisfied rather than
