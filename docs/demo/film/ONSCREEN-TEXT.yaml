      - id: k1.overlay.strap
        kind: overlay
        text: every date above is a column value · no AS OF SYSTEM TIME produced any frame of this film
        chip: editorial
        editorial: true
        source: docs/demo/film/VO-CLOSE.md §2.2
        stays_at_6_s: >-
          It is one line and it is the sentence that stops a viewer reading the three dates
          as time travel. Cutting the strap to buy dwell for the columns would remove the
          only thing on the card that is a disclaimer.

      - id: k1.rail.line1
        kind: overlay
        status: WITHDRAWN AS A SEPARATE ON-SCREEN STRING — the text is not lost
        text_survives_verbatim_in: k3.overlay.rail_all_four, first stanza, to the character
        chip: editorial
        editorial: true
        source: docs/demo/film/VO-CLOSE.md §2.2 (where it faded in at 2:04)
        ruling: >-
          R-3. Across 22 s and three cards, four staggered rail lines are unreadable, so the
          rail arrives WHOLE in the final card — which is the shape VO-CLOSE.md §0.3 already
          designed it to lift into. Nothing is dropped: all four lines are on screen in k3
          and this one is the first of them.
        the_cost_stated_plainly: >-
          A judge no longer sees each criterion answered BESIDE the block answering it. The
          answers are all there; the adjacency is gone. That is film-recut-plan.md §2.3
          COST 2 and it is a real loss, not a reorganisation.

  # ── k2 · THE STACK — AWS ∥ CockroachDB · 2:34 → 2:44 ───────────────────────────────
  - beat_id: k2
    t: 154
    dur: 10
    title: THE STACK — AWS ∥ CockroachDB
    was: c2 (16 s) + c3 (14 s), run one after the other
    what_changed: >-
      SEQUENCE, NOT SUBSTANCE. Both were name-the-surfaces cards built on the same
      three-label discipline, so they run SIDE BY SIDE in one card instead of one after the
      other. Every line of both is below, verbatim. Not one service, feature, label, caveat
      or concession leaves the screen.
    spoken: >-
      ~16 w — one sentence, whose only job is to say the list has a rule and to say the
      Bedrock line out loud. The service names are not read aloud; VO-CLOSE.md §3.2 already
      ruled that and R-6 keeps it.
    layout:
      one_card: true
      columns: 'AWS on the left, CockroachDB on the right, one card, one lift, one hold'
      rule: >-
        The two entries below are TWO COLUMNS OF ONE CARD, not two cards. They arrive
        together and leave together. If they are cut apart on the day the card is c2 and c3
        again and the 10 s does not fit them.
    highlight_sweep:
      at_most_four_landings_in_10_s: true
      order: '23514 → P0001 → the enum inside the predicate → the `It did not run in this request.` column'
      everything_else_is_pause_material_by_design: >-
        That is what "confirm them quickly" means for a list this long: the eye lands four
        times and the pause button does the rest. A card this dense with a roving highlight
        would be a card nobody reads.
      authority: film-recut-plan.md §3.3 constraint 1; VO-CLOSE.md §4.1
    the_constraint_that_keeps_this_card_honest:
      rule: >-
        THE GROUPING IS THE HONESTY AND IT SURVIVES AT ANY SIZE. VO-CLOSE.md §3.1: "a flat
        list would let 'S3' borrow the credibility of 'Lambda', and S3 was never in the
        request."
      must_not_show: a single ungrouped stack list
      escape_valve_if_it_will_not_fit: >-
        If the two columns will not fit legibly WITH THEIR LABELS, k2 gets 12 s and the 8 s
        banked in film-recut-plan.md §2.1 pays for it. It does NOT get flattened, and it
        does not lose a label to fit. The bank exists for exactly this.
      authority: film-recut-plan.md §3.3 constraint 2
    the_three_labels_that_must_all_survive:
      - 'IN THIS REQUEST — on both columns'
      - 'IN THE APPLY THAT CREATED IT (AWS) · IN THIS DATABASE, EARLIER (CockroachDB)'
      - 'IT IS NOT IN THIS REQUEST PATH — the Bedrock exception, in its own boxed position'
    authority: film-recut-plan.md §3.1, §3.2, §3.3, R-6; VO-CLOSE.md §3.1 and §4.1
    strings:

      - id: k2.overlay.aws_column
        kind: overlay
        text: |-
          AWS  ·  IN THIS REQUEST

            AWS Lambda                  arm64 · mainline-demo-api
            Lambda Function URL         authorization_type = NONE   (the founder's explicit choice)
            SSM Parameter Store         /mainline/demo/cockroach_dsn
            AWS IAM                     one execution role; one inline policy, GetParameter on that one name


          AWS  ·  IN THE APPLY THAT CREATED IT        24 created · 0 changed · 0 destroyed

            Amazon S3                   Terraform state · versioned · SSE-S3 · public access blocked
            CloudWatch alarms + SNS     the cost guard: three alarms on three timescales into one topic,
            + AWS Budgets               a responder that sets reserved concurrency to zero, and the budget


            Amazon Bedrock  —  EXERCISED IN THIS REPOSITORY.  IT IS NOT IN THIS REQUEST PATH.
            Claude on au.* inference profiles and Titan v2 embeddings, ap-southeast-2 (Sydney).
            The database is aws-ap-southeast-1 (Singapore).  There is no end-to-end Australian residency and we do not claim one.
            The refusal you just watched involved no model at all, and that is the point.
        chip: editorial
        editorial: true
        source: docs/demo/film/VO-CLOSE.md §3.1
        column: LEFT
        verbatim_rule: >-
          Every line above is VO-CLOSE.md §3.1's exact text. The compression is the card's,
          never the list's: no service is abbreviated, no evidence path is dropped, no
          heading is merged into another, and the arm64/function-URL/parameter-name/policy
          details stay on their own service lines where a judge can check each one.
        grouping_is_the_honesty: >-
          A flat list would let S3 borrow the credibility of Lambda, and S3 was never in the
          request. The three group headings carry the labels, not a footnote.
        the_bedrock_block_is_boxed_and_that_is_structural: >-
          The four Bedrock lines sit in their own ruled box inside this column, below the
          apply group and visually separated from both. They are the one place in the film
          where a service is named that the request path did not touch, and the box is what
          stops the name sitting in a list that would lend it credit it has not earned. The
          box may shrink; it may not be removed, merged upward into the apply group, or
          reduced to a footnote marker.
        note_on_one_line: >-
          The residency sentence is one line and stays one line. It states the split and
          denies the claim in the same breath, which is what makes it a disclosure rather
