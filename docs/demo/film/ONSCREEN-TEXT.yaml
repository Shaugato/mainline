      - id: b0.header.state_ladder
        kind: ui_label
        text: mainline.subject_state — the seven values the enum declares
        chip: editorial
        editorial: true
        source: permit/header.ts:255
        note: >-
          The chip renders the enum value verbatim and the ladder beside it shows the other
          six. That pairing is what makes `dispositioned` readable without translating it.

      - id: b0.header.site
        kind: payload_value
        label: Site
        text_slot: '/data/site_code — a uuid, printed as the column holds it'
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/permits/{permit_id} · /data/site_code
        measured_2026_08_16: dec0de00-0001-4000-8000-000000000001
        must_not: >-
          Never a plant name. The column is a uuid; a place name here would be an invention
