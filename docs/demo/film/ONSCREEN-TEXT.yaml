        editorial: true
        source: permit/display-copy.ts:50
        do_not: Do not click it on camera. It opens a print view and costs the take.

      - id: b0.el1.title_typed
        kind: ui_label
        label: Permit title
        text: Cold work — intrusive work inside the isolation boundary
        chip: typed
        editorial: true
        typed: pre-typed in pre-roll, 56 characters
        source: HSG250 Figure 1 element 1 · no column exists · permit/typed-fields.ts
        constraint_check: >-
          No plant name, no asset tag, no crew, no company. Nothing here could be mistaken
          for a column value if the frame were screenshotted: it contains no identifier, no
