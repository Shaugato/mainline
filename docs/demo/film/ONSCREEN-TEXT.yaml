# ══════════════════════════════════════════════════════════════════════════════════════
# WHERE THE `t` AND `dur` NUMBERS IN THIS FILE CAME FROM, AND THE ONE WAY THEY CAN BE WRONG
# ══════════════════════════════════════════════════════════════════════════════════════
timing_source:
  authority: docs/demo/film/BEATS.yaml
  rule: >-
    This file re-decides no duration. Every `t` and `dur` below is inherited. If this file
    and BEATS.yaml ever disagree, BEATS.yaml wins and this file is wrong.
  state_when_this_file_was_written: >-
    BEATS.yaml had NOT yet been re-cut when these rows were written. Measured on the tree:
    its last write was 2026-08-15 23:16 and it still carries `demo_s: 120`, `close_s: 50`,
    no `b0b`, `b8` at 10 s, and `c1`..`c4`. So the numbers below could not be copied from
    it. They are DERIVED from film-recut-plan.md §2.1's arithmetic, which BEATS.yaml is
    expected to adopt, and the derivation is written out so a reader can check it rather
    than trust it.
  derivation: >-
    b0 12 + b0b 8 + b1 10 + b2 14 + b3 18 + b4 10 + b5 16 + b6 18 + b7 12 + b8 6 + b9 12 +
    b10 12 = 148 demo. k1 6 + k2 10 + k3 6 = 22 close. end 2. 148 + 22 + 2 = 172.
  the_check_a_reader_does_by_hand: >-
    For each beat, `t + dur` equals the next beat's `t`; the list is contiguous and
    gapless from 0 to 172. That is two subtractions per row and it needs no script.
  reconciliation_done: >-
    BEATS.yaml LANDED RE-CUT WHILE THIS FILE WAS BEING WRITTEN, AND THE DIFF WAS RUN
    RATHER THAN ASSUMED. All sixteen beat ids match, and every `t` and every `dur` matches,
    beat for beat: b0 0/12 · b0b 12/8 · b1 20/10 · b2 30/14 · b3 44/18 · b4 62/10 ·
    b5 72/16 · b6 88/18 · b7 106/12 · b8 118/6 · b9 124/12 · b10 136/12 · k1 148/6 ·
    k2 154/10 · k3 164/6 · end 170/2. Its budget block reads `demo_s: 148`, `close_s: 22`,
    `end_card_s: 2`, `total_s: 172`, and this file's `film_total_s` is 172.
  the_rule_that_still_stands: >-
    The agreement above is a reading taken once. BEATS.yaml remains the authority: if it
    moves again, this file is the one that is wrong and this file is the one that changes.
  block_id_collision_resolved: >-
    RESOLVED 2026-08-16, IN FAVOUR OF TWO BLOCKS, WHICH IS THE SHAPE THIS FILE ALREADY
    CARRIED. The collision was: docs/demo/cr-gate-route-plan.md §R9 named the same 24 s as
    THREE blocks — B9 10 s + B10 6 s + B11 8 s — and VO-DEMO-CR.md and CLICKS-CR.md obeyed
    it, while film-recut-plan.md §4 named TWO, b9 12 s and b10 12 s, and BEATS.yaml,
    VO-DEMO.md, CLICKS.md, FALLBACKS.md, SPINE.md and this file encoded that. Both totalled
    24 s, so 2:52 held either way and no arithmetic check could catch it; what it broke is
    the recording session, because the founder records voice first and then picture and a
    block boundary is a place he stops and starts. THE RULING AND ITS REASONS ARE IN
    docs/demo/film/VO-DEMO-CR.md §0.3, and the deciding reason is a measurement rather than
    a preference: CLICKS.md M14 timed the change screen's read chain at ~3.5 s warm and
    ~6 s cold and measured that the proposed-wording textarea is destroyed and re-created
    empty on mount, so b9 cannot be shot in 10 s. B11 does not exist. Nothing in this file
    changed as a consequence, which is the point of recording it here. See todo.T-7.

vocabulary:
  kind: [watermark, lower_third, overlay, ui_label, payload_value]
  chip:
    - db:column
    - derived
    - recomputed
    - reported
    - parsed
    - staged
    - typed
    - editorial
    - none_claimed
  envelope_chip: ['db:column', 'db:constraint', recomputed, staged, derived]

conventions:
  - id: C1
    rule: >-
      Nothing on screen is rounded by us and no number is retyped. Per-beat durations are
      the payload's own elapsed_ms as the panel prints them; no overlay, strap or caption
      in this file quotes an elapsed figure at all.
    authority: plan R-K; CLICKS.md §6 rule 5; r6-honesty A2
  - id: C2
    rule: >-
      A value that moves between runs is a slot, never a string. Slots in this file:
      run_id, response byte count, received-at instant, every elapsed, generated_at,
      disposition_id, clearance_digest, refusal_id, the two logical timestamps.
    authority: plan R-K; docs/demo/memory-visible-CONTRACT.md §1.4 (volatile is a confession)
  - id: C3
    rule: >-
      Typed carries no chip. The three typed fields are visible inputs with a caret and a
      placeholder, labelled by the app itself, and they are never echoed back as data.
      Every server value carries a chip; nothing typed does.
    authority: plan R-H; CLICKS.md §4; permit/typed-fields.ts
  - id: C4
    rule: >-
      The SYNTHETIC prefix stays on screen wherever a column carries it — the event title,
      the evidence summary, the clause text, the blame-edge attribution. It is part of the
      column value and cropping it to prettify a frame is editing evidence.
    authority: plan R-F; demo_world.sql:275-278; hazard/precursor.ts:378
  - id: C5
    rule: >-
      An overlay may only name a fact whose evidence is legible in the same frame. An
      overlay that cannot be checked against the picture behind it is an assertion, and
      assertions are the thing this product exists to replace.
    authority: r5-craft §4 rule 1
  - id: C6
    rule: >-
      Every `label` in this file is our own word. Row labels, section headings, glosses and
      straplines are authored; the values beside them are not. This is the single
      convention that lets a reviewer see, at a glance, which words are ours.
  - id: C7
    rule: >-
      Where the app composes a sentence from a payload value, the sentence is recorded with
      its template and the pointer that fills it, so nobody types the reference value into
      a burned-in strap on the day.

# ══════════════════════════════════════════════════════════════════════════════════════
# THE WATERMARK — on frame for the whole film, and it names this film's world
# ══════════════════════════════════════════════════════════════════════════════════════
watermark:
  id: film.watermark
  kind: watermark
  text: SYNTHETIC CORPUS · EVERY SITE, PERMIT, INCIDENT AND PERSON HERE IS AUTHORED
  chip: editorial
  editorial: true
  on_frame: 0 s to 172 s, without exception, including the end card
  placement: >-
    Burned in, top strip, inside the middle 90 % of frame and clear of the bottom 12 %
    where the player's scrubber sits.
  authority: plan R-L; r6-honesty A3; DEMO-HONESTY.md:35-36 and :83

  deviation_from_committed_string:
    committed_string: SYNTHETIC CORPUS · KESTREL RESOURCES IS FICTIONAL
    committed_at: verticals/mainline/demo/DEMO-HONESTY.md:35-36
    also_at: verticals/mainline/demo/script/CAMERA-STRINGS.yaml banners.watermark
    deviation: >-
      This film burns the R-L string above instead of the committed one. The words are
      different; the control is identical and is not weakened — the committed string names
      one fictional thing, the string above names every fictional thing on screen.
    reason: >-
      The committed string names Kestrel Resources, which is the CORPUS world's cleared
      fictional operator — cleared against the ASIC company register, ABN Lookup and IP
      Australia, with the query strings and verbatim results recorded in
      demo/operator/CLEARANCE.md (DEMO-HONESTY.md:83-86). This film is shot against the
      demo-api world, whose site seeds as `demo_site` (demo_world.sql:72-76) and whose
      `site_code` renders on screen as a uuid, not as a company. A watermark naming an
      operator the frame never shows would be a strange kind of dishonesty: it would
      disclaim the wrong fiction and leave the site, the permit, the incident and the
      person on screen undisclaimed.
    measured: >-
      `grep -ril kestrel verticals/mainline/apps/console/src/` returns nothing on this
      tree, so no built operator surface renders a Kestrel site today.
    reversion_condition: >-
      If the operator UI does render Kestrel Resources on the day, the committed string is
      used VERBATIM instead, unchanged and un-merged with this one, and this block records
      that it was.
    what_is_preserved: >-
      Watermark on frame for the whole film; never cropped; never faded under a title;
      never smaller than the smallest legible on-screen row.

# ══════════════════════════════════════════════════════════════════════════════════════
# PERSISTENT — strings on frame across many beats, recorded once
# ══════════════════════════════════════════════════════════════════════════════════════
persistent:
  - id: film.chip.stack
    kind: overlay
    text: AWS Lambda Function URL · ap-southeast-1
    chip: editorial
    editorial: true
    on_frame: b0 to b10, small, top-left, under the watermark
    on_frame_note: >-
      Extended from `b0 to b8` when the change-request blocks were added. The chip's whole
      claim is that the origin in the URL bar in the same frame is a Lambda Function URL in
      ap-southeast-1, and that is as true on the change screen as on the permit screen —
      the same origin serves both. Nothing else about the chip changes.
    why_this_wording: >-
      Every word of it is confirmable against the URL bar in the same frame, which reads
      the `…lambda-url.ap-southeast-1.on.aws` origin. The cluster version is deliberately
      NOT in this chip: it comes from GET /v1/health and is not in frame on the permit
      screen, so it is named in k2's CockroachDB column where the read that produces it is
      the exhibit.
    authority: r5-craft §4 (suggested persistent chip, narrowed by rule 1 same-frame confirmability)

  - id: film.strap.disclosure_fallback
    kind: overlay
    text: >-
      The beats on this panel arrived in one already-rolled-back SERIALIZABLE transaction.
      This panel reveals them in order as a reading aid; every timing shown is the
      server's.
    chip: editorial
    editorial: true
    on_frame: >-
      ONE STRAP PER REQUEST. b2 to b8 over the permit request's panel; re-established over
      the change request's panel in b10. In both cases only while that page's own
      disclosure strip is scrolled out of frame.
    carries_no_run_varying_value: true
    per_request: true
    why: >-
      Plan R-C requires the disclosure in frame from b2 onward; the page's strip is not
      sticky and leaves frame at b3 and b6 (CLICKS.md §7 D-2). A burned strap carrying a
      run_id typed by hand could be wrong about a run; this sentence cannot be, because it
      contains no value from one.
    the_word_that_changed_and_why_it_had_to: >-
      This strap used to open `All four beats arrived…`. THAT SENTENCE IS FALSE OF THE
      SECOND REQUEST. `POST /v1/demo/gate-run` plays four beats; the change-request
      endpoint plays THREE — read, merge, projection_drift_attack — declared as a
      three-member list at cr_gate_run.py:576-602. A strap carrying `four` re-established
      over the second panel would be a count measured on one request asserted over
      another, which is the precise class of act R-9 exists to stop. `The beats on this
      panel` is true of either request and still contains no value from a run. The count
      is left where it belongs: the page's own composed disclosure line
      (`b2.disclosure.line`), which the transport writes and nobody types.
    must_not: >-
      One strap, restated per request, never carried across the cut from one request's
      panel to the other's, and never carrying a number. If the strap is on frame while
      neither panel is, it is on frame for a request that is not being shown, and that is
      a disclosure about nothing.
    authority: plan R-C; CLICKS.md §7 D-2; film-recut-plan.md R-9

  - id: film.ui.watermark_strip
    kind: ui_label
    text: SYNTHETIC DEMONSTRATION — no real site, no real permit, no real person
    chip: editorial
    editorial: true
    source: verticals/mainline/apps/console/src/operator/chrome/Watermark.ts:22
    on_frame: b0 only, because the strip is a normal flow element and scrolls away
    note: >-
      The page's own watermark. It is not the film's watermark and does not replace it;
      both are on screen in b0 and only the burned one survives the first scroll.

  - id: film.ui.origin_strip
    kind: ui_label
    label: served from
    text_slot: the origin the page was served from, printed by the page itself
    chip: derived
    editorial: false
    source: verticals/mainline/apps/console/src/operator/chrome/OriginStrip.ts:118,132
    why_it_matters: >-
      This strip is the film's R-N device. If the take is made against the local emulator
      it prints `X-Mainline-Emulator` and the film cannot be passed off as the deployed
      one. It is in frame at the foot of the document, and it is never cropped.

  - id: film.frame.url_bar
    kind: ui_label
    text_slot: the browser's own address bar, uncropped, showing the origin and the route
    chip: derived
    editorial: false
    note: >-
      Browser chrome, not our string. Recorded because it is one of the four witnesses that
      must be in frame from the first frame to the last (CLICKS.md §1.4) and because an
      overlay may never cover it.

# ══════════════════════════════════════════════════════════════════════════════════════
# THE BEATS
# ══════════════════════════════════════════════════════════════════════════════════════
beats:

  # ── b0 · THE ORDINARY MOMENT · 0:00 → 0:12 ─────────────────────────────────────────
  - beat_id: b0
    t: 0
    dur: 12
    title: THE ORDINARY MOMENT
    strings:

      - id: b0.lower_third.problem
        kind: lower_third
        text: >-
          The lesson a past incident taught is a memo people forget. Here it is a
          constraint the database enforces — for the supervisors and safety engineers who
          issue permits to work.
        chip: editorial
        editorial: true
        on_frame: 0:00 to 0:07
        why: >-
          Devpost asks for the problem and the audience in one sentence up front and the
          spoken opener spends its words on the promise, so the problem sentence is written
          rather than said. It costs zero seconds of voice.
        authority: plan §1.2
        set_two_lines: >-
          Break after `forget.` so neither line exceeds the 42-character subtitle width the
          craft research fixes; hold both lines for the full 7 s.

      - id: b0.appbar.product
        kind: ui_label
        text: CONTROL OF WORK
        chip: editorial
        editorial: true
        source: chrome/AppBar.ts:20
        note: >-
          The supervisor's own product, and it is deliberately not MAINLINE. MAINLINE is
          underneath; the whole point of the film is that the refusal lands inside somebody
          else's software.

      - id: b0.appbar.modules
        kind: ui_label
        text: Modules
        chip: editorial
        editorial: true
        source: chrome/AppBar.ts:50

      - id: b0.rail.items
        kind: ui_label
        text: Permits · Isolations · Certificates · Register
        chip: editorial
        editorial: true
        source: chrome/Rail.ts:36-39
        note: Rendered as a list, not a menu; the unavailable three carry the note below.

      - id: b0.rail.not_carried
        kind: ui_label
        text: not carried by this deployment
        chip: editorial
        editorial: true
        source: chrome/Rail.ts:43 (NOT_CARRIED_NOTE), permit/typed-fields.ts:56 (NOT_CARRIED)
        note: >-
          The same six words do three jobs on this screen — an absent rail item, an absent
          column, an absent action. That repetition is a feature: a judge learns the phrase
          once and can then read every gap on the screen without a legend.

      - id: b0.header.permit_type
        kind: ui_label
        label: Permit type
        text: Cold work
        chip: typed
        editorial: false
        source: permit/header.ts:51,130
        note: >-
          Selected on this device from HSG250 Table 2's eight types. It is an input, not a
          column: `mainline.permit` carries no permit-type column.

      - id: b0.header.permit_type_note
        kind: ui_label
        text: HSG250 Table 2 · selected on this device
        chip: editorial
        editorial: true
        source: permit/header.ts:150

      - id: b0.header.external_ref
        kind: payload_value
        label: Permit reference number
        text: DEMO-PTW-0001
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/permits/{permit_id} · /data/external_ref
        note: The one string in the film a judge will remember well enough to type into the API.

      - id: b0.header.ref_name
        kind: payload_value
        text: refs/permits/demo-0001
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/permits/{permit_id} · /data/ref_name
        note: A permit that is a git ref. Keep it in the header; it is our most distinctive idea.

      - id: b0.header.state_chip
        kind: payload_value
        label: Status
        text: dispositioned
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/permits/{permit_id} · /data/state
        must_not: >-
          Do not translate it into `Pending approval`. It is a value of the user-defined
          enum `mainline.subject_state`, and translating it would invent a status
          vocabulary this system does not have.

      - id: b0.header.state_ladder
        kind: ui_label
        text: mainline.subject_state — the seven values the enum declares
        chip: editorial
        editorial: true
        source: permit/header.ts:255
        note: >-
          The chip renders the enum value verbatim and the ladder beside it shows the other
          six. That pairing is what makes `dispositioned` readable without translating it.

      - id: b0.header.site
        kind: payload_value
        label: Site
        text_slot: '/data/site_code — a uuid, printed as the column holds it'
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/permits/{permit_id} · /data/site_code
        measured_2026_08_16: dec0de00-0001-4000-8000-000000000001
        must_not: >-
          Never a plant name. The column is a uuid; a place name here would be an invention
          wearing a column's clothes.

      - id: b0.header.site_source_note
        kind: ui_label
        text: mainline.site.site_code, joined on mainline.permit.site_id
        chip: editorial
        editorial: true
        source: permit/header.ts:180

      - id: b0.header.validity
        kind: payload_value
        label: Valid from · Expires
        text: 2 August 2026, 00:00 UTC → 2 August 2027, 00:00 UTC
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/permits/{permit_id} · /data/opened_at and /data/horizon_at
        rendering: >-
          The app prints the human UTC form and the emitted ISO literal beside it
          (`2026-08-02T00:00:00Z`, `2027-08-02T00:00:00Z`). Both are the columns'.
        note: HSG250 Figure 1 element 9 and audit item 23 — a permit must state its expiry.

      - id: b0.header.epoch_and_head
        kind: payload_value
        label: Gate epoch · Chain head · Under hold
        text: 1 · 2 · false
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/permits/{permit_id} · /data/gate_epoch, /data/head_seq, /data/under_hold

      - id: b0.header.display_copy
        kind: ui_label
        text: Display copy ⎙
        chip: editorial
        editorial: true
        source: permit/display-copy.ts:50
        do_not: Do not click it on camera. It opens a print view and costs the take.

      - id: b0.el1.title_typed
        kind: ui_label
        label: Permit title
        text: Cold work — intrusive work inside the isolation boundary
        chip: typed
        editorial: true
        typed: pre-typed in pre-roll, 56 characters
        source: HSG250 Figure 1 element 1 · no column exists · permit/typed-fields.ts
        constraint_check: >-
          No plant name, no asset tag, no crew, no company. Nothing here could be mistaken
          for a column value if the frame were screenshotted: it contains no identifier, no
          code and no uuid.
        authority: plan R-H; r3-operator §5.3 honest option A; CLICKS.md §4

      - id: b0.el3.location_typed
        kind: ui_label
        label: Location on site
        text: Within the isolation boundary declared on this permit
        chip: typed
        editorial: true
        typed: pre-typed in pre-roll, 53 characters
        source: HSG250 Figure 1 element 3 · no free-text column exists
        constraint_check: >-
          Points at the boundary certificate two sections above, which IS a column, rather
          than at an invented place. A location that names nothing real cannot be mistaken
          for something real.

      - id: b0.el5.work_typed_head
        kind: ui_label
        label: Work and its limitations
        text: 'Open the guard and inspect; no work until'
        chip: typed
        editorial: true
        typed: pre-typed in pre-roll, 40 characters
        source: HSG250 Figure 1 element 5 · no column exists

      - id: b0.el5.work_typed_tail
        kind: ui_label
        text: ' verified at zero'
        chip: typed
        editorial: true
        typed: TYPED ON CAMERA at 0:05.5 – 0:08, three words, at a human rate
        joins_to: b0.el5.work_typed_head
        full_field_when_typed: 'Open the guard and inspect; no work until verified at zero'
        length_check: 57 characters complete, so the field does not wrap
        why_these_three_words: >-
          They are the supervisor writing his own limitation in the language the clause
          uses, which is what makes the refusal legible eighteen seconds later. They assert
          nothing about the database and they name nothing that does not exist.
        authority: CLICKS.md §4 (on-camera tail at least three words, so the typing rate is visible)

      - id: b0.typed.chip_note
        kind: ui_label
        text: typed on this device · not carried by this deployment
        chip: editorial
        editorial: true
        source: permit/typed-fields.ts:59 (TYPED_HERE)
        why_it_is_the_most_important_label_on_the_screen: >-
          It is the convention a judge can check in two seconds: every server value carries
          a provenance chip and nothing typed does. In frame, `DEMO-PTW-0001` two sections
          above carries `db:column` and this field carries this sentence instead.

      - id: b0.el4.plant
        kind: payload_value
        label: Plant identification · Tags declared · Tags resolved · Tags unmodelled
        text: 1 · 1 · 0
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/permits/{permit_id} · /data/boundary_certificate
        beside_it: 'asset graph version: demo-asset-graph-1 · state: boundary certified'
        note: >-
          Better than a real form's box: it certifies that the plant identification is
          COMPLETE, and the certificate is the reason the sentence can be said at all.

      - id: b0.el7.clause_text
        kind: payload_value
        label: Precautions necessary and actions in the event of an emergency
        text: >-
          SYNTHETIC — Before any intrusive work, stored energy shall be isolated, locked and
          verified at zero by a competent person.
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/clauses/{clause_uuid}/versions/{commit_id} · /data/version/canon_text
        synthetic_prefix: KEPT — it is part of the column value (C4)
        note: >-
          `raw_text` and `canon_text` are byte-identical on this row and both carry the
          prefix. The film quotes the clause as the database returned it or not at all.

      - id: b0.el7.clause_facts
        kind: payload_value
        label: Clause · Generation · Control delta · Severity max · At commit · Anchors
        text: 7.3.2(b) · 1 · introduce · 4 · 9f12114d…9a39 · LOTO · ZERO_ENERGY
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: >-
          GET /v1/clauses/{clause_uuid}/versions/{commit_id} · /data/version/printed_label,
          /gen, /control_delta, /sev_max, /commit_id, /anchor_set
        digest_rendering: >-
          The app shortens a hex value to its first eight and last four characters with an
          ellipsis between (`hazard/precursor.ts:172-180`). That is the form on screen; it
          is never a seven-character abbreviation and never a full forty.
        also_on_screen: >-
          Canonical sha256 `9b152601…0e7b`, under the label `Canonical sha256`.

      - id: b0.el7.sev_max_note
        kind: ui_label
        text: the worst severity anywhere in this version’s blame lineage; projected, never chosen
        chip: editorial
        editorial: true
        source: permit/precautions.ts:81
        note: >-
          One of the two sentences on the permit screen that tell a judge the severity was
          not typed by anybody. The other is on the hazard card in b3.

      - id: b0.el8.ppe
        kind: ui_label
        label: Protective equipment (including PPE)
        text: not carried by this deployment
        chip: editorial
        editorial: true
        source: permit/typed-fields.ts:56; PermitScreen.ts:214
        do_not: >-
          Do not scroll past it quickly and do not fill it. An empty field that says why it
          is empty is a fidelity signal; a plausible PPE list would be a fabrication.
        authority: plan R-H; r3-operator §5.3 honest option B

      - id: b0.el11.extension
        kind: ui_label
        text: >-
          11 · Extension / shift handover — this deployment has no extension mechanism; no
          column and no route carry one
        chip: editorial
        editorial: true
        source: permit/signatures.ts:80-81

      - id: b0.actionbar.standing
        kind: payload_value
        text: 1 obligation outstanding
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: >-
          GET /v1/permits/{permit_id} · /data/counters/open_blocking, composed by
          issue/beats.ts:476-477 (singular/plural chosen from the count, never a constant)
        must_not: >-
          This counter does not tick to zero at any point in the film. It was rendered
          before the press, the beat-3 write was rolled back, and this page never re-reads
          it. A UI-side decrement, or a line of narration claiming it ticked, is a
          fabricated exhibit.
        authority: CLICKS.md §3 first boxed warning

      - id: b0.actionbar.controls
        kind: ui_label
        text: 'Save draft   ·   ISSUE ▸'
        chip: editorial
        editorial: true
        source: issue/ActionBar.ts:99,109
        note: >-
          The button says ISSUE, which is what a supervisor does to a permit — not Merge and
          not Submit. `Save draft` is present and disabled with its reason beside it.

      - id: b0.actionbar.save_note
        kind: ui_label
        text: Save draft — not carried by this deployment.
        chip: editorial
        editorial: true
        source: issue/ActionBar.ts:117

      - id: b0.signatures.block
        kind: ui_label
        text: >-
          Signature block — HSG250 ¶49 — signatures on permit-to-work forms should be dated
          and timed.
        chip: editorial
        editorial: true
        source: permit/signatures.ts:67-68
        rows_visible: Issue · Acceptance · Hand-back · Cancellation, with Extension omitted and labelled

  # ── b0b · WHY IT MATTERS · 0:12 → 0:20 ─────────────────────────────────────────────
  # ADDED BY W4. `VO-DEMO.md` grew this beat on 2026-08-16 at 09:37 and the insert
  # propagated to nothing: this file's `beats:` list ran b0, b1, b2 … with no b0b in it.
  # Nothing renders differently because of this entry — b0b carries no new string — but a
  # beat list that omits a beat is a beat list that is lying about the film, and every
  # `t` after it was eight seconds wrong.
  - beat_id: b0b
    t: 12
    dur: 8
    title: WHY IT MATTERS
    strings_added_by_this_beat: none
    what_is_on_screen: >-
      The same permit screen as b0, unchanged and unscrolled. b0b is a voice-over beat: it
      buys the public-YouTube audience the sentence that says why a permit to work is a
      thing worth watching a database refuse. No new burned string, no new overlay, no new
      lower third, and the b0 rows above are all still in frame.
    strings_still_on_frame_from_b0: >-
      film.watermark · film.chip.stack · film.ui.watermark_strip · film.ui.origin_strip ·
      film.frame.url_bar, and every b0 `ui_label` and `payload_value` the b0 scroll
      position holds.
    do_not: >-
      Do not add an overlay here to fill the eight seconds. b0b's whole job is a sentence
      in the ear over a picture the eye has already read; a new card would make the viewer
      re-read the screen instead of listening to it.
    consequence_recorded: >-
      Every beat from b1 to b8 shifts +8 s because of this beat. Those shifts are applied
      below and are the reason `first_refusal_at_s` in BEATS.yaml is wrong at 22 —
      film-recut-plan.md R-1 corrects it to 30. That correction is W1's to make, not this
      file's; it is recorded at findings.F-7 so it is not lost.
    authority: film-recut-plan.md §1.1, §1.2, R-1; VO-DEMO.md B0b

  # ── b1 · THE ATTEMPT · 0:20 → 0:30 ─────────────────────────────────────────────────
  - beat_id: b1
    t: 20
    dur: 10
    title: THE ATTEMPT
    strings:

      - id: b1.button.pending
        kind: ui_label
        text_slot: 'Issuing… <s> s — the tenths counting up on the real promise'
        template: 'Issuing… ${(elapsedMs/1000).toFixed(1)} s'
        chip: derived
        editorial: false
        source: issue/pending.ts:135-138
        must_not: >-
          There is no setTimeout behind this clock and no skeleton pretending to be work. If
          the round trip is slow the number is large, and a large number is a better problem
          than a false one.

      - id: b1.button.pending_note
        kind: ui_label
        text: >-
          One SERIALIZABLE transaction is open against the database. The clock is this
          browser’s measurement of the round trip; each beat below reports the duration the
          server measured.
        chip: editorial
        editorial: true
        source: issue/pending.ts:142-144 (PENDING_NOTE)
        note: >-
          Quoted with the typographic apostrophe the source carries. It is the sentence that
          stops the pending clock from being read as a server measurement.

      - id: b1.devtools.row
        kind: ui_label
        text_slot: 'gate-run · POST · <status> · <bytes> · <time> — DevTools'' own columns'
        chip: derived
        editorial: false
        note: >-
          Not our string. In frame because the list was cleared on camera one second before
          the press, which is the only ordering that distinguishes a live request from a
          screenshot.
        authority: r5-craft §6

  # ── b2 · THE REFUSAL · 0:30 → 0:44 ─────────────────────────────────────────────────
  - beat_id: b2
    t: 30
    dur: 14
    title: THE REFUSAL — filmed calm
    strings:

      - id: b2.overlay.sqlstate
        kind: overlay
        text: |-
          SQLSTATE 23514
          CockroachDB CHECK constraint
        chip: editorial
        editorial: true
        note: >-
          Two lines, 14 and 28 characters, well inside the 42-character line limit; on
          screen from 0:29 to 0:33. It is the film's only demo-side overlay besides b3's
          three loop labels, and it goes BESIDE the predicate, never over it — the
          `:::mainline.subject_state` annotation must stay legible under it.
        confirmable_in_same_frame: 'yes — `23514` and `gate_closed_when_issued` are both on the banner'
        authority: r5-craft §4 rules 1-3; CLICKS.md §5 B2

      - id: b2.lock.note
        kind: ui_label
        text_slot: 'ISSUE is locked: <constraint> refused this write.'
        template: 'ISSUE is locked: ${beat.constraint} refused this write.'
        reference: 'ISSUE is locked: gate_closed_when_issued refused this write.'
        chip: editorial
        editorial: true
        source: issue/ActionBar.ts:278 and its templated sibling
        note: >-
          The constraint name in this sentence is the payload's; the sentence around it is
          ours. `ISSUE ▸` is disabled from here to the end of the film and the lock note
          stays on screen through the admission beat, which is b8's whole point.

      - id: b2.disclosure.line
        kind: ui_label
        text_slot: >-
          one request · 4 beats · POST /v1/demo/gate-run · run_id <id> · response received
          <ISO> · <n> bytes
        template: >-
          one request · ${beats.length} beats · POST /v1/demo/gate-run · run_id ${run_id} ·
          response received ${receivedAt} · ${bytes} bytes
        chip: derived
        editorial: false
        source: kernel/gate-run.ts:200-214; shape asserted at issue/disclosure.ts:54-55
        must_not: >-
          Do not correct `4 beats` to `four beats`. The transport composed the digit and a
          line that does not match the expected shape is rendered verbatim anyway, marked
          unexpected — a screen that quietly repaired a malformed disclosure would be
          disclosing something other than what happened.
        authority: plan R-C

      - id: b2.disclosure.caveat
        kind: ui_label
        text: >-
          Every beat below came back in that one response. Each is revealed on a click, and
          each shows the duration the server measured for it. The received-at instant above
          is this browser’s clock.
        chip: editorial
        editorial: true
        source: issue/disclosure.ts:83-86

      - id: b2.beat1.rows
        kind: payload_value
        label: SQLSTATE · state · open_blocking (projected column) · open_blocking (re-derived) · gate_epoch · head_seq
        text: 00000 · dispositioned · 1 · 1 · 1 · 2
        chip: none_claimed
        envelope_chip: none — the emitter claims no chip for /beats/0
        editorial: false
        source: 'POST /v1/demo/gate-run · /data/beats/0/{sqlstate,observed}'
        note: >-
          Two of the four SQLSTATEs on screen carry a chip and two do not. That asymmetry is
          the truth about what the emitter claimed, and adding a chip to the other two would
          be an endpoint change made for the camera.
        authority: docs/demo/memory-visible-CONTRACT.md §2.1

      - id: b2.beat1.statement
        kind: payload_value
        label: statement
        text: SELECT … FROM mainline.permit JOIN mainline.site …
        chip: none_claimed
        editorial: false
        source: POST /v1/demo/gate-run · /data/beats/0/statement
        note: The ellipses are the payload's own. They are not our truncation and are not to be filled in.

      - id: b2.banner.headline
        kind: ui_label
        text: PERMIT NOT ISSUED
        chip: editorial
        editorial: true
        source: issue/RefusalBanner.ts:116
        note: >-
          The supervisor's register, on top; the database's register underneath. The second
          is what makes a judge believe the first.

      - id: b2.banner.outstanding
        kind: payload_value
        text: 1 obligation outstanding
        chip: derived
        editorial: false
        source: >-
          composed from the beat's observed count, or from the size of the refusal's own
          reason set — never from a constant (RefusalBanner.ts:125)

      - id: b2.banner.precursor_sentence
        kind: payload_value
        text: DEMO-INC-0001 has never been answered for this permit.
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: >-
          sentence composed at RefusalBanner.ts:274 from the precursor label and the
          refusal's reason set; the label is /data/checks/0/precursor/external_ref

      - id: b2.banner.register_lead
        kind: ui_label
        text: The database refused this write. Everything below is what it returned.
        chip: editorial
        editorial: true
        source: issue/RefusalBanner.ts:159

      - id: b2.banner.sqlstate
        kind: payload_value
        label: SQLSTATE
        text: '23514'
        chip: reported
        envelope_chip: db:constraint
        editorial: false
        source: POST /v1/demo/gate-run · /data/beats/1/sqlstate

      - id: b2.banner.constraint
        kind: payload_value
        label: constraint
        text: gate_closed_when_issued
        chip: reported
        envelope_chip: db:constraint
        editorial: false
        source: >-
          POST /v1/demo/gate-run · /data/beats/1/constraint, with
          /data/beats/1/constraint_source rendered as the chip beside it
        note: >-
          `reported` means the driver handed the constraint name back. Beat 3's is `parsed`,
          which is weaker, and the difference is on screen at the film's loudest moment.

      - id: b2.banner.check_predicate
        kind: payload_value
        label: CHECK predicate
        text: "((state != 'merged':::mainline.subject_state) OR (open_blocking = 0:::INT8))"
        chip: reported
        envelope_chip: 'none — recovered from /data/beats/1/message, which is itself chipped nowhere'
        editorial: false
        source: >-
          read out of POST /v1/demo/gate-run · /data/beats/1/message by
          issue/beats.ts::checkPredicate; the banner prints the note
          `Read out of the message below; no field carries it.`
        verbatim_rule: >-
          Quoted to its printed characters, including CockroachDB's own `:::` type
          annotations and `INT8`. It is neither paraphrased, nor truncated, nor
          pretty-printed, nor covered by an overlay. It is the most credible string in the
          film precisely because nobody would write it that way on purpose.
