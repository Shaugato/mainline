  # ── b9 · THE OTHER WAY IN · 2:04 → 2:16 ────────────────────────────────────────────
  # The judge's own objection, said out loud before the judge has to: fine, so couldn't
  # somebody just rewrite the rule? The seeded world has answered that since the day it
  # was seeded and nothing has ever surfaced it.
  - beat_id: b9
    t: 124
    dur: 12
    title: THE OTHER WAY IN
    conditional_on: decision_gate below — under NO-GO this beat does not exist

    decision_gate:
      authority: film-recut-plan.md §6
      rule: >-
        Three conditions, all measurements and none of them a promise. If all three do not
        hold on the day, b9 and b10 are NOT SHOT, b8 returns to 10 s with its `b8b.*` rows,
        and the film is 152 s. That is a legitimate outcome and no string in this file
        assumes otherwise.
      condition_1:
        what: POST /v1/demo/cr-gate-run answers 200 with persisted:false measured from a fingerprint
        measured_2026_08_16: >-
          ABSENT FROM THE DEPLOYMENT. The 404 body's own `error.declared` list carries 17
          routes and this is not one of them. It exists in the tree — `app.py:316` declares
          `Route("POST", "/v1/demo/cr-gate-run", "cr_gate_run")` and
          `cr_gate_run.py` implements it — but the tree is not the origin.
      condition_2:
        what: GET /v1/change-requests/{cr_id}/blocking-checks answers 200
        measured_2026_08_16: '404, 693 B, `kind: no_route`'
        why_this_one_is_load_bearing_and_the_plan_does_not_say_so: >-
          The plan treats this route as a broken panel to tidy up. IT IS NOT. It is the only
          thing that makes the change request's OWN obligation addressable, and R-4 and R-5
          both depend on it — see findings.F-8. Without it the screen renders the PERMIT's
          defeater vocabulary on the change screen, under its own scope note saying nothing
          is claimed about this change request's obligation, and the second use case has no
          second vocabulary and no shared identifiers in frame.
      condition_3:
        what: GET /operator.html serves an approve/attempt control that calls that endpoint
        measured_2026_08_16: >-
          The deployed entry `/assets/operator-D24tzVGh.js` (96,734 B decoded) contains
          `Approve change` ×1 and `cr-gate-run` ×0. The attempt control is in the tree
          (`ChangeScreen.ts:158` names the path) and is not in the bytes served.
      verdict_today: >-
        OPEN — none of the three holds against the live origin as measured on 2026-08-16.
        Recorded as a reading, not as a complaint: two of the three are packaging, the third
        is a route, and none of them is this file's to land.

    # ── THE PRESS, PLACED — added 2026-08-16 under shoot-docs-plan.md R-SD4 ──────────
    press_placement:
      authority: docs/demo/shoot-docs-plan.md R-SD4 · R-SD4a · R-SD4b
      ruling: >-
        CLICK 6 — THE ATTEMPT — IS AT 2:14.0, WHICH IS +10.0 INTO b9. The request is in
        flight 2:14.0 to 2:15.5. The refusal paints at 2:15.5. b10 opens at 2:16.0 on a
        refusal that has been on screen for half a second. The film's two mutating presses
        are now choreographed identically: press in the attempt beat, answer painted before
        the refusal beat's first word.
      struck: >-
        CLICKS.md §5's 2:17 is STRUCK — it put the SQLSTATE on screen after "Refused." was
        spoken at 2:16, which R-K forbids. CLICKS-CR.md's +7.4 is STRUCK too — scored
        against the retired 10 s three-block B9, it lands at 2:11.4, in the middle of the
        typing. Neither number survives; the placement of one does.
      why_this_file_carries_it: >-
        Because two ids in this file are values a judge reads off a frame whose in-point the
        ruling moves. b9.devtools.row is the second of exactly two mutating rows and it now
        appears at 2:14.0; every b10 payload id renders from the response that lands at
        2:15.5. This file records WHEN a string reaches the screen only where that timing is
        what makes the string checkable, and here it is: R-K says a value is spoken while it
        is on screen or it is not spoken.
      timeline_inside_this_beat:
        - '2:04.0-2:05.5  cursor to the app-bar tab `Management of change`'
        - '2:05.5         Click 5 — module switch; the screen MOUNTS here, inside the take'
        - '2:05.5-2:09.0  the four-read paint, 3.5 s WARM (CLICKS.md M14); operator touches nothing'
        - '2:09.0-2:10.5  wheel scroll to §3; the dwell on the clause of record is R-5 evidence and is not shortened'
        - '2:10.5-2:11.0  click into `Proposed wording`; caret in an EMPTY box'
        - '2:11.0-2:13.5  keystrokes — 2.5 s, at a human rate, on camera'
        - '2:13.5-2:14.0  cursor travels to the attempt control'
        - '2:14.0         CLICK 6 — mutating request 2 of 2'
        - '2:14.0-2:15.5  in flight; real pending state; ONE cr-gate-run row'
        - '2:15.5-2:16.0  the refusal paints and the frame composes'
        - '2:16.0         b10 in-point — "Refused." is spoken over a refusal already on screen'
      conditional_on: >-
        R-SD4b. FALLBACKS.md §4.2's R-11 gate. Under NO-GO there is NO Click 6 at all: the
        film's click ledger is five clicks and one text entry, F-11's count reverts to
        exactly one mutating request, b8 returns to 10 s and the film is 152 s. Every
        restatement of this ruling states it as conditional, including this one.
      what_did_not_move: >-
        R-SD5. No spoken line, no vo_word_budget, no beat duration and no total. 148 + 22 + 2
        = 172 s, hard stop 174 s, ceiling 180 s. This block adds nothing to the film.

    strings:

