  # ══ THE CLOSE ═══════════════════════════════════════════════════════════════════════
  # k1-k3 overlay text is W3's and is reproduced here VERBATIM so that one file carries
  # every string in the film. If this block and VO-CLOSE.md ever disagree, VO-CLOSE.md is
  # the owner of the words and this file is wrong.
  #
  # ── WHAT HAPPENED TO c1, c2, c3 AND c4 ────────────────────────────────────────────
  # The close goes 50 s → 22 s and the four beats become three. NOTHING LEAVES THE
  # SCREEN. film-recut-plan.md R-6 is explicit — Devpost asks that the services and
  # features be "on screen (text overlay or slide) so judges can confirm them quickly"
  # and never asks for them narrated — so the saving is taken from DWELL, from SPEECH,
  # and from running two sequential cards in PARALLEL. The mapping, in full:
  #
  #   c1 (12 s) → k1 (6 s)              same overlay, same strap, half the dwell
  #   c2 (16 s) ┐
  #             ├→ k2 (10 s)            two cards side by side instead of one after the
  #   c3 (14 s) ┘                       other; every line of both, verbatim, all labels
  #   c4  (8 s) → k3 (6 s)              same three-line limit, same four-line rail, same
  #                                      two URLs; one sentence moves from mouth to screen
  #
  # 36 spoken words over 22 s is 1.64 w/s — identical to two decimals to the current
  # close's deliberate 1.64 w/s. THE WORDS-PER-SECOND DOES NOT MOVE, and that is the
  # whole proof that this is a compression of delivery and not of content.
  #
  # THE ONE THING THAT DOES CHANGE, AND IT IS A COST: the criterion rail no longer builds
  # one line per block beside the block that answers it. R-3 rules that it arrives WHOLE,
  # in k3. The four answers are all still there; the adjacency is gone. The rail entries
  # c1.rail.line1, c2.rail.line2 and c3.rail.line3 are therefore WITHDRAWN as separate
  # on-screen strings and their text survives, to the character, inside
  # k3.overlay.rail_all_four — which already carried all four lines and always did.

  # ── k1 · THE LOOP · 2:28 → 2:34 ────────────────────────────────────────────────────
  - beat_id: k1
    t: 148
    dur: 6
    title: THE LOOP
    was: c1 at 12 s
    what_changed: >-
      DWELL ONLY. The overlay below and its strap are unchanged to the character. What is
      lost is the time a judge has to sit with STORE / RETRIEVE / ACT before the next card
      arrives, and that is a real cost on the first tie-break axis — film-recut-plan.md
      §2.3 COST 1 names it as the sharpest thing in the plan and does not dress it up.
      Recorded here rather than only there, because this is the file that would otherwise
      make the loss look like nothing happened.
    spoken: ~10 w; the three words STORE · RETRIEVE · ACT are on screen large and are not spoken
    authority: film-recut-plan.md §3.1, §3.2, §2.3 COST 1; VO-CLOSE.md §2.2
    strings:

      - id: k1.overlay.columns
        kind: overlay
        text: |-
          S T O R E                      R E T R I E V E                 A C T

          mainline.event                 mainline_meas.recall_run        mainline.permit
          mainline.blame_edge            mainline.clause_blame_current   CHECK gate_closed_when_issued
          mainline.clause_blame_closure    (view · DISTINCT ON, gen DESC)  -> 23514
            append-only, generation-                                     mainline.fn_permit_merge_gate
            versioned; superseded,                                         -> P0001
            never deleted

          occurred_at                    started_at                      refused at
          2019-03-14T06:20:00Z           2026-08-02T03:00:00Z            <THIS RUN>

                                         obligation materialised
                                         2026-08-02T03:00:10Z
                                         ten seconds
        chip: editorial
        editorial: true
        source: docs/demo/film/VO-CLOSE.md §2.2
        embedded_payload_values:
          - text: '2019-03-14T06:20:00Z'
            chip: db:column
            source: GET …/blocking-checks · /data/checks/0/precursor/occurred_at
          - text: '2026-08-02T03:00:00Z'
