findings:

  - id: F-1
    severity: HIGH — it decides whether this cut can be shot at all
    finding: >-
      The operator screens are not in the bytes the live origin serves. GET /operator.html
      answers 200 with 4,655 B and the title `MAINLINE console`; its only script is
      /assets/index-LoN3Sn_L.js; that asset answers 200 gzipped (138,177 B on the wire,
      490,539 B decoded) and contains zero occurrences of `CONTROL OF WORK`,
      `1 obligation outstanding`, `not carried by this deployment`, `cow-`, `hz-card` or
      `moc-`.
    why_it_matters: >-
      A pre-flight that checks only for a 200 on /operator.html would pass and the shoot would
      begin against the console. CLICKS.md D-6 flagged the dependency; this is the measurement
      that says it is still open and names the check that catches it.
    measured: '2026-08-16, against the live origin, GET only'
    owner: orchestrator (packaging), W6 (fallback document)
    the_check_that_catches_it: >-
      Confirm the served document's title is the operator's and that the script asset contains
      the string `1 obligation outstanding`, before step 2 of the pre-roll.

  - id: F-2
    severity: MEDIUM — two true strings that a tidy-minded person would "reconcile"
    finding: >-
      The CHECK predicate appears in two different real forms. The permit and change-request
      payloads carry the pg_catalog form with `::` and no INT8; the gate-run refusal message
      carries CockroachDB's `:::` annotations and `0:::INT8`. Both were read from their own
      responses on 2026-08-16.
    why_it_matters: >-
      The `:::` form is the most credible string in the film and R-K quotes it exactly.
      Somebody comparing the two frames will be tempted to correct one into the other; either
      correction would put a string on screen that no endpoint returned.
    owner: W7 (clearance), and anyone building an overlay near either string
    ruling_recorded_here: b2.banner.check_predicate and b2.constraint_table.predicate are separate entries and neither may be edited into the other.

  - id: F-3
    severity: MEDIUM — a rounding the film must not out-claim
    finding: >-
      The beat panel's own formatter prints one decimal for durations at or above 1 ms and
      three decimals below it (issue/beats.ts:486-489). A reference beat of 572.251 ms
      therefore renders as `572.3 ms` on screen, while the payload carries the longer number.
    why_it_matters: >-
      R-K says nothing on screen is rounded and nothing spoken is unseen. Both hold, but only
      if nobody quotes the payload's digits over a frame showing the panel's. The resolution
      is the one already in this file: no overlay, strap or spoken line quotes an elapsed
      figure at all, and the panel's printed digits are the only ones on screen.
    owner: W2 (script), W7 (clearance)

  - id: F-4
    severity: MEDIUM — a value the brief permits and this cut declines
    finding: >-
      merged_commit is stable and R-K permits captioning it, but the admission panel as built
      does not render it, and the permit header in the same scroll reads `Merged commit null`,
      which is the live row.
    ruling: >-
      Not captioned in this cut (b7.optional.merged_commit). The permission is recorded, the
      decline is recorded, and the reason is the frame rather than the value.
    owner: story lead, if a later cut wants it

  - id: F-5
    severity: LOW — an operational detail that can look like a broken demo
    finding: >-
      The static asset route enforces the response ceiling. Without `accept-encoding: gzip`,
      GET /assets/index-LoN3Sn_L.js answers 413 with a body naming 490,950 bytes against a
      ceiling of 139,264 and suggesting gzip in its own error text. A browser sends gzip and
      is served 200; a curl-based pre-flight that does not will see a 413.
    why_it_matters: >-
      A 413 in a pre-flight ten minutes before the red light reads as an outage. It is not one,
      and the deployment says so in the error body — which is itself a small exhibit of the
      house style.
    owner: W6 (pre-flight document)

