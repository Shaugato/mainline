#
# prose-hygiene: register
#
# ONSCREEN-TEXT.yaml — EVERY STRING THAT APPEARS ON SCREEN IN THE 172 s, AND WHERE IT CAME
# FROM. Owner: W5 (story-and-script wave). Beat ids and durations are inherited from
# `docs/demo/film/BEATS.yaml`, which wins on timing; nothing here re-decides a duration.
#
# This file quotes forbidden strings beside true ones, in the same register form
# `verticals/mainline/demo/script/CAMERA-STRINGS.yaml` uses, so it carries the
# `prose-hygiene: register` marker above. Structurally it does not need it —
# `forbidden_on_camera` is one of `claim_hygiene.py`'s PROHIBITION_KEYS and the whole
# indented block under it is read as quoting the ban rather than committing it — but a
# reader who does not know that should not have to work it out from a regex.
#
# ── SCANNER VERDICT (plan R-B) ────────────────────────────────────────────────────────
# `docs/demo/film/` is outside every glob in `claim_hygiene.py`'s TARGET_GLOBS, so the
# scanner is invoked by hand and its verdict is recorded here rather than inferred from a
# green lane. Command and result, run on this file, 2026-08-16:
#
#   .venv/Scripts/python.exe scripts/demo/claim_hygiene.py --check \
#       docs/demo/film/ONSCREEN-TEXT.yaml
#
#   scanned 1 file(s) against 21 rules
#   claim hygiene OK
#   exit 0
#
# VERDICT: PASS, on the first run of this file, and a pass that has never gone red asserts
# nothing — so it was falsified rather than trusted. A copy of this file with three
# violations planted at the end was scanned on 2026-08-16:
#
#   .venv/Scripts/python.exe scripts/demo/claim_hygiene.py --check <scratch>/onscreen-red.yaml
#
#   FAIL :2395: [HYG-sha-literal]     a seven-hex tree ref written into a note
#   FAIL :2396: [HYG-bare-invariant]  a bare invariant id written outside the prohibition block
#   FAIL :2397: [MNC-14-split-view]   a banned property claimed in prose
#   3 claim-hygiene violation(s) · exit 1
#
# All three families are quiet on the real file and loud on the planted one, which is the
# reading that matters: the silence above is the rules holding, not the rules asleep. The
# third probe is the important one — those words DO appear in this file, inside
# `forbidden_on_camera`, and the planted copy proves the exemption is structural (a
# PROHIBITION_KEY block) rather than a hole. Why the first run was clean is recorded under
# `findings.F-6`; it is not a boast, it is a note about which red somebody else already
# paid for.
#
# ── WHAT WAS MEASURED BEFORE THIS FILE WAS WRITTEN ────────────────────────────────────
# Ten payload GETs against the live origin on 2026-08-16 (server_date 2026-08-15T14:00-
# 14:02Z), and no POST — the plan forbids one and the recorded gate-run payload is the
# reference. Three further GETs (`/operator.html`, its script asset, `/v1/demo/subjects`)
# are recorded under `findings.F-1` and `F-5` rather than here, because they measured the
# delivery of the page and not the value of a string:
#
#   GET /v1/health                              200    409 B
#   GET /v1/permits/{permit_id}                 200  5,691 B
#   GET /v1/permits/{permit_id}/blocking-checks 200  2,408 B
#   GET /v1/checks/{check_id}/disposition       200  3,805 B
#   GET /v1/recall-runs/{run_id}                200  2,223 B
#   GET /v1/clauses/{clause_uuid}/versions/{commit_id}  200  3,230 B
#   GET /v1/clauses/{clause_uuid}/ancestry      200  3,744 B   (bare path; the same route
#                                                               with ?as_of_commit= answers
#                                                               400, measured the same day)
#   GET /v1/receipts/{receipt_id}               200  1,817 B
#   GET /v1/change-requests/{cr_id}             200  3,295 B
#   GET /v1/checks/{cr_check_id}/disposition    200  3,850 B
#
# Every `payload_value` row below carries the pointer it was read from. Values that change
# per run are NOT written down as text; they are slots (see `conventions.volatile`).
# The POST-side values are read from `evidence/deploy/live-gate-run.json` (run `judge-walk`,
# generated 2026-08-14T22:10:33Z) and are labelled `reference`, never `text`.
#
# ── THE ONE THING A READER MUST KNOW BEFORE TRUSTING A `ui_label` ROW ─────────────────
# Every `ui_label` string here is quoted from the operator source in THIS repository at
# HEAD. On 2026-08-16 those strings were NOT in the bytes the live origin serves:
# `GET /operator.html` answers 200 (4,655 B) with `<title>MAINLINE console</title>`, its
# only script is `/assets/index-LoN3Sn_L.js`, and that bundle contains zero occurrences of
# `CONTROL OF WORK`, `1 obligation outstanding`, `cow-`, `hz-card` or `moc-`. See
# `findings.F-1`. Until the operator package is deployed, the `ui_label` rows describe the
# film the repository can make, not the film this origin can serve today, and W6's
# fallback governs the shoot.
#
# ── HOW TO READ AN ENTRY ──────────────────────────────────────────────────────────────
#   id            stable handle: <beat>.<region>.<thing>
#   kind          watermark | lower_third | overlay | ui_label | payload_value
#   text          the string VERBATIM, exactly as it appears — or
#   text_slot     a description of the value to be filled from THIS RUN's own response,
#                 used wherever the value moves between runs. A slot is never a
#                 placeholder to be typed over: it names the pointer that fills it.
#   label         the row label the app prints beside the value. EVERY `label` in this
#                 file is our own word, i.e. editorial; it is recorded once here rather
#                 than doubling every entry.
#   chip          the provenance chip: db:column | derived | recomputed | reported |
#                 parsed | staged | typed | editorial | none_claimed
#   envelope_chip the chip the WIRE claimed for this pointer, where the wire's vocabulary
#                 and the chip vocabulary above differ. Recorded, never substituted.
#   editorial     true when the words are ours rather than the database's.
#   source        pointer, file:line, or the endpoint the value came back on.
#
# ── TWO DECLARED EXTENSIONS TO THE BRIEF'S VOCABULARIES, EACH WITH ITS REASON ─────────
# 1. `chip: none_claimed`. The brief's chip vocabulary has eight values; the deployed
#    envelope claims a chip for some pointers and NONE for others, and beats 1 and 4 —
#    including their `00000` SQLSTATEs — are in the second group (`transitions.py` claims
#    `db:constraint` for `/beats/1/sqlstate` and `/beats/2/sqlstate` only;
#    `docs/demo/memory-visible-CONTRACT.md` §2.1). Choosing any of the eight for those
#    values would be this file inventing a claim the emitter did not make. `none_claimed`
#    is the console's own third answer (`features/gate/provenance.ts::lookupProvenance`)
#    and it is used here for exactly that case.
# 2. `envelope_chip`. The wire's five chips are `db:column`, `db:constraint`,
#    `recomputed`, `staged`, `derived` (`envelope.py:93`). `reported` and `parsed` are not
#    wire chips at all — they are the payload's own `constraint_source` values, which the
#    refusal banner renders AS a chip beside the constraint name (`RefusalBanner.ts:171`).
#    Both are true of the same string, so both are recorded: `chip` is what the frame
#    shows, `envelope_chip` is what the envelope claimed.
#
# ── kind: editorial ───────────────────────────────────────────────────────────────────
# The brief asks that every editorial string be marked `kind: editorial`. `editorial` is a
# member of the CHIP vocabulary and not of the KIND vocabulary, and a string is both a
# watermark (kind) and ours (provenance) at once. So the mark is carried twice and
# unambiguously: `chip: editorial` AND `editorial: true`, on every string whose words are
# ours — the lower third, the straplines, the reveal-control labels, every overlay in the
# naming block, and every row label. Grep `editorial: true` and you have the complete list
# of words a judge would be right to call ours.

meta:
  owner: W5
  file_purpose: >-
    Every burned-in and on-screen string in the 172 s cut, keyed by beat, each with its
    kind, its provenance chip and the pointer or file:line it came from.
  film_total_s: 172
  spine: docs/demo/film/BEATS.yaml
  plan: docs/demo/story-and-script-plan.md
  siblings: [VO-DEMO.md, VO-CLOSE.md, CLICKS.md, SPINE.md, FALLBACKS.md, CLAIMS-CLEARANCE.md]
  measured_on: '2026-08-16'
  origin: https://ihuuyvm4z6nfuktihnkey77fpy0eyrhj.lambda-url.ap-southeast-1.on.aws
  post_reference: evidence/deploy/live-gate-run.json
  post_reference_run: judge-walk
  post_reference_generated_at: '2026-08-14T22:10:33Z'
  scanner_verdict: PASS
  scanner_command: .venv/Scripts/python.exe scripts/demo/claim_hygiene.py --check docs/demo/film/ONSCREEN-TEXT.yaml

vocabulary:
  kind: [watermark, lower_third, overlay, ui_label, payload_value]
  chip:
    - db:column
    - derived
    - recomputed
    - reported
    - parsed
    - staged
    - typed
    - editorial
    - none_claimed
  envelope_chip: ['db:column', 'db:constraint', recomputed, staged, derived]

conventions:
  - id: C1
    rule: >-
      Nothing on screen is rounded by us and no number is retyped. Per-beat durations are
      the payload's own elapsed_ms as the panel prints them; no overlay, strap or caption
      in this file quotes an elapsed figure at all.
    authority: plan R-K; CLICKS.md §6 rule 5; r6-honesty A2
  - id: C2
    rule: >-
      A value that moves between runs is a slot, never a string. Slots in this file:
      run_id, response byte count, received-at instant, every elapsed, generated_at,
      disposition_id, clearance_digest, refusal_id, the two logical timestamps.
    authority: plan R-K; docs/demo/memory-visible-CONTRACT.md §1.4 (volatile is a confession)
  - id: C3
    rule: >-
      Typed carries no chip. The three typed fields are visible inputs with a caret and a
      placeholder, labelled by the app itself, and they are never echoed back as data.
      Every server value carries a chip; nothing typed does.
    authority: plan R-H; CLICKS.md §4; permit/typed-fields.ts
  - id: C4
    rule: >-
      The SYNTHETIC prefix stays on screen wherever a column carries it — the event title,
      the evidence summary, the clause text, the blame-edge attribution. It is part of the
      column value and cropping it to prettify a frame is editing evidence.
    authority: plan R-F; demo_world.sql:275-278; hazard/precursor.ts:378
  - id: C5
    rule: >-
      An overlay may only name a fact whose evidence is legible in the same frame. An
      overlay that cannot be checked against the picture behind it is an assertion, and
      assertions are the thing this product exists to replace.
    authority: r5-craft §4 rule 1
  - id: C6
    rule: >-
      Every `label` in this file is our own word. Row labels, section headings, glosses and
      straplines are authored; the values beside them are not. This is the single
      convention that lets a reviewer see, at a glance, which words are ours.
  - id: C7
    rule: >-
      Where the app composes a sentence from a payload value, the sentence is recorded with
      its template and the pointer that fills it, so nobody types the reference value into
      a burned-in strap on the day.

# ══════════════════════════════════════════════════════════════════════════════════════
# THE WATERMARK — on frame for the whole film, and it names this film's world
# ══════════════════════════════════════════════════════════════════════════════════════
watermark:
  id: film.watermark
  kind: watermark
  text: SYNTHETIC CORPUS · EVERY SITE, PERMIT, INCIDENT AND PERSON HERE IS AUTHORED
  chip: editorial
  editorial: true
  on_frame: 0 s to 172 s, without exception, including the end card
  placement: >-
    Burned in, top strip, inside the middle 90 % of frame and clear of the bottom 12 %
    where the player's scrubber sits.
  authority: plan R-L; r6-honesty A3; DEMO-HONESTY.md:35-36 and :83

  deviation_from_committed_string:
    committed_string: SYNTHETIC CORPUS · KESTREL RESOURCES IS FICTIONAL
    committed_at: verticals/mainline/demo/DEMO-HONESTY.md:35-36
    also_at: verticals/mainline/demo/script/CAMERA-STRINGS.yaml banners.watermark
    deviation: >-
      This film burns the R-L string above instead of the committed one. The words are
      different; the control is identical and is not weakened — the committed string names
      one fictional thing, the string above names every fictional thing on screen.
    reason: >-
      The committed string names Kestrel Resources, which is the CORPUS world's cleared
      fictional operator — cleared against the ASIC company register, ABN Lookup and IP
      Australia, with the query strings and verbatim results recorded in
      demo/operator/CLEARANCE.md (DEMO-HONESTY.md:83-86). This film is shot against the
      demo-api world, whose site seeds as `demo_site` (demo_world.sql:72-76) and whose
      `site_code` renders on screen as a uuid, not as a company. A watermark naming an
      operator the frame never shows would be a strange kind of dishonesty: it would
      disclaim the wrong fiction and leave the site, the permit, the incident and the
      person on screen undisclaimed.
    measured: >-
      `grep -ril kestrel verticals/mainline/apps/console/src/` returns nothing on this
      tree, so no built operator surface renders a Kestrel site today.
    reversion_condition: >-
      If the operator UI does render Kestrel Resources on the day, the committed string is
      used VERBATIM instead, unchanged and un-merged with this one, and this block records
      that it was.
    what_is_preserved: >-
      Watermark on frame for the whole film; never cropped; never faded under a title;
      never smaller than the smallest legible on-screen row.

# ══════════════════════════════════════════════════════════════════════════════════════
# PERSISTENT — strings on frame across many beats, recorded once
# ══════════════════════════════════════════════════════════════════════════════════════
persistent:
  - id: film.chip.stack
    kind: overlay
    text: AWS Lambda Function URL · ap-southeast-1
    chip: editorial
    editorial: true
    on_frame: b0 to b8, small, top-left, under the watermark
    why_this_wording: >-
      Every word of it is confirmable against the URL bar in the same frame, which reads
      the `…lambda-url.ap-southeast-1.on.aws` origin. The cluster version is deliberately
      NOT in this chip: it comes from GET /v1/health and is not in frame on the permit
      screen, so it is named in c3 where the read that produces it is the exhibit.
    authority: r5-craft §4 (suggested persistent chip, narrowed by rule 1 same-frame confirmability)

  - id: film.strap.disclosure_fallback
    kind: overlay
    text: >-
      All four beats arrived in one already-rolled-back SERIALIZABLE transaction. This
      panel reveals them in order as a reading aid; every timing shown is the server's.
    chip: editorial
    editorial: true
    on_frame: b2 to b8, only while the page's own disclosure strip is scrolled out of frame
    carries_no_run_varying_value: true
    why: >-
      Plan R-C requires the disclosure in frame from b2 onward; the page's strip is not
      sticky and leaves frame at b3 and b6 (CLICKS.md §7 D-2). A burned strap carrying a
      run_id typed by hand could be wrong about a run; this sentence cannot be, because it
      contains no value from one.
    authority: plan R-C; CLICKS.md §7 D-2

  - id: film.ui.watermark_strip
    kind: ui_label
    text: SYNTHETIC DEMONSTRATION — no real site, no real permit, no real person
    chip: editorial
    editorial: true
    source: verticals/mainline/apps/console/src/operator/chrome/Watermark.ts:22
    on_frame: b0 only, because the strip is a normal flow element and scrolls away
    note: >-
      The page's own watermark. It is not the film's watermark and does not replace it;
      both are on screen in b0 and only the burned one survives the first scroll.

  - id: film.ui.origin_strip
    kind: ui_label
    label: served from
    text_slot: the origin the page was served from, printed by the page itself
    chip: derived
    editorial: false
    source: verticals/mainline/apps/console/src/operator/chrome/OriginStrip.ts:118,132
    why_it_matters: >-
      This strip is the film's R-N device. If the take is made against the local emulator
      it prints `X-Mainline-Emulator` and the film cannot be passed off as the deployed
      one. It is in frame at the foot of the document, and it is never cropped.

  - id: film.frame.url_bar
    kind: ui_label
    text_slot: the browser's own address bar, uncropped, showing the origin and the route
    chip: derived
    editorial: false
    note: >-
      Browser chrome, not our string. Recorded because it is one of the four witnesses that
      must be in frame from the first frame to the last (CLICKS.md §1.4) and because an
      overlay may never cover it.

# ══════════════════════════════════════════════════════════════════════════════════════
# THE BEATS
# ══════════════════════════════════════════════════════════════════════════════════════
beats:

  # ── b0 · THE ORDINARY MOMENT · 0:00 → 0:12 ─────────────────────────────────────────
  - beat_id: b0
    t: 0
    dur: 12
    title: THE ORDINARY MOMENT
    strings:

      - id: b0.lower_third.problem
        kind: lower_third
        text: >-
          The lesson a past incident taught is a memo people forget. Here it is a
          constraint the database enforces — for the supervisors and safety engineers who
          issue permits to work.
        chip: editorial
        editorial: true
        on_frame: 0:00 to 0:07
        why: >-
          Devpost asks for the problem and the audience in one sentence up front and the
          spoken opener spends its words on the promise, so the problem sentence is written
          rather than said. It costs zero seconds of voice.
        authority: plan §1.2
        set_two_lines: >-
          Break after `forget.` so neither line exceeds the 42-character subtitle width the
          craft research fixes; hold both lines for the full 7 s.

      - id: b0.appbar.product
        kind: ui_label
        text: CONTROL OF WORK
        chip: editorial
        editorial: true
        source: chrome/AppBar.ts:20
        note: >-
          The supervisor's own product, and it is deliberately not MAINLINE. MAINLINE is
          underneath; the whole point of the film is that the refusal lands inside somebody
          else's software.

      - id: b0.appbar.modules
        kind: ui_label
        text: Modules
        chip: editorial
        editorial: true
        source: chrome/AppBar.ts:50

      - id: b0.rail.items
        kind: ui_label
        text: Permits · Isolations · Certificates · Register
        chip: editorial
        editorial: true
        source: chrome/Rail.ts:36-39
        note: Rendered as a list, not a menu; the unavailable three carry the note below.

      - id: b0.rail.not_carried
        kind: ui_label
        text: not carried by this deployment
        chip: editorial
        editorial: true
        source: chrome/Rail.ts:43 (NOT_CARRIED_NOTE), permit/typed-fields.ts:56 (NOT_CARRIED)
        note: >-
          The same six words do three jobs on this screen — an absent rail item, an absent
          column, an absent action. That repetition is a feature: a judge learns the phrase
          once and can then read every gap on the screen without a legend.

      - id: b0.header.permit_type
        kind: ui_label
        label: Permit type
        text: Cold work
        chip: typed
        editorial: false
        source: permit/header.ts:51,130
        note: >-
          Selected on this device from HSG250 Table 2's eight types. It is an input, not a
          column: `mainline.permit` carries no permit-type column.

      - id: b0.header.permit_type_note
        kind: ui_label
        text: HSG250 Table 2 · selected on this device
        chip: editorial
        editorial: true
        source: permit/header.ts:150

      - id: b0.header.external_ref
        kind: payload_value
        label: Permit reference number
        text: DEMO-PTW-0001
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/permits/{permit_id} · /data/external_ref
        note: The one string in the film a judge will remember well enough to type into the API.

      - id: b0.header.ref_name
        kind: payload_value
        text: refs/permits/demo-0001
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/permits/{permit_id} · /data/ref_name
        note: A permit that is a git ref. Keep it in the header; it is our most distinctive idea.

      - id: b0.header.state_chip
        kind: payload_value
        label: Status
        text: dispositioned
        chip: db:column
        envelope_chip: db:column
        editorial: false
        source: GET /v1/permits/{permit_id} · /data/state
        must_not: >-
          Do not translate it into `Pending approval`. It is a value of the user-defined
          enum `mainline.subject_state`, and translating it would invent a status
