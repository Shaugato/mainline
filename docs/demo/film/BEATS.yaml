    t: 148
    dur: 6
    ends: 154
    title: THE LOOP
    axis: [agentic_memory_design]
    vo_word_budget: 10 # 1.67 w/s
    never_cut: false # and no ladder step below reaches it
    on_screen: >-
      STORE, RETRIEVE, ACT — three words, large, each with the table it came from
