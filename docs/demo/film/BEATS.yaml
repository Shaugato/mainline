    # THIS CARD PAYS THE MOST FOR THE COMPRESSION AND IT IS THE SHARPEST THING IN
    # THE REVISION. It is the only close card whose primary axis is
    # `agentic_memory_design`, which is the first and tie-break criterion, and it
    # goes 12 s -> 6 s. Content is preserved to the character. What is lost is the
    # TIME A JUDGE HAS TO SIT WITH STORE / RETRIEVE / ACT before the next card
    # arrives. That is a real axis-1 loss and it is not dressed up as anything else.
    # It is accepted because `b9` and `b10` are themselves axis-1: they attach the
    # constraint to the CLAUSE rather than to the workflow, and follow it into the
    # process that would erase it.

  - beat_id: k2
    t: 154
    dur: 10
    ends: 164
    title: THE STACK — AWS ∥ CockroachDB
    axis: [agentic_memory_design, technological_implementation, product_readiness]
    vo_word_budget: 16 # 1.60 w/s
    never_cut: false
    on_screen: >-
