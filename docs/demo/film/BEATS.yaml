    # written" is the one sentence this beat must not say.

  - beat_id: b9
    t: 124
    dur: 12
    ends: 136
    title: THE OTHER WAY IN
    axis: [agentic_memory_design, real_world_impact]
    vo_word_budget: 20 # 1.67 w/s
