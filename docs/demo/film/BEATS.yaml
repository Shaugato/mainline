      logo animation, no music sting.

# ── A SANCTIONED CLAIM ON THE 8 s BANK, AND THE ONLY ONE ──────────────────────
# Top-level rather than a member of `beats:`, because it is a conditional variant of
# one beat and not a beat. The `beats:` list stays contiguous and gapless.
k2_legibility_variant:
  applies_to: k2
  dur: 12
  film_after_s: 174
  when: >-
    Only if the two labelled columns will not fit LEGIBLY with all three of their
    labels at 10 s. Then k2 takes 12 s and the banked margin pays for it. It does
    NOT get flattened into one ungrouped list — the grouping is the honesty.
  warning: >-
    174 is exactly `hard_stop_s`. It does not EXCEED it, so the ladder is not
    triggered, but the 2 s margin is gone and nothing else may then run long. If
    this variant is taken, the assembled cut is measured before anything else is.

cut_ladder:
  # PRE-COMMITTED, IN ORDER. Executed from the top until the cut is under
  # hard_stop_s. Never improvised at 02:00, never reordered on the day.
  #
  # THE PREVIOUS LADDER IS VOID AND IS REPLACED WHOLE, not amended. Its rank 1
  # (`b8`'s change-request cut) no longer exists — this revision spent it. Its
  # rank 2 (`b0` 12 -> 8) is arithmetically unexecutable: `b0` carries 19 fixed,
  # verbatim words and 19 words in 8 s is 2.4 w/s, so the step cut picture out from
  # under words that span it. Its rank 5 targeted a `c4` that no longer exists.
  #
  # Total recoverable: 4 + 4 + 3 + 2 + 4 = 17 s. Floor 172 - 17 = 155 s.
  # Running floors: 168, 164, 161, 159, 155.
  never_cut: [b3, b5]
  steps:
    - rank: 1
      beat_id: b9
      from_dur: 12
      to_dur: 8
      saves_s: 4
      film_after_s: 168
      what_goes: The typing of the proposed wording on camera.
      why: >-
        First, because it is the only second in the new material that is
        preparation rather than consequence. Arrive on the MoC screen already
        composed, with the wording in the field. The screen, the shared clause and
        the shared precursor all survive, so R-5 is untouched.
    - rank: 2
      beat_id: b6
      from_dur: 18
      to_dur: 14
      saves_s: 4
      film_after_s: 164
      what_goes: One of the three permit defeaters.
      why: >-
        Two questions carry the point that the answer is a question. The cost
        lattice is kept — it is the half a competitor cannot also show.
    - rank: 3
      beat_id: b7
      from_dur: 12
      to_dur: 9
      saves_s: 3
      film_after_s: 161
      what_goes: The dwell on the post-merge fields.
      why: >-
        ADMITTED and the screen turning from blocked to issued is the whole job of
        this beat: it proves b2 was not a bug. Three seconds of dwell is not.
    - rank: 4
      beat_id: k3
      from_dur: 6
      to_dur: 4
      saves_s: 2
      film_after_s: 159
      what_goes: The spoken limit. The screen keeps all three of its lines.
      why: >-
        The limit is already the densest thing on the card and it is already
        printed there in its exact sanctioned form. What is given up is the film's
        last SPOKEN concession, which is a real loss to a judge who is listening
        rather than reading — so it goes fourth, not first.
    - rank: 5
      beat_id: b10
      from_dur: 12
      to_dur: 8
      saves_s: 4
      film_after_s: 155
      what_goes: The hold after the mirror line.
      why: >-
        Last of the five, and it is floored at 8 s by R-10. The three live defeater
        prompts stay on screen: without them the beat ends on a refusal with no way
        through shown, which is the one reading of use case two that damages the
        film.

  atomicity:
    # RULING R-10 — USE CASE TWO IS ATOMIC. This is a constraint ON the ladder and
    # it binds whoever executes it at 02:00.
    rule: >-
      No step may take b10 below 8 s, and b9 may NEVER be cut without b10. A setup
      with no answer is worse than neither: it spends 8-12 s raising the judge's
      question and never answers it.
    escape_hatch:
      when: If the cut must go past rank 5.
      action: Drop b9 and b10 TOGETHER, and restore b8 to 10 s.
      from_film_s: 172 # computed from the UNCUT film; this REPLACES ranks 1 and 5
      removes_s: 24 # b9 12 + b10 12, at their full durations
      restores_s: 4 # b8 6 -> 10, and its read-only change-request cut comes back
      net_s: -20
      film_after_s: 152
      combined_with_ranks_2_3_4_s: 143 # 152 - 4 - 3 - 2
      why: >-
        The film is then back to ONE clean use case rather than one and a half.
        This is the same shape and the same 152 s the no-go path lands on if the
        change-request attempt endpoint is never built, so there is exactly one
        fallback film to rehearse rather than two.

constraints:
  # Facts about the film's shape that other workers must not contradict.
  posts_per_film: 2 # was `one_post_per_film: true` until 2026-08-16
  # RULING R-9, AND IT IS A TIGHTENING RATHER THAN A LOOSENING. `FALLBACKS.md` F-11
  # today says a second POST row means STOP THE TAKE; it is a fake-detection rule
  # and its force must not be reduced to make room for a beat. The new form is
  # strictly stronger at two requests than the old one was, because it adds a
  # condition that does not exist today:
  #
  #   EXACTLY TWO mutating requests in the whole cut. Each is narrated WHILE IT IS
  #   IN FLIGHT. Each is visible in the network panel. ANY THIRD ROW, OR EITHER ROW
  #   APPEARING WITHOUT ITS NARRATION, STOPS THE TAKE.
  #
  # Both are to a `/v1/demo/*` rolled-back endpoint and each returns its own
  # `persisted: false` MEASURED BY THE ENDPOINT FROM ITS OWN FINGERPRINT, never
  # claimed by this document. `b1`'s line "One request — four beats came back inside
  # it" stays true of THAT request; the disclosure strap becomes per-request.
  post_narration_required: true # the condition R-9 adds; see above
  memory_loop_beat: b3 # the beat that discharges the rules requirement
  peak_beat: b5 # the film's emotional peak; nothing else may compete with it
  title_card_before_demo: false # there is none; the name is earned in the close
  reveal_disclosure_from_beat: b2 # the one-transaction disclosure line is on screen from here on
  operator_ui_is_a_real_client: true # every refusal on screen came back over HTTP from the deployed API
  use_case_two_atomic: true # R-10; encoded in machine form under cut_ladder.atomicity
  use_case_two_shared_identifiers_in_frame: true
  # RULING R-5, BINDING ON W2, W4 AND W5. The shared clause version (label
  # `7.3.2(b)`) AND the shared precursor `DEMO-INC-0001` must be visible in the same
  # frame as the change-request refusal, legible, carrying the same identifiers a
  # judge already saw in `b3`. If those two are not in that frame, `b9` and `b10`
  # are merely a second refusal, the axis-1 trade this revision makes is a straight
  # loss, and the escape hatch above is taken instead.
  committing_route_in_film: false
  # There is none and none is added. Both mutating requests roll back. The demo
  # guard that answers `423 Locked` on the seeded subjects stays exactly as it is.
