  - beat_id: b10
    t: 136
    dur: 12
    ends: 148
    title: REFUSED AGAIN — the mirror
    axis: [agentic_memory_design, technological_implementation]
    vo_word_budget: 22 # 1.83 w/s, with a hold inside it
    never_cut: false # but see R-10: no step may take it below 8 s
    on_screen: >-
