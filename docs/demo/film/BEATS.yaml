    # THE BEAT ANSWERS THE QUESTION USE CASE ONE INVITES. A judge who has watched
    # 124 s of "you cannot issue a permit on that clause" asks the obvious thing:
    # then could somebody just rewrite the rule? The seeded world already answers
    # it and nothing in the film surfaced it.
    #
    # THE TYPED WORDING IS THE HONEST FORM, NOT A WORKAROUND (R-2). `FALLBACKS.md`
    # F-8 forbids RENDERING a proposed clause string, because the table carries none
    # and a plausible one would have to be hard-coded. Typing it on camera into the
    # console's own input satisfies F-8 rather than waiving it: the film's standing
