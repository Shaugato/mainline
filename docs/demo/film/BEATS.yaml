  #
  # 50 s -> 22 s, AND NOTHING LEAVES THE SCREEN (R-6). Devpost asks that the
  # services and features be "on screen (text overlay or slide) so judges can
  # confirm them quickly". It never asks for them narrated, and `VO-CLOSE.md` §3.2
