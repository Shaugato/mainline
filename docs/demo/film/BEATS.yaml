#
# BEATS.yaml — THE SPINE OF THE FILM, MACHINE-READABLE. Owner: W1 (spine and timing).
#
# This file is the single source of truth for TIMING. Every other film document —
# VO-DEMO.md, VO-CLOSE.md, CLICKS.md, ONSCREEN-TEXT.yaml, FALLBACKS.md,
# CLAIMS-CLEARANCE.md — cites a `beat_id` from here and inherits its `t` and `dur`.
# If a worker's document disagrees with this file about a duration, this file wins
# and that document is wrong. Prose, emotional map, opener and cut ladder live in
# the sibling SPINE.md; nothing here duplicates them except the cut ladder, which is
# repeated in machine form below because a 02:00 cut must be executable, not read.
#
# ── REVISION, 2026-08-16 — THE DEFECT THIS REVISION FIXES ─────────────────────
# `VO-DEMO.md` was edited on 2026-08-16 to insert `B0b · WHY IT MATTERS`, 8 s at
# `[0:12]`, at the founder's direction. THE INSERT PROPAGATED TO NOTHING. This file
# had no `b0b` beat, still read `demo_s: 120`, and still read `total_s: 172` — so
# the film it described was not the film that existed. The film that existed was:
#
#   12 + 8 + 10 + 14 + 18 + 10 + 16 + 18 + 12 + 10 = 128 s demo + 50 close + 2 end
#                                                  = 180 s
#
# 180 s is the number `ceiling_s` below calls "a disqualified cut; never approach
# it". The committed film was sitting exactly on it. That defect is fixed here, and
# it is a fix this file owed whatever else happened in this wave.
#
# The same revision adds use case two — `b9` and `b10`, the change request that
# cannot be quietly edited — paid for out of close DWELL (50 s → 22 s, no service,
# feature, label, caveat or concession leaves the screen) and out of `b8`'s second
# half, which was rank 1 on this file's own previous cut ladder. `b0`..`b8` keep
# their ids and their durations; only their `t`/`ends` shift by 8, and only `b8`'s
# `dur` changes. Binding: `docs/demo/film-recut-plan.md`, rulings R-1 … R-10.
#
# ── SCANNER VERDICT (R-B) ─────────────────────────────────────────────────────
# `docs/demo/film/` is outside every glob in `claim_hygiene.py`'s TARGET_GLOBS, so
# the scanner is invoked by hand and its verdict is recorded here rather than
# inferred from a green lane. Command and result, re-run against THIS revision on
# 2026-08-16 — the 2026-08-15 verdict this block used to carry described different
# bytes and has been replaced rather than kept:
#
#   .venv/Scripts/python.exe scripts/demo/claim_hygiene.py --check \
#       docs/demo/film/BEATS.yaml docs/demo/film/SPINE.md
#
#   scanned 2 file(s) against 21 rules
#   claim hygiene OK
#   exit 0
#
# VERDICT: PASS. The 2026-08-15 run is kept in the record because it is the more
# useful half: it went RED three times on these two files — two `HYG-sha-literal`
# hits on a tree ref written into the headers, and one `MNC-17` hit where a
# forbidden opener was quoted on a source line whose negation marker had wrapped
# onto the line above. All three were fixed in the files, never in the scanner.
# A hygiene verdict that never went red asserts nothing. THE WRAP TRAP IS LIVE FOR
# EVERY WORKER BEHIND THIS FILE: the negation exemption is LINE-scoped, so a
# `never` that wraps away from the phrase it governs stops exempting it.
#
# THE 2026-08-16 GREEN WAS FALSIFIED IN BOTH DIRECTIONS BEFORE IT WAS RECORDED,
# because a green whose only evidence is a green proves nothing about a path the
# scanner is not obliged to walk:
#
#   1. A COPY of SPINE.md with a seven-hex commit literal appended was handed to
#      the same command. It went RED — `HYG-sha-literal`, exit 1. So the scanner
#      really reaches these bytes and the pass above is a pass, not a skip. The
#      planted copy lived in a scratch directory and is deleted; nothing in the
#      tree was made non-compliant to run it.
#   2. `claim_hygiene.py --self-test` — planted 4 violation families, fired on 4,
#      exit 0. So the rule set is not vacuous either.
#
# Neither file was softened to reach the green. No rule was edited, no marker was
# bolted onto a sentence that was not already a denial, and no phrase was deleted
# to dodge a rule.
#
# ── WHAT IS AND IS NOT A MEASURED NUMBER IN THIS FILE ─────────────────────────
# `t`, `dur`, and every word budget are DURATIONS THIS FILE IS BUDGETING. They are
# editorial decisions, not measurements, and they are labelled as such.
#
# The only kernel-produced values quoted here are the four SQLSTATEs and the four
# outcomes of the gate run — `00000 read`, `23514 refused`, `P0001 refused`,
# `00000 admitted` — which are read from `evidence/deploy/live-gate-run.json`
# (`data.beats[*].sqlstate`, `data.beats[*].outcome`, run `judge-walk`, generated
# 2026-08-14T22:10:33Z). Per-beat `elapsed_ms`, byte counts, digests and any
# on-screen field value are NOT budgeted here and MUST NOT be copied from a plan:
# they are re-derived from the run that is actually filmed (R-K).
#
# `b10`'s SQLSTATE is `23514` — the same one `b2` carries, from a DIFFERENT
# constraint. That is the whole point of the beat and it is not a typo.
#
# ── HOW TO CHECK THE ARITHMETIC BY HAND, IN TWO SUBTRACTIONS ──────────────────
# Every beat carries `t`, `dur` and `ends`, where `ends = t + dur`. The list is
# contiguous and gapless, so:
#
#   1. For each beat:  ends - t == dur          (one subtraction per row)
#   2. For each pair:  ends(n) == t(n+1)        (no gaps, no overlaps)
#
# The last demo beat b10 ends at 148. The last close beat k3 ends at 170. `end`
# ends at 172. No validator script is shipped for this file — W1 owns no `.py`
# and a script nobody runs is worse than a subtraction anybody can do.

budget:
  # ── The three numbers that bound the cut ────────────────────────────────────
  total_s: 172 # 148 demo + 22 close + 2 end card. The film as designed.
  hard_stop_s: 174 # If the assembled cut exceeds this, the ladder below is executed.
  ceiling_s: 180 # The contest rule. A 180 s cut is a disqualified cut; never approach it.

  # ── How 172 decomposes ──────────────────────────────────────────────────────
  demo_s: 148 # b0, b0b, b1..b10 — TWELVE beats
  close_s: 22 # k1..k3, three cards
  end_card_s: 2 # `end`
  # 148 + 22 + 2 = 172. 174 - 172 = 2 s of margin above the hard stop.
  # 180 - 172 = 8 s of margin to the rule. Both margins are deliberate and small:
  # editing lands long, never short. 8 s of the 32 s recovered by this revision is
  # BANKED, not spent — see `k2_legibility_variant` below, the only sanctioned
  # claim on it.

  # ── The speech-rate assumption every word budget is derived from ────────────
  wps_assumption: 1.9 # words per second == 114 wpm
  # 1.9 w/s is BETWEEN the existing kit's measured average and its comfortable
  # ceiling. It is chosen deliberately unhurried because several lines in this film
  # contain a SQLSTATE, and a SQLSTATE read fast is a SQLSTATE nobody catches.
  # A word budget is a CEILING, not a target. Under-running a beat is free.

  demo_words: 286 # sum of vo_word_budget over b0, b0b, b1..b10
  close_words: 36 # sum of vo_word_budget over k1..k3
  film_words: 322 # 286 + 36
  # 286 / 148 = 1.932 w/s  — OVER the 1.9 assumption, and `b0b` is the entire cause.
  #                          See `b0b_rate_defect` below. Without b0b the demo is
  #                          258 words over 140 s = 1.843 w/s, comfortably under.
  #  36 /  22 = 1.636 w/s  — the close. Identical to two decimals to the 50 s
  #                          close's deliberate 1.64 w/s: THE READING PACE IS NOT
  #                          COMPRESSED AT ALL. That is the proof that 50 s -> 22 s
  #                          is a compression of delivery and not of content.
  # 322 / 170 = 1.894 w/s  — the film's average across everything but the silent
  #                          end card. Still under the assumption.

  b0b_rate_defect: true
  # STATED RATHER THAN QUIETLY MET. `b0b` carries 28 words in 8 s = 3.50 w/s, which
  # is over this file's 1.9 assumption and over the kit's 1.95 ceiling. The words
  # are already written and cleared in `VO-DEMO.md` and W1 does not own them, so
  # this file does not shorten them by fiat. THE SPINE'S RULING: `b0b` is 8 s, and
  # either W2 trims the line to at most 15 words or W2 comes back to W1 for
  # seconds. There is no third option in which 28 words are spoken in 8 seconds.
  # `VO-DEMO.md` §1's `B0b` header prints "8 s · 28 w · 1.75 w/s"; 28 / 1.75 = 16,
  # so that rate was computed against a 16 s window and does not describe an 8 s
  # beat. This file budgets the 8 s and refuses the 1.75.
  #
  # `b0b` IS NOT THE ONLY BUDGET ABOVE THE ASSUMPTION AND THE OTHER ONE IS NAMED
  # HERE RATHER THAN LEFT TO BE FOUND. `b0` is 24 w / 12 s = 2.00 w/s, and it has
  # been over since this file was written; `VO-DEMO.md` §2 already states it and
  # delivers 19 words against it. Every other budget in the file is at or under
  # 1.90. `b8` at 11 / 6 = 1.83 is under, which is the point of choosing 11.

  # ── The organiser's clock, which is not the same clock ──────────────────────
  first_refusal_at_s: 30 # `23514` visible inside the operator app at 0:30
  # RULING R-1. This field read `22` until 2026-08-16 and `22` was the pre-`b0b`
  # number. With `b0b` the click lands at 0:20 and the refusal band is on screen at
  # 0:30. The instruction is "get to the live demo fast (within the first 20 to 30
  # seconds)", and what that instruction asks for is LIVE PRODUCT, which is on
  # screen from FRAME ONE — the supervisor's own permit form on the deployed
  # origin, URL bar in frame, at 0:00. The refusal at 0:30 is the outer edge of the
  # window rather than eight seconds inside it, and that is stated rather than
  # hidden. The seconds are NOT bought back by cutting `b0`: `b0` carries 19 fixed,
  # verbatim words, and 19 words in 8 s is 2.4 w/s, over every rate ceiling in the
  # kit. That step is removed from the ladder below for exactly that reason.

axes:
  # The five criteria, Official Rules spelling, in TIE-BREAK ORDER. `axis` on each
  # beat below is one or more of these keys. Tie-break order matters: a tie is
  # broken on the first criterion, so the beats carrying `agentic_memory_design`
  # are the ones that may never be cut.
  - agentic_memory_design
  - technological_implementation
  - real_world_impact
  - product_readiness
  - creativity_originality

beats:
  # ═══ THE DEMO — twelve beats, 148 s ═══════════════════════════════════════
  #
  # USE CASE ONE — b0 … b8: a supervisor cannot ISSUE a permit that relies on a
  # clause a past incident's blame reaches.
  # USE CASE TWO — b9, b10: nobody can quietly EDIT AWAY that same clause either.
  # They are mirror images and they share a clause and a precursor (R-5).
  - beat_id: b0
    t: 0
    dur: 12
    ends: 12
    title: THE ORDINARY MOMENT
    axis: [real_world_impact]
    vo_word_budget: 24
    never_cut: false
    on_screen: >-
      The supervisor's own permit form on the deployed origin, URL bar in frame,
      state chip and hazard card visible, cursor already resting on ISSUE while the
      founder types the tail of the work description on camera.

  - beat_id: b0b
    t: 12
    dur: 8
    ends: 20
    title: WHY IT MATTERS
    axis: [real_world_impact]
    vo_word_budget: 28 # 3.50 w/s — see `b0b_rate_defect`. NOT a rate this file endorses.
    never_cut: false
    on_screen: >-
      Unchanged from b0 — still the permit form, cursor still on ISSUE. Nothing is
      cut to make room and no new surface appears; the beat is spoken over the frame
      b0 established, and the click lands at 0:20 instead of 0:12.
    # ADDED to this file 2026-08-16. The beat itself was added to `VO-DEMO.md` on
    # 2026-08-16 at the founder's direction, for an audience the rest of the script
    # does not serve: the film goes to a public channel, and a viewer with no
    # database background is never told WHY a refusal is the point. It makes no
    # technical claim, so it costs an expert nothing. IT NAMES NO YEAR, NO SITE, NO
    # JOB TITLE AND NO INJURY — the seeded precursor's own narrative column records
    # that it describes nobody, and a spoken sentence that gave it a casualty would
    # be inventing one to move an audience.

  - beat_id: b1
    t: 20
    dur: 10
    ends: 30
    title: THE ATTEMPT
    axis: [real_world_impact]
    vo_word_budget: 16
    never_cut: false
    on_screen: >-
