  - beat_id: b8
    t: 118
    dur: 6
    ends: 124
    title: NONE OF IT PERSISTED
    axis: [product_readiness]
    vo_word_budget: 11 # was 20 at 10 s; 11 / 6 = 1.83 w/s, under the assumption
    never_cut: false
    on_screen: >-
      persisted false, single transaction true, isolation SERIALIZABLE, and the
