    #
    # `blood_major` is a column value and MUST NOT be spoken — it goes on screen
    # only. Saying it aloud edges toward inventing an injury.
    #
    # THE COST OF THIS BEAT, STATED: use case one runs refuse -> answer -> ADMIT.
    # Use case two runs refuse -> here is the question that would answer it, and
    # stops, because this film adds no committing route. A judge could read that as
    # "the system just says no", which is why the three live defeater prompts are on
