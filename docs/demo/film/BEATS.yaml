    # choice being spent on the thing it was complaining about. The rollback proof —
    # the Product Readiness point — is entirely in the first half and survives at
    # 6 s intact.
    #
    # W2 INHERITS A REAL CONSTRAINT HERE AND IT IS NOT A COMFORTABLE ONE. `b8`'s
    # delivered line is 19 words today and its picture's last 4 s were silent but
    # its WORDS spanned the whole 10 s, so cutting the picture costs spoken words
    # too. `VO-DEMO.md` §5's "Cut 1" already found that 15 words in 6 s reads at
    # 2.50 w/s and refused it — correctly, when the cut was optional. The cut is no
    # longer optional, so the line must actually shrink to 11. `persisted false` is
