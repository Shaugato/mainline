#
# Repository-wide lint and format baseline, with a DELIBERATE GRADIENT that mirrors
# mypy.ini's. A package MAY tighten this in its own `pyproject.toml`
# (`packages/mainline-boundary` does); nothing may loosen it.
#
# STRICTEST — `packages/trappoint-*`, the Apache substrate. Docstrings and annotations
# are required here because this is the artefact a stranger forks, and the only thing
# between a fork and a wrong refusal is that the code says what it means.
#
# STRONG — everywhere else. The rules that stay everywhere are the ones that are
# load-bearing for a claim made elsewhere in the repository, not the ones that are
# merely tidy:
#
#   * `BLE` / `E722` — a bare or blanket `except` is how a refusal becomes a silence.
#     In a product whose deliverable is a refusal, swallowing an exception is the defect
#     class, not a style nit.
#   * `T20` — `print()` outside a CLI entry point is diagnostic output that no log,
#     ledger or step summary will ever contain.
#   * `S` (bandit) — `subprocess` and `assert` reach the provisioning and conformance
#     paths, where both have consequences.
#   * `DTZ` — a naive datetime in an evidentiary payload is an unanswerable question in
#     cross-examination.
#   * `TRY300` / `RET` — control flow that hides which branch produced a refusal.
#
# ENFORCEMENT. The three paragraphs above used to be prose only: the `select` list was
# flat, so a docstring on a test helper and a blanket `except` in the substrate were the
# same colour of red, and 896 findings meant nothing anyone could act on. The gradient is
# now mechanical, in two halves:
#
#   1. `[lint.per-file-ignores]` below RELAXES the cosmetic families where they buy
#      nothing — the docstring family under `verticals/**` and `**/tests/**`, plus
#      `PLR2004` and `PT018`. Each entry carries its one-line reason.
#   2. `qa/ruff-ratchet.json` + `scripts/qa/ruff_ratchet.py` FREEZE everything that is
#      left, per rule per tree, at today's honest count. A count may fall; it may not
#      rise. Rules recorded at 0 are hard gates. The load-bearing families are recorded
#      at 0 for `packages/trappoint-*` and are hard-gated there.
#
# NOTHING IN THIS FILE MAY RELAX A LOAD-BEARING FAMILY (`BLE`, `E722`, `T20`, `S`,
# `DTZ`, `TRY300`, `RET`) FOR `packages/trappoint-*/src/**`. The two carve-outs below
# that touch those families are scoped to `**/tests/**` (assert IS the test) and to
# `cli.py` / `__main__.py` / `report.py` (stdout IS the interface). Widening either to
# cover substrate library code turns the ratchet's 0 into a lie; the ratchet will catch
# the resulting findings, but the review should catch the config change first.

line-length = 100
target-version = "py313"
extend-exclude = [
    ".venv",
    "node_modules",
    "**/node_modules",
    "research",
    "evidence",
]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "ISC",    # implicit str concat
    "PIE",
    "PT",     # flake8-pytest-style
    "RET",
    "SIM",
    "ARG",
    "PTH",
    "TRY",
    "RUF",
    "S",      # flake8-bandit
    "BLE",    # blind except
    "T20",    # print
    "ANN",    # annotations
    "D",      # pydocstyle
    "PLC",    # pylint conventions
    "PLE",    # pylint errors
    "PLW",    # pylint warnings
    "PLR",    # pylint refactor
]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "ANN401", # `Any` is occasionally the honest annotation at a driver boundary
    "TRY003", # long messages inside raise: our refusal messages ARE the product
    "PLR0913",# argument count: DDL and wire shapes have many fields
    "PLR0917",# positional-argument count, same reason
    "ISC001", # conflicts with the formatter
    # `N818` requires every exception to end in "Error". Refused deliberately. The
    # refusal vocabulary is a product surface that appears in operator-facing messages
    # and in the ADRs, and `DirtyMigration`, `LockUnavailable`, `ModelRefusal` and
    # `UnmodelledRefusal` are the words this system uses for those conditions.
    # `LockUnavailableError` is worse prose and buys nothing a reader did not have.
    "N818",
    # `PLC0415` bans imports inside functions. We use them on purpose and in exactly two
    # shapes: to keep an optional heavy dependency (a cloud SDK, a driver's binary
    # wheel) off the import path of a command that must work without it, and to break a
    # genuine module cycle. Both are documented at each site.
    "PLC0415",
]

[lint.per-file-ignores]
# CLI entry points are exactly where stdout is the interface. Scoped to three basenames
# on purpose: this is the ONLY place `T20` is relaxed for substrate library code, and
# widening it is how diagnostic output stops reaching a ledger.
"**/cli.py" = ["T20"]
"**/__main__.py" = ["T20"]
"**/report.py" = ["T20"]
# `scripts/**` is operator tooling: stdout is the report, `subprocess` is the job, and a
# docstring on a 12-line provisioning helper is not what stands between a fork and a
# wrong refusal.
"scripts/**" = ["T20", "S603", "S607", "D", "ANN", "PLR2004", "PT018"]

# Tests assert, parametrise, seed generators deterministically, and read fixtures off
# disk. `S311` is allowed because a *seeded* PRNG is the point — a test of jittered
# backoff that used a cryptographic generator could not be reproduced.
#
# `D` — a test's name is its docstring; requiring both duplicates the sentence.
# `PLR2004` — a test that compares against a named constant is testing the constant,
#   not the behaviour. The literal `409` in an assertion IS the specification.
# `PT018` — `assert a and b` in a test whose failure is read off a captured SQLSTATE is
#   one fact, not two; splitting it makes the report longer and no clearer.
"**/tests/**" = [
    "S101", "S105", "S311", "S603", "S607",
    "D", "ANN", "PLR2004", "PLR0915", "PT018", "T20", "SLF001",
]
"tests/**" = [
    "S101", "S105", "S311", "S603", "S607",
    "D", "ANN", "PLR2004", "PLR0915", "PT018", "T20", "SLF001",
]

# THE GRADIENT. Docstring and annotation completeness is required of the Apache
# substrate and not of the FSL vertical, for the same reason mypy is strict on one and
# not the other: `packages/trappoint-*` is what a second vertical, a fork, or an
# opposing expert reads without us in the room.
#
# `D1` (the whole D100–D107 "missing docstring" family, previously enumerated one code
#   at a time and silently missing `D106`) — the vertical is read with us in the room.
#   Note this relaxes only the MISSING-docstring family: `D2xx`/`D3xx`/`D4xx` still
#   apply here, so a docstring that exists must still be well formed.
# `ANN` — same gradient, same reason.
# `PLR2004` — the vertical's magic values are DDL widths, SQLSTATEs and band numbers
#   that are already named in `migrations.allocation.toml`; a second name is drift.
# `PT018` — see `**/tests/**`.
"verticals/**" = ["D1", "ANN", "PLR2004", "PT018"]
"packages/mainline-boundary/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[lint.isort]
known-first-party = [
    "trappoint_conformance",
    "trappoint_core",
    "trappoint_diagnose",
    "trappoint_jcs",
    "trappoint_migrate",
    "trappoint_recall",
    "trappoint_sql",
    "trappoint_verify",
    "mainline_boundary",
]

[lint.pydocstyle]
convention = "pep257"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

# THE SHIPPED CANONICALISERS ARE NOT FORMATTABLE FILES. They are frozen bytes whose
# SHA-256 is pinned in `spec/custody/canon-registry.yaml` with `retained: forever`, and
# that pin is what `canon_src_sha256` writes into every checkpoint. A stranger with the
# registry and the published hash must be able to reproduce the module byte for byte;
# a formatter that "improves" it invalidates every signature ever written under it.
# `canon_v1.py` says so itself, in its own module docstring:
#
#     "Removing or modifying a shipped ``canon_v*`` is a breaking change to *evidence*,
#      not to code, and CI refuses it."
#
# THE INCIDENT. Commit `998c526 "style(ruff): the tree is formatted"` — a machine sweep,
# nothing typed by hand — added FOUR BLANK LINES to each file and nothing else
# (`4 ++++` and `4 ++++`, the hunks all of the shape
# `@@ -121,6 +121,7 @@ … + <blank>` before a top-level `def`, PEP8's two-blank-lines
# rule). Semantically empty; evidentially fatal. It moved both files off the pin
# 260ed37ddc610f1fb94ddce98998fe4ae5ce883698ad5c7033839cd258dcd659 and took check 10
# (`canon-source-mismatch`) of the custody chain, three pytest assertions and the
# reference bundle down with it. The revert is worthless on its own: the next
# `ruff format .` would silently redo it. This exclude is the durable half.
#
# This is a FORMAT exclude only. `ruff check` still lints both files in full — the
# substrate's strictest tree does not get a blind spot, and the blank-line rules that
# would fight this (E301–E306) are preview-gated and not enabled here. Both entries are
# load-bearing; the second is the byte-identical vendored twin that
# `scripts/custody/check_vendored_canon.py` asserts equal to the first. Do not remove an
# entry to make a sweep quiet, and do NOT re-pin the registry to whatever the formatter
# produced — that admits a canonicaliser the registry has never accepted.
exclude = [
    "packages/trappoint-jcs/src/trappoint_jcs/canon_v1.py",
    "packages/trappoint-verify/src/trappoint_verify/vendor/canon_v1.py",
]
