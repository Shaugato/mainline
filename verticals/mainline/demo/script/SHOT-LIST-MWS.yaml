      VHS terminal, prompt `mainline_demo=>`. `mainline blame STD-ISO-006 --clause 9.2.1`
      walking 2011 → 2013 → 2016 → 2019.
    vo: "So we ask the clause where it came from."
    word_count: 9
    judging_criterion: "Memory design"
    requires_milestone: K3
    fallback: "Replay the recorded tape output from evidence/; the VO is unchanged."
    evidence_artifact: "evidence/demo-run-<ts>/roundtrips.jsonl#m04"

  - t: 28
    dur: 11
