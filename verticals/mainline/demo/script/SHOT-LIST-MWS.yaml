#
# SHOT-LIST-MWS.yaml — the Minimum Winnable Submission.
#
# WRITTEN ON D-7, NOT AT 02:00 ON D-1. That is the entire reason this file exists
# now, while it is cheap and while judgement is good. BUILD_PLAN §5.4 defines the
# MWS as an artefact, not a mood: kernel + blame ancestry + clause identity across
# one reflow + gate refusal with the bypass + one disposition through the clearance
# lattice + the custody ledger + mainline_audit over Managed MCP + the ccloud
# custody patrol + the offline local tier + the video. All of that is below.
#
# WHAT IT DROPS, AND WHY THAT IS THE RIGHT DROP. Beat 4 — the M8 defeater lease
# and the diachronic flip — is the only beat removed. It is the beat with the most
# dependencies (K5 disposition model AND the K6 changefeed) and the only one whose
# absence removes no *claim*: the diachronic thesis is already carried by beat 1's
# ancestry walk and beat 2's refusal. Beat 3 keeps the 23503 on `fk_clearance` and
# a signed disposition, but drops the countersign / WebAuthn sub-beat, which is the
# part that depends on enrolment rather than on schema.
#
# WHAT IT NEVER DROPS. The bypass (m09–m11) and the lattice refusal (m12). If the
# cut cannot carry those, there is no submission worth uploading.
#
# It runs 2:38 — twenty seconds under the submission cut and twenty-two under the
# disqualifier, because a fallback with no slack is not a fallback.
#
# Every string below resolves from the same two sources as the submission cut, so
# switching lists changes the schedule and nothing else.

version: 1
name: MAINLINE — Minimum Winnable Submission (fallback cut)
supersedes_when: "the D-7 preflight is not green, or the scope-cut ladder reaches step 4"
authority:
  - "BUILD_PLAN.md §5.4 (the Minimum Winnable Submission), §5.5 (silent disqualifiers)"
  - "docs/leads/corpus-demo.md §6 (capture day slips → a submittable cut exists from D-5)"
parent_list: verticals/mainline/demo/script/SHOT-LIST.yaml

budget:
  total_s: 158                 # 2:38
  hard_ceiling_s: 180
  ci_hard_fail_s: 176
  headroom_s: 22
  ci_margin_s: 18
  vo_word_budget: 360
  export: { width: 1920, height: 1080, fps: 30, loudness_lufs: -16, true_peak_dbtp: -1 }
  captions: burned_in

string_sources:
  camera: verticals/mainline/demo/script/CAMERA-STRINGS.yaml
  refusal: verticals/mainline/demo/REFUSAL-STRINGS.yaml
watermark: "SYNTHETIC CORPUS · KESTREL RESOURCES IS FICTIONAL"

dropped_from_submission_cut:
  - shot: s04-architecture
    reason: "the thesis survives in the title card; five static elements are the cheapest 5 s available"
  - shot: s16-beat4-register-gains-activity
    reason: "beat 4 requires the K6 changefeed; the MWS assumes it is not wired"
  - shot: s17-beat4-lease-revoked
    reason: "same. The P0001 it films is asserted in the conformance suite either way"
  - shot: s18-beat4-suspend-and-fork
    reason: "same"
  - shot: s22-readiness-strip
    reason: "absorbed into m18-custody-ledger, which shows the ledger instead of describing it"

scope_cut_ladder:
  - step: 1
    cut: m06-beat1-identity-survival
    recovers_s: 7
    cost: "the reflow claim moves to m05's VO and to the repository"
  - step: 2
    cut: m17-beat5-silence
    recovers_s: 6
    cost: "the silence ledger becomes a line in VERIFY.md instead of a shot"
never_cut: [m07-beat2-merge-refused, m08-beat2-constraint, m09-beat2-bypass-admin-update,
            m10-beat2-bypass-append-only, m11-beat2-bypass-drop-constraint,
            m12-beat3-lattice-refusal]

shots:

  - t: 0
    dur: 6
    shot_id: m01-cold-open
    beat: null
    capture_order: 12
    on_screen: >-
      One clause, mono, on warm paper: "The seal-face high-temperature alarm shall
      be set at 135 °C." Cursor selects `135`. Red left-rule fades in.
    vo: "One number in a maintenance procedure. Nobody at this site knows why it's 135."
    word_count: 14
    judging_criterion: Impact
    requires_milestone: K3
    fallback: "Static PNG rendered from the authored fixture."
    evidence_artifact: "evidence/demo-run-<ts>/screens/m01.png"

  - t: 6
    dur: 7
    shot_id: m02-the-change
    beat: null
    capture_order: 13
    on_screen: "Permit branch view. MOC-2026-0413, diff `135 → 150`, badge `control_delta: weaken`."
    vo: "An engineer raised it to 150 — the manufacturer's number. Defensible. Approved."
    word_count: 12
    judging_criterion: Impact
    requires_milestone: K3
    fallback: "The mock fixture server in demo/browser/mock/ renders the same diff."
    evidence_artifact: "evidence/demo-run-<ts>/screens/m02.png"

  - t: 13
    dur: 5
    shot_id: m03-title
    beat: null
    capture_order: 18
    on_screen: "Title card. No motion."
    vo: "MAINLINE: institutional safety memory as a version-controlled repository, on CockroachDB."
    word_count: 10
    judging_criterion: Originality
    requires_milestone: K0
    fallback: "None required — a static export with no dependency."
    evidence_artifact: "verticals/mainline/demo/script/cards/title.svg"

