#
# SHOT-LIST.yaml — the locked shot list. Machine-readable, because it is not a
# document: it is the schedule the preflight warden and the video CI gate enforce.
#
# Run `python verticals/mainline/demo/script/validate_shotlist.py` to check it.
# `.github/workflows/claims.yml` runs the same validator, so a shot list that has
# drifted out of budget is a red build rather than a discovery on capture day.
#
# ── THE BUDGET ────────────────────────────────────────────────────────────────
# BUILD_PLAN §5.5 disqualifier 1: a video under three minutes is required, and the
# failure is SILENT. Three numbers, all enforced by the validator:
#
#   total_s          171   = 2:51, the BUILD_PLAN §5.5 target
#   headroom_s         9   = 180 - 171, the margin to the disqualifier
#   ci_margin_s        5   = 176 - 171, the margin to demo.yml's ffprobe hard fail
#
# Editing is additive in practice — a cut lands long, never short — so the plan
# budgets nine seconds of slack rather than filling the envelope and hoping.
#
# ── WHAT EACH ROW PROMISES ────────────────────────────────────────────────────
#   t                  cumulative start, seconds
#   dur                duration, seconds
#   shot_id            stable id; tapes, the Playwright spec and evidence use it
#   on_screen          what a muted viewer sees. Every quoted string is resolved
#                      from CAMERA-STRINGS.yaml or REFUSAL-STRINGS.yaml
#   vo                 the spoken line, verbatim and identical to VO.md
#   word_count         words in `vo`; the sum is the ≤360 budget
#   judging_criterion  what these seconds buy
#   requires_milestone the milestone that must be COMPLETE for the shot to exist
#   fallback           what is filmed instead if it is not. Never "improvise"
#   evidence_artifact  the file that corroborates the shot after the fact
#   capture_order      worst-first, three takes each (BUILD_PLAN §5.3, D-2)
#
# ── THE TWO RULES THAT ARE NOT NEGOTIABLE ─────────────────────────────────────
# 1. Beat 2 (s08–s12) is NEVER CUT FOR TIME. Every row carries never_cut: true.
#    The DROP CONSTRAINT statement stays; if the patrol is not wired it degrades
#    to two refusals, which is a smaller shot, not a smaller beat.
# 2. Beat 4 films P0001, never 23503. The RAISE in fn_check_materialised fires
#    before the epoch-bumping UPDATE, so 23503 CANNOT occur on that path and
#    filming it would be the exact overclaim this project punishes in others.
#    See docs/adr/0030-demo-beat4-m8-defeater-lease.md (findings S3, S4).
#
# ── THE SCOPE-CUT LADDER ──────────────────────────────────────────────────────
# Executed top-down by the warden, pre-committed here so it is not a 02:00
# judgement call. If the ladder reaches step 4, switch to SHOT-LIST-MWS.yaml.

version: 1
name: MAINLINE — ⟦H⟧ submission cut
authority:
  - "BUILD_PLAN.md §5.2 (beat → milestone tagging), §5.3 (schedule), §5.4 (MWS), §5.5 (silent disqualifiers)"
  - "research/06-build/demo-engineering.md §3 (three pixel-final screens), §5 (the script), §6 (the card)"
  - "docs/leads/corpus-demo.md D1, D15, D16"
  - "docs/adr/0002-g1-platform-ground-truth.md (F5 residency; GT-06b index hint)"
  - "docs/adr/0030-demo-beat4-m8-defeater-lease.md"

budget:
  total_s: 171                 # 2:51
  hard_ceiling_s: 180          # BUILD_PLAN §5.5 disqualifier 1
  ci_hard_fail_s: 176          # .github/workflows/demo.yml ffprobe gate
  headroom_s: 9
  ci_margin_s: 5
  vo_word_budget: 360
  export: { width: 1920, height: 1080, fps: 30, loudness_lufs: -16, true_peak_dbtp: -1 }
  captions: burned_in          # judges watch muted; alignment against the KNOWN script

string_sources:
  camera: verticals/mainline/demo/script/CAMERA-STRINGS.yaml
  refusal: verticals/mainline/demo/REFUSAL-STRINGS.yaml
watermark: "SYNTHETIC CORPUS · KESTREL RESOURCES IS FICTIONAL"

scope_cut_ladder:
  - step: 1
    cut: s07-beat1-identity-survival
    recovers_s: 7
    cost: "the reflow claim moves entirely to the VO of s06 and to the repository"
  - step: 2
    cut: s04-architecture
    recovers_s: 5
    cost: "the five-element architecture card; the thesis survives in s03"
  - step: 3
    trim: s01-cold-open
    recovers_s: 3
    cost: "3 s off the hold on the setpoint; the hook still lands"
  - step: 4
    switch_to: verticals/mainline/demo/script/SHOT-LIST-MWS.yaml
    cost: "the Minimum Winnable Submission, 2:38, four beats, written on D-7 not D-1"
never_cut: [s08-beat2-merge-refused, s09-beat2-constraint, s10-beat2-bypass-admin-update,
            s11-beat2-bypass-append-only, s12-beat2-bypass-drop-constraint,
            s13-beat3-lattice-refusal, s17-beat4-lease-revoked]

shots:

