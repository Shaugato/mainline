#
# CAMERA-STRINGS.yaml — the prose strings that appear on camera, written down once.
#
# REFUSAL-STRINGS.yaml holds every string the DATABASE produces. This file holds
# every string the CORPUS produces that a viewer can read on screen or hear in the
# voice-over. Together they are the closed set of quotable text in the film.
#
# THE ONE THAT MATTERS. `commit_message_2013` is asserted byte-equal across four
# files by tests/unit/corpus (assertion CA "camera-string equality"):
#
#   1. verticals/mainline/fixtures/corpus/authored/…   (owner: corpus-spine-authored)
#   2. verticals/mainline/demo/script/VO.md            (owner: this worker)
#   3. verticals/mainline/demo/script/SHOT-LIST.yaml   (owner: this worker)
#   4. the generated verticals/mainline/demo/honesty/card.html (gen_card.py)
#
# It contains U+2192 RIGHTWARDS ARROW and U+2014 EM DASH. Both are load-bearing:
# a hyphen-minus or an ASCII "->" is a different string and the test is byte-equal,
# not fuzzy. Do not "fix" the punctuation.
#
# CROSS-CHECK. `authored_fixture_root` below is owned by corpus-spine-authored.
# While that directory is absent the check WARNS and says so; the moment it lands
# the check FAILS on any divergence. Same discipline as the spec/errors.md
# cross-check in REFUSAL-STRINGS.yaml: absence is never reported as a pass.
#
# NO COMMIT SHA APPEARS HERE, and none may. `commit_id` is sha256 over the JCS
# envelope; it cannot be chosen, so a SHA written into a script is a SHA the film
# will not be able to show. scripts/demo/claim_hygiene.py fails on any 7-hex
# literal in this file.

version: 1
authored_fixture_root: verticals/mainline/fixtures/corpus/authored/
authored_fixture_present: false      # flip to true when corpus-spine-authored lands
answer_key: verticals/mainline/fixtures/corpus/answer-key/spine.json
watermark_source: verticals/mainline/demo/operator/clearance-checks.yaml

