# ── Strings that must NEVER appear ───────────────────────────────────────────
# Kept here so the ban travels with the strings it is about.
forbidden_on_camera:
  - value: "any 7-hex-character commit SHA"
    reason: "commit_id is sha256 over the JCS envelope; it cannot be chosen in advance"
  - value: "any bare invariant number (I01, MI07, …)"
    reason: "BUILD_PLAN §5.2 — the film cites constraint names, which are unambiguous"
  - value: "a real person's name, a real incident, a real operator"
    reason: "the corpus is synthetic and the honesty card says so; a real fatality never appears"
  - value: "browser chrome, an OS taskbar, a cloud console"
    reason: "BUILD_PLAN §5.5 disqualifier 4 — the cloud console is trademark-dense"
  - value: "music of any kind"
    reason: "no music at all removes the whole licensing question"
  - value: "end-to-end Australian data residency"
    reason: >-
      ADR 0002 F5 — the cluster is aws-ap-southeast-1 (Singapore); only Bedrock
      inference is in ap-southeast-2 (Sydney). The card states the split.

  # ── Added 2026-08-12, each one measured on that day ──────────────────────────
  # These are frames rather than sentences, and each has a counterpart in
  # docs/submission/MUST-NOT-CLAIM.md. The ban lives here too because the failure
  # mode is a camera pointed at the wrong window, not a sentence said out loud.
  - value: "a CloudFront distribution, a CDN, the word 'edge', or a CloudWatch console"
    reason: >-
      No distribution exists — the account is under a verification hold and a real
      apply was refused. The gate-bypass alarms are DECLARED in Terraform and not
      created, so a CloudWatch window on camera would be some other stack's.
  - value: "an invariant or custody count read off a document instead of a run"
    reason: >-
      The MI ratchet measured 21 pending / 9 enforced on 2026-08-12 and the string
      '28 of 30' still survives in superseded planning documents. Run
      scripts/mi_ratchet.py report and film that.
  - value: "a gate-run verdict that is not the one evidence/deploy/acceptance.json holds today"
    reason: >-
      That file read verdict='NOT PROVEN' at 2026-08-12T16:17:12Z. Beat 4 of a
      gate-run skips silently when the exposure receipt has expired, so a remembered
      PROVEN is the easiest false frame in the film.
  - value: "the honesty card while it is built from fixtures"
    reason: >-
      card.html prints a full-width NOT FOR CAMERA banner, driven by a marker inside
      the data, whenever corpus.lock.json is absent. It was absent on 2026-08-12.
  - value: "a demo or video URL that reads UNRESOLVED in docs/submission/SUBMISSION.json"
    reason: >-
      Both fields read UNRESOLVED on 2026-08-12. s25 is filmed last for this reason.
