#
# ══════════════════════════════════════════════════════════════════════════════════════════════
#  GRANTS.yaml — the MAINLINE role matrix, declarative and idempotently re-asserted (DM-7)
#  owner:  dm-foundation  ·  source: ARCHITECTURE.md §11.2, §11.3, §4  ·  consumers listed below
# ══════════════════════════════════════════════════════════════════════════════════════════════
#
# WHY THIS IS A FILE AND NOT A MIGRATION
#   Role membership and object privileges are CLUSTER state. A RESTORE into a new cluster does not
#   carry them, so a grant applied once in migration 0006 exists in dev and does not exist in the
#   cluster the restore drill produces — and the restore drill is a K6 deliverable. Cluster state
#   must be re-asserted and drift-checked, which a forward-only migration is by construction the
#   wrong instrument for. Migration 0009 is the marker that says so at the point in the numbered
#   sequence where a reader looks for GRANT statements and does not find them.
#
# AND WHY THE MATRIX IS NOT THE REAL CONTROL EITHER
#   A GRANT is a claim about intent. A 42501 is evidence about behaviour. The control is
#   tests/integration/schema/test_mi_foundation.py::test_privilege_probe_refuses_ungranted_writes,
#   which walks every (role, table) pair this file does NOT name and asserts the refusal. This file
#   is the input to that probe as much as it is the input to `grants apply`.
#
# THE HARD PLATFORM FACT THAT SHAPES EVERYTHING BELOW
#   CockroachDB has NO COLUMN-LEVEL PRIVILEGES (ARCHITECTURE §4). Privilege separation is by
#   schema, database or cluster, and by nothing else. Every place §11.2 says a role may update
#   "the head pointer only", "retracted_by only" or "state + counters", THE GRANT IS TABLE-WIDE
#   UPDATE and the column restriction is enforced by a trigger in band 0130-0199. Those rows are
#   marked `column_scope_enforced_by: trigger` below. Reading this file as though the column note
#   were a privilege would be reading a control that does not exist — which is exactly the failure
#   mode DM-7 says the probe, not the matrix, has to catch.
#
# THE TWO LOGIN ROLES, AND WHY THEY ARE IN THIS FILE AS OF 2026-08-15
#   Every role above `mainline_api` is NOLOGIN and is reached by GRANT plus SET ROLE. Two are not.
#   `mainline_api` is the identity the Lambda behind the public demo Function URL connects as, and
#   that Function URL is `authorization_type = NONE` by the founder's explicit choice — so
#   `mainline_api` is, precisely, WHAT AN ANONYMOUS CALLER ON THE INTERNET EXECUTES AS. `mainline_judge`
#   is the read-only credential handed to judges.
#
#   Until today neither was declared in any document. Their whole privilege surface was five Python
#   tuples in `scripts/deploy/cloud_roles.py`, and that copy drifted: THIRTEEN relations the shipping
#   demo-api queries were absent from it, and each one surfaced as an HTTP 500 in front of a reader,
#   one request at a time (`evidence/deploy/LIVE.md`). They were repaired by hand against the live
#   cluster and never in the repository, so re-provisioning a fresh cluster from that script would
#   have reproduced every one of those outages. That is the defect this section closes: not eight
#   grants, but the fact that the most exposed role in the system was declared nowhere at all.
#
#   `cloud_roles.py` no longer carries its own copy. It DERIVES `API_READ`, `API_GATE_READ`,
#   `API_WRITE`, `AUDIT_VIEWS` and `API_MEMBERSHIPS` from the rows below, so the drift is now
#   unrepresentable rather than merely detectable. Two consequences bind anyone editing this file:
#
#     * A row's `why:` is not decoration. `cloud_roles.py::_why` reads `why`, then `note`, then
#       `purpose`, and prints it beside the statement in the operator's terminal. A log line saying
#       "SELECT on mainline.cr_event" still has to say that it exists because a trigger branches on
#       `subject_kind`; that sentence lives here now, and deleting it blinds the deploy log.
#     * A `SELECT` row may carry `demand: gate_chain`. It changes NO grant. It records that the
#       read exists for the merge transaction's trigger cascade rather than for any screen, and it
#       is what sorts the object into `API_GATE_READ` instead of `API_READ`.
#
#   NO PASSWORD, NO SECRET AND NO DSN EVER APPEARS IN THIS FILE. The credential lifecycle belongs to
#   `cloud_roles.py`, which generates a password, prints it once, and writes it nowhere. A matrix is
#   a public document about reach; a credential is not, and the two must never share a file.
#
#   AND THE STANDING WARNING APPLIES DOUBLE HERE. An over-grant on a NOLOGIN agent role is a
#   weakness. An over-grant on `mainline_api` is a weakness reachable by anyone with the URL, so
#   every row below cites the file and line that demands it. A row that cannot cite one does not
#   belong to this login, and "it might be needed later" is not a citation.
#
# ──────────────────────────────────────────────────────────────────────────────────────────────
# CONTRACT FOR `trappoint-migrate grants apply`  (dm-runner implements; this file is the schema)
#
#   apply_order is authoritative and each phase is idempotent:
#     1. roles              CREATE ROLE IF NOT EXISTS <name> WITH [NO]LOGIN
#     2. memberships        GRANT <role> TO <member>          (see §2 — three rows, all for
#                                                              mainline_api, none for the owner)
#     3. schema_privileges  GRANT <privs> ON SCHEMA <s> TO <role>
#     4. table_privileges   GRANT <privs> ON TABLE <s>.<t> TO <role>
#     5. schema_wide        GRANT <privs> ON ALL TABLES IN SCHEMA <s> TO <role>
#     6. default_privileges ALTER DEFAULT PRIVILEGES FOR ROLE <owner> IN SCHEMA <s>
#                             GRANT <privs> ON TABLES TO <role>
#     7. revocations        REVOKE <privs> ON <object> FROM <grantee>
#
#   `since` names the migration at which the object first exists. A row whose object is absent
#   from the connected database is SKIPPED WITH A WARNING, never an error, and the warning names
#   the migration — a fresh cluster migrated only to 0023 must be grantable without the operator
#   being asked to hand-edit the matrix. `grants apply --strict` turns those warnings into errors
#   and is what CI runs against a fully-migrated cluster.
#
#   `denials` are NEVER applied. They are assertions the privilege probe reads.
#
#   Unknown keys are ignored, so this file may carry documentation fields the tool does not model.
# ──────────────────────────────────────────────────────────────────────────────────────────────

version: 1
generated_from:
  - "ARCHITECTURE.md §11.2 — the SQL role matrix"
  - "ARCHITECTURE.md §11.3 — RLS scope roles (site_reader, fleet_hse, signer)"
  - "ARCHITECTURE.md §4 — schema zones; no column-level privileges"
  - "docs/leads/datamodel.md DM-7, DM-16"
owner_role: mainline_owner
schemas: [mainline, mainline_meas, mainline_audit, mainline_qa, mainline_ops]

apply_order:
  - roles
  - memberships
  - schema_privileges
  - table_privileges
  - schema_wide
  - default_privileges
  - revocations

# ══════════════════════════════════════════════════════════════════════════════════════════════
# 1. ROLES
#    `login: false` for every role of §11.2. Every principal reaches those by GRANT plus SET ROLE,
#    never by logging in as one, because CURRENT_USER is the RLS scope token (§11.3) and a role that
#    can be logged in as directly is a role whose scope a credential holder chooses.
#
#    THE TWO EXCEPTIONS ARE AT THE END OF THIS LIST and are exceptions on purpose: a deployed
#    service has to connect as something. They are `login: true`, they hold no DDL, they hold no
#    DELETE, and they are the only two rows in this file that correspond to a credential that
#    exists — which is why the reasoning attached to them is longer than for anything above.
# ══════════════════════════════════════════════════════════════════════════════════════════════

roles:
  - name: mainline_owner
    login: false
    created_by_migration: "0001"
    purpose: >
      Owns all five schemas (taken at CREATE SCHEMA … AUTHORIZATION, migrations 0002-0006).
      NOLOGIN and UNASSUMABLE — it appears in no `memberships` entry and never will. Owning a
      table matters because an owner is exempt from RLS unless the table also carries FORCE ROW
      LEVEL SECURITY, and because an owner may DROP TRIGGER. Both of those powers are therefore
      held by an identity with no credential and no members.

  - name: mainline_migrator
    login: false
    purpose: >
      DDL only (§11.2 final rows). Holds CREATE and USAGE on the five schemas so migrations can be
      applied by a principal that is not admin. Holds NO application privilege — it cannot INSERT a
      row anywhere. The converse property is the one that matters: no application role holds DDL,
      so a compromised agent cannot DROP TRIGGER permit_merge_gate and evaporate the central
      invariant with no schema-change record. CI asserts 42501.

  - name: agent_ingestor
    login: false
    purpose: "Untrusted-document plane. Turns incident PDFs into events, control failures and cues."
  - name: agent_cartographer
    login: false
    purpose: "Clause identity and content; draws blame edges from documents."
  - name: agent_projector
    login: false
    purpose: >
      Writes mainline.clause_blame_closure AND NOTHING ELSE (S2). One table, one privilege. This
      is the narrowest role in the system and the narrowness is the point: the closure is the
      scalar every gate reads, so the set of principals that can extend it is exactly one.
  - name: agent_recaller
    login: false
    purpose: >
      Runs recall and writes what it found AND WHAT IT DECLINED TO SURFACE. It has no INSERT on
      blocking_check — the role that detects a precursor cannot materialise the obligation (S1).
  - name: agent_gate
    login: false
    purpose: >
      The kernel. Writes blocking_check inside the same serializable transaction that issues the
      exposure receipt. This single grant is what makes the flagship claim true.
  - name: svc_disposition
    login: false
    purpose: >
      Records human dispositions. Cannot write blocking_check, so it cannot manufacture the
      obligation it then clears.
  - name: agent_patroller
    login: false
    purpose: "As-documented vs as-operated fixity; drift findings and discordance warrants."
  - name: agent_sequencer
    login: false
    purpose: "Builds the Merkle ledger. Holds the lease it updates and nothing in mainline."
  - name: agent_relay
    login: false
    purpose: >
      INSERT on ledger_intake and NOTHING ELSE — not even SELECT. A relay that cannot read cannot
      be induced to exfiltrate, and it does not need to read to append.
  - name: agent_fleet
    login: false
    purpose: "Cross-site lesson propagation. Only tightenings travel (MI23)."
  - name: agent_assay
    login: false
    purpose: "Measurement only; confined to mainline_meas."
  - name: mainline_auditor
    login: false
    purpose: >
      THE MANAGED-MCP IDENTITY (S13). SELECT on mainline_audit views only; INSERT on exactly one
      table, mainline_meas.external_attestation. The role that certifies the books has no write
      path to them. Never granted anything in mainline_qa, ever.
  - name: auditor_ro
    login: false
    purpose: "Human read-only auditor. Reads mainline and mainline_meas; writes nothing."
  - name: quality_assurance
    login: false
    purpose: >
      SELECT on mainline_qa views only (S14). Nothing else, in any schema — see `denials`. Per-named
      person detail exists only here, and every SELECT writes a ledger entry (entry_kind
      'profile_read'): observing the observer.
  - name: subject_access
    login: false
    purpose: >
      A person reading their own record, RLS-scoped to CURRENT_USER. This role is what makes SEC-3
      condition (4) real: a score you compute about a person, use against them, and refuse to show
      them is the definition of an allegation.
  - name: site_reader
    login: false
    purpose: >
      RLS scope role (§11.3). Policies read `USING (site_role = CURRENT_USER)`, so the ACTUAL
      site-scoped principals are per-site roles named by mainline.site.site_role, each granted
      site_reader for its table privileges. site_reader itself is the privilege carrier; the
      per-site role is the scope token.
  - name: fleet_hse
    login: false
    purpose: "Cross-site HSE reader; RLS policy fleet_scope grants it USING (true)."
  - name: signer
    login: false
    purpose: >
      A human who signs dispositions. Its restrictive policies are the interesting ones:
      `peer_blind` on disposition and `standing_blind` on mainline_meas.standing. Access control
      doing epistemics — it stops "I'll sign what Dave signed", and it is what M10's
      peer-prediction channel structurally requires.

  # ── THE TWO LOGINS. Read the header block before editing either. ───────────────────────────
  #
  # ORDERING HAZARD, recorded because declaring these roles here is what creates it.
  # `grants apply` phase 1 now issues `CREATE ROLE IF NOT EXISTS mainline_api LOGIN` — with NO
  # PASSWORD, because this file never carries one. cloud_roles.py sets a password only when it
  # CREATES the login or when `--rotate` says so, precisely so that re-running it cannot invalidate
  # the credential the Lambda is already using and take the demo down. Those two rules compose
  # badly in one order and only one: on a FRESH SECURE cluster, `grants apply` before
  # cloud_roles.py leaves a login that exists, so cloud_roles.py reports "already exists, password
  # left alone" and mints nothing — a LOGIN role no one holds a credential for. It is not a
  # vulnerability (a passwordless login cannot authenticate to a secure cluster) but it is a
  # deployment that looks finished and is not. It is not live today: deploy.sh runs cloud_chain.py
  # then seed_demo.py and invokes cloud_roles.py out of band, and `grants apply` is not pointed at
  # the demo cluster at all. Anyone wiring `grants apply` into the deploy must run cloud_roles.py
  # FIRST, or pass `--rotate` and re-publish the secret. The fix is an order, not an edit here.
  - name: mainline_api
    login: true
    created_by: "scripts/deploy/cloud_roles.py (CREATE USER … WITH LOGIN PASSWORD, generated there)"
    purpose: >
      THE IDENTITY THE PUBLIC DEMO EXECUTES AS. The Lambda behind the demo Function URL connects
      as this role, and that Function URL is `authorization_type = NONE` by the founder's explicit
      choice, so this row describes what an anonymous caller on the internet can reach. It holds
      what the demo's three beats require and no more: SELECT on the corpus the read resources
      show, SELECT on the relations the merge transaction's trigger cascade touches, the handful
      of writes those beats actually issue, EXECUTE on the merge procedure, and membership in the
      three roles whose row-level-security policies make those statements see anything at all.
      It holds no DDL, no DELETE, and nothing whatever in mainline_qa.
    why_it_is_narrow: >
      For comparison, the admin role on the deployed cluster holds ALL on 417 objects. The endpoint
      runs as this role and not that one, and the difference between those two sentences is the
      entire security argument for exposing a database-backed demo without authentication.

  - name: mainline_judge
    login: true
    created_by: "scripts/deploy/cloud_roles.py (CREATE USER … WITH LOGIN PASSWORD, generated there)"
    purpose: >
      Read-only, for the judges. SELECT on the fourteen mainline_audit views and on NOTHING else in
      the cluster. It additionally holds USAGE — and only USAGE — on the three schemas those views
      traverse, which is a right to NAME a schema and not a right to read anything in it; see the
      measured note on its schema_privileges rows, because that behaviour is not what the
      documentation led us to expect and the evidence is worth more than the assurance.
      Explicitly NOT mainline_qa, ever (S14): without USAGE that schema is not even nameable, which
      is a stronger position than a revoked SELECT.

# ══════════════════════════════════════════════════════════════════════════════════════════════
# 2. MEMBERSHIPS — three rows, and NOT ONE OF THEM NAMES mainline_owner.
#    Nobody is a member of mainline_owner. That is what "unassumable" means, and it is asserted by
#    test_mi_foundation.py::test_mainline_owner_is_unassumable rather than merely intended here.
#    Human principals are still granted their roles by the provisioning service account, which is
#    the only alterable authority in the grant graph (§11.3); those grants are per deployment and
#    live in infra/, not in this file.
#
#    WHY ROLE MEMBERSHIP AND NOT ONLY GRANTS — the paragraph that cost a deploy to learn.
#    Four tables carry FORCE ROW LEVEL SECURITY (RLS-MATRIX.yaml: mainline.permit,
#    mainline.change_request, mainline.disposition, mainline_meas.standing), and under FORCE
#    *"if RLS is enabled but no policies apply to a given combination of user and SQL statement,
#    access is denied by default."* A bare `GRANT SELECT ON mainline.permit` therefore buys ZERO
#    ROWS, SILENTLY — which is the worst failure an audit surface can have, because it is
#    indistinguishable from a clean site. The policies are written `TO <role>`, and a policy matches
#    any MEMBER of that role. So mainline_api is made a member of exactly three.
#
#    MEASURED on a freshly migrated database: `information_schema.table_privileges` for agent_gate,
#    svc_disposition and auditor_ro returns NO ROWS. These three carry POLICY SCOPE and no table
#    privilege, so relying on inheritance for the privileges would have produced a login that can
#    see nothing and a demo that fails in front of a judge. The memberships below are for RLS SCOPE;
#    every privilege mainline_api holds is granted to it DIRECTLY in §3 and §4.
#
#    NOTE FOR THE ORCHESTRATOR, recorded rather than worked around: this section was `[]` until
#    2026-08-15, and `tests/integration/schema/test_mi_foundation.py:716` asserts
#    `matrix["memberships"] == []` with the reason "mainline_owner must remain unassumable". That
#    assertion is broader than its own stated reason and these rows make it fail. The narrowed
#    assertion that preserves the claim exactly is:
#        assert not [m for m in matrix["memberships"] if m["role"] == "mainline_owner"]
#    W2 does not own that file and has not edited it. Reported, not hidden, and not routed around
#    by hiding these rows in a section `grants apply` would ignore — cloud_roles.py::DERIVED_SECTIONS
#    reads `memberships` and refuses any section absent from apply_order, so a documentation-only
#    home for them would put the deploy script and `grants apply` out of step on one file.
# ══════════════════════════════════════════════════════════════════════════════════════════════

memberships:
  - role: auditor_ro
    member: mainline_api
    why: >
      RLS SCOPE, NOT PRIVILEGE. Carries the `fleet_scope` policies on mainline.permit and
      mainline.change_request and `disposition_service_read` on mainline.disposition. Without it the
      permit the whole demo is about returns zero rows under FORCE ROW LEVEL SECURITY, and returns
      them silently.
  - role: agent_gate
    member: mainline_api
    why: >
      RLS SCOPE, NOT PRIVILEGE. Carries `service_read`, `gate_insert` and `gate_write` — the merge
      transaction. This is the membership the demo's headline beat runs inside.
  - role: svc_disposition
    member: mainline_api
    why: >
      RLS SCOPE, NOT PRIVILEGE. Carries `gate_write` (the counter decrement) and
      `disposition_insert`. Those three roles are the principals the demo impersonates, one per beat.

# ══════════════════════════════════════════════════════════════════════════════════════════════
# 3. SCHEMA PRIVILEGES
#    USAGE is a prerequisite for every table privilege below. CREATE is held by mainline_migrator
#    and nobody else.
# ══════════════════════════════════════════════════════════════════════════════════════════════

schema_privileges:
  - role: mainline_migrator
    schemas: [mainline, mainline_meas, mainline_audit, mainline_qa, mainline_ops]
    privileges: [USAGE, CREATE]
    since: "0006"
    why: "DDL only. The one role that holds CREATE, and it holds no data privilege anywhere."

  - role: agent_ingestor
    schemas: [mainline]
    privileges: [USAGE]
    since: "0002"
  - role: agent_cartographer
    schemas: [mainline]
    privileges: [USAGE]
    since: "0002"
  - role: agent_projector
    schemas: [mainline]
    privileges: [USAGE]
    since: "0002"
  - role: agent_recaller
    schemas: [mainline, mainline_meas]
    privileges: [USAGE]
    since: "0003"
  - role: agent_gate
    schemas: [mainline, mainline_ops]
    privileges: [USAGE]
    since: "0006"
    why: >
      mainline_ops because the outbox trigger fires as the INVOKING role. See the note under
      table_privileges for mainline_ops.outbox — this is a real coupling, not a convenience.
  - role: svc_disposition
    schemas: [mainline, mainline_ops]
    privileges: [USAGE]
    since: "0006"
  - role: agent_patroller
    schemas: [mainline]
    privileges: [USAGE]
    since: "0002"
  - role: agent_sequencer
    schemas: [mainline, mainline_ops]
    privileges: [USAGE]
    since: "0006"
  - role: agent_relay
    schemas: [mainline]
    privileges: [USAGE]
    since: "0002"
  - role: agent_fleet
    schemas: [mainline, mainline_ops]
    privileges: [USAGE]
    since: "0006"
  - role: agent_assay
    schemas: [mainline_meas]
    privileges: [USAGE]
    since: "0003"
  - role: mainline_auditor
    schemas: [mainline_audit, mainline_meas]
    privileges: [USAGE]
    since: "0004"
    why: >
      mainline_meas USAGE exists ONLY to reach external_attestation for INSERT. It carries no
      SELECT — see denials. mainline and mainline_qa are absent from this list on purpose.
  - role: auditor_ro
    schemas: [mainline, mainline_meas]
    privileges: [USAGE]
    since: "0003"
  - role: quality_assurance
    schemas: [mainline_qa]
    privileges: [USAGE]
    since: "0005"
  - role: subject_access
    schemas: [mainline_qa]
    privileges: [USAGE]
    since: "0005"
  - role: site_reader
    schemas: [mainline]
    privileges: [USAGE]
    since: "0002"
  - role: fleet_hse
    schemas: [mainline]
    privileges: [USAGE]
    since: "0002"
  - role: signer
    schemas: [mainline, mainline_meas]
    privileges: [USAGE]
    since: "0003"

  # ── mainline_api ───────────────────────────────────────────────────────────────────────────
  - role: mainline_api
    schemas: [mainline, mainline_meas, mainline_audit, mainline_ops]
    privileges: [USAGE]
    since: "0006"
    why: >
      USAGE is the prerequisite for every table privilege in §4 and buys no row by itself.
      mainline_ops is here for the same open coupling that puts agent_gate there: the outbox
      triggers fire as the INVOKING role, so the login that drives the merge needs to reach
      mainline_ops.outbox. mainline_qa is absent and is additionally REVOKED on every provisioning
      run (S14) — the absence of a grant and a revocation are different claims and this login
      carries both.

  - role: mainline_api
    schemas: [trappoint]
    privileges: [USAGE]
    since: "bootstrap"
    since_note: >
      NOT A MIGRATION. Schema `trappoint` is created by the migration RUNNER's bootstrap
      (packages/trappoint-migrate/src/trappoint_migrate/bootstrap.py:78), before any numbered file
      runs, so no `since:` in the 0001-0271 sequence would be true. A four-digit number here would
      be an invented citation and would produce a misleading warning on a partially-migrated
      cluster; the honest value names the thing that actually creates it.
    why: >
      THE GRANT THAT WAS MISSING WHILE AN EXECUTE GRANT SAT UNUSABLE. `/v1/health` reads
      trappoint.schema_attestation, trappoint.schema_migration and trappoint.deploy_chain
      (health.py:153,157,163) and the refusal path calls trappoint.explain_refusal
      (refusal.py:141, `SELECT trappoint.explain_refusal(%s, %s, %s, %s)`; the function is created
      by migration 0119a). USAGE is the right to NAME the schema: without it the EXECUTE grant on
      explain_refusal is unusable and every read above is 42501. Recorded hand-granted against the
      live cluster on 2026-08-14 in evidence/deploy/LIVE.md and granted by no code in this
      repository until now.
    hazard_measured_2026_08_15: >
      THIS IS THE FIRST ROW IN THIS SECTION WHOSE SCHEMA CAN BE ABSENT, and one consumer does not
      survive that. The file header's contract says a row whose object is absent is SKIPPED WITH A
      WARNING. `trappoint_migrate.grants.apply(allow_missing=True)` honours it (3F000 is in
      _MISSING_OBJECT_SQLSTATES) and `scripts/chain/apply_chain.py --grants` passes that flag, so
      the real tool is correct. The SECOND implementation of the same contract —
      test_mi_foundation.py::apply_grants_matrix — guards `table_privileges` with `_table_exists`
      and `schema_wide` with `_schema_has_tables` but applies `schema_privileges` unguarded, and its
      `foundation` fixture builds a database from band files 0001-0023 only, which never create
      schema trappoint. Measured on CockroachDB v26.2.5: `GRANT USAGE ON SCHEMA trappoint` against
      such a database returns `3F000 unknown schema "trappoint"`. The fix is the guard that section
      already has for the other two — it belongs to that file's owner, not to W2, and it is
      reported rather than dodged by dropping a grant the deployed login genuinely holds.

  # ── mainline_judge ─────────────────────────────────────────────────────────────────────────
  - role: mainline_judge
    schemas: [mainline_audit]
    privileges: [USAGE]
    since: "0004"
    why: "The judge's entire read surface is the fourteen views in this schema. See §4."

  - role: mainline_judge
    schemas: [mainline, mainline_meas, mainline_ops]
    privileges: [USAGE]
    since: "0006"
    why: >
      TRAVERSAL ONLY — USAGE here, and no table privilege in any of the three. MEASURED, AND NOT
      WHAT THE DOCUMENTATION LED US TO EXPECT (CockroachDB CCL v26.2.5, local single node,
      2026-08-10). A view runs its underlying query with its OWNER's table privileges — that is the
      fourth trap RLS-MATRIX.yaml names, and it holds — but the SCHEMA USAGE check is made against
      the INVOKER regardless:
        with USAGE on mainline_audit only:
          SELECT count(*) FROM mainline_audit.v_open_gate_summary
            -> 42501  user mainline_judge does not have USAGE privilege on schema mainline
        with USAGE additionally on mainline, mainline_meas, mainline_ops:
          SELECT count(*) FROM mainline_audit.v_open_gate_summary   -> OK, rows=1
          SELECT count(*) FROM mainline.permit
            -> 42501  user mainline_judge does not have SELECT privilege on relation permit
      So the judge needs USAGE on the schemas its views TRAVERSE and gets no table privilege in any
      of them. USAGE is the right to name a schema; it is not the right to read anything in it, and
      the second probe is the evidence rather than the assurance. mainline_qa is NOT in this list
      and never will be: without USAGE the schema is not even nameable, which is a stronger position
      than a revoked SELECT. `cloud_roles.py::_judge_revocation_schemas` DERIVES the re-revocation
      set from exactly this shape — every schema the judge holds USAGE on and has no table privilege
      in — so splitting this row from the mainline_audit row above is load-bearing, not cosmetic.

