     why: "Re-asserts migration 0008 — the one revoke that changes something on a clean cluster."}

# ══════════════════════════════════════════════════════════════════════════════════════════════
# 8. DENIALS — never applied. Read by the privilege probe, which asserts 42501.
#    A denial is written here when the ABSENCE of a grant is a claim we make out loud, so that
#    deleting the grant row is not enough to weaken the system quietly: the probe would still pass,
#    but the denial makes the intent explicit and CI diffs it.
# ══════════════════════════════════════════════════════════════════════════════════════════════

denials:
  - role: mainline_auditor
    forbidden: [INSERT, UPDATE, DELETE]
    scope: "every table in every schema EXCEPT mainline_meas.external_attestation"
    expect_sqlstate: "42501"
    why: "S13. The MCP write surface is one insert-only table, and that is the whole of it."
  - role: mainline_auditor
    forbidden: [SELECT]
    scope: "every object in schemas mainline, mainline_qa, mainline_ops, and every TABLE in mainline_meas"
    expect_sqlstate: "42501"
    why: >
      The auditor reads mainline_audit views and nothing else. mainline_qa is the one that must
      never be reachable from an MCP identity, ever (S14) — a Managed-MCP account for per-named-person
      distributions is the single worst credential this system could issue.
  - role: quality_assurance
    forbidden: [SELECT, INSERT, UPDATE, DELETE]
    scope: "every object outside schema mainline_qa"
    expect_sqlstate: "42501"
  - role: agent_projector
    forbidden: [INSERT, UPDATE, DELETE]
    scope: "every table except mainline.clause_blame_closure"
    expect_sqlstate: "42501"
    why: "S2. One table."
  - role: agent_recaller
    forbidden: [INSERT]
    scope: "mainline.blocking_check"
    expect_sqlstate: "42501"
    why: "S1, stated as a denial because it is the grant everyone expects to find and must not. The role that detects a precursor cannot oblige anyone."
  - role: svc_disposition
    forbidden: [INSERT]
    scope: "mainline.blocking_check"
    expect_sqlstate: "42501"
    why: "The role that disposes of an obligation cannot manufacture it."
  - role: agent_gate
    forbidden: [INSERT, UPDATE]
    scope: "mainline.disposition"
    expect_sqlstate: "42501"
    why: "The kernel writes obligations; it does not sign them off. Separation runs in both directions."
  - role: agent_relay
    forbidden: [SELECT]
    scope: "every object in every schema"
    expect_sqlstate: "42501"
  - role: mainline_migrator
    forbidden: [INSERT, UPDATE, DELETE]
    scope: "every table in every schema"
    expect_sqlstate: "42501"
    why: "DDL only. A migrator that can write rows is an unlogged application role."
  - roles: [agent_ingestor, agent_cartographer, agent_projector, agent_recaller, agent_gate,
            svc_disposition, agent_patroller, agent_sequencer, agent_relay, agent_fleet,
            agent_assay, mainline_auditor, auditor_ro, quality_assurance, subject_access,
            site_reader, fleet_hse, signer, mainline_api, mainline_judge]
    forbidden: [CREATE]
    scope: "every schema"
    expect_sqlstate: "42501"
    why: >
      THE APPLICATION ROLE HOLDS NO DDL. Without this, a compromised agent could
      `DROP TRIGGER permit_merge_gate` and the central invariant would evaporate with no
      schema-change record. This is the denial that matters most and the one a reviewer should
      check first. mainline_api and mainline_judge are on this list as of 2026-08-15: an anonymous
      caller on a public Function URL executes as the first of them, so "holds no DDL" is the load-
      bearing sentence about it. test_mi_foundation.py::test_no_application_role_holds_ddl already
      probes every role this file declares, so both are asserted by construction.
  - roles: [agent_ingestor, agent_cartographer, agent_projector, agent_recaller, agent_gate,
            svc_disposition, agent_patroller, agent_sequencer, agent_relay, agent_fleet,
            agent_assay, mainline_auditor, auditor_ro, quality_assurance, subject_access,
            site_reader, fleet_hse, signer, mainline_migrator, mainline_api, mainline_judge]
    forbidden: [DELETE]
    scope: "every table in every schema"
    expect_sqlstate: "42501"
    why: >
      MI01, layer one of three. No role in this matrix holds DELETE on anything — including the two
      logins, which is why a demo login that could delete would be the only principal in the system
      that can. Permitted deletion is a reviewed two-person job performed by a break-glass identity
      that writes a destruction_record; it is not a privilege any standing role carries.

  # ── the two logins ──────────────────────────────────────────────────────────────────────────
  - roles: [mainline_api, mainline_judge]
    forbidden: [SELECT, INSERT, UPDATE, DELETE, USAGE]
    scope: "every object in schema mainline_qa, and the schema itself"
    expect_sqlstate: "42501"
    why: >
      S14, AND THE ONE DENIAL IN THIS FILE THAT IS ALSO ENFORCED BY REVOCATION. Per-named-person
      detail exists only in mainline_qa. Neither login is granted anything there, ever, and
      cloud_roles.py additionally issues `REVOKE ALL ON SCHEMA mainline_qa` and `REVOKE ALL ON ALL
      TABLES IN SCHEMA mainline_qa` for both on EVERY provisioning run — §7's reasoning exactly: a
      migration runs once, drift happens continuously. The judge pack's envelope names mainline_qa
      as never-issued and `cloud_roles.py --verify` asserts 42501 on it for both logins rather than
      trusting that the absence of a grant is the absence of reach. Without USAGE the schema is not
      even nameable, which is a stronger position than a revoked SELECT.
  - role: mainline_judge
    forbidden: [SELECT]
    scope: "every table in schemas mainline, mainline_meas and mainline_ops"
    expect_sqlstate: "42501"
    why: >
      The judge holds USAGE on those three schemas and no table privilege in any of them. USAGE is
      the right to NAME a schema so its mainline_audit views can traverse it; it is not the right to
      read anything in it. MEASURED, not assumed — `SELECT count(*) FROM mainline.permit` as
      mainline_judge returns 42501 while `SELECT count(*) FROM mainline_audit.v_open_gate_summary`
      returns rows, on the same connection. cloud_roles.py re-asserts this as a REVOKE on every run
      and derives the schema set from this matrix rather than restating it.
  - role: mainline_judge
    forbidden: [INSERT, UPDATE, DELETE]
    scope: "every object in every schema, including mainline_audit"
    expect_sqlstate: "42501"
    why: >
      Read-only means read-only. The judge login has no write path anywhere in the cluster — not
      even to the fourteen views it can read, which are views and not tables.
  # NOTE ON WHAT IS *NOT* DENIED TO mainline_api, AND WHY THE OBVIOUS DENIALS ARE ABSENT.
  # Two further denials were drafted for this login and REMOVED BEFORE COMMIT because measurement
  # showed both were false: "no INSERT on mainline.blocking_check" (S1) and "no SELECT on
  # mainline.ledger_intake" (agent_relay's shape). mainline_api is a MEMBER of agent_gate,
  # svc_disposition and auditor_ro, and in a PostgreSQL-family grant graph a member INHERITS the
  # privileges of the role it is a member of — not only its RLS policy scope. Writing either denial
  # would have put a claim in this file that the probe would immediately falsify, which is the one
  # thing a denials block must never contain. See the MEMBERSHIP INHERITANCE block at the foot of
  # this file for the measured consequence and for who owns the decision.

# ══════════════════════════════════════════════════════════════════════════════════════════════
# OPEN COUPLING, RECORDED RATHER THAN HIDDEN — mainline_ops.outbox and trigger execution identity
#
#   A PostgreSQL-family trigger executes with the privileges of the INVOKING role unless its
#   function is declared SECURITY DEFINER. Every table that carries an outbox trigger therefore
#   forces its writers to hold INSERT on mainline_ops.outbox, which is why agent_gate,
#   svc_disposition and agent_fleet appear there above. That is four extra grants and one extra
#   schema USAGE per writer, and it widens each role slightly.
#
#   AS OF 2026-08-15 IT ALSO WIDENS THE PUBLIC ENDPOINT'S LOGIN, which is what makes this note
#   stop being a tidy piece of bookkeeping. mainline_api is now the fourth row on the outbox: an
#   anonymous caller's identity holds INSERT in an infrastructure schema for no reason of its own,
#   purely because a trigger function was never declared SECURITY DEFINER. That is the strongest
#   argument yet for taking the alternative below.
#
#   The alternative is to declare the outbox trigger functions SECURITY DEFINER owned by
#   mainline_owner, at which point no application role needs any privilege in mainline_ops at all.
#   That is almost certainly the better shape, and it is dm-functions-triggers' call to make,
#   because it is a property of the function definitions in band 0130-0199 and not of this matrix.
#   If they take it, delete the FOUR `mainline_ops.outbox` rows (agent_gate, svc_disposition,
#   agent_fleet, mainline_api) and drop mainline_ops from the schema USAGE rows that exist only to
#   reach it, and the probe will start asserting 42501 on them instead. Counted on 2026-08-15:
#   4 outbox rows, and 7 rows carrying `mainline_ops` USAGE — of which mainline_migrator (DDL),
#   agent_sequencer (sequencer_lease) and mainline_judge (view traversal only) are there for other
#   reasons and STAY.
#
#   Recorded here because a grant that exists to work around an unmade decision, with no note
#   saying so, is indistinguishable from a grant somebody needed.
# ══════════════════════════════════════════════════════════════════════════════════════════════
#
# ══════════════════════════════════════════════════════════════════════════════════════════════
# MEMBERSHIP INHERITANCE — MEASURED 2026-08-15, OPEN, AND THE MOST IMPORTANT THING ON THIS PAGE
#
#   §2 grants mainline_api membership in auditor_ro, agent_gate and svc_disposition FOR RLS SCOPE.
#   A membership does not carry only policy scope. In a PostgreSQL-family grant graph a member
#   INHERITS the privileges of the role it is a member of, so on any cluster where this matrix has
#   been applied, mainline_api's EFFECTIVE reach is the union of §4's enumerated rows and:
#
#     SELECT on ALL TABLES IN mainline        (auditor_ro, agent_gate, svc_disposition schema_wide)
#     SELECT on ALL TABLES IN mainline_meas   (auditor_ro schema_wide)
#     INSERT on blocking_check, permit_event, cr_event, merge_record, exposure_receipt,
#            exposure_line, boundary_certificate, ledger_intake, mainline_ops.outbox   (agent_gate)
#     INSERT/UPDATE on permit and change_request                                       (agent_gate)
#     INSERT/UPDATE on disposition, INSERT on disposition_citation and override_ledger
#                                                                              (svc_disposition)
#
#   FOUR CONSEQUENCES, EACH OF WHICH BELONGS TO SOMEBODY:
#
#   1. The careful enumeration in §4 is the login's DIRECT reach, not its effective reach. On the
#      deployed cloud cluster the two are the same, because `trappoint migrate grants apply` has
#      never been run there (lead plan R3) and so auditor_ro/agent_gate/svc_disposition hold no
#      table privileges at all — `information_schema.table_privileges` for those three returns NO
#      ROWS, which is the measurement cloud_roles.py's docstring already records. That is exactly
#      why the thirteen missing grants above showed up as HTTP 500s instead of being masked: the
#      memberships were buying scope and nothing else. Apply the matrix and the two diverge.
#
#   2. THE PROBE MUST ACCOUNT FOR IT. Leg B connects as the role and asserts 42501 where the matrix
#      does not name. A pair the matrix does not name for mainline_api may still SUCCEED through
#      inheritance, and a probe that treats that as a defect will report a false red — while a
#      probe that quietly tolerates it certifies nothing. The negative direction has to be computed
#      against the TRANSITIVE closure of the grant graph, not against §4's rows.
#
#   3. IT DECIDES R4b, AND NOT BY GUESSING. transitions.py:891 issues INSERT INTO
#      mainline.exposure_receipt and transitions.py:969 issues INSERT INTO mainline.exposure_line,
#      while §4 grants this login SELECT on both. Those INSERTs succeed on a matrix-applied cluster
#      through agent_gate's rows above, and would return 42501 on the deployed cluster where the
#      matrix has never been applied. So R4b is not "unreachable path vs missing privilege" — it is
#      a privilege that exists by one route and not the other, which is a third answer neither the
#      census nor the probe would produce alone. NO GRANT IS ADDED FOR IT HERE; recording which
#      route supplies it is the finding, and closing it is the census's and the probe's call.
#
#   4. SEPARATION OF DUTIES IS UNIONED IN THIS ONE LOGIN. S1 says the role that disposes of an
#      obligation may not manufacture it, and the matrix keeps agent_gate and svc_disposition apart
#      to make that true. mainline_api is a member of BOTH, so for the demo login the separation
#      does not hold. That is inherent to one credential driving all three beats — cloud_roles.py
#      says as much, "the three principals the demo impersonates, one per beat" — but it has never
#      been written down as a consequence, and an anonymous Function URL is where it matters most.
#      The narrower shape, if it is wanted, is SECURITY DEFINER policy functions or per-beat logins;
#      both are decisions above this file. RECORDED, NOT QUIETLY ACCEPTED.
# ══════════════════════════════════════════════════════════════════════════════════════════════
#
# ══════════════════════════════════════════════════════════════════════════════════════════════
# WHY THERE IS NO `EXECUTE` ROW IN §4, THOUGH BOTH ROUTINES ARE REAL
#
#   mainline_api must EXECUTE two routines: `mainline.merge_permit` (the demo's first beat is a
#   CALL of it, gate_run.py:169) and `trappoint.explain_refusal` (refusal.py:141). Neither appears
#   as a table_privileges row, deliberately and for two independent reasons:
#
#     * §4 renders `GRANT <privs> ON TABLE <object>`. An EXECUTE row there would emit
#       `GRANT EXECUTE ON TABLE mainline.merge_permit`, which is not the statement anybody wants.
#     * This file's identifier grammar is lower_snake with at most one dot
#       (trappoint_migrate.grants._QUALIFIED), so it can spell `mainline.merge_permit` and it
#       CANNOT spell `mainline.merge_permit(UUID, BYTES, STRING, STRING, JSONB, BYTES, INT2, BYTES)`
#       — and CockroachDB needs the argument list to disambiguate an overload.
#
#   So the signatures live in `cloud_roles.py::ROUTINE_SIGNATURES` and the grants are issued there.
#   That module already refuses, rather than silently dropping, an EXECUTE row this matrix names
#   whose signature it cannot spell — so adding one here without adding the signature there is a
#   loud failure and not a missing grant. What this file DOES carry is the prerequisite that was
#   missing until today: `USAGE ON SCHEMA trappoint` in §3, without which the EXECUTE grant on
#   explain_refusal was present and unusable.
# ══════════════════════════════════════════════════════════════════════════════════════════════
