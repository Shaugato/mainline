# ══════════════════════════════════════════════════════════════════════════════════════════════
#  mi_catalogue.yaml — the MAINLINE invariant catalogue MI01–MI30, and the PL-2 ratchet's data
#  owner:  datamodel / dm-invariant-catalogue  ·  source: ARCHITECTURE.md §16  ·  ruling: DM-8
#  tools:  scripts/mi_ratchet.py  ·  rendering: MI-CATALOGUE.md (generated, committed, current)
# ══════════════════════════════════════════════════════════════════════════════════════════════
#
# WHAT THIS FILE IS
#   The thirty statements MAINLINE makes about itself, each with the mechanism that makes it
#   true, the SQLSTATE it produces when it is violated, the migrations that build it, the tests
#   that witness it, and — the field the whole file exists for — its `status`.
#
#   `status: pending`  no owning test has been observed to pass. CI *requires* at least one
#                      owning test of every pending invariant to be FAILING right now.
#   `status: enforced` every owning test passes on a real cluster, and CI keeps it that way.
#
# WHY A STATUS COLUMN IS A CI GATE AND NOT A PROGRESS TRACKER  (docs/leads/datamodel.md §1.2)
#   MAINLINE's deliverable is a refusal. A test for a refusal that has never been red is
#   indistinguishable from a test of a mechanism that does not exist — it asserts nothing, and
#   it asserts nothing *confidently*, which is worse than no test. So red-before-green is not a
#   habit here; it is a gate driven by this file:
#
#     mi-red    every `pending` invariant must have ≥1 owning test that currently FAILS.
#               A pending invariant whose tests all pass fails the build with
#                 `MI25 is pending but its tests pass — promote it in mi_catalogue.yaml`
#     mi-green  every `enforced` invariant's owning tests must PASS. A skip is not a pass.
#
#   Promotion is therefore a pull request, in blame forever. Demotion (`enforced` → `pending`)
#   requires an `ADR-NNNN` reference in the commit body — `mi_ratchet.py demote-check`. The
#   ratchet is one-way; that is the product's own O-Ring Ratchet turned on its own test suite.
#
# THE FIELDS
#   id                 MI01–MI30. Exactly thirty, in order. A gap is an invariant nobody owns.
#   statement          verbatim from ARCHITECTURE.md §16, column 2.
#   instantiates       the TRAPPOINT invariant (I01–I16) this is an instance of, or `null`.
#                      `null` is not an omission: §16 marks three rows `—`, "and that is the
#                      interesting case" — MI08, MI10 and MI21 are MAINLINE-specific.
#   mechanism          verbatim from §16, column 4. The thing that does the refusing.
#   sqlstate           §16 column 5. One of 23514 / 23503 / 23505 / P0001 — the gate refusals,
#                      attempted exactly once, ever. NEVER 40001: that is the one retryable
#                      code, and a retry is not a refusal. `mi_ratchet check` enforces this.
#   headline           §16 bolds seven rows. They are the claims this integration is new for.
#   owning_migrations  ** A PROJECTION, NOT A DECLARATION. ** Derived from the `-- MI:` header of
#                      every file in verticals/mainline/db/migrations — the same header block
#                      `trappoint migrate lint` enforces, read through the same 4096-character
#                      window. NOT from migrations.lock.json: the lock is a manifest derived from
#                      those headers, and projecting from a manifest that has fallen behind the
#                      tree is exactly the trusted-projection failure P2 exists to prevent (the
#                      lock is kept as a cross-check and its staleness is reported). Do not
#                      hand-edit: `mi_ratchet check` recomputes it and refuses on drift;
#                      `mi_ratchet reconcile --write` rewrites it. A MISSING source refuses
#                      (exit 2) rather than projecting [] — an empty projection would say that
#                      no migration enforces anything, which is a far more dangerous sentence.
#   owning_tests       selectors, resolved against the real collected-test universe. Three forms:
#                        tests/…/f.py::test_name   an exact node id — a promise about a function
#                        tests/…/f.py::test_mi25_* an fnmatch glob   — a promise about naming
#                        tests/…/f.py              every test in the module
#                      A selector matching nothing is reported as UNRESOLVED: legitimate while
#                      the owning worker has not landed, fatal for anything `enforced`. Tests
#                      carrying `@pytest.mark.mi("MIxx")` are discovered automatically and need
#                      no entry here — that marker is the author claiming to prove the thing.
#                      A bare `miNN` token in a test NAME is a MENTION, not a witness, and never
#                      moves a status: `test_undetermined_forces_advisory_because_mi21_would_
#                      refuse_otherwise` is a pure-Python unit test that never touches the
#                      database, and promoting MI21 off it would be a false green.
#   status             pending | enforced.
#   adr                the ADR that authorised a demotion, or null. Set only by a demotion.
#
# WHY SO MANY ENTRIES STILL READ `pending`  (9 enforced / 21 pending as of 2026-08-10)
#   Strata S1–S7 are inert tables; nothing refuses anything until S8 lands the functions and
#   triggers (docs/leads/datamodel.md §1.1). Most MI tests are therefore red from S1 to S8, and
#   DR-4 accepts that explicitly: "this is the intended state, and DM-8 makes it visible rather
#   than silent". A catalogue that shipped green would be a catalogue that lied.
#
# WHAT A PROMOTION HAS TO SHOW  (the standard the 2026-08-10 review applied, and recorded)
#   `mi_ratchet red` refuses when a pending invariant's owning tests all pass, and that refusal
#   names the invariant. It is an instruction to REVIEW, never an instruction to obey: the
#   ratchet can see that the tests are green and cannot see whether they are green BECAUSE the
#   mechanism works. So a promotion in this file must be able to answer three questions, and
#   the entry has to answer them in writing where the next reader will find them:
#
#     1. Does the enforcing object exist?      Measured — `pg_constraint` / `pg_proc` /
#                                              `pg_trigger` on a CockroachDB v26.2.5 node with
#                                              the whole chain applied, cross-checked against
#                                              the migration tree with comments stripped.
#     2. Does a passing test make it ACT?      A test that would still pass with the object
#                                              dropped witnesses nothing. Reading data the
#                                              mechanism consumes is not the mechanism acting.
#     3. What is still unwitnessed?            Named in the entry, not left to be discovered.
#
#   Question 1 is asked of THIS FILE's `mechanism` column, which is the promise `enforced`
#   certifies — not of everything a reader might reasonably want the invariant to imply.
#   MI19's column names one CHECK, that CHECK exists and a test observes it refusing, so
#   MI19 is promotable even though its counter is not yet projected (a P2 gap its own
#   migration writes down, and this entry repeats). MI06's column names `fn_boundary_project`
#   as well as a CHECK, that function is in none of the 271 migrations, so MI06 is not.
#   The difference is not severity; it is what the catalogue undertook to be true.
#
#   On 2026-08-10 the ratchet demanded ten promotions, then two more (MI16, MI18) when the
#   recall band's missing producer was repaired mid-review and their witnesses stopped
#   ERRORing. Seven were made — MI01, MI02, MI11, MI16, MI18, MI19, MI28 — and five were
#   REFUSED after review, each with its reason recorded in its own entry:
#     MI06, MI21   the object §16 names is ABSENT from all 271 migrations. `fn_boundary_
#                  project` and `undetermined_never_blocks` do not exist, so no passing test
#                  can be exercising them. The defect is a misplaced marker, not a stale
#                  status, and promoting would have been a lie.
#     MI10, MI22,  the object IS present and armed — the FKs to `subject_transition`, the
#     MI27         `permit_merge_gate` weld, the `disposition_project` weld — but every
#                  passing witness reads data the mechanism consumes rather than making the
#                  mechanism refuse. Each would still pass with its object dropped.
#   The ratchet will go on demanding those five, and the demand is it working correctly with
#   the evidence it can see. Nothing was suppressed, no threshold was moved, and no
#   assertion was deleted to gain a green.

