# ══════════════════════════════════════════════════════════════════════════════════════════════
#  PROPOSED, NOT ADOPTED
#
#  A migration header may ASK for an invariant. It cannot create one: MI01–MI30 is a numbered,
#  versioned catalogue, §16 is the authority, and amending it is an ADR — not a comment in a
#  file. Recording the ask here is how the ask stays visible without a worker having quietly
#  made an architectural decision on the way past. `mi_ratchet check` refuses if the migration
#  tree proposes something this block does not answer, and `reconcile --write` keeps the
#  migration list current the same way it does for an adopted invariant.
# ══════════════════════════════════════════════════════════════════════════════════════════════

proposed:

  - id: MI31
    statement: the vector-index prefix columns are projections of the parent cue, never inputs
    proposed_by: recall / recall-ddl-triggers, in the `-- proposes:` line of migration 0041
    owning_migrations: ["0041", "0088", "0114", "0114a", "0138", "0138a"]
    disposition: >-
      NOT ADOPTED by this catalogue, and deliberately so. The statement is right and the
      mechanism is already built — 0114/0114a project the prefix columns from the parent
      `event_cue` and 0138/0138a fire them, raising P0001 when the parent is absent — but that
      is MI25's projection principle reaching one hop upstream onto the index partition, which
      is exactly how migration 0041's own `-- MI:` header classifies it (`MI: MI25`). Adopting
      MI31 would renumber a catalogue that ARCHITECTURE.md §16, spec/, the conformance corpus
      and the submission all cite by number, to say a second time something MI25 already says.
      If a distinct statement is wanted, it is an ADR that amends §16 first and this file
      second, in that order. Until then the six migrations are witnessed as MI25.
