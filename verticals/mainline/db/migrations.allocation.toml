# ============================================================================
# MIGRATION NUMBER ALLOCATION — THE AUTHORITY
#
# Document:  docs/leads/migration-reconciliation.md  (sections 3 and 4)
# Date:      2026-08-08
# Ruling:    MR-6 lock 1.
#
# This file is the authority. The tables in sections 3 and 4 of the
# reconciliation ruling are its RENDERING, not its source: where the prose and
# this file disagree, this file is what `trappoint migrate lint` enforces and
# this file is therefore what is true.
#
# It exists because the pre-dispatch collision check compared strings. One side
# declared ownership as a glob-ish band ("0050-0065"), the other as literal
# paths ("0006a_role_migrator.sql"), the comparison found nothing in common and
# reported zero collisions. It was wrong by twenty numbers. The replacement does
# not compare declarations with each other; it compares every file on disk
# against ONE declaration, which is this one.
#
# ---------------------------------------------------------------------------
# HOW A NUMBER RESOLVES TO A BAND
#
# A migration filename is `NNNN[a-z]_lower_snake_slug.sql` (MR-5). Its
# ALLOCATION KEY is the pair (NNNN as an integer, the optional letter, or the
# empty string when there is none). Keys are ordered pairwise, and the empty
# string sorts before "a":
#
#     (6, "") < (6, "a") < (6, "i") < (6, "x") < (7, "")
#
# `first` and `last` are inclusive keys written in the same shape as a filename
# prefix: four digits, optionally one lowercase letter. A `last` WITHOUT a
# letter closes at the bare number and hands that number's letter space to the
# next band — that is how `0047`-`0049` (datamodel) and `0049a`-`0049z`
# (algorithms) sit next to each other without either one guessing. A `last`
# WITH a letter closes at that letter; `z` therefore means "this band owns the
# whole of its final number, suffixes included", which is what MR-5's band
# overflow needs: a worker that runs out of numbers suffixes its own last
# number, it never borrows a neighbour's.
#
# The bands below are exhaustive and disjoint over the key space from (1, "")
# to (9999, "z"). Every key has exactly one owner. There is no unowned number,
# because an unowned number is precisely what produced two conventions.
#
# ---------------------------------------------------------------------------
# MODE IS BINDING (MR-1)
#
#   mode = "rendered"     The file is emitted by a template in
#                         packages/trappoint-sql/templates/ and carries the
#                         banner `-- @rendered-by  trappoint render`. It is
#                         NEVER hand-edited: a change to it is a change to its
#                         template followed by a re-render of BOTH bindings.
#                         Deleting it does not resolve anything — the next
#                         `trappoint render` recreates it.
#
#   mode = "authored"     The file is written directly in the vertical and
#                         carries no banner. It is never emitted.
#
#   mode = "unallocated"  Legal on exactly one band, the terminal one, whose
#                         owner is the literal string "UNALLOCATED". No file may
#                         use these numbers in either mode. See MRR-7: a range
#                         that lint refuses is safer than a range someone can
#                         assume into.
#
# The seam is drawn by OBJECT, not by worker and not by band, and the object
# test is: would a second TRAPPOINT vertical need this object to pass
# `trappoint-conform`? If yes it is SUBSTRATE and it is a template. If no it is
# VERTICAL and it is authored. The bands below are the consequence of applying
# that test to MR-2's object list; they are not the test itself.
#
# ---------------------------------------------------------------------------
# CHANGING THIS FILE
#
# Adding a band is not an edit to this file alone. A new band must be carved
# out of an existing one, both sides restated, and the result must remain
# exhaustive and disjoint — `packages/trappoint-migrate/tests/test_allocation.py`
# asserts exactly that and will refuse a range that overlaps or a gap that
# opens. A worker who needs a number that is not theirs asks the band's owner;
# a worker who has run out of numbers suffixes their own last number.
# ============================================================================

# ============================================================================
# PROSE EXTENSION — 2026-08-10, the producer-completion wave
#
# Document:  docs/leads/producers-plan.md  (decision D3)
#
# WHAT CHANGED, AND WHAT DELIBERATELY DID NOT
#
# Four `contents` strings below were restated so that they name the ten files
# the wave adds. That is the whole of the change. No `first`, no `last`, no
# `owner`, no `mode` moved, and no band was carved. The bands were already
# exhaustive and disjoint over (1, "") to (9999, "z") and they still are —
# `packages/trappoint-migrate/tests/test_allocation.py` asserts exactly that,
# and it was not touched, so it is the check and not the changer.
#
# WHY PROSE IS THE RIGHT INSTRUMENT AND A NEW BAND IS NOT
#
# `_rule_b_allocation` in packages/trappoint-migrate/src/trappoint_migrate/
# lint.py resolves a filename's key to a band and then compares **`mode`** —
# `rendered` against `authored` against `unallocated`. It does NOT compare
# `owner`, and it does not read `contents` at all. `owner` and `contents` are
# addressed to a human reader.
#
# All ten new files land in bands whose `mode` is ALREADY `authored`, so lint
# rule B admitted them as written before this comment existed:
#
#     0049d  mainline.identity_assignment           band 0049a-0049z  authored
#     0089   mainline_meas.agent_action             band 0080-0089z   authored
#     0089a  mainline_meas.person_measure_policy    band 0080-0089z   authored
#     0089b  mainline_meas.standing                 band 0080-0089z   authored
#     0090   mainline.patrol_run                    band 0090-0099z   authored
#     0099   mainline_ops.outbox                    band 0090-0099z   authored
#     0099a  mainline_ops.site_register_signal      band 0090-0099z   authored
#     0145f  trg identity_assignment append-only    band 0145-0149z   authored
#     0149a  trg agent_action append-only           band 0145-0149z   authored
#     0149b  trg person_measure_policy append-only  band 0145-0149z   authored
#
# That the lint would have admitted them silently is exactly why this block is
# here. A band whose description does not name the files it grants is a grant
# nobody can audit by reading, and the incident of 2026-08-08 was an audit that
# compared two declarations with each other and found nothing. Restating the
# prose is a deliberate act by the wave that added the files, recorded on the
# day it was made, and not a side effect of one.
#
# The numbers themselves are not this file's to choose. Four already-committed
# artefacts fix them — the `requires:` headers of 0163/0164/0165/0166/0171/
# 0172/0198x, `GRANTS.yaml`'s `since:` keys, ARCHITECTURE.md section 18, and
# RLS-MATRIX.yaml. Moving one would falsify all four (D2).
#
# `mainline_ops.outbox` gets NO append-only weld, and its absence from the
# 0145-0149z list is the decision D5, not an omission: it is the one TTL table
# in `mainline_ops` (30 days), and a BEFORE DELETE refusal trigger would make
# the row-expiry job fail forever.
# ============================================================================

