# THE NEGATIVE ASSERTIONS THIS FILE MAKES, WHICH THE TEST SUITE TURNS INTO EVIDENCE
# ══════════════════════════════════════════════════════════════════════════════════════════════

negative_assertions:
  - id: RLS-N1
    claim: "mainline_qa is unreachable from mainline_auditor, on every object, forever (S14)."
    expect_sqlstate: "42501"
    test: "tests/integration/schema/test_mi_rls.py::test_mainline_qa_is_unreachable_from_the_mcp_identity"
    note: >
      This is a GRANT-layer assertion, not an RLS-layer one, and it is in this file because the
      question "why is there no policy protecting mainline_qa" has exactly one correct answer:
      because there is no grant to protect it from. A per-named-person distribution behind a
      Managed-MCP service account is the single worst credential this system could issue, so the
      control is the absence of the account and the test is the absence of the reach.

  - id: RLS-N2
    claim: "The full gate transaction succeeds with FORCE ROW LEVEL SECURITY active (CF-22)."
    test: "tests/integration/schema/test_mi_rls.py::test_cf22_the_gate_transaction_survives_forced_rls"

  - id: RLS-N3
    claim: "Dropping gate_insert turns the gate's INSERT into 42501."
    expect_sqlstate: "42501"
    test: "tests/integration/schema/test_mi_rls.py::test_cf22_dropping_the_insert_policy_refuses_with_42501"
    note: >
      PL-2. RLS-N2 asserts nothing on its own — a transaction that would have succeeded with RLS
      switched off entirely proves only that RLS was switched off. The pair is the assertion.

  - id: RLS-N3b
    claim: >
      Dropping gate_write does NOT refuse. The UPDATE matches zero rows, returns successfully,
      and the projected counter does not move — which is how a missing UPDATE policy silently
      disarms gate_closed_when_issued.
    expect_sqlstate: null
    expect: "rowcount == 0, no exception, open_blocking unchanged"
    test: "tests/integration/schema/test_mi_rls.py::test_cf22_dropping_the_update_policy_is_silent_not_refused"
    note: >
      Measured on CockroachDB CCL v26.2.5, 2026-08-10. This assertion is deliberately written as
      the DANGEROUS behaviour rather than the desired one. A test asserting 42501 here would fail
      honestly today and would be "repaired" by relaxing it, at which point the finding is gone.
      See the ⚠ block at the head of this file, and the cross-domain note about migrations 0101,
      0103 and 0104 needing to verify their own UPDATE landed.

  - id: RLS-N4
    claim: "No policy expression in the matrix contains a subquery (§4.1 law 10)."
    test: "tests/integration/schema/test_mi_rls.py::test_no_policy_expression_contains_a_subquery"

  - id: RLS-N5
    claim: "Every policy in the cluster is named, and every name in the cluster is in this file."
    test: "tests/integration/schema/test_mi_rls.py::test_the_cluster_matches_the_declared_matrix"
    note: "DM-10: the policy name is the courtroom exhibit; `policy_1` is not an exhibit."
