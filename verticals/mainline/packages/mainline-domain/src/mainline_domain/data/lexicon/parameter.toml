# Parameter phrases that are DELIBERATELY not mapped, because the word is a
# hazard cue rather than a controlled parameter and mapping it would attach a
# setpoint to the wrong key.  Listed so the omission is visible and stays a
# decision rather than becoming a gap.
[parameters.deliberately_unmapped]
phrases = [
  "pressure", "temperature", "level", "flow", "concentration", "distance",
  "height", "time", "frequency",
  # Direction-ambiguous on their own: "operating pressure" says nothing about
  # whether the safe move is up or down, so mapping it to max_operating_pressure
  # would smuggle a direction in through the name-resolution table and past the
  # gate that governs DIRECTRIX.  A clause using only this phrasing extracts
  # parameter='' and confidence='low', which blocks rather than guesses.
  "operating pressure", "working pressure", "design limit",
]
