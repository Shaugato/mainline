#
# CATSEAL parameter-key lexicon (worker W3): surface phrase -> parameter_key.
#
# WHAT THIS FILE IS NOT.  It is not the safe_direction registry.  It says
# nothing about which way a setpoint move is dangerous.  That judgement lives in
# DIRECTRIX (worker W2), stored as clauses in the gated commit DAG under doc_code
# REG-SAFE-DIRECTION, so that editing it is itself a gated change -- the gate's
# parameter table is gated by the gate.  A direction column here would escape
# that gate completely, which is why there is none.
#
# WHAT IT IS.  The name-resolution half: given the words a clause actually uses
# ("maximum working pressure", "MAWP", "pressure rating"), which registry key is
# being talked about.  The key is what lands in CAT.parameter and therefore in
# the cat_key preimage.
#
# THE KEY SPACE IS SHARED WITH W2 AND MUST NOT DRIFT.  Every key on the left is
# a key DIRECTRIX is expected to carry.  A key here that DIRECTRIX has never
# ratified is not an error and is not silently dropped: the lookup returns
# ABSTAIN, decision D6 maps ABSTAIN to `weaken`, and the way to stop the
# nuisance block is to ratify the parameter with a signed commit.  Under-coverage
# therefore fails CLOSED and carries its own adoption ratchet.  Never "fix" a
# nuisance block by deleting a key from this file.
#
# UNRECOGNISED PARAMETERS.  A clause with a setpoint whose parameter phrase
# matches nothing here yields CAT.parameter = '' and confidence='low'.  It does
# NOT invent a key from the surface text: an invented key would look ratified-
# but-unknown to DIRECTRIX and would be indistinguishable from a typo forever.

[parameters]
version = 1

# Longest surface phrase wins.  Matching is case-insensitive over canon_text.
[parameters.synonyms]
max_operating_pressure = [
  "maximum operating pressure", "max operating pressure", "maximum working pressure",
  "max working pressure", "maximum allowable working pressure", "mawp",
  "maximum design pressure", "design pressure", "pressure rating", "maximum pressure",
  "operating pressure limit", "pressure limit",
]
