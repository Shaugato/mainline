# --------------------------------------------------------------------------- #
# coverage_quantifier -- R5 diffs this for narrowing (all -> selected).         #
#                                                                              #
# Resolution is by PRECEDENCE, not by position: the order in [.precedence] is   #
# tried in turn and the first class with a cue present wins, wherever in the    #
# clause it sits.  Position is not evidence -- a clause reading "all valves ... #
# a representative sample of which ..." is narrowed, and which cue happened to  #
# come first says nothing about that.                                          #
#                                                                              #
# Cues deliberately NOT listed: "those" and "such".  Both are ordinary          #
# anaphora ("such work shall be supervised") and listing them would classify    #
# most of the corpus as 'selected', which would make R5 fire on nearly every    #
# edit and get the rule switched off -- the nuisance-ceiling failure mode in    #
# risk R-A7.  A rule that breaches the ceiling is rejected, not tuned.          #
# --------------------------------------------------------------------------- #
[coverage_quantifier]
default = "unspecified"
precedence = ["selected", "typical", "all", "any"]

[coverage_quantifier.cues]
all = ["all", "every", "each and every", "each", "the whole", "in its entirety", "without exception", "100%", "100 %"]
any = ["any", "whichever", "either"]
selected = ["selected", "certain", "nominated", "designated", "identified", "relevant", "applicable", "affected"]
typical = ["typical", "representative", "a sample of", "spot", "random", "indicative", "a selection of"]

# --------------------------------------------------------------------------- #
