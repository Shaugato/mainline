# --------------------------------------------------------------------------- #
# hazard_energy -- the energy the control stands between.  ORDER MATTERS:       #
# the first key in [hazard_energy.priority] whose cues appear wins, so that a   #
# clause mentioning both "pressure" and "equipment" resolves to pressure.       #
# --------------------------------------------------------------------------- #
[hazard_energy]
priority = [
  "explosive", "radiation", "chemical", "electrical", "pressure", "thermal",
  "gravitational", "kinetic", "mechanical", "hydraulic", "pneumatic",
  "atmospheric", "noise", "biological", "stored",
]

[hazard_energy.cues]
explosive = ["explosive", "explosives", "blasting", "blast", "detonator", "shotfiring", "misfire", "magazine"]
radiation = ["radiation", "radioactive", "radiography", "nucleonic", "gauge source", "ionising", "x-ray"]
chemical = ["chemical", "reagent", "acid", "caustic", "cyanide", "sulphuric", "sulfuric", "corrosive", "toxic", "hazardous substance", "dangerous good", "sds", "msds"]
electrical = ["electrical", "electricity", "voltage", "live", "energised", "energized", "arc flash", "high voltage", "low voltage", "switchboard", "conductor"]
pressure = ["pressure", "pressurised", "pressurized", "hydrostatic", "pneumatic test", "compressed", "psv", "relief valve", "stored pressure"]
thermal = ["thermal", "hot work", "welding", "cutting", "grinding", "molten", "steam", "burn", "temperature", "heat"]
gravitational = ["fall", "falling", "working at height", "height", "dropped object", "suspended load", "overhead load", "edge protection"]
kinetic = ["moving", "movement", "vehicle", "traffic", "collision", "mobile plant", "rotating", "rotation"]
mechanical = ["mechanical", "entanglement", "crush", "crushing", "nip point", "pinch point", "guard", "guarding", "shear"]
hydraulic = ["hydraulic", "hydraulics", "accumulator", "hydraulic fluid", "injection injury"]
pneumatic = ["pneumatic", "compressed air", "air line", "airline", "air receiver"]
atmospheric = ["atmosphere", "atmospheric", "oxygen", "oxygen deficient", "irrespirable", "gas", "methane", "carbon monoxide", "hydrogen sulphide", "hydrogen sulfide", "lel", "confined space"]
noise = ["noise", "sound", "hearing", "decibel", "acoustic"]
