hold_point = ["hold point", "hold-point", "witness point", "stop point", "mandatory hold"]
witness = ["witnessed by", "in the presence of", "witnessed", "observed by"]
permit_to_work = ["permit to work", "work permit", "hot work permit", "confined space permit", "high risk work permit", "permit issued"]
isolation_certificate = ["isolation certificate", "isolation permit", "isolation tag register", "lock box", "lockbox", "group isolation"]
gas_test_record = ["gas test record", "atmospheric test record", "gas test results recorded", "test results recorded", "recorded on the permit"]
competency_check = ["competency verified", "competency check", "verification of competency", "voc", "assessed as competent", "authorisation verified"]
sign_off_record = ["signed off", "sign-off", "signature required", "signed record", "signed and dated"]
photographic_evidence = ["photographic evidence", "photograph taken", "photo record", "photographed"]
supervisor_approval = ["supervisor approval", "approved by the supervisor", "supervisor sign-off", "manager approval", "authorised by"]
