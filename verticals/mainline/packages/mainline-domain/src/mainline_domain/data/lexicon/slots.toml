#
# CATSEAL slot vocabularies (worker W3): action, object_class, hazard_energy,
# coverage_quantifier, verification.
#
# Each table maps SURFACE PHRASES to a CANONICAL KEY.  The canonical key is what
# lands in the CAT and therefore in the cat_key preimage, so:
#
#   * a key is never renamed in place -- renaming a key re-keys every clause
#     that used it, which is a migration, not an edit;
#   * a new surface phrase pointing at an existing key is a safe, additive
#     change and does not move any cat_key;
#   * an unrecognised surface phrase does NOT become a key of its own by
#     accident.  The extractor falls back to the normalised surface token and
#     records that it did, so a vocabulary gap shows up as an odd-looking key
#     rather than as a missing slot.
#
# `actor` has no table here on purpose.  Actors are resolved against the
# ANCHORLOCK named_role gazetteer (data/gazetteer/roles.toml, owner W1), because
# a role is a hard anchor and duplicating the list would let the two drift.  The
# only actor values this file contributes are the two structural fallbacks in
# [actor].

[slots]
version = 1

# --------------------------------------------------------------------------- #
# actor -- structural fallbacks only; real roles come from the W1 gazetteer     #
# --------------------------------------------------------------------------- #
[actor]
unspecified = "unspecified"
generic = [
  # Role-like phrases that the ANCHORLOCK named_role gazetteer does not carry
  # because they are not site-specific roles.  Kept here rather than proposed
  # for roles.toml: that file is owned by W1 and a role added there changes the
  # anchor set, which changes identity; these change only the actor slot.
  "authorised person",
  "authorized person",
  "authorised persons",
  "any person",
  "all persons",
  "all personnel",
  "personnel",
  "employees",
  "workers",
  "the worker",
  "the person",
  "persons",
  "no person",
  "nobody",
  "everyone",
  "all employees",
  "site personnel",
  "the contractor",
  "contractors",
  "the operator",
  "operators",
  "the crew",
]

# --------------------------------------------------------------------------- #
# action -- the verb the obligation binds.                                      #
#                                                                               #
# NEGATION NORMALISES INTO THE DEONTIC, NEVER INTO THE ACTION.  "shall not      #
# exceed" is (MUST_NOT, exceed); it is never (MUST, not_exceed).  Without that  #
# rule the same control acquires two identities -- one clause writes "shall not #
# exceed 50 kPa" and its successor writes "shall remain below 50 kPa", the CATs #
# differ in two slots, and the edit reads as a rewritten control rather than as #
# the restatement it is.  An identity split is worse than a missed weakening,   #
# because it detaches the blame edge silently.                                  #
#                                                                               #
# [action] holds POSITIVE surfaces.  [action.negating] holds surfaces that mean #
# the same verb with the polarity reversed; matching one flips the deontic      #
# (MUST <-> MUST_NOT, SHOULD <-> SHOULD_NOT) and stores the positive key.       #
# --------------------------------------------------------------------------- #
[action]
isolate = ["isolate", "isolated", "isolating", "isolation of", "isolates"]
lock_out = ["lock out", "locked out", "lockout", "apply a lock", "apply locks", "lock off", "locked off"]
tag_out = ["tag out", "tagged out", "tagout", "apply a tag", "apply tags", "attach a danger tag"]
de_energise = ["de-energise", "de-energised", "deenergise", "de-energize", "de-energized", "isolate electrically"]
depressurise = ["depressurise", "depressurised", "depressurize", "depressurized", "vent to atmosphere", "bleed down"]
drain = ["drain", "drained", "draining", "empty", "emptied"]
purge = ["purge", "purged", "purging", "inert", "inerted"]
flush = ["flush", "flushed", "flushing", "wash out"]
blank = ["blank", "blanked", "blind", "blinded", "spade", "spaded", "install a blank", "install a spade"]
test = ["test", "tested", "testing", "carry out a test", "conduct a test", "perform a test", "gas test", "atmospheric test"]
inspect = ["inspect", "inspected", "inspecting", "carry out an inspection", "conduct an inspection", "examine", "examined"]
verify = ["verify", "verified", "verifying", "confirm", "confirmed", "check", "checked", "validate", "validated"]
monitor = ["monitor", "monitored", "monitoring", "continuously monitor", "observe", "observed"]
calibrate = ["calibrate", "calibrated", "calibrating", "calibration of"]
maintain = ["maintain", "maintained", "maintaining", "keep", "kept"]
exceed = ["exceed", "exceeds", "exceeded", "go above", "rise above", "goes above"]
fall_below = ["fall below", "falls below", "fell below", "drop below", "drops below", "go below"]
ventilate =["ventilate", "ventilated", "ventilating", "provide ventilation", "force ventilate"]
evacuate = ["evacuate", "evacuated", "evacuating", "withdraw", "withdrawn", "clear the area"]
barricade = ["barricade", "barricaded", "cordon off", "cordoned off", "fence off", "hard barricade", "soft barricade"]
notify = ["notify", "notified", "notifying", "inform", "informed", "report to", "advise", "advised", "escalate"]
record = ["record", "recorded", "recording", "log", "logged", "document", "documented", "enter in the logbook"]
sign_off = ["sign off", "signed off", "sign", "signed", "countersign", "countersigned", "endorse", "endorsed"]
approve = ["approve", "approved", "approving", "authorise", "authorised", "authorize", "authorized", "permit"]
obtain = ["obtain", "obtained", "obtaining", "secure a permit", "issue a permit", "raise a permit"]
review = ["review", "reviewed", "reviewing", "reassess", "reassessed", "re-assess"]
train = ["train", "trained", "training", "be competent", "hold a competency", "be assessed as competent"]
supervise = ["supervise", "supervised", "supervising", "provide supervision", "directly supervise"]
wear = ["wear", "worn", "wearing", "don", "donned", "use personal protective equipment", "put on"]
secure = ["secure", "secured", "securing", "restrain", "restrained", "chock", "chocked"]
stop = ["stop", "stopped", "cease", "ceased", "shut down", "shutdown", "shut off", "halt", "halted"]
sample = ["sample", "sampled", "sampling", "take a sample", "collect a sample"]
enter = ["enter", "entered", "entering", "entry into", "gain entry"]
work = ["work", "carry out work", "perform work", "undertake work", "commence work"]
operate = ["operate", "operated", "operating", "start", "started", "energise", "energised"]
perform = ["carry out", "carried out", "carrying out", "perform", "performed", "undertake", "undertaken", "conduct", "conducted", "complete", "completed"]
provide = ["provide", "provided", "providing", "supply", "supplied", "make available", "made available"]

# LIGHT VERBS.  These carry no control content of their own: "gas testing shall
# be CARRIED OUT" is an obligation to test, not an obligation to carry out.  When
# the post-modality verb resolves to one of these AND the subject nominalises a
# real predicate, the nominalisation wins -- otherwise half the corpus extracts
# action='perform' and two clauses about entirely different controls collide.
[action.light]
keys = ["perform", "provide"]

# Nominalised predicates.  "Gas TESTING shall be carried out" puts the control
# verb in the subject and a light verb after the modality; without these
# surfaces every such clause extracts action='' and cannot be diffed against
# the clause that replaces it.  They resolve to the same keys as the verbs.
[action.nominal]
test = ["gas testing", "atmospheric testing", "a test", "tests"]
inspect = ["inspection", "inspections", "an inspection"]
monitor = ["continuous monitoring"]
calibrate = ["calibration", "recalibration"]
isolate = ["isolation", "energy isolation"]
verify = ["verification", "confirmation"]
ventilate = ["ventilation"]
supervise = ["supervision"]
evacuate = ["evacuation", "withdrawal"]
train = ["refresher training", "induction"]
notify = ["notification"]
approve = ["approval", "authorisation"]
review = ["a review", "reviews"]
maintain = ["maintenance", "servicing"]

# Surfaces meaning the same verb with reversed polarity.  Matching one stores
# the key on the left AND flips the clause's deontic.
[action.negating]
exceed = [
  "not exceed", "never exceed", "not be exceeded", "not exceeded",
  "not to be exceeded", "remain below", "remains below", "be kept below",
  "kept below", "keep below", "stay below", "be maintained below",
  "maintained below", "not go above", "not rise above", "not be greater than",
]
fall_below = [
  "not fall below", "not be less than", "remain above", "remains above",
  "be kept above", "kept above", "keep above", "stay above", "not drop below",
  "be maintained above", "maintained above", "not be lower than",
]

