#
# CANONHOLD de-hyphenation lexicon (canon_version = 1).
#
# Used ONLY at a line-wrap hyphen ("word-" at end of line, continuation on the
# next).  The decision order is fixed in mainline_domain.canon.dehyphen:
#
#   1. joined-with-hyphen is in `compounds`      -> keep the hyphen
#   2. joined-without-hyphen is in `words`       -> join
#   3. both fragments are in `words`             -> keep the hyphen
#   4. otherwise                                 -> join
#
# Rule 4 is the default because a hyphen at a line wrap is overwhelmingly a
# typesetting artefact.  `compounds` exists to protect the genuine ones, and it
# is checked FIRST so that a compound whose closed form also happens to be a
# word ("lock-out" / "lockout") resolves the same way whether or not the line
# happened to wrap there.  That stability is the whole point: identical text,
# different wrapping, one digest.
#
# Entries are compared casefolded.  Adding an entry changes digests, so it is a
# canon_version bump, not an edit.

[lexicon]
version = 1

# Closed forms.  A wrap hyphen inside one of these is an artefact.
words = [
  "abnormal", "acceptance", "accordance", "acknowledge", "actuator",
  "alarm", "ambient", "analyser", "asphyxiant", "assessment", "atmosphere",
