# `unverified:` and NEVER inside `claim:`.

slug: directrix
name: DIRECTRIX
mechanism: M1
claim: >-
  safe_direction(parameter) — the table that decides which way a setpoint move is dangerous — is
  not a table.  It is a document in the gated commit DAG (doc_code REG-SAFE-DIRECTION), one clause
  per parameter, carrying its own blame edges, and an entry answers only when its clause says
  RATIFIED and the commit carrying that clause is signed.  Editing a direction is therefore a
  change_request against a protected branch, governed by the same merge gate the direction feeds:
  the gate's own parameters are gated by the gate.  A parameter that is unknown, proposed,
  withdrawn, retired, duplicated, ambiguous across two merged branches or written in a clause the
  grammar cannot read yields SafeDirection.ABSTAIN, which resolves to control_delta='weaken' —
  never to 'neutral' — so under-coverage costs nuisance blocks and never silent passes, and the
  only way to clear the block is a signed ratification that binds the direction publicly before
  the edit anybody cares about is proposed.  The registry is read AS OF A COMMIT by walking
  commit_edge, with no cache anywhere, so a verdict issued last March is re-derivable under the
  registry that existed last March.

enforcement:
  refuses: []
  refusal_depth: 0
# Stated at its true depth, which today is ZERO, and the honesty here matters more
# than the number.
#
# This worker's only SQL is migration 0207, and 0207 creates a VIEW.  A view has
# no CHECK, no trigger and no SQLSTATE; it refuses nothing, and its own header
# says so.  What this package produces is a `ControlDelta.weaken` plus the
# arithmetic behind it (`SetpointRuling`), which worker W4 turns into a
# delta_witness set and a lattice verdict, which the kernel lead's
# `gate_closed_when_issued` / `cr_gate_closed_when_merged` CHECK constraints
# refuse a merge over.  Every one of those is somebody else's migration and none
# of them had landed when this fragment was written.  The `unverified:` block
# below names them.
#
# Two things this worker DOES enforce, in Python, and neither is a database
# refusal, so neither is listed above:
#   * a gauge-to-absolute pressure conversion raises rather than answering
#     (decision D5), so the comparison that would invert a verdict cannot be
#     performed at all; and
#   * `encode()` refuses to write ABSTAIN into a clause, so "this parameter is
#     permanently unanswerable" is not a thing a signature can assert.

position: unclaimed
# The REGISTRY is not the claim and is not new.  A curated per-parameter table of
# which direction is safer is ordinary safety engineering; the lead's own plan
# calls it "the honest cost of the design", and §8 of the clause-identity research
# classes it as hard engineering rather than research.  Sixty-odd seeded
# parameters is a bootstrap, not a contribution.
#
# The claim is the RECURSION, and it has three parts the surveyed systems do not
# put together:
#
#   (a) THE PARAMETER TABLE IS SUBJECT TO THE MECHANISM IT PARAMETERISES.  Held
#       as a table, the cheapest attack on the whole product is two columns:
#           UPDATE mainline.safe_direction SET direction = 'higher_is_safer'
#            WHERE parameter = 'max_operating_pressure';
#       after which every pressure increase classifies as `strengthen`, nothing
#       raises, no residue appears, no check opens, and the gate keeps working
#       perfectly while giving the opposite answer.  Grants and audit logs make
#       that edit attributable afterwards; they do not make it refusable.  As a
#       clause it is a change_request over a control with blame edges, which the
#       weaken gate governs on exactly the terms it governs any other weakening.
#   (b) RATIFICATION IS THE COMMIT, NOT A FIELD.  `ratified_by_sub` and
#       `ratification_commit` are read off `commit_obj`, never stored on the
#       clause, so a clause cannot assert a signature it does not have — P2's
#       discipline applied to a lookup table rather than to a projected column.
#   (c) UNRATIFIED FAILS TOWARDS ADJUDICATION, WHICH MAKES COVERAGE SELF-
#       ENFORCING.  "Absent ⇒ neutral" would make never adding an entry a way to
#       move a setpoint invisibly, because coverage is under the author's
#       influence.  D6 inverts the incentive: the way to stop the gate blocking
#       is to ratify, in public, in advance.
#
# The individual ingredients are all old: policy-as-code keeps rules in version
# control, GitOps reviews configuration through the same pull request as code,
# exposure-limit registries are published and versioned, and Pint has modelled
# offset units for a decade.  What this survey did not find is a system in which
# the safety gate's own decision parameters are a first-class subject of that
# same gate, with the parameter's provenance carrying blame to the incident that
# motivated it.

prior_art:
  - url: "https://www.openpolicyagent.org/docs/latest/policy-language/"
    what_it_covers: >-
      Open Policy Agent keeps authorisation and admission rules as Rego source in version control,
      reviewed and merged like code, and evaluates them as a precondition of an action — an
      admission controller literally refuses a Kubernetes write when policy says no.  Policy under
      source control, gating a state transition, is squarely published work and this fragment does
      not claim otherwise.
    what_it_does_not: >-
      OPA's policies govern OTHER resources; nothing makes a change to a policy pass through the
      admission control that policy implements.  The bundle is deployed by a mechanism outside the
      policy's own reach, so the equivalent of the two-column UPDATE is a bundle push.  Rego also
      has no notion of ancestry: a rule carries no link to the incident that motivated it, there is
      no per-parameter ratification distinct from deployment, and an evaluation cannot be re-run
      "under the policy that existed on the day the decision was made" without separately
      reconstructing the bundle.
  - url: "https://pint.readthedocs.io/en/stable/user/nonmult.html"
    what_it_covers: >-
      Pint models non-multiplicative (offset) units, documents that arithmetic on them is
      ambiguous, and ships `autoconvert_offset_to_baseunit` so a library can choose how much
      convenience to trade for safety.  The offset machinery this package's gauge units are built
      on is Pint's, unchanged.
    what_it_does_not: >-
      Pint has no concept of a reference FRAME, so gauge and absolute pressure are dimensionally
      identical to it and `Quantity(50, 'psig').to('kPa')` returns 446.06 with no complaint —
      measured, and the first test in tests/unit/domain/quantity/test_gauge_refusal.py demonstrates
      it before demonstrating the refusal.  That is correct behaviour for a units library and
      catastrophic for a setpoint comparison, because the answer is right only at one standard
      atmosphere of ambient and the direction of the error is not constant: the same arithmetic
      that reports a tightening as a weakening on one clause pair hides a real weakening on
      another.  Nothing in Pint distinguishes an offset that is exact by definition (Celsius to
      Kelvin, allowed here) from one that is an assumption about the room (gauge to absolute,
      refused here).
  - url: "https://www.nist.gov/pml/special-publication-811"
    what_it_covers: >-
      NIST SP 811 (Guide for the Use of the International System of Units) states the convention
      for gauge quantities: the qualifier belongs to the quantity, not to the unit symbol, and a
      pressure stated without its reference is incompletely specified.  The problem this package's
      `reference` field encodes is a known and documented one, not a discovery.
    what_it_does_not: >-
      A style guide tells an author how to write a quantity.  It has no enforcement, and — more to
      the point here — no position on what a system should do when it meets a quantity that was
      written the other way, which is the overwhelmingly common case in a real procedure library.
      This package's answer is that a bare 'kPa' is `reference='none'` (the author did not say),
      that 'none' compares only with 'none', and that the resulting refusal becomes a merge block
      rather than a warning.  Choosing to treat unstated as its own frame — and proving that
      comparisons within it are still sound, because the frames differ by a monotone additive
      constant — is not something a notation guide addresses.
  - url: "https://www.safeworkaustralia.gov.au/doc/workplace-exposure-standards-airborne-contaminants"
    what_it_covers: >-
      Safe Work Australia publishes the Workplace Exposure Standards: a curated, versioned,
      per-substance table of limits with a stated direction of harm, revised through a public
      process.  A maintained registry of per-parameter safety limits, with an amendment procedure,
      exists and is a national instrument.
    what_it_does_not: >-
      It is a published document consumed by humans and by systems that treat it as a constant.  No
      software reads it as a precondition of a state transition, an amendment to it is not
      expressible in the same terms as the controls it governs, and it carries no per-entry link to
      the exposures that produced it.  It is also silent on the class of parameter that dominates a
      site's actual controls — isolation point counts, test intervals, PPE levels, verification
      counts — for which no external registry exists and where the direction has to be ratified
      locally.
  - url: "https://git-scm.com/book/en/v2/Git-Internals-Git-Objects"
    what_it_covers: >-
      A content-addressed commit DAG in which any state is reconstructible as of any commit, and
      in which a change to any file is a reviewable, signable commit.  Storing configuration
      alongside the artefacts it configures, and reading it at a revision, is the everyday practice
      of every GitOps deployment.
    what_it_does_not: >-
      Git refuses nothing on the basis of what a change MEANS.  A commit that flips a safety
      direction is byte-identical in kind to one that fixes a typo, and branch protection is a
      review policy enforced by a forge rather than a property of the data.  There is no analogue
      of a clause carrying blame to an incident, no analogue of a merge the storage layer declines
      to perform, and no analogue of "this parameter is unratified, so every edit that depends on
      it is a weakening until somebody signs".

