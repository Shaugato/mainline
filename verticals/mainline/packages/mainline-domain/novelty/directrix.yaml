unverified:
  - >-
    NO REFUSAL IN THIS WORKER HAS BEEN OBSERVED.  `enforcement.refuses` is empty and
    `refusal_depth` is 0 because that is the truth at the time of writing.  The path from an
    abstention to a merge that stops runs through worker W4's delta lattice and
    `fn_delta_witness_guard` (migrations 0205/0211) and then through the kernel lead's
    `gate_closed_when_issued` / `cr_gate_closed_when_merged` CHECK constraints (ARCHITECTURE.md
    §5.5, MI02/MI30).  None of those migrations had landed.  What is proven today is that DIRECTRIX
    answers where it can and abstains to `weaken` where it cannot; that the abstention becomes a
    23514 is, until an integration test observes it, an unproven claim and is deliberately absent
    from `claim:`.
  - >-
    MIGRATION 0207 HAS NOT BEEN RUN AGAINST A LIVE CLUSTER.  No `cockroach` binary and no Docker
    daemon were available on the build machine and CockroachDB Cloud credentials were not assumed;
    the integration suite skips with that reason rather than passing.  What HAS run everywhere is
    `test_0207_shape.py`, which is static: it holds the migration to one statement, cross-checks the
    `split_part` literals against the Python clause grammar, and asserts the header's disclaimers
    are present.  The view's SQL — `split_part` with a multi-character delimiter, the four-way join,
    the boolean `answers` expression — is shaped against ARCHITECTURE.md §5.2/§5.3 and has NOT been
    executed by CockroachDB.  The suite additionally applies a STAND-IN spine DDL, because the
    migrations that create `commit_obj`/`commit_edge`/`doc`/`clause`/`clause_version` belong to the
    schema lead and had not landed; a green run against the stand-in is a weaker claim than one
    against the deployed schema, and the suite prints which one happened.
  - >-
    DIRECTRIX COVERAGE IS A BOOTSTRAP AND ITS ADEQUACY IS UNMEASURED (risk R-A4).  The seed carries
    74 parameters chosen from mining and process-safety practice; a real site's blame-bearing
    controls span a few hundred, and no measurement exists of what fraction of a live procedure
    library's setpoints they cover.  Under-coverage fails closed by construction — decision D6 —
    so the cost is nuisance blocking rather than silent passing, but the NUISANCE RATE IS ITSELF
    UNMEASURED, and §6.7's nuisance ceiling is the thing that decides whether that trade is
    acceptable.  If the ceiling breaks, the rule is rejected, not tuned.
  - >-
    THE SEED'S DIRECTIONS ARE HAND-AUTHORED JUDGEMENTS, NOT DERIVED FACTS.  Each carries a
    rationale, and the two consistency nets in the test suite (an `*_interval` must be
    lower_is_safer; a `max_*` must be lower_is_safer and a `min_*` higher_is_safer) catch
    transcription errors and nothing else.  A direction that is defensible but WRONG for a
    particular site — and there are real cases, e.g. a minimum ventilation quantity that becomes
    a dust-entrainment hazard above some upper bound — is not detected by anything here.  That is
    what per-site ratification is for, and it is a governance answer rather than a technical one.
  - >-
    THE QUANTITY PARSER HAS TWO KNOWN GAPS, both failing towards silence and both unmeasured.  A
    unit token must be adjacent to its number, so "2 isolation points" reads as a bare 2; and
    spelled-out numerals ("two isolation points") yield no measurement at all.  Relaxing either
    would read those correctly and would also read "50 metre levels" and "3 shift hours" as things
    they are not, at a false-positive rate nobody has measured.  Under-reading degrades to
    `cat_confidence='low'`, which over blood-written ancestry defaults to `weaken`; over-reading
    would produce a confident wrong comparison.  The gap stays until W10's SURVIVE catalogue
    measures the alternative on the corpus.
  - >-
    EXACT COMPARISON OVER-BLOCKS ON UNIT RESTATEMENTS, and this is a deliberate, arguable choice
    rather than a proven-correct one.  A calendar month here is 365.25/12 days, so rewriting a
    "180 days" interval as "6 months" lengthens it by two and a half days and is reported
    `weaken`.  The alternative — a tolerance on comparisons — is a policy about how much a control
    may quietly move before anybody is told, and this package's position is that such a policy
    belongs in a clause somebody signed rather than in an arithmetic helper.  Whether operators
    accept that position is an adoption question that has not been tested with any operator.
  - >-
    RATIFICATION IS A SIGNATURE, NOT A JUDGEMENT (risk R-A8).  Nothing here distinguishes a
    considered ratification from a rubber stamp, and nothing here can.  DIRECTRIX makes the
    question unavoidable and the record precise; it says nothing whatsoever about whether the
    direction somebody signed is the right one, and it must never be sold as retiring that risk.
  - >-
    THE ANCESTRY WALK ASSUMES `gen` IS PARENT-DERIVED AND STRICTLY INCREASING, which is the
    schema's stated invariant (`gen = 1 + max(parent.gen)`) but is enforced by the schema lead's
    triggers rather than by anything in this package.  If a `gen` were ever written that violated
    it, the loader would pick the wrong version in force without abstaining.  The same-generation
    ambiguity path is tested; a MIS-generation path is not, because from here it is
    indistinguishable from a correct history.
