unverified:
  - >-
    EXTRACTION ACCURACY IS UNMEASURED.  What is proven is that the ENCODING is exact, reproducible
    and injective, and that the extractor behaves as specified on hand-authored clauses.  How often
    the extractor fills a slot correctly over a real site's procedure library is unknown until
    W10's mutation ratchet reports kill rates per mutation class with Wilson lower bounds.  A
    cat_key is only as good as the tuple it hashes, and this fragment claims nothing about the
    tuple's fidelity — only about the hash's exactness and the extractor's refusal to guess.
  - >-
    The extractor is a shallow closed-class grammar, monolingual (English), and tuned to Australian
    WHS and ISA tag conventions.  Its actor resolution is closed to the ANCHORLOCK named_role
    gazetteer plus a small generic list, so a clause naming a role neither list carries extracts
    actor='unspecified'.  That is a deliberate fail-quiet on ONE slot (an unresolvable noun phrase
    entering a closed slot would re-key the obligation on every rewording, which is worse), but it
    is a coverage gap and its size is unmeasured.
  - >-
    A `between X and Y` range keeps the LOWER bound and the comparator 'range'; the upper bound is
    not in the tuple, so two clauses differing only in their upper bound share a cat_key.  The
    mitigation is that every range extracts confidence='low', which routes it to adjudication.  It
    is a mitigation, not a fix, and a cat2 encoding would add a second quantity slot.  Recorded in
    verticals/mainline/spec/cat-key-v1.md §10.
  - >-
    SI normalisation is not performed by this package.  cat/quantity_bridge.py classifies a unit's
    dimension and reads the reference class the prose declares, and holds a Protocol seam to worker
    W2's quantity algebra; it contains no conversion factor and must never contain one.  Until W2
    lands and a converter is passed explicitly, a stored cat_key is a function of the unit AS
    WRITTEN.  That is reproducible and is stated in the spec, but it means two clauses expressing
    one setpoint in different units currently carry different keys.  The error contract this
    package asserts on W2 — that a gauge/absolute crossing raises with something that is NOT a
    LookupError — is pinned by test against fakes here, and is unverified against W2's real
    converter because it does not yet exist.
  - >-
    `frequency` uses the unit as written where no converter knows it.  'shift' is a site-defined
    interval and 'use' ("prior to each use") is not a duration at all, so both normalise to
    themselves.  This is correct for identity and wrong for arithmetic: the lattice is REQUIRED to
    treat an unconvertible frequency comparison as unknown, and unknown resolves to weaken.  That
    requirement is stated in spec §10 and is enforced in W4's rule R7, not here, so from this
    package's side it is an assumption about a downstream worker.
  - >-
    The parameter key space in data/lexicon/parameter.toml is shared with DIRECTRIX (W2) and is
    asserted only by convention and by a naming test.  A key here that W2 never ratifies yields
    ABSTAIN, which decision D6 maps to weaken — so drift fails CLOSED and costs nuisance blocks
    rather than silent passes — but no test yet cross-checks the two key sets, because W2's seed
    registry has not landed.
  - >-
    The opacity heuristics are conservative and their false-negative rate is unmeasured.  A table
    row that reaches the extractor with its pipes stripped and no layout hint reads as prose.  The
    mitigation is that callers holding Textract LAYOUT_* output should pass ClauseHint, which is
    strictly better evidence than any string heuristic — but whether ingest always does so is a
    property of the ingest path, not of this package.
  - >-
    None of this distinguishes a considered disposition from a rubber stamp (risk R-A8).  CATSEAL
    makes the question of whether an obligation survived an edit precise and unavoidable; it says
    nothing whatsoever about the quality of the answer, and it must never be sold as retiring that
    risk.
