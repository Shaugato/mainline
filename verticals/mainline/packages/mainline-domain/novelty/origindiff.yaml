unverified:
  - >-
    THE MECHANISM IS SILENT AT AN ODD STEP OF ITS OWN FIXTURE, AND THE TEST SAYS SO.  The salami
    chain alternates the comparator between `<=` and `=`; at an odd step the origin's comparator
    family and the descendant's differ, rule R2 declines for exactly the reason it declines on
    every step of the parent diff, and the delta of record is `restate`.  ORIGINDIFF catches the
    drift on the NEXT commit.  It does not catch it on that one, and
    test_an_odd_step_is_quiet_and_that_is_the_honest_limit asserts the silence rather than
    leaving it to be discovered.  A merge proposed at an odd generation is a real, unmeasured
    gap.
  - >-
    ORIGINDIFF REFUSES NOTHING IN SQL.  Its refusals are Python exceptions raised inside the
    projector.  A writer who never imported this package and simply declares
    control_delta='restate' on mainline.clause_version is not stopped by anything in this
    fragment, and no trigger could stop them: §4.1 law 1 forbids a CHECK from seeing another row
    and the origin version is several other rows plus a blame closure plus a signed registry.
    What closes that hole, if it is closed, is the CONSERVATION OF BLAME MASS ledger (W9)
    accounting for the obligation independently — and that is cbm-ledger.yaml's claim, not this
    one.
  - >-
    THE FIRST-PARENT CHAIN IS VERIFIED BY A SEPARATE STATEMENT, SO A SUFFICIENTLY LONG HISTORY
    COSTS A SECOND ROUND TRIP.  The walk is linear in generations and depth-bounded at 4096, but
    it is not free and it is not in the view.  No latency measurement of the pair has been taken
    against a realistic corpus; the p99 claim in ARCHITECTURE.md §12 is about the GATE, and this
    module runs off the gate path, so nothing here has been shown to fit inside it either way.
  - >-
    REACHING THE DEPTH BOUND IS FAIL-OPEN.  If a clause's blame origin were more than 4096
    generations back, mainline.v_blame_origin would return no origin row, the mechanism would
    report itself inert, and the delta of record would collapse to the parent diff — QUIETER, not
    louder.  `origin_depth` is projected and BlameOrigin carries `depth_bound_reached` precisely
    so the condition is visible, but nothing refuses on it and no corpus has been checked for a
    clause that approaches it.
  - >-
    `mainline.v_blame_origin` HAS NOT BEEN APPLIED AGAINST THE REAL BLAME TABLES.
    datamodel/dm-blame's blame_edge, clause_blame_closure and clause_blame_current were not on
    disk when this was written — only migrations 0032-0036 of that band exist — so the integration
    suite applies a STAND-IN transcribed from ARCHITECTURE.md §5.4 and prints a banner naming
    every object it stood in for, on every run.  The view was executed against CockroachDB CCL
    v26.2.5 in Docker on 2026-08-09 and every assertion in this fragment's test list passed, but
    it passed against a transcription, not against the reviewed migration.  This entry is deleted
    when that band lands and the banner reads "no stand-in".
  - >-
    THE PARENT-VERSION POINTER IS TRUSTED FOR THE PARENT COMPARISON.  ORIGINDIFF resolves the
    ORIGIN from blame and verifies it against the first-parent chain, but the PARENT half of the
    join is whatever clause_version.parent_version says.  That pointer is FK-enforced to a real
    version of the same clause, which is what 0029's fk_parent_version buys, and it is not
    otherwise checked against the commit DAG.  A matcher that re-parented a clause within one
    branch would move the parent baseline without moving the origin one; the record would still
    be the join, so the effect is bounded by the origin comparison, but it is not zero and it is
    not measured.
  - >-
    NONE OF THIS DISTINGUISHES A CONSIDERED DISPOSITION FROM A RUBBER STAMP (risk R-A8).
    ORIGINDIFF makes the question "is this edit a weakening of what the incident wrote" precise
    and unavoidable.  It says nothing whatsoever about the quality of the answer a person then
    gives, and it must never be sold as retiring that risk.
