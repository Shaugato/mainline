unverified:
  - >-
    THE STRUCTURAL REFUSAL AT THE MERGE IS NOT BUILT.  `permit.unbalanced_cbm_count` and
    `change_request.unbalanced_cbm_count`, with `CONSTRAINT cbm_balanced_when_issued CHECK
    (state <> 'merged' OR unbalanced_cbm_count = 0)`, are the plain-column second layer this
    domain's plan specifies.  Both tables are RENDERED SUBSTRATE, so the column is a change to
    `packages/trappoint-sql/templates/0050_permit.sql.j2` and `0051_change_request.sql.j2`
    agreed with `kernel/subject-and-pin` and re-rendered into both bindings.  This worker owns
    neither template and did not make the change.  Until it lands, the merge refusal is a
    TRIGGER and `ALTER TABLE mainline.permit DISABLE TRIGGER z_cbm_gate` succeeds; what the
    custodian patrol makes impossible is removing the RECORD that it was disabled, and that
    claim belongs to the custody domain and is not verified here.
  - >-
    CBM CANNOT SEE BLAME LANDING ON THE WRONG CLAUSE (risk R-A2).  The ledger proves every
    inherited obligation was accounted for; it says nothing about whether `carried` matched an
    ancestor to the CORRECT descendant.  A matcher that confidently matches obligation A to the
    clause that used to be obligation B produces a perfectly balanced account.  The pre-committed
    escalation ladder for that failure is in docs/leads/algorithms.md §8 — raise the auto-accept
    band, disable the semantic stage, run on hash and anchors only — and `identity_policy` is
    versioned on every assignment row so the ladder is auditable.  Nothing in this fragment
    reduces that risk and nothing here should be read as claiming to.
  - >-
    `inherited` IS DEFINED OVER THE FIRST-PARENT COMMIT'S VERSIONS OF THE TOUCHED DOCUMENTS, AND
    THAT DEFINITION HAS A KNOWN EDGE.  A(c) is built from `clause_version` rows AT the first
    parent whose `doc_id` the commit touched.  If the first-parent commit did not itself version
    every clause of that document — a repository whose commits are patches rather than document
    snapshots — the ancestor set under-counts, and an under-counted `inherited` is a gate that
    opens.  The definition is stated normatively in 0140a's header and implemented identically
    in Python, so the two agree; whether it is the RIGHT definition for a patch-shaped corpus is
    an open question against the demo corpus and is not settled by any test here.
  - >-
    THE PROJECTION REQUIRES A CLOSURE ROW AT THE FIRST PARENT AND WILL SURFACE AS A BACKLOG.
    `fn_residue_project` refuses an `identity_residue` insert whose ancestor has no
    `clause_blame_current` row at the first-parent commit, and `fn_cbm_account_guard` refuses an
    account when ANY first-parent clause version in a touched document lacks one.  Both are
    fail-closed on purpose and both impose a real ordering obligation on the closure projector
    fleet.  How often that fires under production load is unmeasured, and the nuisance ceiling in
    docs/leads/algorithms.md §6.7 is the rule that decides what happens if it fires too often —
    under which a rule is REJECTED, not tuned.
  - >-
    THE STALENESS REFUSAL COMPARES ONE COUNTER, NOT THE WHOLE ACCOUNT.  `z_cbm_gate` checks the
    newest account's `residue_open` against the live count of distinct ancestors with an open
    residue row.  A world that moved in some OTHER way — an assignment row added after the
    account, a closure generation that raised a severity and enlarged A(c) — is not detected by
    this comparison, and the merge proceeds on an account that is stale in a way the gate does
    not measure.  Re-deriving the entire account inside the merge trigger would close it and was
    not done: it is an unbounded amount of work on the latency-critical path of every merge, and
    a gate that times out is a gate somebody disables.
  - >-
    THREE DEPENDENCIES WERE STOOD IN FOR AT AUTHORING TIME.  `mainline.clause_blame_closure`,
    `mainline.clause_blame_current` (datamodel/dm-blame) and `mainline.identity_assignment`
    (worker W8) had no migration in the tree, so the cluster suite applies
    `tests/integration/algorithms/cbm/_pending_dependency.sql`, whose DDL is transcribed from
    ARCHITECTURE.md §5.4 and from W8's brief and cites both line by line.  Every cluster-backed
    result in this fragment is therefore true of those transcribed shapes and is only as true of
    the deployment as the transcriptions are.  The stand-in is outside the migration apply path,
    every fixture prints which objects it covered, and `test_cbm_pending_dependency.py` refuses the
    combination of a real migration and a shadowing stand-in.
  - >-
    MEASURED PLATFORM DETAIL, RECORDED BECAUSE AN EXHIBIT DEPENDS ON IT.  On CockroachDB CCL
    v26.2.5 a `23514` MESSAGE names the CHECK EXPRESSION — `failed to satisfy CHECK constraint
    (balanced)` — and the constraint NAME arrives only in the error's diagnostics field.  Any
    console or exhibit that promises an operator the name `cbm_balances` must take it from the
    diagnostics.  Separately: reading a trigger pseudo-record needs `(NEW).col` and WRITING one
    needs `NEW.col :=`; the wrong read form applies at CREATE FUNCTION and fails at CREATE
    TRIGGER, one migration downstream of the defect.
  - >-
    THE AUDIT VIEW FITS THE MCP CAP ONLY IN THE COLUMNS-PLUS-ROWS ENCODING.  25 full rows of
    `mainline_audit.v_cbm_ledger` measure about 5 KiB as `{"columns": [...], "rows": [[...]]}`
    and about 12.6 KiB as one JSON object per row, because the nineteen column names are then
    repeated 25 times.  A renderer that serialises per-row objects will breach the 10 KiB cap and
    be truncated by the transport — which is exactly the silent partial answer `ledger_truncated`
    exists to prevent.  Both sizes are asserted so neither can drift unnoticed, but no shim has
    been built or measured against this view.
  - >-
    RLS IS NOT APPLIED TO ANY OBJECT IN THIS FAMILY BY THIS WORKER.  `mainline.cbm_account` gets
    no `CREATE POLICY` here and `mainline_audit.v_cbm_ledger` inherits whatever the underlying
    tables enforce; the policy band `0180`-`0198` belongs to `datamodel/dm-views-rls`.  The
    view's global `LIMIT 25` and its `n_accounted_commits` total are therefore global for a
    superuser and site-scoped only once those policies exist, which the test suite models by
    building a fresh database rather than by asserting isolation it does not have.
  - >-
    NONE OF THIS DISTINGUISHES A CONSIDERED DISPOSITION FROM A RUBBER STAMP (risk R-A8).  CBM
    makes an obligation impossible to LOSE.  It cannot make a match true, it cannot make a
    disposition thoughtful, and it must never be sold as retiring either risk.
