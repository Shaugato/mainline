# `unverified:` and NEVER inside `claim:`.

slug: cbm-ledger
name: CONSERVATION OF BLAME MASS LEDGER
mechanism: M1
claim: >-
  Every ancestor clause that carries a blame edge to a severity >= 4 event is, in commit c,
  exactly one of five things — matched, carried through a recorded split, carried through a
  recorded merge, open residue, or dispositioned residue — and that sentence is stored as
  arithmetic the database refuses to be wrong about:

      inherited = carried + split_carried + merge_carried + residue_open + residue_disposed

  `mainline.cbm_account` (migration 0049c) carries the right-hand side as six INT8 columns, the
  identity as a `BOOL … STORED` generated column, and the refusal as `CONSTRAINT cbm_balances
  CHECK (balanced)`.  A matcher that quietly under-emits residue therefore does not produce a
  clean gate: it produces an account that cannot be stored, `23514`, at the moment of
  accounting.  Deleting one counted `identity_residue` row and re-accounting is the whole
  demonstration.

  The second half is what makes the first half mean anything.  `fn_cbm_account_guard`
  (0140a, attached by 0145a) RE-DERIVES all six counters from `clause_blame_current`,
  `identity_assignment` and `identity_residue` and OVERWRITES whatever the inserter supplied,
  so an account that balances on its own arithmetic and misstates `inherited` is silently
  corrected and then refused on the corrected numbers.  That is finding S1 applied to the
  accounting rather than to severity: a projector that can choose its own numerator is not a
  projection, it is a claim wearing a projection's clothes, and the claim is the thing under
  suspicion.  `site_id` is re-derived from `commit_obj` for the same reason — a writer who could
  choose the site could file a commit's accounting where its auditors do not look.

  Two further refusals put the arithmetic in the write path of a state transition rather than in
  a report about one.  `z_cbm_gate` / `z_cbm_gate_cr` (0140c/0140d, attached by 0145c/0145d)
  raise P0001 when a commit the subject cites has NO account at all, and again when the newest
  account's `residue_open` disagrees with the live count of distinct ancestors carrying an open
  residue row — because an accounting that was true last week and is false now is worth less
  than none: it looks like evidence.

  And one hole in the architecture is closed on the way past.  `identity_residue.
  max_ancestral_severity` is annotated `PROJECTED from clause_blame_closure (P2)` in
  ARCHITECTURE.md §5.3 and §5.11 lists no trigger that projects it; 0049's own header records
  that the column was client-supplied.  `fn_residue_project` (0140b, attached by 0145b) makes it
  a projection: it re-derives the severity from `clause_blame_current` for the ancestor's
  version in the FIRST-PARENT commit and raises P0001 when no closure row exists.  The column
  decides which clearance verdicts are legal over the row, so a writer who could lower it could
  convert an undischargeable obligation into a dischargeable one.

enforcement:
  refuses:
    - "cbm_balances (23514) — an account whose five terms do not sum to `inherited`; measured on
       v26.2.5 the MESSAGE names the expression `(balanced)` and the diagnostics field carries
       the constraint name `cbm_balances`"
    - "cbm_balances (23514), after re-derivation — an account that balances on its own numbers
       and misstates them; the trigger corrects it first and the CHECK refuses the correction"
    - "fn_cbm_account_guard (P0001) — the commit it accounts for does not exist"
    - "fn_cbm_account_guard (P0001) — blame closure not materialised for the first-parent commit"
    - "fn_cbm_account_guard (P0001) — cbm account generations must be dense and monotone (MI26)"
    - "z_cbm_gate / z_cbm_gate_cr (P0001) — merge refused, blame accounting absent for a cited commit"
    - "z_cbm_gate / z_cbm_gate_cr (P0001) — merge refused, blame accounting is stale for a cited commit"
    - "fn_residue_project (P0001) — residue refused, no blame closure for the ancestor clause in
       the first-parent commit"
    - "fn_residue_project (P0001) — residue refused, the commit has no first parent"
    - "z_cbm_account_append_only / fn_refuse_mutation (P0001) — an UPDATE or DELETE on a
       stored account, which is the hole an INSERT-only guard leaves open: `cbm_balances`
       alone would accept `inherited = 2, carried = 1, split_carried = 1` written over a
       stored `inherited = 3`"
    - "counts_nonneg / gen_nonneg / commit_id_is_sha256 / projector_ver_stated / wrote_as_stated (23514)"
  refusal_depth: 2
# Depth 2 AT THE ACCOUNT, depth 1 at the merge, and the difference is worth the extra sentence.
#
# At the account the two layers catch two different lies and both are demonstrated, one at a
# time, by test_the_two_layers_catch_two_different_lies:
#
#   STRUCTURAL  `cbm_balances` is a plain-column CHECK over a STORED generated column on
#               `mainline.cbm_account`.  It survives `ALTER TABLE mainline.cbm_account DISABLE
#               TRIGGER z_cbm_account_guard`, and with the trigger gone a writer still cannot
#               store `inherited = 3` beside terms summing to 2.
#   DERIVED     the trigger is what sees an account that is arithmetically perfect and false.
#               Disabling it converts a refusal into a discoverable lie — a strictly weaker but
#               non-empty guarantee, because `mainline_audit.v_cbm_ledger` reports the live
#               comparison and an auditor can run it.
#
# At the merge it is depth 1 and this fragment does not inflate it.  The structural second layer
# this domain wanted is `permit.unbalanced_cbm_count` with `CONSTRAINT cbm_balanced_when_issued
# CHECK (state <> 'merged' OR unbalanced_cbm_count = 0)`.  `mainline.permit` and
# `mainline.change_request` are RENDERED SUBSTRATE (allocation band 0050-0053, mode `rendered`),
# so that column is an edit to `packages/trappoint-sql/templates/0050_permit.sql.j2` and
# `0051_change_request.sql.j2`, agreed with `kernel/subject-and-pin` and re-rendered into BOTH
# bindings — never an `ALTER` typed into the vertical, which MR-1 consequence 2 describes as red
# in the worst way (CI green, deploy dead).  It was not made by this worker and is recorded
# under `unverified:`.  `ALTER TABLE mainline.permit DISABLE TRIGGER z_cbm_gate` succeeds today.

position: unclaimed
# Every ingredient is published and this fragment says so plainly:
#
#   * a conservation identity enforced by a database constraint — double-entry bookkeeping, and
#     ledger databases that refuse an unbalanced transfer;
#   * generated columns and CHECK constraints — SQL:2003 and every major engine;
#   * requirements traceability with a completeness report — DO-178C, ISO 26262, and thirty
#     years of traceability-matrix tooling;
#   * mass-balance reconciliation over a process — undergraduate chemical engineering, and the
#     metering-reconciliation software every plant already runs;
#   * bipartite matching between two versions of a document — the matcher this ledger audits,
#     which is worker W8's and is itself labelled prior art there.
#
# The claim is one specific composition that the survey did not find anywhere:
#
#   THE CONSERVED QUANTITY IS A LEGAL OBLIGATION, THE ACCOUNT IS RE-DERIVED FROM THE SOURCES
#   RATHER THAN ACCEPTED FROM THE PROJECTOR, AND A FAILURE TO BALANCE IS A WRITE REFUSAL RATHER
#   THAN A REPORT.
#
# Each of the three clauses is doing work:
#
#   (a) THE QUANTITY.  Ledger databases conserve money and reconciliation software conserves
#       mass.  Both are quantities the system already has a number for.  What is conserved here
#       is "an obligation written by an incident that killed or nearly killed somebody", which
#       is a quantity nobody had made countable — the counting is what W7/W8's matcher exists to
#       make possible, and the ledger is what makes the matcher's failures loud.
#   (b) THE RE-DERIVATION.  A traceability matrix is computed by the tool that reports it, so a
#       tool that mis-computes coverage reports full coverage.  Here the tool's answer is
#       discarded and the storage layer recomputes from three relations the tool does not own.
#   (c) THE REFUSAL.  A completeness report is an output.  It can be filed, waived, or produced
#       after the change has shipped.  This one is a precondition of a state transition,
#       enforced against every writer including one that has never heard of this package.
#
# The inversion that follows from all three is the thing worth arguing for, and it is not a
# claim about accuracy: a successful evasion of the matcher produces an ORPHANED BLOOD-WRITTEN
# OBLIGATION, which is a louder gate than the weakening it was hiding.  Matcher recall failures
# convert into gate false POSITIVES, which a human adjudicates in minutes, instead of gate false
# NEGATIVES, which are fatal and silent.

prior_art:
  - url: "https://en.wikipedia.org/wiki/Double-entry_bookkeeping"
    what_it_covers: >-
      The idea that a set of records is trustworthy because it must balance, and that an entry
      which does not balance is refused rather than corrected later, is five hundred years old
      and is not claimed here in any form.  The arithmetic in this fragment is the accounting
      equation with different nouns, and the discipline of a trial balance — recompute the totals
      from the entries and compare — is exactly what `fn_cbm_account_guard` performs.
    what_it_does_not: >-
      Double-entry conserves a quantity the system already has: money, denominated, supplied by
      the transaction.  Nothing in it says where the entries come from, and it has no answer for
      an entry that was never made.  A cash book balances perfectly if a sale is simply never
      recorded — which is the failure this ledger exists to catch, because the entries here are
      not supplied by the writer at all: they are RE-DERIVED from the ancestry, so an obligation
      the projector never wrote about is still counted on the left-hand side.
  - url: "https://tigerbeetle.com/"
    what_it_covers: >-
      TigerBeetle is the clearest modern statement of "the database refuses an unbalanced
      transfer": a purpose-built financial datastore whose whole design is that double-entry
      invariants are enforced by the storage engine rather than by the application above it.
      The architectural argument — put the invariant where no application can route around it —
      is theirs and this fragment agrees with it rather than claiming it.
    what_it_does_not: >-
      Its invariants are over amounts supplied in the transfer itself, between accounts the
      caller names, and both sides of every entry arrive in the same request.  There is no
      derivation from a third relation, no notion of an entry that OUGHT to exist because of
      something in the past, and no ancestry: the question "how many obligations did this state
      inherit" is not expressible, because the ledger has no history other than its own entries.
  - url: "https://en.wikipedia.org/wiki/Requirements_traceability"
    what_it_covers: >-
      Traceability matrices under DO-178C, ISO 26262 and their tooling already answer "does every
      requirement still have something downstream of it", already report orphans and gaps, and
      already treat an unlinked safety requirement as a finding.  Conceptually this is the
      closest safety-engineering neighbour, and the reporting half of it is not claimed here.
    what_it_does_not: >-
      The matrix is computed BY the tool that reports it, so a tool whose linking is wrong
      reports full coverage in perfect confidence, and the report is an artefact a process
      consumes — reviewable, waivable, and producible after the change has shipped.  Nothing in
      the practice makes an incomplete matrix refuse a state transition, and nothing recomputes
      the coverage from sources the tool does not own.  Traceability also links requirement to
      test; it does not carry a link from a clause to the INCIDENT that wrote it, which is what
      makes `severity >= 4` a meaningful universe to quantify over.
  - url: "https://en.wikipedia.org/wiki/Mass_balance"
    what_it_covers: >-
      "What went in must come out or be accounted for" is the reconciliation every process plant
      already runs over its own metering, and the vocabulary of this mechanism — inherited,
      carried, residue — is borrowed from it deliberately so that a plant engineer recognises the
      shape of the claim on sight.  The idea of a balance whose failure indicates measurement
      error or loss is entirely standard.
    what_it_does_not: >-
      A mass balance is a measurement with a tolerance, reconciled after the fact, and a residual
      is a number an engineer interprets.  There is no tolerance here and there is no
      after-the-fact: the balance is exact, integer, and evaluated before the row exists.  Nor
      does a mass balance gate anything — a plant does not stop because yesterday's reconciliation
      was 0.4% out.
  - url: "https://en.wikipedia.org/wiki/Management_of_change"
    what_it_covers: >-
      Management of Change is the incumbent and deserves naming, because it is what a site does
      today: a procedure edit is routed to a review board, a competent person checks that nothing
      important was lost, and the judgement is recorded.  Every question this ledger asks is
      already asked under MOC, by people who know the plant, and often answered better.
    what_it_does_not: >-
      The check is a human artefact in a workflow system and the workflow completes without it:
      an MOC record can be approved with an empty rationale and no system state prevents it.  It
      is also synchronic — the reviewer compares the current text with the proposed text, not
      with the twenty-year-old incident that wrote the clause — so "this edit dropped a control a
      fatality put there" is not a question the record is shaped to answer.  The contribution is
      not judging better than a review board; it is making the arithmetic of what was lost a
      thing the storage layer will not accept as absent.

