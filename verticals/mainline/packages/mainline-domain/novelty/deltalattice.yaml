# Novelty fragment per docs/leads/algorithms.md §6.  Validated by
# tests/unit/domain/novelty/test_novelty_manifest.py (worker W10) and consumed
# by MECHANISMS.md generation.  Anything not yet proven belongs under
# `unverified:` and NEVER inside `claim:`.

slug: deltalattice
name: DELTALATTICE
mechanism: M1
claim: >-
  Given two Control Assertion Tuples, nine deterministic rules — deontic rung, setpoint against
  the DIRECTRIX direction, comparator family, exceptions, coverage quantifier, verification steps,
  frequency, anchors, and the existence of the control at all — each emit zero or more witness
  rows, and their join along introduce ≺ restate ≺ strengthen ≺ weaken ≺ remove is the
  control_delta of record.  No model, no network, no clock, no randomness: the same two tuples and
  the same signed registry produce the same verdict on any machine in any year, which is the only
  property that makes "the database refused this merge, and here is why" survive cross-examination.
  The verdict then carries the MINIMAL UNSATISFIABLE SUBSET of its own findings — the set from
  which removing any member changes the answer, computed by deletion to a fixpoint and verified
  against its own post-condition before it is returned — alongside the MINIMAL CORRECTION SET, the
  smallest set whose removal would make the edit admissible.  I14 asks for both and they are not
  the same set.
  What makes this more than a classifier is decision D8, and D8 is SQL: `mainline.clause_version`
  carries a BEFORE INSERT trigger (`z_delta_witness_required`, migration 0145, calling
  `mainline.fn_delta_witness_guard`, migration 0140) that raises P0001 when a row declares
  `control_delta IN ('weaken','remove')` on `delta_basis IN ('lattice','lattice+model')` and no
  `mainline.delta_witness` row exists for its own (clause_uuid, commit_id).  An unexplainable
  weakening verdict does not get to exist in this database — not "is flagged", not "is logged":
  cannot be stored.  A second, distinct P0001 refuses a witness set with no member flagged
  `minimal`, because I14 asks for an irreducible reason set and not a repair list.

enforcement:
  refuses:
    - "z_delta_witness_required / fn_delta_witness_guard (P0001) — a lattice weaken or remove with no delta_witness row for its own (clause_uuid, commit_id)"
    - "z_delta_witness_required / fn_delta_witness_guard (P0001) — witnesses present, none flagged minimal"
    - "delta_witness.note_stated (23514) — a witness that explains nothing"
    - "delta_witness.field_stated (23514) — a witness that names no slot"
    - "delta_witness.rule_id_closed (23514) — a rule id outside the nine"
  refusal_depth: 1
# Depth 1, and the honesty is worth more than a bigger number.
#
# The load-bearing refusal is a TRIGGER, and it cannot be a CHECK: §4.1 law 1
# forbids a CHECK expression from seeing another row, and every witness is
# another row.  So `ALTER TABLE mainline.clause_version DISABLE TRIGGER
# z_delta_witness_required` succeeds — admin can remove the guard, and what the
# custodian patrol makes impossible is removing the RECORD that they removed it.
# `tests/integration/algorithms/lattice/test_witness_or_refuse.py::test_the_guard_can_be_disabled_and_the_disabling_is_the_record`
# demonstrates the disabling rather than leaving it for a reviewer to find.
#
# The three 23514s ARE structural and they do survive DISABLE TRIGGER, but they
# are a strictly weaker statement — they refuse a blank or mislabelled witness,
# not a missing one — so they are listed separately rather than counted as a
# second layer under the same claim.
#
# What this fragment does NOT claim as its own: the merge refusal itself.  A
# `weaken` over severity ≥ 4 ancestry materialises a blocking check and the
# kernel lead's `gate_closed_when_issued` / `cr_gate_closed_when_merged`
# constraints refuse the merge (MI30).  Those are that lead's migrations and that
# lead's claim.  This worker's contribution ends at making the verdict, and the
# reasons behind it, unfalsifiable-by-omission at the moment of writing.

position: unclaimed
# Every ingredient is published and this fragment says so plainly:
#
#   * a rule catalogue that compares two versions of an artefact and decides
#     whether the change is breaking — cargo-semver-checks, japicmp, revapi, and
#     every API-compatibility checker of the last twenty years.  cargo-semver-checks
#     even calls its evidence a WITNESS.  Nothing about "run N rules over a diff
#     and report which fired" is claimed here;
#   * MUST / SHOULD / MAY as an ordered modality ladder — RFC 2119, and the
#     deontic-classification literature in legal NLP that fills it from modal cues;
#   * minimal unsatisfiable subsets — Liffiton & Sakallah and thirty years of SAT
#     and constraint-programming work on explaining infeasibility.  The minimiser
#     in witness.py is textbook deletion-based MUS extraction and is labelled as
#     such in its own docstring;
#   * a lattice/join over an ordered label set — undergraduate order theory.
#
# The claim is the composition, and it has one part that the survey did not find
# anywhere:
#
#   THE ABSENCE OF THE EXPLANATION IS A WRITE REFUSAL.
#
# Every system above computes an explanation and then RENDERS it.  The
# explanation is an output — a report, a CI annotation, a lint message — and
# nothing anywhere refuses to record the verdict when the explanation is missing.
# That asymmetry is not incidental: it is what lets a verdict be stored, cited in
# a decision, and later be impossible to reconstruct.  Here the reasons are a
# PRECONDITION of the state transition, enforced by the storage layer against
# every writer including one that has never imported this package, and the two
# statements have a normative order (witnesses first, version row second, one
# transaction) precisely because a BEFORE INSERT trigger cannot see rows written
# after it.
#
# Two smaller choices are also unclaimed as far as this survey found:
#
#   (a) THE MINIMAL SET AND THE CORRECTION SET ARE BOTH STORED AND ARE
#       DISTINGUISHED BY A COLUMN.  When four rules each independently force
#       `weaken`, the irreducible reason is any one of them and undoing one fixes
#       nothing.  Storing only the singleton is truthful and useless; storing all
#       four undifferentiated is a dump.  `delta_witness.minimal` is the column
#       that keeps I14's two questions apart, and its DEFAULT is `true` — the
#       conservative direction, so a writer that never heard of the column still
#       produces a row treated as part of the reason set.
#   (b) THE DELTA OF RECORD IS THE JOIN OF THE PARENT DIFF AND THE BLAME-ORIGIN
#       DIFF (decision D7, implemented by worker W6 over this package's `join`).
#       Twenty individually-neutral commits whose composition weakens are refused
#       at commit twenty.  No synchronic system can express that, because it has
#       no baseline other than the parent.

prior_art:
  - url: "https://github.com/obi1kenobi/cargo-semver-checks"
    what_it_covers: >-
      The closest published thing to this lattice, and the closest by a wide margin.  It runs many
      dozens of lints over two versions of a crate's public API and reports which specific rule
      fired — function_missing, and so on — with the offending item named.  Its newer, unstable
      "witness" feature generates a minimal downstream example that compiles against the baseline
      and fails against the current version, and for some lints a result whose witness does not
      confirm the breakage is DISCARDED.  That is a stronger evidential standard than anything in
      this lattice: a cargo-semver-checks witness is executable and can falsify its own finding,
      whereas a DeltaWitness is a claim about two tuples that no machine can check.  The idea of
      "a rule catalogue over two versions, each rule carrying the evidence that it fired" is
      theirs and is not claimed here.
    what_it_does_not: >-
      Nothing refuses to record a breaking-change verdict whose witness is missing.  The report is
      an output — a CI annotation a maintainer reads, a lint that can be allowed, a run that can be
      skipped — and the verdict is not stored anywhere that a later state transition is conditioned
      on.  There is also no baseline other than the previous release: a chain of individually
      non-breaking changes whose composition breaks a downstream user is not expressible, because
      there is no ancestry to diff against.  And the subject is an API, not a control with blame
      edges to an incident, so no rule can be made louder because of what the artefact is
      answerable to.
  - url: "https://link.springer.com/article/10.1007/s10817-007-9084-z"
    what_it_covers: >-
      Liffiton & Sakallah, *Algorithms for Computing Minimal Unsatisfiable Subsets of Constraints*
      (Journal of Automated Reasoning 40(1), 2008), is the reference treatment of extracting the
      irreducible core of an infeasible constraint system, including the deletion-based extraction
      that `witness.minimal_unsatisfiable_subset` implements and the MUS/MCS duality that
      `minimal_correction_set` leans on.  The minimiser here is that algorithm at a scale of nine
      items, and it is a re-implementation rather than a contribution.  The paper's algorithms are
      sound, complete and enumerate ALL MUSes; this one returns one, which is strictly less.
    what_it_does_not: >-
      An MUS explains why a constraint system is unsatisfiable.  It says nothing about how the
      explanation is stored, who may write one, or what happens when nobody writes one — the
      question that this fragment's claim turns on.  It is also an explanation of a computation
      over constraints supplied to a solver, not a precondition on a database write performed by an
      arbitrary party, and the constraint system in this domain is not adversarial in the way a
      commit author is.
  - url: "https://datatracker.ietf.org/doc/html/rfc2119"
    what_it_covers: >-
      RFC 2119 fixes MUST / MUST NOT / SHOULD / SHOULD NOT / MAY as an ordered vocabulary of
      requirement levels and is why rule R1's ladder needs no defence: the rungs and their relative
      force are the interoperability community's, not this project's, and the Australian WHS
      phrasing layered on top by `data/lexicon/deontic.toml` is standard drafting practice.
    what_it_does_not: >-
      RFC 2119 orders the keywords and stops.  It defines no comparison between two versions of one
      requirement, no notion that moving down the ladder is a distinct kind of change from rewording
      it, and no consequence for doing so.  It also has no answer for the MUST ↔ MUST NOT polarity
      inversion, which this lattice deliberately treats as non-orderable — reading that edit
      backwards does not make it a strengthening, and both directions resolve to `weaken`.
  - url: "https://aclanthology.org/2023.nllp-1.15/"
    what_it_covers: >-
      Liga & Robaldo (NLLP 2023) and the deontic-modality classification literature around it
      establish the OBLIGATION / PROHIBITION / PERMISSION taxonomy over legal text and the practice
      of assigning it from modal cues.  Detecting that a sentence's modality has been downgraded is
      published work in legal NLP and is not claimed here.
    what_it_does_not: >-
      Deontic classification labels a sentence.  It does not diff two versions of one clause, does
      not separate a modality from a HEDGE ("so far as is reasonably practicable" — routed here to
      CAT.exceptions[] where rule R4 sees it as growth), produces no irreducible reason set, and
      produces nothing a database refuses.  It is also a model task, so under principle P7 it can
      never be the component that decides a state transition; that is the shape of Path B
      (mainline-delta-oracle, worker W5), which may only ever RAISE a verdict's force.
  - url: "https://en.wikipedia.org/wiki/Management_of_change"
    what_it_covers: >-
      Management of Change is the incumbent, and it is worth naming as prior art precisely because
      it is what a site does today: a procedure edit is routed to a review board, a competent person
      judges whether it weakens a control, and the judgement is recorded in the MOC record.  Every
      question this lattice answers is already answered under MOC, by people, and usually better
      than nine rules answer it.
    what_it_does_not: >-
      The judgement is a human artefact in a workflow system, and the workflow can be completed
      without it: an MOC record can be approved with an empty rationale field, and no system state
      prevents it.  It is also synchronic — the reviewer sees the current text and the proposed
      text, not the incident that wrote the clause twenty years ago and not the twenty intervening
      edits.  The contribution here is not judging better than a review board.  It is making the
      absence of a reason a thing the storage layer will not accept, and making the baseline the
      blame origin rather than the parent.

