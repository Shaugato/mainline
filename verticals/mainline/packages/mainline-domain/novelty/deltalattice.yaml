unverified:
  - >-
    DELTA FALSE NEGATIVES ARE IRREDUCIBLE AND UNMEASURED (risk R-A1).  A real weakening that nine
    rules classify as `restate` is not argued away anywhere in this design.  It will be MEASURED by
    worker W10's mutation ratchet, per mutation class, with Wilson lower bounds, and published as a
    standing residual-risk number rather than as a launch claim.  Until that harness has reported a
    SURVIVING mutant on a deliberately weakened lattice, no kill rate from this domain means
    anything.
  - >-
    THE GUARD MAKES A WEAKENING CARRY AN EXPLANATION.  IT CANNOT MAKE THE EXPLANATION TRUE.  A
    writer who inserts a fabricated delta_witness row and then the version row satisfies it, and
    `test_witness_or_refuse.py::test_a_fabricated_witness_satisfies_the_guard` demonstrates exactly
    that on purpose.  No trigger on `clause_version` could do better: the truth of a witness is a
    fact about two Control Assertion Tuples, and §4.1 law 1 forbids a CHECK from seeing another
    row.  The dodge that a writer declares `restate` on an edit that is really a weakening is also
    NOT closed here — it is closed, if it is closed, by the matcher and the CONSERVATION OF BLAME
    MASS ledger (W8/W9) accounting for every blood-written obligation across the commit
    independently.  D8 closes one hole and names the others.
  - >-
    REFUSAL DEPTH IS 1 AND THE GUARD IS DISABLEABLE.  `ALTER TABLE mainline.clause_version DISABLE
    TRIGGER z_delta_witness_required` succeeds; a test in this suite performs it.  The claim that
    the disabling is itself an attested ledger leaf belongs to the custody domain and is NOT
    verified by this worker.
  - >-
    THE MINIMAL UNSATISFIABLE SUBSET IS A SINGLETON FOR EVERY FINDING COMBINATION THIS LATTICE CAN
    CURRENTLY PRODUCE.  The verdict is a join over nine independent rules, so the single most
    forceful finding attains the maximum on its own.  That is a true fact about the decision and
    not a weakness of the minimiser, and it is recorded here rather than dressed up: the general
    algorithm is implemented and property-tested so that a future rule whose finding is forcing
    only IN COMBINATION does not silently break the guarantee, but no such rule exists today and
    the general path is therefore exercised only by synthetic findings.
  - >-
    TWO CAT SLOTS ARE DELIBERATELY UNJUDGED AND THE COST IS UNMEASURED.  `conditions` has no rule,
    because adding a condition can narrow a control's applicability (a weakening) or state a
    pre-existing scope explicitly (a restatement) and this lattice cannot tell those apart;
    guessing fail-closed would fire on a very large fraction of ordinary edits and breach the
    nuisance ceiling (risk R-A7, under which a rule is REJECTED, not tuned).  `actor` / `action` /
    `object_class` / `hazard_energy` have no rule because a change in them is a change of IDENTITY,
    which the matcher decides.  How many real weakenings hide in those slots is unknown.
  - >-
    RULE R8 DOES NOT RUN WHEN THE CALLER SUPPLIES NO ANCHOR SETS, and the omission is silent by
    design — `LatticeDecision.anchors_considered` is how a caller finds out, and a caller that never
    reads it gets an eight-rule verdict that looks identical to a nine-rule one.  Nothing in this
    package can force a caller to pass anchors.
  - >-
    THE DELTA OF RECORD (decision D7 — the join of the parent diff and the blame-origin diff) IS
    NOT IMPLEMENTED HERE.  This package supplies `join` and a `reference` argument that does not
    care which baseline it was handed; resolving the blame origin and calling `decide` twice is
    worker W6's ORIGINDIFF.  The salami defence is therefore claimed by that fragment, not this
    one, and this package's tests prove nothing about it.
  - >-
    THE RULE CATALOGUE IS FINGERPRINTED BUT THE FINGERPRINT IS NOT YET STAMPED ON A STORED ROW.
    `rule_catalogue_fingerprint()` digests the four hand-authored decision tables so that a verdict
    computed under a quietly-edited comparator table is visibly a verdict from a different lattice —
    the same retro-tuning defence DIRECTRIX applies to `safe_direction` and M3 applies to τ.
    `mainline.clause_version` has no column for it and adding one is a schema-lead change this
    worker did not make, so today the fingerprint is computable and unrecorded.
  - >-
    THE SQL SUITE'S SPINE IS THE REAL MIGRATIONS AND IS VERIFIED ONLY WHERE A CLUSTER IS REACHABLE.
    Executed against CockroachDB CCL v26.2.5 on 2026-08-08; on a machine with no `cockroach` binary,
    no `MAINLINE_TEST_DSN` and no Docker daemon the cluster suite SKIPS with a reason, and a skipped
    run verifies nothing.  The two shape suites still run everywhere and are what remains.
  - >-
    MEASURED PLATFORM DETAIL, RECORDED BECAUSE AN EXHIBIT DEPENDS ON IT: a CockroachDB v26.2.5
    `23514` names the CHECK EXPRESSION and not the constraint — `failed to satisfy CHECK constraint
    (note != '':::STRING)` — where PostgreSQL names the constraint.  Any refusal exhibit or console
    rendering that promises to show an operator a constraint NAME for a 23514 must supply the name
    itself.  The P0001 messages are unaffected: those are ours and arrive verbatim.
  - >-
    NONE OF THIS DISTINGUISHES A CONSIDERED DISPOSITION FROM A RUBBER STAMP (risk R-A8).
    DELTALATTICE makes the question "did this edit weaken a safety control, and for what reason"
    precise, unavoidable and impossible to leave blank.  It says nothing whatsoever about the
    quality of the answer, and it must never be sold as retiring that risk.
