unverified:
  - >-
    NOTHING IN THIS FRAGMENT HAS BEEN RUN AGAINST A COCKROACHDB CLUSTER.  No cluster is reachable
    from the build machine, `cockroach` is not on PATH and AWS credentials are not valid, so every
    test under tests/integration/algorithms/candidates/ that needs one SKIPS -- with a message
    naming what was missing.  What is proven today is the offline half: statement TEXT (each
    statement is a pure function and its shape is asserted), the plan-assertion machinery (proven
    to refuse in four separate ways against committed plan fixtures), the reference band index,
    and the cost curve measured as a count.  The claims that a generated arm really plans as a
    prefix-constrained `vector search`, that the SQL band probe returns what the reference
    implementation returns, and that the application's trigram similarity equals the cluster's
    `similarity()`, are UNPROVEN until those tests run green against a real v26.2.
  - >-
    The 16 x 8 band geometry and the 5-character shingle size were transcribed from the design,
    not calibrated.  The S-curve is measured -- observed band recall tracks the analytic
    prediction across seven Jaccard buckets on a seeded corpus -- but that corpus is SYNTHETIC and
    deliberately templated, built from four subjects, four verbs, four objects and three tails.
    Character 5-grams over a real site's procedure library will not distribute the same way.
    Whether 16 x 8 puts the knee in the right place FOR THIS PRODUCT is a corpus question and it
    is open.
  - >-
    The stage bands themselves (S2 accept 0.92 with a 0.55 trigram floor, S3 accept 0.90 /
    reject 0.30, S4 accept 0.93 / reject 0.70) are the design's numbers and are UNCALIBRATED.
    No labelled corpus of real ancestor-descendant clause pairs exists yet, so no precision or
    recall figure is claimed for any of them.  The only thing that has been measured about them
    is that the S3 pair is meaningful against a token-level score and meaningless against a
    character-level one.
  - >-
    The score of record -- token-level indel similarity -- is a choice, not a result.  A weighted
    blend of the six recorded features would very likely do better and would need weights, and
    inventing weights and presenting them as measured is the exact failure this file exists to
    prevent.  Until a labelled corpus exists the score is the one quantity in the set that needs
    no parameters.
  - >-
    `trigram.py` is a re-implementation of `pg_trgm` from its published recipe and its agreement
    with CockroachDB's `similarity()` is asserted only by a test that currently skips.  Its notion
    of "alphanumeric" is Python's Unicode-aware `str.isalnum`; PostgreSQL's is locale-aware.  On
    the ASCII procedure text this system handles the two should agree and outside ASCII they may
    not.  Nothing has measured it.
  - >-
    S2's decision to require anchor-set EQUALITY (rather than compatibility) before it will
    auto-accept is conservative and untested against real edits.  It means a descendant that adds
    an equipment tag falls through to S3/S4 instead of being auto-accepted, which costs recall at
    S2 in exchange for precision.  Whether that trade is right is a corpus question.
  - >-
    `patience_similarity` is NOT symmetric -- Hypothesis found a three-token counterexample and it
    is pinned by a test.  The consequence is bounded by keeping the number out of the score of
    record, which is symmetric because it is metric-derived; but any future change that promotes
    the patience number to a score invalidates that reasoning and there is nothing in the build
    that would notice.
  - >-
    Band recall is measured; band PRECISION over a real corpus is not.  The false-candidate rate
    at low Jaccard is asserted below 10 % on the synthetic corpus and predicted at 2.65 % by the
    analytic curve, but the operational question -- how many pairs a real 40 000-clause site
    surfaces per query -- has never been run, and the sublinearity measurement here tops out at
    800 clauses.
  - >-
    None of this distinguishes a considered disposition from a rubber stamp (risk R-A8).  The
    cascade decides what must be adjudicated; it says nothing whatsoever about the quality of the
    adjudication, and it must never be sold as retiring that risk.
