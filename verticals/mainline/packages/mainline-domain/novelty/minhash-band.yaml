# Novelty fragment per docs/leads/algorithms.md §6.  Validated by
# tests/unit/domain/novelty/test_novelty_manifest.py (worker W10) and consumed
# by MECHANISMS.md generation.  Anything not yet proven belongs under
# `unverified:` and NEVER inside `claim:`.

slug: minhash-band
name: MINHASH-BAND
mechanism: M1
claim: >-
  The lexical stage of clause identity is a MinHash/LSH banding scheme whose permutation table is
  a COMMITTED, SELF-VERIFYING ARTEFACT rather than a seeded runtime value: 128 affine permutations
  over GF(2**61-1), derived by a published blake2b recipe, carrying a digest over their own
  canonical rendering, and REFUSED AT LOAD by MinHashTableError if either the digest or the
  re-derivation disagrees.  A signature is therefore reproducible byte-for-byte in any process,
  any interpreter version and any fresh environment years later -- which is asserted by running
  the computation in a second interpreter with a different PYTHONHASHSEED, not by inspection.
  Candidate generation against mainline.clause_band is sixteen primary-key point lookups, and the
  cost claim that follows is MEASURED rather than argued: over a corpus doubling four times, the
  number of pairs the stage must rescore grows 1.6x for an 8x corpus, and work per clause falls
  at every doubling.  The banding's own recall curve is measured against exhaustively-computed
  Jaccard on a seeded labelled corpus and matched to the analytic S-curve at the knee the
  parameters actually put it at, 0.7071, rather than at a rounded one.  And because banding is
  lossy by design, an ancestor the caller declared it must account for and which shared no band
  is recorded BY NAME as a band_miss at the moment it is missed, so a recall failure is a row
  rather than an absence.

enforcement:
  refuses:
    - "MinHashTableError: an altered or non-re-derivable permutation table (application)"
    - "MissingAnchorSet: an S4 candidate whose anchor set cannot be resolved (application)"
    - "ValueError: an ANN arm whose activity_root is not a specific value (application)"
  refusal_depth: 0
# Stated at ZERO, deliberately, and it is the honest number.  This package
# contains no DDL, writes no residue row and gates no state transition.  It
# produces candidates and recorded refusals; the assignment worker (W8) decides
# what becomes `identity_residue`, and the constraint that stops a merge
# (`identity_conserved_when_issued`, 23514) is already claimed at depth 1 by
# ANCHORLOCK and at depth 2 by the CBM ledger.  Claiming it a third time here
# would be counting one refusal three times, which is exactly the inflation the
# `refusal_depth` field exists to make visible.  The three entries above are
# real refusals and they are labelled `(application)` so that nobody reads them
# as database enforcement: they stop a RUN, not a MERGE.

position: re-parameterisation
# The algorithm is textbook and this manifest does not pretend otherwise.
# Min-wise independent permutations are Broder 1997; banding b x r with the
# S-curve at (1/b)^(1/r) is the standard treatment in Mining of Massive
# Datasets; 5-gram shingles, 128 permutations and a band table joined by
# equality are published practice, and `datasketch` implements all of it with
# more machinery than this package has.  The parameters here (16 x 8, 5-gram
# character shingles, blake2b-64 base hash) are a re-parameterisation of that
# work for one corpus, and they are labelled as such here and in MECHANISMS.md.
#
# Three choices around the algorithm are not standard practice, and they are
# small.  They are stated at their real size rather than dressed up:
#
#   (a) THE PERMUTATION TABLE IS EVIDENCE.  Every implementation surveyed seeds
#       its permutations from an RNG whose seed is a constructor argument or a
#       library default.  That is fine when the output is a recommendation and
#       fatal when the output is which ancestor clause a fatality's obligation
#       was compared against.  Here the coefficients are a file in the
#       repository with a declared minhash_version, a digest over their own
#       canonical rendering, and a derivation recipe printed inside the file;
#       load_params(verify=True) re-runs the recipe and REFUSES the file if it
#       disagrees.  Changing a permutation is a migration -- it changes every
#       band_hash in mainline.clause_band -- and the file says so.
#
#   (b) A MISS IS A NAMED ROW, NOT AN ABSENCE.  Banding is probabilistic: a
#       pair at Jaccard 0.5 shares a band about 0.6 % of the time.  Every
#       system surveyed treats that as an accepted recall loss and reports
#       aggregate recall.  Here the stage takes the set of ancestors the caller
#       must account for and emits a `band_miss` naming each one it failed to
#       surface, at the moment of the failure.  The stage's recall loss is
#       therefore enumerable per obligation rather than estimable per corpus,
#       which is what lets the conservation identity in the CBM ledger be an
#       equality instead of an inequality.
#
#   (c) THE SCORE OF RECORD WAS CHOSEN BY MEASUREMENT AND THE MEASUREMENT IS
#       KEPT.  Character-level indel similarity puts two unrelated English
#       sentences at about 0.40, so the design's 0.30 auto-reject band would
#       never have fired on it; the token-level form puts the same pairs at
#       0.07 and 0.15 and a genuine two-word paraphrase at 0.92.  The stage
#       scores on tokens for that reason, the character-level numbers are kept
#       as features beside it, and the pair that decided it is pinned by a test
#       so the choice can be revisited if the data changes.  None of this is
#       novel; recording *why* a threshold is where it is, in a form that
#       breaks when the reason stops holding, is the part that is not routine.

prior_art:
  - url: "https://doi.org/10.1109/SEQUEN.1997.666900"
    what_it_covers: >-
      Broder, *On the Resemblance and Containment of Documents* (SEQUENCES '97), introduces
      min-wise independent permutations: hash a document's shingle set under k permutations, keep
      the minimum of each, and the fraction of agreeing minima is an unbiased estimator of the
      sets' Jaccard similarity.  That is exactly the estimator implemented in `minhash.py`, with
      no modification whatsoever, and this manifest claims none.
    what_it_does_not: >-
      The paper is about an estimator and its variance.  It has nothing to say about where the
      permutations come from operationally, because in a research setting an RNG is an adequate
      source.  The requirement that a signature computed today be re-derivable from committed
      bytes by an adversarial third party years later is an evidentiary requirement, not a
      statistical one, and it is what makes the permutation table here a versioned artefact with
      a load-time refusal rather than a seed.
  - url: "http://www.mmds.org/"
    what_it_covers: >-
      Leskovec, Rajaraman and Ullman, *Mining of Massive Datasets*, chapter 3, gives the standard
      treatment of LSH banding: split a signature of length b*r into b bands of r rows, declare a
      candidate pair when any band agrees, and note that the probability of that is
      1 - (1 - J**r)**b with the steepest point near (1/b)**(1/r).  The 16 x 8 geometry, the
      S-curve and the knee formula in `minhash.py` are that chapter, restated.
    what_it_does_not: >-
      The textbook treats the S-curve as a design tool and the resulting recall as an accepted
      loss to be reported in aggregate.  Nothing in it addresses what happens to a *specific*
      item the scheme failed to surface, because in a duplicate-detection setting no such
      obligation exists.  Here it does: the stage is given the set of ancestors it must account
      for and emits a `band_miss` naming each one it missed, which converts an aggregate recall
      figure into per-obligation rows a human has to dispose of.
  - url: "https://ekzhu.com/datasketch/lsh.html"
    what_it_covers: >-
      `datasketch`'s MinHashLSH is the widely used implementation of exactly this stage: MinHash
      signatures, banding, tunable thresholds, and an index that answers approximate-Jaccard
      queries.  It does the job well and this package does not do it better.
    what_it_does_not: >-
      Its permutation coefficients come from a seeded RNG inside a library whose version is a
      dependency-resolution outcome, so a signature is reproducible only for as long as the
      resolution is.  It also has no notion of an index whose contents live in a SQL table that
      other processes join against by equality, which is the shape `mainline.clause_band` needs
      in order for candidate generation to be sixteen primary-key point lookups with a plan the
      CI can assert.  The decision not to depend on it (D3) is about evidence and about the
      storage shape, not about quality.
  - url: "https://git-scm.com/docs/gitdiffcore"
    what_it_covers: >-
      git's diffcore documents both halves of what `patience_diff.py` does: rename detection by
      content similarity with a tunable threshold, and the histogram/patience diff family that
      anchors on rare elements before recursing into the gaps.  Bram Cohen's patience algorithm
      -- unique-common lines, longest increasing subsequence, recurse -- is implemented here
      unchanged, and git's implementations are more mature than this one.
    what_it_does_not: >-
      git produces a diff for a human to read and a rename decision for a merge to use; a wrong
      rename produces a confusing patch.  Here the diff's job is to be the WITNESS attached to a
      candidate that a person signs a disposition against, and the tokens the longest increasing
      subsequence had to drop are reported as moves so that a re-ordering is legible as a
      re-ordering rather than as a rewrite -- which matters because "this looks like a rewrite"
      is what an author hiding a deletion inside a reflow would want it to look like.  git also
      has no analogue of the asymmetry finding recorded in `patience_similarity`: because the
      number is not symmetric, it is deliberately kept OUT of the score of record.
  - url: "https://tlsh.org/"
    what_it_covers: >-
      TLSH is the strongest published fuzzy-hash family for byte-level document identity, beating
      ssdeep on accuracy and speed and yielding a distance rather than a bounded score, which
      lets an operator set explicit false-positive/false-negative trade-offs.
    what_it_does_not: >-
      TLSH requires at least 50 bytes and is tuned for binary and document-scale inputs; a great
      many safety clauses are one sentence, so the primary lexical stage here is MinHash/LSH and
      TLSH is left to whole-document re-template triage.  That is a scoping decision recorded
      here so that the absence of TLSH from this package reads as a decision rather than as an
      oversight.  ssdeep is deliberately absent from the design entirely.
  - url: "https://www.cockroachlabs.com/docs/stable/vector-indexes"
    what_it_covers: >-
      Cockroach Labs documents that a vector index is used only if each prefix column is
      constrained to a specific value, and gives the ORDER BY <=> ... LIMIT form that an ANN
      lookup takes against a `vector_cosine_ops` index.  `semantic.py`'s arm is that form.
    what_it_does_not: >-
      The documentation states the condition; it does not give a way to know that a particular
      statement met it.  `explain.py` turns the condition into four separate assertions -- a
      `vector search` node exists, it reads `ce_ann`, its `prefix spans` are present and
      non-empty, and no node anywhere in the plan is a FULL SCAN -- and the fourth is the one a
      reading of the docs would not suggest, because a plan can contain a correct vector search
      node beside a scan that reads the whole table.  The vendor page has since also noted that
      multiple prefix values may be filtered with IN while keeping index acceleration; this
      package still fans out into single-value arms, because a fan-out has exactly one possible
      plan shape and "may" is not a property a cost claim can rest on.

