unverified:
  - >-
    NOTHING IN THIS FRAGMENT IS ENFORCED BY THE DATABASE, AND THE REFUSAL DEPTH IS THEREFORE ZERO.
    Every refusal listed above is a Python exception.  The ratchet's guarantee is that the delta
    of record is never lowered by the model; turning that delta into a refused merge is
    DELTALATTICE's trigger and the kernel lead's merge-gate CHECK constraints, and this worker
    verifies neither.  A deployment that computed the verdict correctly and then ignored it would
    satisfy every test in this manifest.
  - >-
    THE CONFIDENCE SCALE IS AN ORDINAL ENCODING, NOT A CALIBRATED POSTERIOR.  The adjudication
    profile emits a named band — low / medium / high — which `mapping.BAND_CONFIDENCE` maps to
    0.25 / 0.55 / 0.85 so that it can be compared against theta.  NOTHING HAS MEASURED HOW OFTEN A
    `high` IS RIGHT.  theta must therefore be read as "which bands count" and never as a
    probability threshold, and any published statement of the form "the model was 85% confident"
    would be false.  The band map is versioned (`band.v1`) so a retune is a visible commit, which
    makes the number traceable, not calibrated.
  - >-
    NO RESPONSE IN THIS REPOSITORY HAS BEEN NEAR BEDROCK.  All eleven committed scenarios carry
    `provenance: "synthetic"`; the live lane is code that has never executed against AWS, because
    credentials were not valid on the build machine as of 2026-08 (PL-3).  Real refusal rates on a
    cyanide or H2S corpus, real Guardrail behaviour, real throttle behaviour, real latency and
    real agreement between Path A and Path B are all UNMEASURED.  The cassette suite proves the
    code paths; it proves nothing about a model.
  - >-
    THE RATCHET CONSTRAINS THE CODOMAIN, NOT THE CONTENT.  A model that fabricates a plausible
    rationale still fabricates it, and that rationale is still stored as evidence attached to a
    record.  Two deterministic checks reduce the surface — the supporting quote must be verbatim
    in the descendant text, and an `entails` that admits a numeric disagreement must quote a
    number — and neither is a check on whether the reasoning is sound.  Content authenticity is
    out of scope; provenance is in scope; this fragment is about neither.
  - >-
    THE MODEL CAN MAKE THE GATE LOUDER WITHOUT BOUND AND THE NUISANCE RATE IS UNMEASURED.  A Path
    B that abstained on everything would block every merge, and nothing in this design prevents
    it: the asymmetry that makes the ratchet safe is exactly the asymmetry that makes it
    weaponisable in the annoying direction.  That is a monitoring and operating-point question
    (risk R-A7's nuisance ceiling, under which a rule is REJECTED rather than tuned) and it is not
    answered here.
  - >-
    PROMPT-INJECTION RESISTANCE IS NOT CLAIMED.  The layered defences — untrusted text inside a
    per-request random sentinel in a user turn, a strict schema, no tools — are agentkit's and are
    asserted there.  What is asserted here is strictly weaker and strictly checkable: injected
    prose that survives every layer never becomes a term in the decision.  An attacker who
    controls Path B entirely can still cause nuisance blocks, and the catalogue says so.
  - >-
    THE SILENCE ROW IS BUILT AND VALIDATED IN PYTHON AND IS NOT ROUND-TRIPPED AGAINST A CLUSTER
    HERE.  `SilenceRecord` re-states the `mainline_meas.silence_ledger` CHECK vocabularies from
    ARCHITECTURE.md §5.7 and refuses a row the database would refuse, but the INSERT itself is the
    caller's and no integration test in this worker's scope has performed one.  A drift between
    the re-stated vocabulary and the shipped DDL would be caught only by the datamodel lead's
    suite.
  - >-
    THE AST BOUNDARY TEST COVERS ONE DISTRIBUTION.  It walks `mainline-domain` and asserts that no
    module of it can reach a model, which is the code-path half of §8.2's four enforcements for
    the package that holds the lattice.  It says nothing about any other distribution in the
    repository, and the IAM, network-route and prompt-path halves of that boundary are owned
    elsewhere and are not verified by this worker.
  - >-
    THE RESOLUTION IS TOTAL OVER THE ENUM, NOT OVER THE WORLD.  The 100 cells cover every
    combination of the five `mainline.control_delta` members with the two flags.  A sixth enum
    member added to the SQL type without a corresponding row would make `_freeze()` raise at
    import — which is the correct failure — but nothing in this package watches the SQL type, so
    the discovery happens the first time someone imports the module after the migration.
  - >-
    NONE OF THIS DISTINGUISHES A CONSIDERED DISPOSITION FROM A RUBBER STAMP (risk R-A8).  The
    ratchet guarantees that a model cannot clear a gate.  A person can, by signing a disposition,
    and whether that signature reflects thought is outside everything this design can see.  It
    must never be sold as retiring that risk.
