unverified:
  - >-
    The refusal named in `enforcement.refuses` is not yet running.  `identity_conserved_when_issued`
    lives in DDL owned by the kernel lead (ARCHITECTURE.md §5.5) and the `identity_residue` rows it
    counts are written by W8's cascade orchestrator; neither migration has landed at the time this
    fragment was written.  What is proven today is that this package computes the veto and the drop
    correctly on committed fixtures — the fact that a merge STOPS because of them is, until those
    migrations exist and an integration test observes 23514, an unproven claim and is deliberately
    absent from `claim:`.
  - >-
    Gazetteer coverage is a corpus question and is unmeasured.  The equipment, instrument,
    isolation, citation, role and setpoint-unit lists are hand-built from the demo corpus's
    vocabulary; their recall over a real site's procedure library is unknown.  Under-coverage fails
    towards MORE anchors, not fewer, because an unknown hyphenated LETTERS-DIGITS token is still
    extracted as an equipment_tag — so the cost of under-coverage is nuisance adjudication rather
    than a silent pass.  The false-anchor rate that this fail-closed choice buys is likewise
    unmeasured until W10's SURVIVE catalogue reports it.
  - >-
    Anchor extraction is monolingual (English) and assumes the ISA/tag conventions the demo corpus
    uses.  Nothing in the design is language-specific, but nothing has been tested outside them.
  - >-
    Compensation is decided by CLASS, not by equivalence: a citation replaced by a different
    citation counts as compensated and is routed to `compatible_with`, which reports a conflict.
    That routing is correct in every case constructed so far, but "an added anchor of the same
    class always means the drop was deliberate" is an assumption about author behaviour and is not
    provable from the data.  The failure mode it admits — drop A and add unrelated B in one edit —
    is caught by the conflict path rather than the drop path and therefore still blocks; if a case
    is found where it blocks NEITHER, the compensation rule is the thing that was wrong.
  - >-
    `compatible_with` is symmetric and reflexive but NOT transitive, and nothing in the cascade may
    assume that it is.  This is asserted by test on constructed sets, not proven over the corpus.
  - >-
    None of this distinguishes a considered disposition from a rubber stamp (risk R-A8).  ANCHORLOCK
    decides what must be adjudicated; it says nothing whatsoever about the quality of the
    adjudication, and it must never be sold as retiring that risk.
