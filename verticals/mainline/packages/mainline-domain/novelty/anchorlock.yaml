slug: anchorlock
name: ANCHORLOCK
mechanism: M1
claim: >-
  Seven model-free token classes are extracted from canon_text by regex over committed
  gazetteers, and the resulting set is used twice against one edit: a CONFLICT in any of the five
  identity classes VETOES a semantic match the embedding scored 0.97, and an UNCOMPENSATED DROP
  of an identity anchor raises a control_delta='weaken' candidate with no model in the loop and
  writes identity_residue.reason='anchor_drop'.  An edit therefore has nowhere to go: keep the
  tag and the match holds, change the tag and the match is refused, delete the tag and the drop
  fires — and the drop is the branch the merge gate refuses on.  The word lists that decide all of
  this are committed, version-declared and folded into one 32-byte gazetteer fingerprint, so an
  anchor decision can be re-derived years later from the exact bytes that made it.

enforcement:
  refuses: ["identity_conserved_when_issued (23514)"]
  refusal_depth: 1
# Stated at its true depth, not inflated.  This package writes no SQL.  What it
# produces is `clause_version.anchor_set` and the `identity_residue` rows whose
# reason is 'anchor_drop'; the refusal itself is `CHECK
# identity_conserved_when_issued` on permit/change_request (ARCHITECTURE.md
# §5.5, MI03, 23514), projected by `fn_residue_counter` and owned by the kernel
# lead, with the second, structural layer (`cbm_balances`) owned by W9 and
# claimed in cbm-ledger.yaml.  Refusal depth here is 1 because ANCHORLOCK
# contributes exactly one refusing constraint; depth 2 is CBM's claim, not this
# one's.  The `unverified:` block below says plainly that those migrations have
# not landed yet.

position: unclaimed
# The extraction is not the claim and is not new — see the prior art below, all
# of which does gazetteer/dictionary entity recognition better than this does.
# The unclaimed part is the COUPLING, and it has three parts that the surveyed
# systems do not put together:
#
#   (a) an anchor conflict is a VETO OVER COSINE rather than a feature fed into
#       the score.  A semantic candidate at 0.97 with a different equipment tag
#       is rejected outright.  Record linkage blocks on identifiers to make the
#       comparison cheaper; here the identifier is allowed to overrule an
#       accepted comparison, and it overrules it in the direction of MORE
#       adjudication, never less.
#   (b) the DISAPPEARANCE of an anchor between two versions of one clause is an
#       independent weakening signal, not a diff artefact — and the reference it
#       is measured against is the BLAME-ORIGIN version, not the parent (W6),
#       so twenty commits that each drop nothing but whose composition drops an
#       isolation point are still visible.
#   (c) the output of (b) is a ROW THE DATABASE REFUSES TO MERGE OVER, not a
#       report.  The entity-consistency literature scores a rewrite; nothing
#       found makes an entity's absence a write precondition on a state
#       transition.
#
# 'setpoint' and 'named_role' are deliberately excluded from the identity
# classes, and that exclusion is part of the claim: were a setpoint an identity
# anchor, every legitimate setpoint move would present as a non-match and the
# weakening would hide behind an 'unmatched' residue row instead of being
# adjudicated as the weakening it is by lattice rule R2_SETPOINT.

prior_art:
  - url: "https://spacy.io/api/entityruler"
    what_it_covers: >-
      spaCy's EntityRuler is a pipeline component for rule-based named entity recognition: it adds
      entities by token patterns or exact phrase match, standalone or alongside a statistical NER
      model.  That is precisely the extraction technique used here — patterns plus committed word
      lists — and it does it with more machinery than this package has.
    what_it_does_not: >-
      An EntityRuler produces annotations for a downstream consumer to use as it likes.  It defines
      no relation between two versions of one document, so it has no notion of an entity's absence
      being an event; and nothing in the component or its ecosystem overrides a similarity
      judgement, because a rule-based recogniser has no similarity judgement to override.  The
      gazetteers here are additionally immutable evidence — loaded once from committed TOML,
      never fetched — because a word list that can drift between runs makes anchor drop
      unfalsifiable.
  - url: "https://www.census.gov/content/dam/Census/library/working-papers/1993/adrm/rr93-8.pdf"
    what_it_covers: >-
      Winkler, *Matching and Record Linkage* (U.S. Bureau of the Census RR93-8), states the
      Fellegi–Sunter probabilistic linkage model and the standard practice of blocking on
      deterministic identifiers before scoring: identifiers reduce the comparison space and
      dominate weak evidence.  Hard identifiers constraining a probabilistic match is old, and
      this manifest does not claim otherwise.
    what_it_does_not: >-
      Record linkage decides whether two records describe the same entity, and blocking exists to
      make that cheaper — a blocking key that disagrees means the pair is never compared, which is
      a silent negative.  ANCHORLOCK inverts the consequence: a disagreeing identity anchor on an
      otherwise-accepted pair produces a BLOCKING ROW that a human must dispose of, and a
      *missing* anchor produces a weakening verdict.  Linkage has no analogue of an anchor
      disappearing over time, because its records do not have ancestry, and it has no analogue of
      a refusal, because its output is a linked file rather than a state transition.
  - url: "https://arxiv.org/abs/1910.12840"
    what_it_covers: >-
      Kryściński et al., *Evaluating the Factual Consistency of Abstractive Text Summarization*
      (FactCC), checks a generated text against its source for factual conflicts, and the entity-
      overlap family of metrics around it treats named entities that appear in a rewrite but not
      in the source as a hallucination signal.  Comparing entity sets across a rewrite to detect
      unfaithfulness is published work.
    what_it_does_not: >-
      Those metrics score a document pair and report a number, and they run in the OTHER direction
      — entities *added* by the model are the hallucination.  Here the signal is an entity
      *removed* by a human author, measured against the blame-origin version rather than the
      immediate input, restricted to five typed identity classes so that a paraphrased role or a
      moved setpoint is routed to the lattice instead of being double-counted, and terminating in
      a database row rather than a score.  No consistency metric found is a precondition of a
      write.
  - url: "https://git-scm.com/docs/gitdiffcore"
    what_it_covers: >-
      git's diffcore rename and copy detection matches files across revisions by content
      similarity with a threshold tunable via -M/-C (default 50%), which is the closest widely
      deployed analogue of "decide identity across a revision by similarity".
    what_it_does_not: >-
      git's similarity is content-only: a rename is accepted at the threshold regardless of which
      identifiers inside the file changed, and there is no token class whose disagreement can veto
      an accepted rename or whose disappearance is itself reported.  git also has nothing to
      refuse — a rename detection that is wrong produces a confusing diff, not an unsafe permit,
      so the asymmetry that governs every choice in this module does not exist there.
  - url: "https://www.cas.org/support/documentation/chemical-substances/checkdig"
    what_it_covers: >-
      CAS publishes the check-digit rule for a CAS Registry Number (weighted sum over the digits
      of the first two groups, modulo 10).  The validation implemented in `anchors/cas.py` is that
      published rule, unchanged.
    what_it_does_not: >-
      The published rule exists to catch transcription errors in a chemical database.  It is used
      here for the opposite failure: an identity-class anchor VETOES matches, so a false CAS
      anchor manufactures residue for a clause nobody touched.  Validating the checksum — and
      rejecting zero-padded bodies, which are dates and part numbers wearing the shape — is what
      keeps `2019-05-1` from becoming a chemical identity and blocking a permit.

