unverified:
  - >-
    The re-normalisation migration that a canon_version bump would require does not exist yet.
    CANON_VERSION is 1 and has never been bumped, so the claim "bumping it is a migration" is
    currently enforced by documentation, a test that the constant is not configurable, and the
    version being bound into the digest preimage -- not by a migration anyone has run.
  - >-
    The de-hyphenation lexicon is small and hand-built.  Its false-join and false-keep rates on a
    real site's procedure library are unmeasured; the mutation ratchet (W10, SURVIVE catalogue)
    is where that number will come from, and until it does, "reflow-invariant" is proven on the
    committed fixtures and the generated property inputs only.
  - >-
    Page-furniture stripping by repetition needs the containing document's pages.  A clause handed
    over without document context gets only the unconditional patterns, so furniture unique to one
    page survives into canon_text.  This is a known recall cost, not a correctness bug, and it is
    why FurnitureModel.from_pages exists.
  - >-
    The confusable repair does not fix damage to the LEADING character of a number, nor damage
    inside an equipment tag, nor a number glued to its unit.  Those are deliberate refusals to
    guess, and each one costs a match and produces adjudicable residue.  Their frequency in
    scanned procedure text is unmeasured.
