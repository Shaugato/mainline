unverified:
  - >-
    APPEND-ONLY IS NOT ENFORCED ON mainline.commutation_edge.  MI01 is cited in 0049b's header and
    its BEFORE UPDATE/DELETE trigger is OWED, not written: one file carries one statement, the
    trigger belongs in the vertical trigger band 0145-0149, and this worker holds no number there.
    An owner-level UPDATE succeeds today and an integration test performs one to prove it.  Until
    that trigger lands the table is append-only by GRANT and by convention, which is a materially
    weaker statement than the one MI01 makes.
  - >-
    THE FOOTPRINT IS WIDE AND THE NUISANCE COST IS UNMEASURED.  Reading "touched" as IN SCOPE OF
    rather than CHANGED BY means edits commute less often and more dependency edges exist.  That
    is the fail-closed direction — a wider antecedent set can only make a gate louder — but HOW
    MUCH louder on a real corpus is a number nobody has.  Risk R-A7 says a rule that breaches the
    nuisance ceiling is REJECTED, not tuned, and this reading has not been measured against that
    ceiling.  Worker W10's mutation ratchet is what would measure it.
  - >-
    control_class_key() IS THIS PACKAGE'S DERIVATION AND IS JOINED TO NOTHING.
    ARCHITECTURE.md §5.4 describes mainline.control_failure.control_class as "the JOIN KEY to a
    clause's CAT control class", and no module in this repository derives that key from a CAT.
    The `control:` token here is used ONLY to decide commutation between two edits computed by
    this same package.  It is NOT joined against control_failure and any future code that wants to
    join them must first prove the two derivations agree — a claim this worker does not make.
  - >-
    NO CORPUS-SCALE DERIVATION HAS BEEN RUN.  derive_commutation_edges is quadratic in the number
    of edits and the docstring states the bound rather than hiding it: the intended input is the
    edits in one commit, which is tens of clauses.  A caller applying it across a whole history
    must partition first, by site and by document family, and this package deliberately will not
    do that for them — a partitioning rule chosen inside a derivation is a rule nobody reviews.
    Nobody has yet run it over the demo corpus, so neither the edge count nor the runtime is known.
  - >-
    THE OVERLAP IS EXACT BUT IT IS NOT SEMANTIC.  Two clauses about the same physical pump under
    two different tag conventions — P-101A in one document and 101-P-A in another — produce
    disjoint footprints and are reported as commuting.  Anchor NORMALISATION is worker W1's
    (mainline_domain.anchors), it is gazetteer-driven and model-free by design, and whatever it
    cannot normalise this relation cannot see.  That is a recall failure in the dependency
    derivation and it is silent.
  - >-
    AN EMPTY FOOTPRINT IS A REFUSAL IN PYTHON AND NOTHING IN SQL.  commutes() raises on one, and
    derive_commutation_edges skips it and reports it through unfootprintable() — but a clause the
    footprinter cannot read produces NO ROW, and no row is indistinguishable from "commutes with
    everything" to a reader of the table.  Mapping such a clause to
    identity_residue.reason='opaque_control' is the intended handling and it belongs to worker W8;
    this package does not do it and does not verify that anybody does.
  - >-
    EXECUTED AGAINST CockroachDB CCL v26.2.5 IN DOCKER ON 2026-08-09.  The four CHECKs, both
    composite foreign keys and the primary key were exercised and refused as claimed.  On a
    machine with no `cockroach` binary, no MAINLINE_TEST_DSN and no Docker daemon the cluster
    suite SKIPS with a reason, and a skipped run verifies nothing; the shape suite still runs
    everywhere and is what remains.
  - >-
    MEASURED PLATFORM DETAIL, RECORDED BECAUSE AN EXHIBIT DEPENDS ON IT: a CockroachDB v26.2.5
    23514 names the CHECK EXPRESSION and not the constraint — `failed to satisfy CHECK constraint
    (COALESCE(array_length(footprint_overlap, 1), 0) >= 1)` — where PostgreSQL names the
    constraint.  Any refusal exhibit or console rendering that promises an operator a constraint
    NAME for a 23514 must supply the name itself.  Worker W4 recorded the same measurement for
    mainline.delta_witness.
