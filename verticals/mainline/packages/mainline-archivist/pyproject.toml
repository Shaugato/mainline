[project]
name = "mainline-archivist"
version = "0.1.0"
description = "The Archivist — ingest and appraise, with every field of an event row a coded fact, a verbatim span, or a capped model rating that cannot arm the gate."
readme = "README.md"
requires-python = ">=3.13"
# FSL-1.1-ALv2 per the repository licence map (verticals/mainline/* is FSL).
# The licence TEXT lives in the repo-root LICENSES/ tree, outside this project
# directory, and therefore cannot be referenced by `license-files`: under PEP 639
# a glob that matches nothing is a build error.
license = "LicenseRef-FSL-1.1-ALv2"
authors = [{ name = "MAINLINE contributors" }]
keywords = ["mainline", "archivist", "ingest", "severity", "cockroachdb"]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Private :: Do Not Upload",
]

# TWO DEPENDENCIES, AND THE ABSENCES ARE THE ARGUMENT.
#
# `mainline-agentkit` because the Archivist's two calls — triage and extraction —
# are `quarantined_call()`s, and there is exactly one call shape in this
# repository. Depending on it is what makes "the Archivist holds no tool" a
# property of the signature it calls rather than a promise in a docstring.
#
# `mainline-quarantine` because layers 2-6 of the injection posture are that
# package's, and a second screen here would be a second answer to "was this
# document hostile".
#
# DELIBERATELY ABSENT — any database driver. This package builds statements and
# parameters and hands them back; the caller opens the connection and holds
# `agent_ingestor`. That absence is what `mainline-boundary`'s E3 SBOM scan reads,
# and `tests/unit/archivist/test_starvation.py` walks this package's AST to keep
# it true.
#
# DELIBERATELY ABSENT — `boto3`. The S3 and Textract legs are an EXTRA and their
# imports are inside the methods that use them, so a process that ingests a
# document off local disk never loads a cloud SDK. AWS credentials are not valid
# on the build machine (PL-3), so nothing on a dated path may require one.
dependencies = [
  "mainline-agentkit",
  "mainline-quarantine",
]

[project.optional-dependencies]
# The custody-preamble source leg: S3 GetObject on an Object-Locked version, and
# Textract DetectDocumentText. OFF by default, never exercised in CI, and
# NOT EXECUTED ANYWHERE as of 2026-08-09 — see the honesty note in `source.py`.
aws = ["boto3>=1.35"]
# ANCHORLOCK for layer 4. An extra rather than a hard dependency, exactly as
# `mainline-quarantine` treats it: the committed-gazetteer fallback is real code.
domain = ["mainline-domain"]

[tool.uv.sources]
mainline-agentkit = { workspace = true }
mainline-quarantine = { workspace = true }
mainline-domain = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mainline_archivist"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["mainline_archivist"]

# `boto3` is an extra, so it is legitimately absent from the environment a strict check
# runs in. Mirrors `mypy.ini`'s repo-level `[mypy-boto3.*]` section rather than adding a
# `type: ignore` at the import site, which would go stale the moment the extra is
# installed.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*"]
ignore_missing_imports = true
