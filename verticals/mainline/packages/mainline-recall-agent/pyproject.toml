[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mainline-recall-agent"
version = "0.1.0"
description = "MAINLINE recall agent — model providers (embeddings, Claude listwise judge), offline-first."
readme = "README.md"
requires-python = ">=3.13"
# FSL-1.1-ALv2 per the repository licence map (verticals/mainline/* is FSL).  The licence
# TEXT lives in the repo-root LICENSES/ tree, which is outside this project directory and
# therefore cannot be referenced by `license-files` — under PEP 639 a `license-files` glob
# that matches nothing is a build error, so the key is deliberately absent rather than
# pointing at a file that is not here.  Matches the sibling `mainline-domain` package.
license = "LicenseRef-FSL-1.1-ALv2"
authors = [{ name = "MAINLINE contributors" }]
keywords = ["mainline", "trappoint", "recall", "bedrock", "embeddings"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

# Runtime dependencies.
#
# `anthropic` and `boto3` are import-time-light and are declared here because the judge
# provider and the inference-profile resolver are part of the shipped surface. They are
# nonetheless imported LAZILY (inside the call that needs them) so that the cassette
# replay path — the CI and demo default — works in an environment where neither the SDK
# nor AWS credentials exist.
#
# `sentence-transformers` is deliberately an EXTRA, not a runtime dependency: it drags
# torch (~1 GB of wheels) and, more decisively, the bge-large weights themselves require
# a network fetch. The package's stated contract is that it runs with no AWS account and
# no network; a hard dependency that cannot be satisfied offline would make that false.
# Install `mainline-recall-agent[local-embed]` on a machine that will actually encode.
dependencies = [
  "anthropic>=0.40",
  "boto3>=1.35",
  "numpy>=2.0",
  "pydantic>=2.9",
]

[project.optional-dependencies]
local-embed = ["sentence-transformers>=3.0"]

[project.urls]
Homepage = "https://github.com/Shaugato/mainline"

[tool.hatch.build.targets.wheel]
packages = ["src/mainline_recall_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/mainline_recall_agent/providers/data" = "mainline_recall_agent/providers/data"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "anthropic.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF", "SIM", "TID", "PL"]
ignore = [
  # Keyword-only constructors here take a provider identity (model, revision, region,
  # transport, store, provenance, side, note). Bundling them into a config object would
  # hide exactly the fields that must appear in `recall_run`.
  "PLR0913",
  # Exception names are the domain vocabulary the callers branch on and the silence
  # ledger records: `ModelRefusal`, `DeadLetter`, `CassetteMiss`, `ProviderUnavailable`.
  # `ModelRefusalError` would be worse: a refusal is not our error, it is the model's
  # answer, and the name is what the reader of a silence_ledger row sees.
  "N818",
  # Every deferred import in this package is load-bearing, not laziness: `boto3`,
  # `anthropic` and `sentence_transformers` must NOT be imported at module scope, because
  # the cassette replay path — the CI and demo default — has to work on a machine where
  # none of them is installed. Hoisting them would make `import mainline_recall_agent`
  # fail offline, which is precisely the failure this package exists to avoid.
  "PLC0415",
]
