[project]
name = "mainline-cartographer"
version = "0.1.0"
description = "MAINLINE blame resolver — resolves a clause's blame pointer, and proposes provisional blame edges that can never block."
readme = "README.md"
requires-python = ">=3.13"
# FSL-1.1-ALv2 per the repository licence map (verticals/mainline/* is FSL).
# The licence TEXT lives in the repo-root LICENSES/ tree, outside this project
# directory, and therefore cannot be referenced by `license-files`: under PEP 639
# a glob that matches nothing is a build error.
license = "LicenseRef-FSL-1.1-ALv2"
authors = [{ name = "MAINLINE contributors" }]
keywords = ["mainline", "blame", "cartographer", "provenance", "bedrock"]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Private :: Do Not Upload",
]

# TWO DEPENDENCIES, AND THE SECOND ONE IS THE ARGUMENT.
#
# `mainline-agentkit` rather than `boto3`: there is exactly ONE model surface in
# this repository. A second Bedrock client here would be a second place for the
# residency assertion, the zero-tool call shape, the stop_reason-before-content
# ordering and the one-retry-then-dead-letter rule to drift apart. agentkit's own
# runtime dependency is `pydantic` alone, so the offline lane installs no AWS SDK.
#
# There is deliberately NO database driver. This package builds rows and statements
# and hands them back; the caller holds the SQL role. That absence is what
# `mainline-boundary`'s E3 SBOM scan reads, and it is why nothing here can write
# the field the gate reads even by accident.
dependencies = [
  "mainline-agentkit",
]

[project.optional-dependencies]
# The live Bedrock leg, off by default and never exercised in CI (PL-3). Reaching
# it needs this extra AND `MAINLINE_AGENT_PROVIDER=bedrock`.
bedrock = ["mainline-agentkit[bedrock]"]

[tool.uv.sources]
mainline-agentkit = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mainline_cartographer"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["mainline_cartographer"]
