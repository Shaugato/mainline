#
# HISTORICAL FIXTURE REVISIONS — the ancestors every mutation is applied to.
#
# WHAT THESE ARE
# --------------
# Nine clause revisions in the shape a real procedure library carries them:
# a numbering prefix, page furniture, a stated control, an equipment tag or a
# citation, and a verification step.  They are AUTHORED, not extracted from any
# real site's documents, and nothing here is a transcript of a real incident,
# permit or standard.  The document families are the breakdown axis of the
# published metric: a kill rate that is high on permits and low on ventilation
# standards is two facts, and an aggregate reports neither.
#
# WHY THE PARAMETERS MATTER
# -------------------------
# `parameter` is the DIRECTRIX key the CAT extractor resolves this clause's
# setpoint to, RECORDED HERE AS AN EXPECTATION rather than as an input: the
# harness re-extracts it and `tests/e2e/mutation/test_fixtures.py` refuses a
# fixture whose recorded parameter is not what the extractor produces.  A
# fixture that quietly stopped resolving would silently move every setpoint
# mutant into the "inapplicable" bucket and raise the published kill rate by
# removing its hardest trials.
#
# `directrix_ratified = false` is not a defect in the fixture.  It is a MEASURED
# coverage gap between two committed tables — `data/lexicon/parameter.toml`
# resolves the phrase to one key and `data/registry/safe-direction-seed.toml`
# ratifies a differently-spelled one — and it is exactly the risk R-A4 that
# decision D6 makes fail closed.  The setpoint-nudge classes decline those
# fixtures (OperatorInapplicable) rather than counting a kill that DIRECTRIX
# would have produced by abstaining, because an abstention-driven kill measures
# the registry's coverage and not the lattice's arithmetic.
#
# `furniture_lines` are the page furniture the canonicaliser is expected to
# strip.  They are stored separately from `raw_text` so that the SURVIVE
# operators that migrate a template or relocate an appendix have something real
# to change.

[meta]
version = 1
families = [
  "pressure-systems-standard",
  "hot-work-permit",
  "gas-testing-procedure",
  "isolation-procedure",
]

