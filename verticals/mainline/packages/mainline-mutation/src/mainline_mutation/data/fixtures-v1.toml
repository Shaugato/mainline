# ── the three fixtures the SALAMI classes need ───────────────────────────────
#
# The salami construction walks the comparator through the two cells rule R3 is
# DELIBERATELY SILENT on (`<=` <-> `=`), moving the magnitude on the step where
# the comparator FAMILY changes — because R2 stays silent when the family moves,
# on the grounds that comparing a bound against a tolerance band is arithmetic on
# two different assertions. Every adjacent step is therefore `restate` and the
# composition against the ORIGIN is `weaken`.
#
# It only works where the deontic stays put, which means the clause must state
# its ceiling with a NON-NEGATING comparator surface: `must be no more than X`
# and not `must not exceed X`. `not exceed` is in `slots.action.negating`, so
# rewriting it to `be set at` would flip MUST_NOT -> MUST and rule R1 would fire
# a polarity inversion on step one — the salami would be detected immediately and
# would measure nothing. These fixtures are authored in the phrasing that makes
# the attack expressible, which is the point: the harness must be able to build
# the mutation the design claims to catch.

[[fixture]]
fixture_id = "F10"
family = "pressure-systems-standard"
title = "V-311 operating pressure ceiling, stated without a negation"
numbering_prefix = "4.7"
furniture_lines = ["Doc No: PSS-0117", "Page 12 of 31"]
raw_text = "The maximum operating pressure of vessel V-311 must be no more than 250 kPa for all crews, and the reading shall be independently verified."
parameter = "max_operating_pressure"
directrix_ratified = true
setpoint_token = "250 kPa"
setpoint_value = "250"
setpoint_unit = "kPa"

