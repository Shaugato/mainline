unverified:
  - >-
    THE FIXTURE CORPUS IS TWELVE AUTHORED CLAUSES, NOT A SITE'S PROCEDURE LIBRARY. Every published
    bound is a bound over THIS corpus and generalises to nothing. Twelve clauses across four
    document families cannot support a claim about a real library's distribution of drafting
    styles, table usage, cross-reference density or OCR quality, and the per-(class, family) cells
    frequently have one or two trials, where the Wilson lower bound is near zero and correctly so.
    The number is a floor on a fixture set, published because a floor on a fixture set is more
    than anybody else publishes, and not because it is a floor on a site.
  - >-
    THE ADVERSARY IS A PERSON, NOT A MODEL. The `adversarial_paraphrase` cassettes are
    HAND-AUTHORED. AWS credentials are not valid on the build machine (PL-3) and decision D12
    keeps the live Bedrock path off by default and out of CI, so a cassette recorded from a live
    call cannot be produced honestly today. They are what a competent adversary WOULD write, and
    the artefact says so in a field called `paraphrase_provenance` rather than in a footnote. A
    real adversarial-paraphrase kill rate is UNMEASURED.
  - >-
    RESIDUE IS DERIVED BY A STAND-IN. Worker W8 (`margin-assignment`) owns residue emission and
    had not landed when this harness was written, so `mainline_mutation.residue` derives the five
    reasons from the same authoritative facts and stamps `residue_source =
    'mutation-harness-local/v1'` on every row. No figure here is a measurement of W8's
    implementation, and the KILL catalogue's success condition — a weakening verdict OR a residue
    row — is therefore half-measured against a stand-in.
  - >-
    THE CONSERVATION OF BLAME MASS LEDGER IS NOT EXERCISED. Worker W9's accounting needs a
    cluster, a commit DAG and `clause_blame_closure` rows, none of which a fixture corpus has. The
    flagship claim of this domain — that under-emitting residue is a `23514` at the moment of
    accounting — is therefore NOT part of what this harness measures, and a KILL mutant recorded
    as `survived` here might still be refused at merge by machinery this harness never ran.
  - >-
    PATH B IS NEVER CONSULTED, SO THE FIGURE IS A FLOOR AND NOT AN ESTIMATE. The published kill
    rate is the model-free floor. The ABSTENTION RATCHET can only ever RAISE a verdict's force, so
    an oracle could only improve these numbers. What the harness ALSO measured, and records on
    every row, is that `resolve(path_a, oracle=None, theta)` returns `weaken` for every pair
    including a pure retypeset — an absent oracle is an abstaining one and D6 makes an abstention
    a weakening. A deployment that never runs Path B therefore blocks on everything. That is the
    ratchet failing closed exactly as specified, it is why the outcome is judged on Path A, and
    the operational consequence has NOT been measured against a real permit workload.
  - >-
    CASCADE STAGE S4 IS NOT DRIVEN. Identity recovery is measured over S1 (digest), S2 (anchor set
    plus trigram) and S3 (MinHash/LSH rescored) only. The anchor-gated ANN arm needs embeddings
    and a cluster and PL-3 forbids a dated path on either, so every `identity_changed` outcome in
    the SURVIVE catalogue is an outcome a semantic stage might have recovered. The false-identity
    change rate is therefore an UPPER estimate of the failure and the corresponding preservation
    bound is conservative — which is the correct direction, and is stated rather than relied on.
  - >-
    THE MATCHER IS MEASURED AGAINST A ONE-MEMBER CORPUS. A SURVIVE mutant is asked "are you still
    recognisable as THIS ancestor", never "do you beat every other clause in the library". The
    discrimination question is worker W8's assignment problem and is a different measurement; a
    one-member corpus cannot produce a degenerate optimum, which is why `ambiguous` residue is
    never emitted here and why decision D4's degeneracy-as-residue rule is entirely untested by
    this harness.
  - >-
    A MEASURED COVERAGE GAP BETWEEN TWO COMMITTED TABLES, RECORDED HERE BECAUSE IT IS THIS
    HARNESS THAT FOUND IT. `data/lexicon/parameter.toml` can extract 60 parameter keys;
    `data/registry/safe-direction-seed.toml` ratifies 74; the INTERSECTION is 6. Every clause
    whose parameter falls outside that intersection ABSTAINS, and decision D6 turns an abstention
    into `weaken`. That is R-A4 failing closed exactly as designed and it is not a defect — but it
    means the great majority of setpoint clauses in this corpus would block on their own
    reformatting for a vocabulary reason rather than a safety one, and the nuisance cost of that
    has NOT been quantified. The intersection is recomputed on every run and printed into the
    artefact as `directrix_ratified_and_extractable` so the number cannot rot into a comment.
  - >-
    A KILL RATE SAYS NOTHING ABOUT THE MUTATIONS NOBODY THOUGHT OF. The catalogue is curated, and
    a curated catalogue measures the adversary its authors imagined. The classes here are the ones
    the brief named plus the salami construction the lattice's own documented silences make
    possible; a real adversary who found a different silence would not appear in any of these
    numbers. Mutation testing's competent-programmer hypothesis is inherited here as an
    assumption and is not tested.
  - >-
    NONE OF THIS DISTINGUISHES A CONSIDERED DISPOSITION FROM A RUBBER STAMP (risk R-A8). The
    ratchet measures whether the machine noticed. It says nothing whatsoever about whether the
    person who then adjudicated the blocking row read it, and it must never be sold as retiring
    that risk.
