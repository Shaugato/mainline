# SPDX-License-Identifier: FSL-1.1-ALv2
#
# Regulatory and standards citations, bound to the MUE fonds they govern.
#
# NEVER SAMPLED AT RANDOM.  A citation is an IDENTITY anchor: two clause versions whose
# `REGULATORY_CITATION` anchors conflict are not the same clause.  A generator that emitted
# plausible-looking standard numbers would produce a corpus in which citation resolution has
# nothing to resolve against, and the "citation that resolves to nothing is a blocking residue
# row" path would never fire.
#
# EVERY `text` BELOW WAS RUN THROUGH `mainline_domain.anchors.iter_anchors` AND CLAIMS A
# `REGULATORY_CITATION` ANCHOR.  `skeleton/build.py` re-checks this at generation time when
# mainline_domain is importable and RAISES on a miss — a citation that stopped colliding
# because the product gazetteer changed is a silent corpus regression, so it is made loud.
#
# The edition YEAR is deliberately omitted: `mainline_domain`'s normalisation decision is that
# `AS 2865:2009` and `AS 2865` are the SAME anchor, because a descendant citing the standard
# without its year must not read as a conflict.

