#
# THE DATED STRUCTURAL SPINE.  Everything on camera hangs off one clause; a three-minute video
# cannot afford a second protagonist (research/06-build/demo-engineering.md §2).
#
# ── WHAT IS HERE AND WHAT IS NOT ────────────────────────────────────────────────────────────
# HERE: external references, dates, sites, assets, severities, document codes, branch names —
#       the STRUCTURE the generator must plant exactly rather than draw.
# NOT HERE: a single sentence anybody reads.  The 2013 commit message, the clause bodies and
#       the ICAM narrative are hand-authored verbatim by `corpus-spine-authored` under
#       verticals/mainline/fixtures/corpus/authored/, and `test_camera_strings_agree` checks
#       that string across the authored fixture, VO.md, SHOT-LIST.yaml and the honesty card.
#       A fifth copy living here would be a fifth thing that can drift, so there is none.
#
# ── ID DERIVATION, so no worker has to coordinate ───────────────────────────────────────────
# Every id in the corpus is `uuid5(CORPUS_NS, "<entity>:<natural key>")` — see `rng.sid`.
# Therefore any downstream worker can recompute an id from the natural key printed here without
# reading the skeleton output at all:
#
#     event_id(INC-2013-044)   = sid("event",  "INC-2013-044")
#     cr_id(MOC-2026-0413)     = sid("change_request", "MOC-2026-0413")
#     permit_id(WO-88213)      = sid("permit", "WO-88213")
#     site_id(MRD)             = sid("site",   "MRD")
#     doc_id(MRD/PRO-MEC-014)  = sid("doc",    "MRD/PRO-MEC-014")
#
# That is the whole cross-worker interface for identity.  There is no registry to keep in sync.

version: 1

# The demo's fixed "now".  Playwright pins the browser clock to the same instant (decision D14),
# so on-screen timestamps are byte-identical across takes.
corpus_now: 2026-08-04T09:14:00+10:00
corpus_epoch: 2004-01-01T00:00:00+10:00
