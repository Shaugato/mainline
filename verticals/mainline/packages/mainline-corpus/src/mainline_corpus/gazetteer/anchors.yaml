  clause_label_2011: "7.3"
  clause_label_2016: "5.2.1"
  asset_incident: P-4102          # the 2013 fire
  asset_permit: P-4104            # the 2026 hot work, sibling of the same class
  asset_class: HTP-CLASS-A
  setpoint_parameter: seal_face_temperature_alarm
  setpoint_oem: 150
  setpoint_post_incident: 135
  author_2013: "kestrel:okonjo.d"
  # Dates only; the commit body is authored elsewhere.
  dates:
    clause_introduced: 2011-03-14
    incident: 2013-06-12
    strengthen_commit: 2013-08-04
    retypeset: 2016-11-21
    split: 2019-02-19
    author_separated: 2021-07-16
    weaken_moc_opened: 2026-07-28
    permit_opened: 2026-08-03
    permit_merge_attempt: 2026-08-04
  # Which revision each spine date is, and what drove it.  `driven_by_event` and
  # `driven_by_change` are STRUCTURAL POINTERS, not blame edges: they record that a revision
  # followed a named event or MOC, which is a documentary fact.  Whether that revision's clause
  # change is *attributable* to the event is a blame edge, it carries a basis and a signature,
  # and it is authored by `corpus-blame-key`, not here.
  revisions:
    - {effective_on: 2011-03-14, driver: introduce}
    - {effective_on: 2013-08-04, driver: incident, author: "kestrel:okonjo.d", driven_by_event: INC-2013-044}
    - {effective_on: 2016-11-21, driver: retypeset}
    - {effective_on: 2019-02-19, driver: moc, driven_by_change: MOC-2019-0221}

