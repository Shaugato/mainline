    site: MRD
    kind: incident
    occurred_at: 2013-06-12T14:20:00+10:00
    reported_lag_hours: 1
    activity_root: CONTROL-OF-IGNITION-SOURCES
    activity_series: authorising hot work
    activity_file: assessing and permitting hot work adjacent to live plant
    assets: [P-4102, TT-4102, ACC-4102]
    severity_actual: 4
    # Potential is 4, not 5, and deliberately so: the spine calls INC-2013-044 a severity-4
