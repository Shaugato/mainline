# ── ANCHORED EVENTS ─────────────────────────────────────────────────────────────────────────
# Planted exactly.  They are removed from the sampled stream, they consume their share of the
# severity budget, and the severity-4/5 ones excite the post-incident reporting spike like any
# other major event — the excitation is not special-cased for them.
#
# `severity_basis` is `coded_field` on both blood events: the injury classification is a coded
# field on the statutory notification, not a model's opinion.  Nothing in this corpus emits
# `severity_gate >= 4` with `severity_basis = 'model_rated'`; `model_cannot_arm` is a shipped
# CHECK and the loader would be refused.
events:
  - external_ref: INC-2009-011
    site: YND
    kind: incident
    occurred_at: 2009-11-06T10:35:00+10:00
    reported_lag_hours: 2
    activity_root: LIFTING-AND-SUSPENDED-LOADS
    activity_series: maintaining lifting appliances
    activity_file: supporting a load for maintenance access
    assets: [HO-9402, PR-9410]
    severity_actual: 5
    severity_potential: 5
    severity_basis: coded_field
    fatal_potential_trigger: true
    summary_facts:
      - suspended component released during workshop maintenance
      - one fatality
    control_failures:
      - {control_class: LOAD_SUPPORT_FOR_MAINTENANCE, barrier_role: preventive, failure_mode: absent, hazard_energy: gravity, icam_tier: absent_or_failed_defence}
      - {control_class: LIFTING_GEAR_INSPECTION, barrier_role: preventive, failure_mode: degraded, hazard_energy: gravity, icam_tier: task_or_environmental_condition}
      - {control_class: DROP_ZONE_EXCLUSION, barrier_role: preventive, failure_mode: ineffective, hazard_energy: gravity, icam_tier: individual_or_team_action}
      - {control_class: LIFT_STUDY_APPROVAL, barrier_role: preventive, failure_mode: absent, hazard_energy: gravity, icam_tier: organisational_factor}

