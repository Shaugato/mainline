#
# The 36 controlled documents (ARCHITECTURE.md §5.2 `mainline.doc`), across five code families.
#
# 36 ROWS EXACTLY.  An entry with three `sites` is three rows: that is the fleet-sibling shape —
# one OEM alert, three sites, three local documents, which is what makes "cherry-pick, and
# dedup-to-one-check" demonstrable rather than asserted.  `skeleton/documents.py` asserts the
# flattened total is 36 and RAISES otherwise, so an edit here cannot silently change the corpus
# census that the honesty card quotes.
#
# `doc.open_token_count` is a PROJECTED column (a trigger writes it from the control series still
# carried) and is DELIBERATELY ABSENT from every entry below and from every emitted row.
#
# `cadence_years` is the mean interval between revisions of this document.  The actual dates are
# drawn from a named RNG stream around that mean; the cadence itself is authored, because a
# procedure that is reissued every 14 months and a standard reissued every 5 years are different
# objects and a single global rate would flatten the corpus into noise.
#
# `retypeset_2016: true` marks the documents that go through the full retypeset injector — every
# `ord_path` changes and clause identity has to survive it.  That is `corpus-blame-key`'s and
# `corpus-docx`'s work; this file only says which documents it happens to.

version: 1
expected_row_count: 36

families:
  PRO:   {label: procedure, cadence_class: long}
  STD:   {label: standard, cadence_class: long}
  MOC:   {label: management of change record, cadence_class: single}
  PTW:   {label: permit to work form set, cadence_class: medium}
  ALERT: {label: safety alert, cadence_class: single}

