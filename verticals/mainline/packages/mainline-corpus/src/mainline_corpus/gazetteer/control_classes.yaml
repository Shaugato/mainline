#
# `control_failure.control_class` (ARCHITECTURE.md §5.4).
#
# THIS IS THE JOIN KEY.  It is what turns "did this change address that failure?" from a prose
# judgement into a set operation: a clause's Control Assertion Tuple names a control class, an
# event's control failures name control classes, and the intersection is computable.  It is also
# what `mechanism` recurrence cues are synthesised from.
#
# Therefore it must be a CLOSED, SHARED vocabulary written once.  A generator that minted a
# control class per event would produce a corpus in which no intersection is ever non-empty and
# every derived_documentary blame edge would be unreachable — the corpus would silently stop
# testing basis-graded force.
#
# `failure_modes` restricts the `failure_mode` CHECK (absent | ineffective | bypassed | degraded
# | not_verified) to the modes that are physically meaningful for that control.  A pressure
# relief valve is not "bypassed" in this corpus; it is degraded or not_verified.

