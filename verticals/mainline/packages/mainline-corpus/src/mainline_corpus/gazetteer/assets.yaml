#
# Asset tags and the control-dependency / energy graph (ARCHITECTURE.md §5.5 `asset_edge`).
#
# EVERY MEMBER TAG BELOW IS WRITTEN BY HAND.  Companion tags (motor, instrument, accumulator)
# are DERIVED from a hand-written member by a rule stated in `derivations` — that is a
# deterministic derivation from an authored literal, not a random draw, and the distinction is
# the whole point of this directory.
#
# ── EDGE DIRECTION, stated once because a reversed edge silently breaks the boundary
#    certificate ────────────────────────────────────────────────────────────────────────────
# Every edge points FROM the energy source or the governing control TOWARD the item a person
# would be exposed to.  Therefore:
#
#     energises      SG-4100 -> M-4104 -> P-4104        (supply toward the exposed machine)
#     stores_energy  ACC-4104 -> P-4104                 (the store toward where it discharges)
#     governs        TT-4102 -> P-4102                  (the control toward what it protects)
#     supersedes     P-4105 -> P-4101                   (the replacement toward the replaced)
#
# The energy closure of a declared permit boundary is therefore the **backward** reachable set
# — every asset that can push energy into something the crew declared.  `permit_slice` in §5.5
# calls this "the backward slice"; `boundary_certificate.under_declared` counts members of that
# backward set that the crew did not declare.
#
# ── THE DELIBERATE UNDER-DECLARATION ────────────────────────────────────────────────────────
# `declared_boundaries` below contains the canonical multi-source-isolation fatality in
# miniature: the 2026 permit isolates the pump electrically (SG-4100, M-4104, P-4104) and the
# seal-support accumulator ACC-4104 — charged by HPU-4104 — is still holding hydraulic
# pressure.  Both sit in the backward closure of P-4104 and neither is declared, so
# `under_declared = 2` and `boundary_certified_when_issued` has something TRUE to refuse on.
# Nothing in the generator special-cases this; it falls out of the edges.

version: 1
asset_graph_version: kestrel-ag-1

derivations:
  # `<n>` is the numeric run of the member tag: P-4104 -> 4104.
  motor: "M-<n>, one per member, edge  M-<n> energises <member>"
  supply: "the family's `energised_by` switchgear, edge  <sg> energises M-<n> (or the member directly when the family has no motor)"
  instrument: "<CODE>-<n> for each code in `instruments`, edge  <CODE>-<n> governs <member>"
  accumulator: "ACC-<n> for each member listed under `accumulator.members`, edge  ACC-<n> stores_energy <member>"

# ── COLLISION WITH THE SHIPPED ANCHOR EXTRACTOR — measured, not assumed ─────────────────────
# `mainline_domain.anchors.extract` claims equipment tags with the shape
# `[AREA-]CODE[-]NNNNN[SS]`.  A code that appears in `equipment.toml` is claimed even WITHOUT a
# separator; a code that does not appear there is STILL claimed when the tag carries an explicit
# hyphen ("unknown prefixes fail closed" — extract.py line 26).  EVERY tag in this file carries
# an explicit hyphen, so every tag is extractable today.
#
#   * present in equipment.toml    : B, CV, D, G, HX, K, M, P, PSV, SC, SG, TK, TX, V, ZV
#   * present in instrument.toml   : LT, PT, TT, VT   (claimed as INSTRUMENT_LOOP, which wins)
#   * hyphen-only, not in either   : ACC, CY, DZ, EX, HO, HPU, HT, LA, MAG, ML, PR, TH
#
# Isolation point ids use the `LOP-` prefix from `isolation.toml`.  The shipped isolation regex
# is `PREFIX-DIGITS[A-Z]{0,2}` with a `(?![\w-])` tail, so `LOP-4104-01` does NOT match and
# `LOP-41041` does.  The ids below are written in the form that actually collides.
codes_used: [ACC, B, CV, CY, D, DZ, EX, G, HO, HPU, HT, HX, K, LA, LT, LV, M, MAG, ML, P, PR, PSV, PT, SC, SG, TH, TK, TT, TX, V, VT, ZV]

