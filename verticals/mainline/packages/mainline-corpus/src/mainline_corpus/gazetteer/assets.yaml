  # do with the switchboard, which is exactly why isolating the switchboard does not make the
  # pump safe.
  - {from: HPU-4104, to: ACC-4104, kind: stores_energy, site: MRD}
  # Fleet siblings share a governing standard: the seal-support cooler serves the whole family.
  - {from: HX-4120, to: P-4102, kind: governs, site: MRD}
  - {from: HX-4120, to: P-4104, kind: governs, site: MRD}
