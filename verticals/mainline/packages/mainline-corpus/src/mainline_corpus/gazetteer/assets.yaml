# What a crew DECLARED they isolated (ARCHITECTURE.md §5.5 `permit_boundary`).
declared_boundaries:
  - permit_ref: WO-88213
    site: MRD
    task: hot work on the P-4104 seal housing
    # The item the crew is actually working on.  The energy closure is computed FROM here and
    # HALTS at any declared isolation point — energy upstream of an applied isolation is
    # contained, which is the whole reason isolations exist.  Without this distinction the
    # closure would walk through SG-4100 and accuse the site transformer, which is nonsense and
    # would make `under_declared` a number nobody trusts.
    work_scope: [P-4104]
    declared:
      P-4104: LOP-41041
      M-4104: LOP-41042
      SG-4100: LOP-41007
    # NOT declared, and both are in the backward energy closure of P-4104.
    known_under_declared: [ACC-4104, HPU-4104]
    note: >-
      Electrical energy is positively isolated and proven dead.  The barrier-fluid accumulator
      ACC-4104 is still charged and HPU-4104 can recharge it, so trapped hydraulic pressure
      remains inside the boundary the crew believes is dead.
