#
# The people the record names (ARCHITECTURE.md §5.1 `mainline.person`).
#
# NO FAKER, NO MIMESIS.  Two reasons, and the second is the one that matters:
#
#  1. `mimesis` is not installed in this environment and nothing in this build may REQUIRE an
#     unavailable dependency to be considered done.
#  2. A name provider is a moving target.  `person.signer_sub` is a foreign key from
#     `commit_obj.author_sub`, `disposition.signer_sub`, `blame_edge.reviewed_by` and the
#     custody ledger.  If the name pool changes between library versions, every one of those
#     keys changes, every committed render-cache entry misses, and "regeneration is a no-op
#     unless a prompt changes" stops being true.  A committed pool cannot drift.
#
# APPEND ONLY.  The generator indexes into these lists from a seeded stream; inserting a name in
# the middle re-keys every person after it.
#
# `person` has NO display-name column.  The name a human reads on camera lives in
# `competency_snapshot` (a JSONB mirror of the HR/LMS record), which is where it belongs: the
# identity is the `signer_sub` the customer's IdP issued, and the label is theirs to assert.

version: 1

# signer_sub = "kestrel:<surname_lower>.<given_initial_lower>[<n>]" where <n> is appended only to
# break a collision.  Readable on camera, stable, and derived — never drawn.
