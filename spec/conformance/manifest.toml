[[case]]
id = "CF-70"
title = "A permit refused with three obligations of which two are already dispositioned emits a MUS naming exactly the third"
class = "gate"
invariants = ["I14", "I02"]
mi = ["MI02"]
anomaly = "none"
expect_sqlstate = "23514"
expect_constraint = "gate_closed_when_issued"
profiles = ["mainline", "trappoint-ref"]
refusal_depth_min = 2
milestone = "K1"
payload_schema = "spec/wire/refusal.schema.json"
asserts_payload = "len(mus) == 1 AND mus[0].kind == 'obligation' AND naa.kind == 'dispose_obligations' AND naa.cardinality == 1"
note = "Minimality is the assertion, not the presence of a payload. A non-minimal set labelled as a MUS is worse than no MUS, because it is a diagnosis that disagrees with the refusal."

