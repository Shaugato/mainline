#
# TRAPPOINT conformance manifest — the SINGLE SOURCE OF TRUTH for the suite.
#
# Every case is an ILLEGAL HISTORY (or, for class = "admit", a legal one that must stay legal),
# asserting an EXACT SQLSTATE and an EXACT exhibit name. A test that asserts "an exception was
# raised" is worthless in a product whose deliverable is the diagnosis.
#
# Normative reading: spec/TRAPPOINT-SPEC.md §6, spec/errors.md §3.1, spec/conformance/README.md.
# Where this file disagrees with prose anywhere in spec/, THIS FILE WINS.

[manifest]
spec_version = "1.0.0-rc.1"
case_count = 71
# Exactly 45 cases carry the "trappoint-ref" profile. `trappoint-conform --profile trappoint-ref`
# therefore reports 45/45, which is the K1 / G2 exit string.
ref_profile_case_count = 45
profiles = ["mainline", "trappoint-ref"]

# The four expectation classes (spec/errors.md §1).
#   gate   — a REFUSE-class outcome: 23514 / 23503 / 23505 / P0001
#   retry  — a RETRY-class outcome: 40001, and only 40001
#   deny   — a DENY-class outcome: 42501, refused BEFORE the gate by grant or policy
#   admit  — the history must complete: 00000
classes = ["gate", "retry", "deny", "admit"]
gate_taxonomy = ["23514", "23503", "23505", "P0001"]
retry_taxonomy = ["40001"]
deny_taxonomy = ["42501"]

# `expect_constraint` is the EXHIBIT NAME and is never empty:
#   23514/23503/23505 -> the constraint or unique-index name from diag.constraint_name
#   P0001             -> the fully-qualified raising trigger function / UDF / procedure
#   40001             -> the projected column that carried the materialised conflict
#   42501             -> grant:<verb>:<object>:<role>, or the RLS policy name
#   00000             -> the SQL object that had to permit the write
exhibit_semantics = "spec/errors.md#31-expect_constraint-semantics"

# Anomaly identifiers A1-A14 come from the merge-gate anomaly analysis; "none" means the case is a
# static illegal history rather than a concurrency anomaly. ANOMALY_COVERAGE.md is generated from
# these values and CI fails if any of A1-A14 has zero cases.
anomalies = ["A1","A2","A3","A4","A5","A6","A7","A8","A9","A10","A11","A12","A13","A14","none"]

