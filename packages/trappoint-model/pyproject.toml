[project]
name = "trappoint-model"
version = "0.1.0"
description = "The reference model: a pure-Python oracle for the merge gate, a Hypothesis differential that runs every generated operation against both the oracle and a real CockroachDB cluster and compares SQLSTATE and constraint name, a shrinkable interleaving scheduler, and the READ COMMITTED downgrade differential."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "MAINLINE contributors" }]
keywords = ["differential-testing", "hypothesis", "cockroachdb", "serializable", "merge-gate"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

# Two dependencies, and one deliberate absence.
#
# `trappoint-core` is NOT here, and that is load-bearing rather than tidy. This package's
# whole value is that it was written from the specification and the migrations rather
# than from the client, so an error shared between the client and the model would not
# cancel out. `adapter.py` therefore re-implements twelve lines of exhibit recovery that
# `trappoint_core.errors.diagnose` also implements — duplication with a reason.
#
# `tenacity`, `backoff`, `retrying` and `stamina` are forbidden repository-wide by
# `.importlinter` contract 4 and are absent here for the same reason they are absent from
# `trappoint-core`: this suite must be able to observe that `40001` was retried and the
# four refusal codes were not, and a blanket-retry helper makes that unobservable.
dependencies = [
  "psycopg[binary]>=3.3.4",
  "hypothesis>=6.165",
]

[project.urls]
Homepage = "https://github.com/Shaugato/mainline"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-timeout>=2.3", "mypy>=1.11", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trappoint_model"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = [
  "requires_cluster: needs a live CockroachDB v26.2; skips with a reason when none is reachable",
  "slow: takes more than a second",
]
